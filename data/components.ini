item_Desc_RADR_GRNP_S03_V880=Item Type: Radar\nManufacturer: Groupe Nouveau Paradigme\nSize: 3\nGrade: A\nClass: Military\n\nProviding useful assistance when detecting hostiles, the V880 brings the power of military technology to the consumer market.
