item_Desc_RADR_GRNP_S01_Tige=Item Type: Radar\nManufacturer: GNP\nSize: 1\nGrade: B\nClass: Military\n\nSituational awareness is key when engaging with hostiles. The GNP developed the Tige radar with improved accuracy to helps ensure that any viable contacts are detected.
item_Name_RADR_GRNP_S01_V80111=V801-11 [MIL-S1-A]
item_Desc_RADR_GRNP_S01_V80111=Item Type: Radar\nManufacturer: GNP\nSize: 1\nGrade: A\nClass: Military\n\nDesigned for the battlefield, the V801-11 is a cut above the rest thanks to the rigid, iterative testing, guaranteeing its performance when you need it most.
