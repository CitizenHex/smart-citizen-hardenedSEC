item_Desc_RADR_GRNP_S00_Agure=Item Type: Radar\nManufacturer: Groupe Nouveau Paradigme\nSize: 0\nGrade: D\nClass: Military\n\nTrusted by many security firms for their vehicles, this reliable and consistent radar will keep your operation on track.
