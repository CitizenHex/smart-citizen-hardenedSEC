item_Desc_RADR_WLOP_S00_Fabian=Item Type: Radar\nManufacturer: WillsOp\nSize: 0\nGrade: A\nClass: Civilian\n\nUtilizing best-in-class scanning technology, the Fabian radar ensures you won't be caught unaware.
