item_DescMISL_S10_CS_TALN_Vanquisher=Manufacturer: Talon\nTracking Signal: Cross Section\nSize: 10\n\nDesigned by Talon, the Vanquisher heat seeking strike torpedo delivers a heavy payload sure to serve as a deterrent from any further hostile actions.
item_NameMISL_S10_CS_TALN_Vanquisher_Short=[CS] Vanquish. X-CS Torp.
