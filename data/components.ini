item_Desc_RADR_NAVE_S01_SNSR7=Item Type: Radar\nManufacturer: Nav-E7 Gadgets\nSize: 1\nGrade: B\nClass: Competition\n\nEngineered to give your vehicle the edge, the SNSR7 provides real-time tracking information on all surrounding emissions.
