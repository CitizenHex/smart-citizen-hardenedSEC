item_Desc_RADR_GRNP_S03_Fidele=Item Type: Radar\nManufacturer: Groupe Nouveau Paradigme\nSize: 3\nGrade: D\nClass: Military\n\nFocusing on the core features of a radar, the Fidele operates efficiently even in battle conditions.
