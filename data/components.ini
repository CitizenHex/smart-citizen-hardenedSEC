item_Desc_RADR_WLOP_S01_Abetti=Item Type: Radar\nManufacturer: WillsOp\nSize: 1\nGrade: A\nClass: Civilian\n\nSupplying high powered detection technology, the Abetti's advanced systems offer a responsive radar experience.
item_Name_RADR_WLOP_S01_Backlund=Backlund [CIV-S1-B]
item_Desc_RADR_WLOP_S01_Backlund=Item Type: Radar\nManufacturer: WillsOp\nSize: 1\nGrade: B\nClass: Civilian\n\nWherever you fly, the WillsOp Backlund radar is perfect for gathering information on what’s nearby and detecting a variety of emission signatures.
item_Name_RADR_WLOP_S01_Capston=Capston [CIV-S1-C]
item_Desc_RADR_WLOP_S01_Capston=Item Type: Radar\nManufacturer: WillsOp\nSize: 1\nGrade: C\nClass: Civilian\n\nExperience why WillsOp is a premiere manufacturer of ship electronics with their Capston radar. Outfit your ship with one today so you know what’s nearby.
item_Name_RADR_WLOP_S01_Fleming=Fleming [CIV-S1-D]
item_Desc_RADR_WLOP_S01_Fleming=Item Type: Radar\nManufacturer: WillsOp\nSize: 1\nGrade: D\nClass: Civilian\n\nThe Fleming is WillsOp’s base small radar. What it lacks in bells and whistles, it makes up for with consistent performance.
item_Name_RADR_WLOP_S02_Agrippa=Agrippa [CIV-S2-A]
item_Desc_RADR_WLOP_S02_Agrippa=Item Type: Radar\nManufacturer: WillsOp\nSize: 2\nGrade: A\nClass: Civilian\n\nA superior quality radar able to accurate provide information on your vehicle's surroundings.
item_Name_RADR_WLOP_S02_Battani=Battani [CIV-S2-B]
item_Desc_RADR_WLOP_S02_Battani=Item Type: Radar\nManufacturer: WillsOp\nSize: 2\nGrade: B\nClass: Civilian\n\nExpand your horizons with the WilsOp Battani radar and its advanced passive detection system.
item_Name_RADR_WLOP_S02_Chernykh=Chernykh [CIV-S2-C]
item_Desc_RADR_WLOP_S02_Chernykh=Item Type: Radar\nManufacturer: WillsOp\nSize: 2\nGrade: C\nClass: Civilian\n\nThe Chernykh is named after the famed 26th century engineer who designed some of the most prized radars of that era. This medium radar from WillsOp celebrates both the look and performance of those classic components.
item_Name_RADR_WLOP_S02_Fawad=Fawad [CIV-S2-D]
item_Desc_RADR_WLOP_S02_Fawad=Item Type: Radar\nManufacturer: WillsOp\nSize: 2\nGrade: D\nClass: Civilian\n\nThe Fawad entry-level radar from WillsOp is the perfect choice for someone who is looking for a no-frills signature detection system perfect for everyday use.
item_Name_RADR_WLOP_S03_Anysta=Anysta [CIV-S3-A]
item_Desc_RADR_WLOP_S03_Anysta=Item Type: Radar\nManufacturer: WillsOp\nSize: 3\nGrade: A\nClass: Civilian\n\nAvoid getting tunnel vision with the Anysta radar. Offering exceptional performance all round, this radar will help keep you informed.
item_Name_RADR_WLOP_S03_Capsulo=Capsulo [CIV-S3-B]
item_Desc_RADR_WLOP_S03_Capsulo=Item Type: Radar\nManufacturer: WillsOp\nSize: 3\nGrade: B\nClass: Civilian\n\nFor a dependable radar with above average performance, the Capsulo is a trustworthy option.
item_Name_RADR_WLOP_S03_Socoria=Socoria [CIV-S3-D]
item_Desc_RADR_WLOP_S03_Socoria=Item Type: Radar\nManufacturer: WillsOp\nSize: 3\nGrade: D\nClass: Civilian\n\nThe Socoria is a well-rounded radar providing everything a pilot needs for an effective radar at a reasonable price point.
item_Name_SHLD_ASAS_S01_Mirage=Mirage [STH-S1-A]
item_Desc_SHLD_ASAS_S01_Mirage=Item Type: Shield Generator\nManufacturer: Ascension Astro\nSize: 1\nGrade: A\nClass: Stealth\n\nBy boasting a signature so faint most won’t believe it’s there, Ascension Astro’s top of the line small shield generator lives up to its name — Mirage. It’s the ultimate component for those who want to go unnoticed.
item_Name_SHLD_ASAS_S01_Veil=Veil [STH-S1-B]
item_Desc_SHLD_ASAS_S01_Veil=Item Type: Shield Generator\nManufacturer: Ascension Astro\nSize: 1\nGrade: B\nClass: Stealth\n\nAn advanced cooling system significantly reduces the heat produced by the Veil stealth shield generator. No other component in its class even comes close to rivaling its heat suppression technology.
item_Name_SHLD_ASAS_S02_Obscura=Obscura [STH-S2-C]
item_Desc_SHLD_ASAS_S02_Obscura=Item Type: Shield Generator\nManufacturer: Ascension Astro\nSize: 2\nGrade: C\nClass: Stealth\n\nRespected for its lower emissions, the Obscura shield generator uses an advanced signature dispersal system to help give your ship a quieter signature while still remaining shielded.
item_Name_SHLD_ASAS_S02_Sheut=Sheut [STH-S2-B]
item_Desc_SHLD_ASAS_S02_Sheut=Item Type: Shield Generator\nManufacturer: Ascension Astro\nSize: 2\nGrade: B\nClass: Stealth\n\nKeep your shield’s heat from giving you away by using a Sheut. Another outstanding stealth shield generator from Ascension Astro.
item_Name_SHLD_ASAS_S02_Umbra=Umbra [STH-S2-A]
item_Desc_SHLD_ASAS_S02_Umbra=Item Type: Shield Generator\nManufacturer: Ascension Astro\nSize: 2\nGrade: A\nClass: Stealth\n\nSlip through the darkness of space like a phantom with the Umbra stealth shield generator. Best when used in conjunction with other low signature components from Ascension Astro.
item_Name_SHLD_BASL_S01_Guardian=Guardian [IND-S1-B]
item_Desc_SHLD_BASL_S01_Guardian=Item Type: Shield Generator\nManufacturer: Basilisk\nSize: 1\nGrade: B\nClass: Industrial\n\nUpgrade to the Guardian for increased absorption of ballistic, energy, and distortion damage. Making this industrial shield generator one of the most durable in its class.
item_Name_SHLD_BASL_S01_Palisade=Palisade [IND-S1-A]
item_Desc_SHLD_BASL_S01_Palisade=Item Type: Shield Generator\nManufacturer: Basilisk\nSize: 1\nGrade: A\nClass: Industrial\n\nNo other small shield generator can match the durability of the Basilisk Palisade. This top-of-the-line industrial component forfeits stealth for the ability to absorb an unrivaled amount of damage.
item_Name_SHLD_BASL_S01_Steward=Steward [IND-S1-D]
item_Desc_SHLD_BASL_S01_Steward=Item Type: Shield Generator\nManufacturer: Basilisk\nSize: 1\nGrade: D\nClass: Industrial\n\nThe Steward is Basilisk’s entry-level industrial shield generator. Its reinforced housing adds an extra level of durability to an already robust system, guaranteeing that your shield will be projecting even in the harshest conditions.
item_Name_SHLD_BASL_S02_Armada=Armada [IND-S2-D]
item_Desc_SHLD_BASL_S02_Armada=Item Type: Shield Generator\nManufacturer: Basilisk\nSize: 2\nGrade: D\nClass: Industrial\n\nBasilisk started by making cutting edge hull plating that was renowned for being durable and dependable. Today they carry on that proud legacy with industrial shield generators like the Armada.
item_Name_SHLD_BASL_S02_Citadel=Citadel [IND-S2-B]
item_Desc_SHLD_BASL_S02_Citadel=Item Type: Shield Generator\nManufacturer: Basilisk\nSize: 2\nGrade: B\nClass: Industrial\n\nFortify your ship with Basilisk’s Citadel shield generator. Tailored toward industrial vessels, the component emits a robust and reliable shield.
item_Name_SHLD_BASL_S02_Rampart=Rampart [IND-S2-A]
item_Desc_SHLD_BASL_S02_Rampart=Item Type: Shield Generator\nManufacturer: Basilisk\nSize: 2\nGrade: A\nClass: Industrial\n\nBasilisk understands that escape isn’t always an option. That’s why they built the Rampart industrial shield generator to take an incredible amount of damage before it’s depleted.
item_Name_SHLD_BASL_S03_Barbican=Barbican [IND-S3-B]
item_Desc_SHLD_BASL_S03_Barbican=Item Type: Shield Generator\nManufacturer: Basilisk\nSize: 3\nGrade: B\nClass: Industrial\n\nBarricade your ship against external forces with the Basilisk Barbican. Originally fabricated for large industrial vessels, this shield generator has became quite popular due to its high damage absorption.
item_Name_SHLD_BASL_S03_Parapet=Parapet [IND-S3-A]
item_Desc_SHLD_BASL_S03_Parapet=Item Type: Shield Generator\nManufacturer: Basilisk\nSize: 3\nGrade: A\nClass: Industrial\n\nAs the peak of Basilisk’s large industrial shield generators, it’s easy to see why the Parapet is so beloved. With one of the industry’s best shield generation to damage ratio, it’s difficult to degrade the shield and expose the hull.
item_Name_SHLD_BASL_S03_Ward=Ward [IND-S3-D]
item_Desc_SHLD_BASL_S03_Ward=Item Type: Shield Generator\nManufacturer: Basilisk\nSize: 3\nGrade: D\nClass: Industrial\n\nThe Ward is Basilisk’s basic industrial-grade shield generator for large ships. It provides decent performance and durability while also keeping its signature respectable.
item_Name_SHLD_BEHR_S01_6SA=6SA 'Arbiter' [CIV-S1-B]
item_Desc_SHLD_BEHR_S01_6SA=Item Type: Shield Generator\nManufacturer: Behring\nSize: 1\nGrade: B\nClass: Civilian\n\nProviding above average shield health and damage absorption, the 6SA ‘Arbiter’ has been a trusted component for centuries. Experience the Behring advantage by installing this small shield generator today.
item_Name_SHLD_BEHR_S01_7SA=7SA 'Concord' [CIV-S1-A]
item_Desc_SHLD_BEHR_S01_7SA=Item Type: Shield Generator\nManufacturer: Behring\nSize: 1\nGrade: A\nClass: Civilian\n\nA top-of-the-line shield generator that runs loud and proud. What it sacrifices in stealth it more than makes up for with supreme durability and excellent performance. So, even if enemies see you coming, they’ll have a hard time disabling Behring’s 7SA ‘Concord’.
item_Name_SHLD_BEHR_S02_6MA=6MA 'Kozane' [CIV-S2-B]
item_Desc_SHLD_BEHR_S02_6MA=Item Type: Shield Generator\nManufacturer: Behring\nSize: 2\nGrade: B\nClass: Civilian\n\nBehring’s ironclad reputation is almost as impenetrable as the shield produced by the 6MA ‘Kozane’. If it’s good enough for Behring, it’s good enough for you.
item_Name_SHLD_BEHR_S02_7MA=7MA 'Lorica' [CIV-S2-A]
item_Desc_SHLD_BEHR_S02_7MA=Item Type: Shield Generator\nManufacturer: Behring\nSize: 2\nGrade: A\nClass: Civilian\n\nTrust a component that has been equipped on crafts for centuries — the 7MA ‘Lorica’. Experience Behring’s top-of-the-line shield generator on your ship today.
item_Name_SHLD_BEHR_S03_6CA=6CA 'Bila' [CIV-S3-B]
item_Desc_SHLD_BEHR_S03_6CA=Item Type: Shield Generator\nManufacturer: Behring\nSize: 3\nGrade: B\nClass: Civilian\n\n“Built by Behring” is a phrase synonymous with quality. That’s why so many around the Empire trust their 6CA ‘Bila’ large shield generator to provide them with solid performance, impressive durable, and an acceptable degree of stealth.
item_Name_SHLD_BEHR_S03_7CA=7CA 'Nargun' [CIV-S3-A]
item_Desc_SHLD_BEHR_S03_7CA=Item Type: Shield Generator\nManufacturer: Behring\nSize: 3\nGrade: A\nClass: Civilian\n\nCommercial-grade shield generators don’t get any better than the 7CA ‘Nargun’. The component utilizes Behring’s patented ‘Freeze Flow’ tech to keep its heat signature in check while increasing both its overall performance and durability.
item_Name_SHLD_GODI_S01_FR66=FR-66 [MIL-S1-A]
item_Desc_SHLD_GODI_S01_FR66=Item Type: Shield Generator\nManufacturer: Gorgon Defender Industries\nSize: 1\nGrade: A\nClass: Military\n\nThe FR-66 is one of the most versatile small shield generator currently on the market. Get military strength protection and performance from Gorgon Defender Industries to ensure your ship can survive any onslaught.
item_Name_SHLD_GODI_S02_CoverAll=CoverAll [MIL-S2-B]
item_Desc_SHLD_GODI_S02_CoverAll=Item Type: Shield Generator\nManufacturer: Gorgon Defender Industries\nSize: 2\nGrade: B\nClass: Military\n\nDon’t sacrifice performance for durability. Get both with Gorgon Defender Industries’ CoverAll shield generator.
item_Name_SHLD_GODI_S02_FR76=FR-76 [MIL-S2-A]
item_Desc_SHLD_GODI_S02_FR76=Item Type: Shield Generator\nManufacturer: Gorgon Defender Industries\nSize: 2\nGrade: A\nClass: Military\n\nRefined by years of extensive, real world testing by the military, Gorgon Defender Industries FR-76 is the ultimate shield generator. Perfect for everyone from folks defending the frontline to those exploring the frontier.
item_Name_SHLD_GODI_S02_SecureShield=SecureShield [MIL-S2-D]
item_Desc_SHLD_GODI_S02_SecureShield=Item Type: Shield Generator\nManufacturer: Gorgon Defender Industries\nSize: 2\nGrade: D\nClass: Military\n\nGet military-grade protection for your ship with the SecureShield from Gorgon Defender Industries. Their cutting edge emitter tech allows for superior shield absorption across the spectrum of damage types.
item_Name_SHLD_GODI_S03_FR86=FR-86 [MIL-S3-A]
item_Desc_SHLD_GODI_S03_FR86=Item Type: Shield Generator\nManufacturer: Gorgon Defender Industries\nSize: 3\nGrade: A\nClass: Military\n\nGorgon’s FR-86 is tried, tested, and trusted. No other large shield generator delivers both exceptional performance and durability to this degree.
item_Name_SHLD_GODI_S03_FullBlock=FullBlock [MIL-S3-B]
item_Desc_SHLD_GODI_S03_FullBlock=Item Type: Shield Generator\nManufacturer: Gorgon Defender Industries\nSize: 3\nGrade: B\nClass: Military\n\nCrafted by former residents of Caliban, Gorgon’s FullBlock large shield generator has been repeatedly put to the test by members of the military and public. That means you can count on it regardless of what you come up against.
item_Name_SHLD_GODI_S03_SecureScreen=SecureScreen [MIL-S3-D]
item_Desc_SHLD_GODI_S03_SecureScreen=Item Type: Shield Generator\nManufacturer: Gorgon Defender Industries\nSize: 3\nGrade: D\nClass: Military\n\nGorgon Defender Industries brings military might to their entry-level, large shield generator. Featuring best-in-class durability, the SecureScreen was built to take a beating and survive.
item_Name_SHLD_GODI_S03_SureStop=SureStop [MIL-S3-C]
item_Name_SHLD_SECO_S01_HEX=HEX [CIV-S1-B]
item_Desc_SHLD_SECO_S01_HEX=Item Type: Shield Generator\nManufacturer: Seal Corporation\nSize: 1\nGrade: B\nClass: Civilian\n\nPrepare your ship for any circumstance by installing a HEX from Seal Corporation. Balanced performance and durability make this an ideal, versatile choice for those who don’t know where their next adventure may take them.
item_Name_SHLD_SECO_S02_BLOC=BLOC [CIV-S2-B]
item_Desc_SHLD_SECO_S02_BLOC=Item Type: Shield Generator\nManufacturer: Seal Corporation\nSize: 2\nGrade: B\nClass: Civilian\n\nSeal Corporation’s BLOC shield generator was the first to use the company’s revolutionary quantum core semiconductor to reduce the component’s power draw without compromising performance.
item_Name_SHLD_SECO_S02_RPEL=RPEL [CIV-S2-D]
item_Desc_SHLD_SECO_S02_RPEL=Item Type: Shield Generator\nManufacturer: Seal Corporation\nSize: 2\nGrade: D\nClass: Civilian\n\nSee why more people trust Seal Corporation to protect their ship than any other company. With the RPEL shield generator you can be certain you’ll be sealed off from danger.
item_Name_SHLD_SECO_S03_ARMOR=ARMOR [CIV-S3-B]
item_Desc_SHLD_SECO_S03_ARMOR=Item Type: Shield Generator\nManufacturer: Seal Corporation\nSize: 3\nGrade: B\nClass: Civilian\n\nARMOR is Seal Corps’ top-of-the-line shield generator. It was used extensively by the military prior to its shield tech being declassified for civilian use.
item_Name_SHLD_SECO_S03_GUARD=GUARD [CIV-S3-C]
item_Desc_SHLD_SECO_S03_GUARD=Item Type: Shield Generator\nManufacturer: Seal Corporation\nSize: 3\nGrade: C\nClass: Civilian\n\nDon’t be afraid to go up against the unknown with Seal Corp’s GUARD. This shield generator balances performance, durability, and stealth to allow the user to utilize the shield in whatever way suits them best.
item_Name_SHLD_SECO_S03_HAVEN=HAVEN [CIV-S3-D]
item_Desc_SHLD_SECO_S03_HAVEN=Item Type: Shield Generator\nManufacturer: Seal Corporation\nSize: 3\nGrade: D\nClass: Civilian\n\nThe HAVEN is an admired shield generator for large ships. Seal Corp’s simple, clean design makes repairing the component an easy and affordable task, and has only increased its popularity over the years.
item_Name_SHLD_YORM_S01_Jaghte=Jaghte [CMP-S1-B]
item_Desc_SHLD_YORM_S01_Jaghte=Item Type: Shield Generator\nManufacturer: Yorm\nSize: 1\nGrade: B\nClass: Competition\n\nBuilt with performance in mind, Yorm’s Jaghte competition shield generator prioritizes shield health and generation rate over strength and stealth.
item_Name_SHLD_YORM_S02_Bamoty=Bamoty [CMP-S2-D]
item_Desc_SHLD_YORM_S02_Bamoty=Item Type: Shield Generator\nManufacturer: Yorm\nSize: 2\nGrade: D\nClass: Competition\n\nThe Bamoty is Yorm’s take on a commercial style shield generator. This medium-sized component has won the company a wider fanbase because it expertly balances performance, durability, and stealth.
item_Name_SHLD_YORM_S02_Haltur=Haltur [CMP-S2-B]
item_Desc_SHLD_YORM_S02_Haltur=Item Type: Shield Generator\nManufacturer: Yorm\nSize: 2\nGrade: B\nClass: Competition\n\nStrong shield health and an exceptional generation rate gives the Haltur the best performance ranking of any shield in its class. Beloved by racers and those who prefer to navigate away from danger instead of soaking it up.
item_Name_SHLD_YORM_S02_Trenta=Trenta [CMP-S2-C]
item_Desc_SHLD_YORM_S02_Trenta=Item Type: Shield Generator\nManufacturer: Yorm\nSize: 2\nGrade: C\nClass: Competition\n\nAn ideal choice for racers looking for a shield generator that provides above average shield performance and durability. As a bonus, the Trenta’s casing is constructed out of a magnesium infused alloy which makes the component both sturdy yet lightweight.
item_NameCOOL_ACOM_S01_IcePlunge=IcePlunge [CMP-S1-C]
item_DescCOOL_ACOM_S01_IcePlunge=Item Type: Cooler\nManufacturer: ACOM\nSize: 1\nGrade: C\nClass: Competition\n\nWhen you’re pushing your ship to the limit during that frantic last lap, you’ll be glad you have ACOM’s IcePlunge to keep things cool.
item_NameCOOL_ACOM_S01_QuickCool=QuikCool [CMP-S1-D]
item_DescCOOL_ACOM_S01_QuickCool=Item Type: Cooler\nManufacturer: ACOM\nSize: 1\nGrade: D\nClass: Competition\n\nThe QuikCool provides superior performance over other coolers in its class. This competition grade component from ACOM sacrifices stealth and some durability to be one of the most powerful entry-level coolers around.
item_NameCOOL_ACOM_S02_AbsoluteZero_SCItem=AbsoluteZero [CMP-S2-B]
item_DescCOOL_ACOM_S02_AbsoluteZero_SCItem=Item Type: Cooler\nManufacturer: ACOM\nSize: 2\nGrade: B \nClass: Competition\n\nOriginally designed for racers, the AbsoluteZero cooler pushes performance to the limits. This high quality component from ACOM features a new coolant cycling system to keep your ship’s systems cool over everything else.
item_NameCOOL_ACOM_S02_IceDive_SCItem=IceDive [CMP-S2-C]
item_DescCOOL_ACOM_S02_IceDive_SCItem=Item Type: Cooler\nManufacturer: ACOM\nSize: 2\nGrade: C \nClass: Competition\n\nThe IceDive delivers peak performance over other medium coolers of its grade, though it does come at the cost of generating high IR and EM signatures.
item_NameCOOL_ACOM_S02_RapidCool_SCItem=RapidCool [CMP-S2-D]
item_DescCOOL_ACOM_S02_RapidCool_SCItem=Item Type: Cooler\nManufacturer: ACOM\nSize: 2\nGrade: D \nClass: Competition\n\nACOM brings its performance first philosophy to this medium cooler. The RapidCool trades signature strength and durability for better performance.
item_NameCOOL_AEGS_S01_Bracer=Bracer [MIL-S1-C]
item_DescCOOL_AEGS_S01_Bracer=Item Type: Cooler\nManufacturer: Aegis Dynamics \nSize: 1\nGrade: C\nClass: Military\n\nFor those looking for a solid, dependable mid-line cooler, you can’t do much better than Aegis’ Bracer. This small-frame cooler system offers solid performance and durability to keep your ship firing on all cylinders.
item_NameCOOL_AEGS_S01_Bracer_SCItem=Bracer [MIL-S1-C]
item_DescCOOL_AEGS_S01_Bracer_SCItem=Item Type: Cooler\nManufacturer: Aegis Dynamics \nSize: 1\nGrade: C\nClass: Military\n\nFor those looking for a solid, dependable mid-line cooler, you can’t do much better than Aegis’ Bracer. This small-frame cooler system offers solid performance and durability to keep your ship firing on all cylinders.
item_NameCOOL_AEGS_S01_Glacier_SCItem=Glacier [MIL-S1-A]
item_DescCOOL_AEGS_S01_Glacier_SCItem=Item Type: Cooler\nManufacturer: Aegis Dynamics\nSize: 1\nGrade: A\nClass: Military\n\nYour weapons, your shields, your thrusters. All vital during combat, all generating heat. Enter the Glacier cooler from Aegis Dynamics. A best-in-class heat management system designed to keep you cool as the pressure mounts.
item_NameCOOL_AEGS_S01_Polar=Polar [MIL-S1-B]
item_DescCOOL_AEGS_S01_Polar=Item Type: Cooler\nManufacturer: Aegis Dynamics \nSize: 1\nGrade: B\nClass: Military\n\nBuilt to the high demands of daily military service, Aegis’ Polar cooler features a reinforced frame for increased durability. You can rest assured that when you drop into the fires of combat, the Polar will keep your ship cool.
item_NameCOOL_AEGS_S01_Tundra=Tundra [MIL-S1-D]
item_DescCOOL_AEGS_S01_Tundra=Item Type: Cooler\nManufacturer: Aegis Dynamics\nSize: 1\nGrade: D\nClass: Military\n\nConstructed by Aegis with military performance in mind, the Tundra’s reliable performance has made it a standard cooler of the UEE Navy.
item_NameCOOL_AEGS_S02_Arctic=Arctic [MIL-S2-C]
item_DescCOOL_AEGS_S02_Arctic=Item Type: Cooler\nManufacturer: Aegis Dynamics \nSize: 2\nGrade: C\nClass: Military\n\nProviding the kind of durability that made Aegis products a mainstay with the military, the Arctic is an economic mil-spec cooler capable of withstanding the rigors of combat without sacrificing performance.
item_NameCOOL_AEGS_S02_Boreal=Boreal [MIL-S2-D]
item_DescCOOL_AEGS_S02_Boreal=Item Type: Cooler\nManufacturer: Aegis Dynamics\nSize: 2\nGrade: D\nClass: Military\n\nDesigned to disperse the heat of battle, Aegis Dynamics’ Boreal cooler is a military standard with the capacity to survive stressful situations.
item_NameCOOL_AEGS_S03_Blizzard_SCItem=Blizzard [MIL-S3-A]
item_DescCOOL_AEGS_S03_Blizzard_SCItem=Item Type: Cooler\nManufacturer: Aegis Dynamics\nSize: 3\nGrade: A \nClass: Military\n\nNavy mechanics worked with Aegis engineers to ensure the Blizzard met their specific needs. When it reached the commercial market, this top of the line, military-grade cooler became one of Aegis’ top selling components.
item_NameCOOL_AEGS_S03_Galinstan_SCItem=Galinstan [MIL-S3-D]
item_DescCOOL_AEGS_S03_Galinstan_SCItem=Item Type: Cooler\nManufacturer: Aegis Dynamics\nSize: 3\nGrade: D \nClass: Military\n\nThe Galinstan is an older model cooler originally developed for the UEE Navy. Its specs won’t knock your socks off but it remains a solid entry level, large cooler.
item_NameCOOL_AEGS_S03_Mercury=Mercury [MIL-S3-C]
item_DescCOOL_AEGS_S03_Mercury=Item Type: Cooler\nManufacturer: Aegis Dynamics \nSize: 3\nGrade: C\nClass: Military\n\nIn combat situations, even the smallest advantage can lead to big gains. With Aegis’ Mercury cooling system onboard, you’ll be able to push your ship hotter for longer when you need it most.
item_NameCOOL_AEGS_S04_Tundra=Tundra [MIL-S4-D]
item_DescCOOL_AEGS_S04_Tundra=Item Type: Cooler\nManufacturer: Aegis Dynamics\nSize: 1\nGrade: D\nClass: Military\n\nConstructed by Aegis with military performance in mind, the Tundra’s reliable performance has made it a standard cooler of the UEE Navy.
item_NameCOOL_JSPN_S00_FrostStarSL=Frost-Star SL [CIV-S0-C]
item_DescCOOL_JSPN_S00_FrostStarSL=Item Type: Cooler\nManufacturer: J-Span\nSize: 0\nGrade: C\nClass: Civilian\n\nWhether cruising across the ground or sailing through space, there’s a J-Span cooler perfect for you. The Frost-Star SL is a mid-tier cooler designed to bring the line’s reliability to ground and open-canopy vehicles.
item_NameCOOL_JSPN_S00_WinterStarSL_SCItem=Winter-Star SL [CIV-S0-D]
item_DescCOOL_JSPN_S00_WinterStarSL_SCItem=Item Type: Cooler\nManufacturer: J-Span\nSize: 0\nGrade: D \nClass: Civilian\n\nThe latest in J-Span’s Winter-Star line of coolers, the SL’s new Kivo system offers a unique dispersal method, allowing your vehicle to manage heat better than ever before.
item_NameCOOL_JSPN_S01_CryoStar=Cryo-Star [CIV-S1-B]
item_DescCOOL_JSPN_S01_CryoStar=Item Type: Cooler\nManufacturer: J-Span\nSize: 1\nGrade: B\nClass: Civilian\n\nJ-Span’s consumer-grade Cryo-Star cooler has become a common sight across the Empire thanks to its reliable heat absorption that won’t strain your ship’s power-plant.
item_NameCOOL_JSPN_S01_FrostStar=Frost-Star [CIV-S1-C]
item_DescCOOL_JSPN_S01_FrostStar=Item Type: Cooler\nManufacturer: J-Span \nSize: 1\nGrade: C\nClass: Civilian\n\nNoted for its consistent performance, the Frost-Star cooler from J-Span has many admirers for its well-balanced power to heat ratio.
item_NameCOOL_JSPN_S01_WinterStar=Winter-Star [CIV-S1-D]
item_DescCOOL_JSPN_S01_WinterStar=Item Type: Cooler\nManufacturer: J-Span \nSize: 1\nGrade: D\nClass: Civilian\n\nJoin the J-Span family by snagging the Winter-Star cooler for your ship. This entry-level model lacks flash but its strong performance record and price point make it a popular choice for pilots across the UEE.
item_NameCOOL_JSPN_S02_CryoStarEX=Cryo-Star EX [CIV-S2-B]
item_DescCOOL_JSPN_S02_CryoStarEX=Item Type: Cooler\nManufacturer: J-Span\nSize: 2\nGrade: B\nClass: Civilian\n\nWith its EX line, J-Span has brought the same reliable heat absorption of their popular Cryo-Star cooler to pilots looking to outfit larger ships.
item_NameCOOL_JSPN_S02_FrostStarEX=Frost-Star EX [CIV-S2-C]
item_DescCOOL_JSPN_S02_FrostStarEX=Item Type: Cooler\nManufacturer: J-Span \nSize: 2\nGrade: C\nClass: Civilian\n\nThe Frost-Star EX cooler comes to you from J-Span, a manufacturer with a well deserved reputation among ship owners for constructing coolers that can reliably handle heat exchange wherever you may fly.
item_NameCOOL_JSPN_S02_WinterStarEX_SCItem=Winter-Star EX [CIV-S2-D]
item_DescCOOL_JSPN_S02_WinterStarEX_SCItem=Item Type: Cooler\nManufacturer: J-Span \nSize: 2\nGrade: D\nClass: Civilian\n\nThe Winter-Star EX is a baseline cooler you can trust. Built by the experts at J-Span, it’s ready to handle whatever conditions you encounter.
item_NameCOOL_JSPN_S03_FrostStarXL_SCItem=Frost-Star XL [CIV-S3-C]
item_DescCOOL_JSPN_S03_FrostStarXL_SCItem=Item Type: Cooler\nManufacturer: J-Span \nSize: 3\nGrade: C\nClass: Civilian\n\nAs your ship flies, components generate heat that can be damaging and even lead to system failures unless properly dealt with by a dependable and properly designed cooler like the Frost-Star XL from J-Span.
item_NameCOOL_JSPN_S03_WinterStarXL_SCItem=Winter-Star XL [CIV-S3-D]
item_DescCOOL_JSPN_S03_WinterStarXL_SCItem=Item Type: Cooler\nManufacturer: J-Span \nSize: 3\nGrade: D\nClass: Civilian\n\nFor two centuries, J-Span has dedicated itself to manufacturing coolers. The Winter-Star XL is their entry level large cooler. What it lacks in features, it more than makes up for in solid craftsmanship.
item_NameCOOL_JUST_S01_EcoFlow=Eco-Flow [IND-S1-B]
item_DescCOOL_JUST_S01_EcoFlow=Item Type: Cooler\nManufacturer: Juno Starwerk \nSize: 1\nGrade: B\nClass: Industrial\n\nA standard for centuries, Juno Starwerk’s industrial Eco-Flow cooler is a favorite of haulers for being easy to maintain even when carrying the heaviest cargo loads.
item_NameCOOL_JUST_S01_Hydrocel=Hydrocel [IND-S1-D]
item_DescCOOL_JUST_S01_Hydrocel=Item Type: Cooler\nManufacturer: Juno Starwerk \nSize: 1\nGrade: D\nClass: Industrial\n\nKeep your ship working harder for longer with the durable Hydrocel, an entry-level industrial cooler from respected manufacturer Juno Starwerk.
item_NameCOOL_JUST_S01_Thermax=Thermax [IND-S1-C]
item_DescCOOL_JUST_S01_Thermax=Item Type: Cooler\nManufacturer: Juno Starwerk \nSize: 1\nGrade: C\nClass: Industrial\n\nJuno Starwerk has done it again. With the Thermax line of coolers, Juno raised the bar on economical industrial coolers made to fit any budget. These small coolers offer above average performance and durability but without breaking the bank.
item_NameCOOL_JUST_S02_CoolCore=CoolCore [IND-S2-C]
item_DescCOOL_JUST_S02_CoolCore=Item Type: Cooler\nManufacturer: Juno Starwerk \nSize: 2\nGrade: C\nClass: Industrial\n\nThe name CoolCore says it all. Designed by Juno Starwerk to be as hardworking as you are, this cooler helps ensure that your entire ship operates well within desired temperature parameters.
item_NameCOOL_JUST_S02_Hydrojet=HydroJet [IND-S2-D]
item_DescCOOL_JUST_S02_Hydrojet=Item Type: Cooler\nManufacturer: Juno Starwerk \nSize: 2\nGrade: D\nClass: Industrial\n\nWhen your ship overheats, it makes just about any task not only more difficult, but potentially dangerous for you and your crew. With the entry-level HydroJet from Juno Starwerk installed, you can be confident that your heat levels are being controlled by a cooler designed by one of the most trustworthy names in the industry.
item_NameCOOL_JUST_S02_Snowfall=Snowfall [IND-S2-B]
item_NameCOOL_JUST_S02_Snowpack_SCItem=Snowpack [IND-S2-A]
item_DescCOOL_JUST_S02_Snowpack_SCItem=Item Type: Cooler\nManufacturer: Juno Starwerk\nSize: 2\nGrade: A \nClass: Industrial\n\nMedium-sized industrial coolers don’t get any better than the Snowpack from Juno Starwerk. Outstanding performance and durability have made it a favorite of haulers for centuries.
item_NameCOOL_JUST_S03_ChillMax_SCItem=Chill-Max [IND-S3-A]
item_DescCOOL_JUST_S03_ChillMax_SCItem=Item Type: Cooler\nManufacturer: Juno Starwerk\nSize: 3\nGrade: A \nClass: Industrial\n\nThe Chill-Max name is as straightforward as the design on this Juno Starwerk cooler. This highly-rated industrial cooler has been a favorite of haulers for centuries.
item_NameCOOL_JUST_S03_Hydropulse_SCItem=Hydropulse [IND-S3-D]
item_DescCOOL_JUST_S03_Hydropulse_SCItem=Item Type: Cooler\nManufacturer: Juno Starwerk\nSize: 3\nGrade: D \nClass: Industrial\n\nAn entry level option to Juno Starwerk’s brand of coolers, the Hydropulse sacrifices some durability and utilizes some design tricks to make this large industrial cooler an option for those unable to afford one of their top of the line models.
item_NameCOOL_JUST_S03_ThermalCore=ThermalCore [IND-S3-C]
item_DescCOOL_JUST_S03_ThermalCore=Item Type: Cooler\nManufacturer: Juno Starwerk \nSize: 3\nGrade: C\nClass: Industrial\n\nWhen you’re in the middle of an important job, you don’t want to waste time wondering if your cooler is doing its part. Now you don’t have to. With the dependable mid-level ThermalCore cooler from Juno Starwerk onboard, you can take all the guesswork out of heat management.
item_NameCOOL_LPLT_S01_ArcticStorm=ArcticStorm [CIV-S1-C]
item_DescCOOL_LPLT_S01_ArcticStorm=Item Type: Cooler\nManufacturer: Lightning Power Ltd. \nSize: 1\nGrade: C\nClass: Civilian\n\nIf you’re after a cooler that balances performance, durability and stealth, then look to the ArcticStorm. This mid-grade cooler from Lightning Power Ltd uses their centuries old technology to provide performance that can be relied upon.
item_NameCOOL_LPLT_S01_BlastChill=BlastChill [CIV-S1-D]
item_DescCOOL_LPLT_S01_BlastChill=Item Type: Cooler\nManufacturer: Lightning Power Ltd. \nSize: 1\nGrade: D\nClass: Civilian\n\nThe BlastChill is a consumer-grade cooler from Lightning Power Ltd. It keeps your ship running without straining its signature, but is best known for a much mocked 2945 ad campaign that promised it was “Built to bring the chill.”
item_NameCOOL_LPLT_S01_FlashFreeze=FlashFreeze [CIV-S1-B]
item_DescCOOL_LPLT_S01_FlashFreeze=Item Type: Cooler\nManufacturer: Lightning Power Ltd. \nSize: 1\nGrade: B\nClass: Civilian\n\nWith the FlashFreeze, Lightning Power makes sure that no matter how hot things get, you can rely on its proven cooling technology to keep you flying.
item_NameCOOL_LPLT_S02_ColdSnap=ColdSnap [CIV-S2-C]
item_DescCOOL_LPLT_S02_ColdSnap=Item Type: Cooler\nManufacturer: Lightning Power Ltd. \nSize: 2\nGrade: C\nClass: Civilian\n\nWell-balanced performance is the hallmark of the ColdSnap cooler from Lightning Power Ltd., thanks to its ability to easily process the extra heat your ship generates during your day-to-day travels.
item_NameCOOL_LPLT_S03_ColdSurge_SCItem=ColdSurge [CIV-S3-D]
item_DescCOOL_LPLT_S03_ColdSurge_SCItem=Item Type: Cooler\nManufacturer: Lighting Power Ltd.\nSize: 3\nGrade: D \nClass: Civilian \n\nMake no mistake, the ColdSurge may not win any awards, but this large cooler from Lighting Power Ltd provides a good entry-level option for most civilian ships without breaking the bank.
item_NameCOOL_LPLT_S03_FrostBurn=FrostBurn [CIV-S3-C]
item_DescCOOL_LPLT_S03_FrostBurn=Item Type: Cooler\nManufacturer: Lightning Power Ltd. \nSize: 3\nGrade: C\nClass: Civilian\n\nLightning Power Ltd. has put its years of design expertise and manufacturing know-how to craft the FrostBurn, an effective cooler that can handle the large scale heat management needs of a wide variety of ships on the market.
item_NameCOOL_TYDT_S01_HeatSafe=HeatSafe [STH-S1-C]
item_DescCOOL_TYDT_S01_HeatSafe=Item Type: Cooler\nManufacturer: Tyler Design & Tech	\nSize: 1\nGrade: C\nClass: Stealth\n\nPilots looking to keep their IR signature low rely on Tyler Design & Tech. As an entry level cooler, the HeatSafe not only limits emissions, it is built with Tyler’s satisfaction guarantee.
item_NameCOOL_TYDT_S01_VaporBlock=VaporBlock [STH-S1-B]
item_DescCOOL_TYDT_S01_VaporBlock=Item Type: Cooler\nManufacturer: Tyler Design & Tech \nSize: 1\nGrade: B\nClass: Stealth\n\nFew coolers can match the stealth performance of the VaporBlock. The team at Tyler Design & Tech have crafted a cooler that keeps your ship’s signature low while delivering acceptable durability and performance.
item_NameCOOL_TYDT_S02_HeatSink_SCItem=HeatSink [STH-S2-C]
item_DescCOOL_TYDT_S02_HeatSink_SCItem=Item Type: Cooler\nManufacturer: Tyler Design & Tech\nSize: 2\nGrade: C\nClass: Stealth\n\nThe HeatSink produces low signatures without sacrificing too much performance or durability, making it a reliable stealth component.
item_NameCOOL_TYDT_S02_IceBox_SCItem=IceBox [STH-S2-B]
item_DescCOOL_TYDT_S02_IceBox_SCItem=Item Type: Cooler\nManufacturer: Tyler Design & Tech        \nSize: 2\nGrade: B \nClass: Stealth\n\nThe IceBox is an upgrade to the company’s standard medium cooler, as the team at Tyler Design & Tech made a number of subtle modifications and material upgrades that lowered the component’s signatures without greatly affecting its durability.
item_NameCOOL_TYDT_S02_NightFall_SCItem=NightFall [STH-S2-A]
item_DescCOOL_TYDT_S02_NightFall_SCItem=Item Type: Cooler\nManufacturer: Tyler Design & Tech        \nSize: 2\nGrade: A\nClass: Stealth\n\nRun silent and safe with the NightFall from Tyler Design & Tech. Few coolers can match the way this component manages your ship's heat while also keeping its signatures low.
item_NameCOOL_WCPR_S00_Fridan=Fridan [CIV-S0-C]
item_DescCOOL_WCPR_S00_Fridan=Item Type: Cooler\nManufacturer: Wen/Cassel Propulsion\nSize: 0\nGrade: C\nClass: Civilian\n\nThe Fridan is Wen/Cassel Propulsion’s entry-level vehicle cooler. It has proven time and again that it can withstand even the worst environmental conditions, making it an ideal component for your vehicle.
item_NameCOOL_WCPR_S00_Tepilo_SCItem=Tepilo [CIV-S0-A]
item_DescCOOL_WCPR_S00_Tepilo_SCItem=Item Type: Cooler\nManufacturer: Wen/Cassel Propulsion        \nSize: 0\nGrade: A \nClass: Civilian\n\nFew can top the cooling power of Wen/Cassel’s Tepilo. This top of the line cooler provides stellar durability and performance for ground vehicles.
item_NameCOOL_WCPR_S01_Berian=Berian [CIV-S1-C]
item_DescCOOL_WCPR_S01_Berian=Item Type: Cooler\nManufacturer: Wen/Cassel Propulsion \nSize: 1\nGrade: C\nClass: Civilian\n\nThe Berian delivers Wen/Cassel’s signature look and performance in an introductory cooler that will meet and surpass pilot’s expectations.
item_NameCOOL_WCPR_S01_Endo=Endo [CIV-S1-B]
item_DescCOOL_WCPR_S01_Endo=Item Type: Cooler\nManufacturer: Wen/Cassel Propulsion	\nSize: 1\nGrade: B\nClass: Civilian\n\nA cooler for discerning ship-owners who are looking to push their craft further, Wen/Cassel’s Endo features above average cooling performance and thoughtful design.
item_NameCOOL_WCPR_S02_Graupel=Graupel [CIV-S2-C]
item_DescCOOL_WCPR_S02_Graupel=Item Type: Cooler\nManufacturer: Wen/Cassel Propulsion\nSize: 2\nGrade: C\nClass: Civilian\n\nThe Graupel not only provides the top of the line cooling technology that larger ships need to maintain optimal performance, it does it with Wen/Cassel’s signature craftsmanship.
item_NameCOOL_WCPR_S02_Taiga_SCItem=Taiga [CIV-S2-B]
item_DescCOOL_WCPR_S02_Taiga_SCItem=Item Type: Cooler\nManufacturer: Wen/Cassel Propulsion\nSize: 2\nGrade: B\nClass: Civilian\n\nWen/Cassel has worked long and hard to develop quality coolers like the latest edition Taiga, which can process and manage excess heat while consistently maintaining the high standards that they have become known for.
item_NameCOOL_WCPR_S03_Draug_SCItem=Draug [CIV-S3-A]
item_DescCOOL_WCPR_S03_Draug_SCItem=Item Type: Cooler\nManufacturer: Wen/Cassel Propulsion\nSize: 3\nGrade: C\nClass: Civilian\n\nThe Draug balances performance, durability, and stealth. Making this large Wen/Cassel cooler ready to respond to any situation you find yourself in.
item_NameCOOL_WCPR_S03_Elsen_SCItem=Elsen [CIV-S3-A]
item_DescCOOL_WCPR_S03_Elsen_SCItem=Item Type: Cooler\nManufacturer: Wen/Cassel Propulsion\nSize: 3\nGrade: B\nClass: Civilian\n\nWen/Cassel engineers used many of the same parts found in the Draug, only fine tuned to deliver improved performance and durability without greatly enhancing its signature. That makes the Elsen large cooler a worthy upgrade for those that can handle the extra heat.
item_NameCOOL_WCPR_S03_Kragen_SCItem=Kragen [CIV-S3-A]
item_DescCOOL_WCPR_S03_Kragen_SCItem=Item Type: Cooler\nManufacturer: Wen/Cassel Propulsion\nSize: 3\nGrade: A\nClass: Civilian\n\nWhen you go big, get nothing but the best. The Kragen from Wen/Cassel Propulsion has consistently been rated among the best large, commercial coolers available on the market.
item_NameMISL_S01_CS_BEHR_Spearhead_Ground=[CS] Spearhead GVI-CS Missile
item_DescMISL_S01_CS_BEHR_Spearhead_Ground=Manufacturer: Behring\nTracking Signal: Cross Section\nSize: 1 (Ground Vehicle Only)\n\nBehring specifically designed the Spearhead line of missiles for ground vehicles. The company's rigorous testing and renowned precision ensures that this missile will elevate your surface-to-air defensive capabilities.
item_NameMISL_S01_CS_BEHR_Spearhead_Ground_Short=[CS] Spearhead GVI-CS Mis
item_NameMISL_S01_CS_FSKI_Spark=[CS] Spark I Missile
item_DescMISL_S01_CS_FSKI_Spark=Manufacturer: Firestorm Kinetics\nTracking Signal: Cross Section\nSize: 1\n\nThose that believe size doesn’t matter would do well to stay clear of the Firestorm Kinetics Spark. Using cross section targeting, this lightweight proximity missile packs a considerable punch.
item_NameMISL_S01_CS_FSKI_Spark_short=[CS] Spark I
item_NameMISL_S01_EM_BEHR_Pioneer=[EM] Pioneer I Missile
item_DescMISL_S01_EM_BEHR_Pioneer=Manufacturer: Behring\nTracking Signal: Electromagnetic\nSize: 1\n\nBehring prides itself on dependability and the Pioneer is no exception. The updated Oracle EM tracking system has proven itself time and again in numerous consumer-testing reports against similarly classed proximity missiles.
item_NameMISL_S01_EM_BEHR_Pioneer_short=[EM] Pioneer I
item_NameMISL_S01_EM_BEHR_Spearhead_Ground=[EM] Spearhead GVI-EM Missile
item_DescMISL_S01_EM_BEHR_Spearhead_Ground=Manufacturer: Behring\nTracking Signal: Electromagnetic\nSize: 1 (Ground Vehicle Only)\n\nBehring specifically designed the Spearhead line of missiles for ground vehicles. The company's rigorous testing and renowned precision ensures that this missile will elevate your surface-to-air defensive capabilities.
item_NameMISL_S01_EM_BEHR_Spearhead_Ground_Short=[EM] Spearhead GVI-EM Mis
item_NameMISL_S01_EM_THCN_TaskForce=[EM] TaskForce I Missile
item_DescMISL_S01_EM_THCN_TaskForce=Manufacturer: Thermyte Concern\nTracking Signal: Electromagnetic\nSize: 1\n\nVenturing into the weapons market, Thermyte Concern have pooled their extensive knowledge of demolition explosives to create the TaskForce. A lightweight EM tracking strike missile with a top-in-class propulsion system provides an efficient mixture of speed and firepower to establish battlefield dominance.
item_NameMISL_S01_EM_THCN_TaskForce_short=[EM] TaskForce I
item_NameMISL_S01_IR_BEHR_Marksman=[IR] Marksman I Missile
item_DescMISL_S01_IR_BEHR_Marksman=Manufacturer: Behring\nTracking Signal: Infrared\nSize: 1\n\nBehring's Marksman series of proximity missiles has earned as much of a reputation for its ability to track a wide range of heat signatures as it has for its area-effect proximity damage.
item_NameMISL_S01_IR_BEHR_Marksman_short=[IR] Marksman I
item_NameMISL_S01_IR_BEHR_Spearhead_Ground=[IR] Spearhead GVI-IR Missile
item_DescMISL_S01_IR_BEHR_Spearhead_Ground=Manufacturer: Behring\nTracking Signal: Infrared\nSize: 1 (Ground Vehicle Only)\n\nBehring specifically designed the Spearhead line of missiles for ground vehicles. The company's rigorous testing and renowned precision ensures that this missile will elevate your surface-to-air defensive capabilities.
item_NameMISL_S01_IR_BEHR_Spearhead_Ground_Short=[IR] Spearhead GVI-IR Mis
item_NameMISL_S01_IR_VNCL_Arrow=[IR] 'Arrow' I Missile
item_DescMISL_S01_IR_VNCL_Arrow=Manufacturer: Vanduul\nTracking Signal: Infrared\nSize: 1\n\nCommonly known by its military designation, the Arrow is a small infrared strike missile that has become a mainstay of the Vanduul armory.
item_NameMISL_S01_IR_VNCL_Arrow_short=[IR] Arrow I
item_NameMISL_S02_CS_FSKI_Agitator_Ground=[CS] Agitator II-CSV Missile
item_DescMISL_S02_CS_FSKI_Agitator_Ground=Manufacturer: Firestorm Kinetics\nTracking Signal: Cross Section\nSize: 2 (Ground Vehicle Only)\n\nGive ground vehicles a better chance to strike back with the Agitator line of missiles. Firestorm Kinetics refined this S2 missile to elevate your ground game and deliver its deadly payload to speedy spacecraft.
item_NameMISL_S02_CS_FSKI_Agitator_Ground_Short=[CS] Agitator II-CSV Mis
item_NameMISL_S02_CS_FSKI_Tempest=[CS] Tempest II Missile
item_DescMISL_S02_CS_FSKI_Tempest=Manufacturer: Firestorm Kinetics\nTracking Signal: Cross Section\nSize: 2\n\nThe Tempest was designed with nothing but annihilation in mind. Utilizing FireStorm Kinetics' targeting technology, this proximity missile locks onto a target's cross section to draw conflicts to a swift conclusion.
item_NameMISL_S02_CS_FSKI_Tempest_short=[CS] Tempest II
item_NameMISL_S02_CS_THCN_StrikeForce=[CS] StrikeForce II Missile
item_DescMISL_S02_CS_THCN_StrikeForce=Manufacturer: Thermyte Concern\nTracking Signal: Cross Section\nSize: 2\n\nThe StrikeForce is the latest culmination of Thermyte Concern's expansion into the missile industry, showcasing notable design and cross-section targeting improvements.
item_NameMISL_S02_CS_THCN_StrikeForce_short=[CS] StrkFrc II
item_NameMISL_S02_EM_FSKI_Agitator_Ground=[EM] Agitator II-EMV Missile
item_DescMISL_S02_EM_FSKI_Agitator_Ground=Manufacturer: Firestorm Kinetics\nTracking Signal: Electromagnetic\nSize: 2 (Ground Vehicle Only)\n\nGive ground vehicles a better chance to strike back with the Agitator line of missiles. Firestorm Kinetics refined this S2 missile to elevate your ground game and deliver its deadly payload to speedy spacecraft.
item_NameMISL_S02_EM_FSKI_Agitator_Ground_Short=[EM] Agitator II-EMV Mis
item_NameMISL_S02_EM_TALN_Dominator=[EM] Dominator II Missile
item_DescMISL_S02_EM_TALN_Dominator=Manufacturer: Talon\nTracking Signal: Electromagnetic\nSize: 2\n\nDesigned to track an opponent’s electromagnetic signature, the Dominator strike missile is a precision ordnance package designed to establish tactical battlefield dominance.
item_NameMISL_S02_EM_TALN_Dominator_short=[EM] Dmntr II
item_NameMISL_S02_IR_FSKI_Agitator_Ground=[IR] Agitator II-IRV Missile
item_DescMISL_S02_IR_FSKI_Agitator_Ground=Manufacturer: Firestorm Kinetics\nTracking Signal: Infrared\nSize: 2 (Ground Vehicle Only)\n\nGive ground vehicles a better chance to strike back with the Agitator line of missiles. Firestorm Kinetics refined this S2 missile to elevate your ground game and deliver its deadly payload to speedy spacecraft.
item_NameMISL_S02_IR_FSKI_Agitator_Ground_Short=[IR] Agitator II-IRV Mis
item_NameMISL_S02_IR_FSKI_Ignite=[IR] Ignite II Missile
item_DescMISL_S02_IR_FSKI_Ignite=Manufacturer: Firestorm Kinetics\nTracking Signal: Infrared\nSize: 2\n\nThe Ignite is Firestorm's premier brand of heat-seeking strike missile that is the definition of Fire and Forget. Simply let it fly and enjoy the show.
item_NameMISL_S02_IR_FSKI_Ignite_short=[IR] Ignite II
item_NameMISL_S02_IR_NOVP_Rattler=[IR] Rattler II Missile
item_DescMISL_S02_IR_NOVP_Rattler=Manufacturer: Nova Pyrotechnica\nTracking Signal: Infrared\nSize: 2\n\nThe Rattler is a cost-effective cluster missile that will no doubt appeal to a wide variety of pilots. When fired, the Rattler will track the opponent’s IR signature and create an opening barrage that weakens the armor or shields, leaving the target vulnerable to the full payload that follows.
item_NameMISL_S02_IR_NOVP_Rattler_short=[IR] Rattler II
item_NameMISL_S02_IR_VNCL_Bullet=[IR] 'Bullet' II Missile
item_DescMISL_S02_IR_VNCL_Bullet=Manufacturer: Vanduul\nTracking Signal: Infrared\nSize: 2\n\nPilots in the Navy have developed a healthy respect for this infrared targeting Vanduul strike missile, formally designated Bullet.
item_NameMISL_S02_IR_VNCL_Bullet_short=[IR] Bullet II
item_NameMISL_S03_CS_FSKI_Arrester=[CS] Arrester III Missile
item_DescMISL_S03_CS_FSKI_Arrester=Manufacturer: Firestorm Kinetics\nTracking Signal: Cross Section\nSize: 3\n\nUsing cross section targeting to hunt for its prey, the Firestorm Arrester proximity missile makes quick work of enemies caught in the crosshairs.
item_NameMISL_S03_CS_FSKI_Arrester_short=[CS] Arrstr III
item_NameMISL_S03_EM_FSKI_Thunderbolt=[EM] Thunderbolt III Missile
item_DescMISL_S03_EM_FSKI_Thunderbolt=Manufacturer: Firestorm Kinetics\nTracking Signal: Electromagnetic \nSize: 3\n\nThanks to the Firestorm Thunderbolt's agile frame and EM targeting system, this proximity missile is a solid choice for a wide variety of combat scenarios.
item_NameMISL_S03_EM_FSKI_Thunderbolt_short=[EM] Thdrblt III
item_NameMISL_S03_IR_NOVP_Viper=[IR] Viper III Missile
item_DescMISL_S03_IR_NOVP_Viper=Manufacturer: Nova Pyrotechnica\nTracking Signal: Infrared\nSize: 3\n\nNova has worked hard to insure that their infrared tracking Viper strike missile lives up to its name by delivering agile and lethal attacks against hostile targets.
item_NameMISL_S03_IR_NOVP_Viper_short=[IR] Viper III
item_NameMISL_S03_IR_VNCL_Chaos=[IR] 'Chaos' III Missile
item_DescMISL_S03_IR_VNCL_Chaos=Manufacturer: Vanduul\nTracking Signal: Infrared\nSize: 3\n\nNaval flight instructors often include the heat seeking Chaos strike missile in Vanduul attack simulations citing that its speed and strength gives new recruits the proper respect for the enemy they will be facing.
item_NameMISL_S03_IR_VNCL_Chaos_short=[IR] Chaos III
item_NameMISL_S04_CS_TALN_Assailant=[CS] Assailant IV Missile
item_DescMISL_S04_CS_TALN_Assailant=Manufacturer: Talon\nTracking Signal: Cross Section\nSize: 4\n\nThe Assailant missile from Talon is a perfect weapon solution for precision strikes against motivated opponents.
item_NameMISL_S04_CS_TALN_Assailant_short=[CS] Asslnt IV
item_NameMISL_S04_EM_TALN_Raptor=[EM] Raptor IV Missile
item_DescMISL_S04_EM_TALN_Raptor=Manufacturer: Talon\nTracking Signal: Electromagnetic\nSize: 4\n\nUtilizing advanced electromagnetic tracking and balanced precision flight, the Talon Raptor strike missile is a fierce addition to any ship's arsenal.
item_NameMISL_S04_EM_TALN_Raptor_short=[EM] Raptor IV
item_NameMISL_S04_IR_BEHR_Pathfinder=[IR] Pathfinder IV Missile
item_DescMISL_S04_IR_BEHR_Pathfinder=Manufacturer: Behring\nTracking Signal: Infrared\nSize: 4\n\nThe Pathfinder proximity missile has been a consistent member of Behring's already robust arsenal thanks to its tried and tested propulsion system and heat seeking guidance array.
item_NameMISL_S04_IR_BEHR_Pathfinder_short=[IR] Pathfndr IV
item_NameMISL_S04_IR_VNCL_Dragon=[IR] 'Dragon' IV Missile
item_DescMISL_S04_IR_VNCL_Dragon=Manufacturer: Vanduul\nTracking Signal: Infrared\nSize: 4\n\nDesignated the Dragon, this Vanduul infrared tracking strike missile has a fearful reputation earned the number of destroyed Naval ships attributed to its destructive power.
item_NameMISL_S04_IR_VNCL_Dragon_short=[IR] Dragon IV
item_NameMISL_S05_CS_TALN_Stalker=[CS] Stalker V Missile
item_DescMISL_S05_CS_TALN_Stalker=Manufacturer: Talon\nTracking Signal: Cross Section\nSize: 5\n\nWith dedicated cross section tracking, the Talon Stalker has endured over the years as a precision strike torpedo with maximum stopping power.
item_NameMISL_S05_CS_TALN_Stalker_short=[CS] Stalker V
item_NameMISL_S05_EM_TALN_Reaper=[EM] Reaper V Missile
item_DescMISL_S05_EM_TALN_Reaper=Manufacturer: Talon\nTracking Signal: Electromagnetic\nSize: 5\n\nThe Reaper strike torpedo features a favorable destructive yield-to-expense ratio and a proven Talon EM tracking suite.
item_NameMISL_S05_EM_TALN_Reaper_short=[EM] Reaper V
item_NameMISL_S05_EM_TALN_Scimitar=[EM] Scimitar V Missile
item_DescMISL_S05_EM_TALN_Scimitar=Manufacturer: Talon\nTracking Signal: Electromagnetic\nSize: 5\n\nThe Scimitar missile tracks targets via their EM signature to deliver a devastating size five payload.
item_NameMISL_S05_EM_TALN_Scimitar_short=[EM] Scimitar V
item_NameMISL_S05_IR_TALN_Valkyrie=[IR] Valkyrie V Missile
item_DescMISL_S05_IR_TALN_Valkyrie=Manufacturer: Talon\nTracking Signal: Infrared\nSize: 5\n\nTalon's torpedo design team pulled out all the stops for their latest Valkyrie strike torpedo by creating a multitiered thrust solution with state of the art infrared tracking capabilities.
item_NameMISL_S05_IR_TALN_Valkyrie_short=[IR] Valkyrie V
item_NameMISL_S07_IR_TALN_Hellion=[IR] Hellion VII Missile
item_DescMISL_S07_IR_TALN_Hellion=Manufacturer: Talon\nTracking Signal: Infrared\nSize: 7\n\nCarrying a sizable payload and an advanced heat-seeking sensor suite, the Hellion missile from Talon can be effective against aggressors of all sizes.
item_NameMISL_S07_IR_TALN_Hellion_short=[IR] Hellion VII
item_NameMISL_S09_CS_TALN_Argos=[CS] Argos IX Torpedo
item_DescMISL_S09_CS_TALN_Argos=Manufacturer: Talon\nTracking Signal: Cross Section\nSize: 9\n\nThe Talon Argos strike torpedo features a classic, straightforward design that relies on exacting manufacturing standards and a classic cross section targeting system.
item_NameMISL_S09_CS_TALN_Argos_short=[CS] Argos IX
item_NameMISL_S09_EM_TALN_Seeker=[EM] Seeker IX Torpedo
item_DescMISL_S09_EM_TALN_Seeker=Manufacturer: Talon\nTracking Signal: Electromagnetic\nSize: 9\n\nTalon's Seeker torpedo is a precision, EM-targeting torpedo capable of delivering a massive payload quickly and accurately.
item_NameMISL_S09_EM_TALN_Seeker_short=[EM] Seeker IX
item_NameMISL_S09_IR_TALN_Typhoon=[IR] Typhoon IX Torpedo
item_DescMISL_S09_IR_TALN_Typhoon=Manufacturer: Talon\nTracking Signal: Infrared\nSize: 9\n\nDesigned by Talon, the Typhoon heat seeking strike torpedo delivers a heavy payload sure to serve as a deterrent from any further hostile actions.
item_NameMISL_S09_IR_TALN_Typhoon_short=[IR] Typhoon IX
item_NameMISL_S10_CS_BEHR_Executor=[CS] EX-T10-CS "Executor" Torpedo
item_DescMISL_S10_CS_BEHR_Executor=Manufacturer: Behring\nTracking Signal: Cross Section\nSize: 10\n\nBehring prides itself on crafting ordnance that is as dependable as it is powerful and the EX-T10 "Executor" is no exception. Designed as an anti-ship and anti-installation weapon, Behring engineers worked tirelessly to ensure this torpedo was a bold strategic statement.
item_NameMISL_S10_CS_BEHR_Executor_Short=[CS] EX-T10-CS Torpedo
