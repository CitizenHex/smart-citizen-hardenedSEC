item_Desc_RADR_NAVE_S01_SNSR5=Item Type: Radar\nManufacturer: Nav-E7 Gadgets\nSize: 1\nGrade: D\nClass: Competition\n\nThe SNSR5 radar small size and dependable performance makes it the perfect device for entry-level users.
