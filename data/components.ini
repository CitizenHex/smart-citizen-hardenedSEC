item_Desc_RADR_NAVE_S02_SNSR6x=Item Type: Radar\nManufacturer: Nav-E7 Gadgets\nSize: 2\nGrade: C\nClass: Competition\n\nThe SNS-R6x provides certainty when detecting electromagnetic emissions, as well as offering reasonable levels of energy efficiency.
