item_Desc_RADR_NAVE_S02_SNSR7x=Item Type: Radar\nManufacturer: Nav-E7 Gadgets\nSize: 2\nGrade: B\nClass: Competition\n\nFavoring energy efficiency above all, the SNS-R7x is a radar is ideal for those looking to manage their ship's levels effectively, whilst still providing excellent vision.
