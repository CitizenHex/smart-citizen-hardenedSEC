mtps_bounty_desc_ERT=ABOUT THE JOB\nmicroTech Protection Services is looking for a qualified bounty hunter to apprehend the extreme-risk target ~mission(TargetName) from ~mission(Location|Address). \n\nAn extreme-risk target typically pilots a sub-capital class vessel, has several heavily-armed allies, and is expected to be very difficult to apprehend. It may be useful to bring along support staff to assist with engaging this target.\n\nRESPONSIBILITIES\n• Provide own transportation to ~mission(Location|Address).\n• Neutralize ~mission(TargetName); using force as necessary.\n\nMINIMUM QUALIFICATIONS\n• Bounty Hunters Guild membership and appropriate certification.\n• Access to vehicle suitably outfitted for combat.\n• Available for immediate deployment.\n\nPREFERRED QUALIFICATIONS\n• Ability to handle high pressure situations.\n\n\n== Stats ==\naUEC Reward: 25,000\nReputation XP: +500
mtps_bounty_desc_HRT=ABOUT THE JOB\nmicroTech Protection Services is looking for a qualified bounty hunter to apprehend the high-risk target ~mission(TargetName) from ~mission(Location|Address). \n\nA high-risk target typically pilots a large multicrew vessel, has several known allies, and is expected to be difficult to apprehend. It may be useful to bring along support staff to assist with engaging this target.\n\nRESPONSIBILITIES\n• Provide own transportation to ~mission(Location|Address).\n• Neutralize ~mission(TargetName); using force as necessary.\n\nMINIMUM QUALIFICATIONS\n• Bounty Hunters Guild membership and appropriate certification.\n• Access to vehicle suitably outfitted for combat.\n• Available for immediate deployment.\n\nPREFERRED QUALIFICATIONS\n• Ability to handle high pressure situations.\n\n\n== Stats ==\naUEC Reward: 17,500\nReputation XP: +500
mtps_bounty_desc_LRT=ABOUT THE JOB\nmicroTech Protection Services is looking for a qualified bounty hunter to apprehend the low-risk target ~mission(TargetName) from ~mission(Location|Address). \n\nA low-risk target typically pilots a single seater craft, has several known allies, and should be straightforward to apprehend.\n\nRESPONSIBILITIES\n• Provide own transportation to ~mission(Location|Address).\n• Neutralize ~mission(TargetName); using force as necessary.\n\nMINIMUM QUALIFICATIONS\n• Bounty Hunters Guild membership and appropriate certification.\n• Access to vehicle suitably outfitted for combat.\n• Available for immediate deployment.\n\nPREFERRED QUALIFICATIONS\n• Ability to handle high pressure situations.\n\n\n== Stats ==\naUEC Reward: 5,000\nReputation XP: +500
mtps_bounty_desc_MRT=ABOUT THE JOB\nmicroTech Protection Services is looking for a qualified bounty hunter to apprehend the moderate-risk target ~mission(TargetName) from ~mission(Location|Address). \n\nA moderate-risk target typically pilots a small multicrew vessel, has several known allies, and may be slightly difficult to apprehend.\n\nRESPONSIBILITIES\n• Provide own transportation to ~mission(Location|Address).\n• Neutralize ~mission(TargetName); using force as necessary.\n\nMINIMUM QUALIFICATIONS\n• Bounty Hunters Guild membership and appropriate certification.\n• Access to vehicle suitably outfitted for combat.\n• Available for immediate deployment.\n\nPREFERRED QUALIFICATIONS\n• Ability to handle high pressure situations.\n\n\n== Stats ==\naUEC Reward: 7,500\nReputation XP: +500
mtps_bounty_desc_VLRT=ABOUT THE JOB\nmicroTech Protection Services is looking for a qualified bounty hunter to apprehend the very low-risk target ~mission(TargetName) from ~mission(Location|Address). \n\nA very low-risk target typically pilots a single seater craft, has few known allies, and should be relatively easy to apprehend.\n\nRESPONSIBILITIES\n• Provide own transportation to ~mission(Location|Address).\n• Neutralize ~mission(TargetName); using force as necessary.\n\nMINIMUM QUALIFICATIONS\n• Bounty Hunters Guild membership and appropriate certification.\n• Access to vehicle suitably outfitted for combat.\n• Available for immediate deployment.\n\nPREFERRED QUALIFICATIONS\n• Ability to handle high pressure situations.\n\n\n== Stats ==\naUEC Reward: 4,000\nReputation XP: +500
mtps_bounty_desc_intro=ABOUT THE JOB\nmicroTech Protection Services is in need of new qualified bounty hunters to expand our existing roster. To evaluate your skills, we would like you to assist us in the apprehension of ~mission(TargetName) from ~mission(Location|Address).\n\n\nRESPONSIBILITIES\n• Provide own transportation to ~mission(Location|Address).\n• Neutralize ~mission(TargetName); using force as necessary.\n\nMINIMUM QUALIFICATIONS\n• Bounty Hunters Guild membership and appropriate certification.\n• Access to vehicle suitably outfitted for combat.\n• Available for immediate deployment.\n\nPREFERRED QUALIFICATIONS\n• Ability to handle high pressure situations.\n\n\n== Stats ==\naUEC Reward: 4,000\nReputation XP: +500
mtps_bounty_desc_rehire=ABOUT THE JOB\nWhile your past performance has not been to our standards, microTech Protection Services has decided to offer you a chance to redeem yourself. \n\nTo reevaluate your skills, we would like you to apprehend ~mission(TargetName) from ~mission(Location|Address).\n\nRESPONSIBILITIES\n• Provide own transportation to ~mission(Location|Address).\n• Neutralize ~mission(TargetName); using force as necessary.\n\nMINIMUM QUALIFICATIONS\n• Bounty Hunters Guild membership and appropriate certification.\n• Access to vehicle suitably outfitted for combat.\n• Available for immediate deployment.\n\nPREFERRED QUALIFICATIONS\n• Ability to handle high pressure situations.\n\n\n== Stats ==\naUEC Reward: 4,000\nReputation XP: +500
mtps_bounty_fps_UGF_desc_001=ABOUT THE JOB\nmicroTech Protection Services is looking for a qualified bounty hunter to apprehend ~mission(TargetName) from ~mission(Location|Address). \n\nWhile there will be other criminals at the site, your main focus should be on completing the bounty.\n\nRESPONSIBILITIES\n• Provide own transportation to ~mission(Location|Address).\n• Neutralize ~mission(TargetName); using force as necessary.\n\nMINIMUM QUALIFICATIONS\n• Bounty Hunters Guild membership and appropriate certification.\n• Access to combat equipment and mode of transport.\n• Available for immediate deployment.\n\nPREFERRED QUALIFICATIONS\n• Ability to handle high pressure situations.\n\n\n== Stats ==\naUEC Reward: 9,000\nReputation XP: +500
mtps_bounty_fps_UGF_nocivs_desc_001=ABOUT THE JOB\nmicroTech Protection Services is looking for a qualified bounty hunter to assist in the apprehension of ~mission(TargetName) from ~mission(Location|Address). We are aware that there may be civilians on site, so please be mindful of possible crossfire.\n\nRESPONSIBILITIES\n• Provide own transportation to ~mission(Location|Address).\n• Neutralize ~mission(TargetName); using force as necessary.\n• Ensure no civilian casualties.\n\nMINIMUM QUALIFICATIONS\n• Bounty Hunters Guild membership and appropriate certification.\n• Access to combat equipment and mode of transport.\n• Available for immediate deployment.\n\nPREFERRED QUALIFICATIONS\n• Ability to handle high pressure situations.\n\n\n== Stats ==\naUEC Reward: 14,000\nReputation XP: +1,000
