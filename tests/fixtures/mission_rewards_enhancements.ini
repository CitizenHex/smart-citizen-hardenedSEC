mtps_UGF_eliminateall_desc_001=ABOUT THE JOB\nmicroTech Protection Services is looking for a detail-oriented security professional who can quickly and safely assist us in the complete removal of illegal occupants who have temporarily gained control of ~mission(Location|Address).\n\nRESPONSIBILITIES\n• Provide own transportation to ~mission(Location|Address).\n• Remove all illegal occupants found within the site; using force as necessary.\n\nMINIMUM QUALIFICATIONS\n• 2 years of combined mercenary and/or security experience.\n• Access to combat equipment and mode of transport.\n• Available for immediate deployment.\n\nPREFERRED QUALIFICATIONS\n• Experience with rapid hostility de-escalation techniques.\n\n\n== Stats ==\naUEC Reward: 30,000\nReputation XP: +500
mtps_UGF_eliminateall_nocivs_desc_001=ABOUT THE JOB\nmicroTech Protection Services is looking for a detail-oriented mercenary professional who can quickly and safely assist us in the complete removal of illegal occupants who have temporarily gained control of ~mission(Location|Address).\n\nBe aware that our intel shows there are civilian workers onsite. Since their connection with the gang is unclear, they should be considered non-combatants. Any hostile action towards them will not be tolerated. \n\nRESPONSIBILITIES\n• Provide own transportation to ~mission(Location|Address).\n• Remove all hostile occupants found within the site; using force if necessary.\n• Ensure the safety of any civilians who may be onsite. \n\nMINIMUM QUALIFICATIONS\n• 2 years of combined mercenary and/or security experience.\n• Access to combat equipment and mode of transport.\n• Available for immediate deployment.\n\nPREFERRED QUALIFICATIONS\n• Experience with rapid hostility de-escalation techniques.\n\n\n== Stats ==\naUEC Reward: 15,000\nReputation XP: +500
