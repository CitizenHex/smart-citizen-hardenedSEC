covalex_UGF_collect_desc_001=Hello there,\n\nI have a delivery I need taken care of. The order is waiting at <EM4>~mission(Location|Address)</EM4> to be taken to <EM4>~mission(Destination|Address)</EM4>. \n\nI’m sure you’ll be fine, but for full disclosure, I’m seeing a bunch of security warnings pop up for this area. Seems there have been a handful of attacks in that area in the last few days. Now, I’m not saying you’ll run into anything, but it would probably be best if you brought along a bit of protection.\n\nGood luck,\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n== Stats ==\naUEC Reward: 45,000\nReputation XP: +500
covalex_UGF_collect_title_001=Delivery Pilot for Covalex [500 XP]
covalexrand_desc=~mission(Description)\n\n== Stats ==\naUEC Reward: 5,000
covalexspec_description_0001=Hi,\n\nI'll totally understand if you don't want to help with this, but if you can it would be amazing.\n\nSee, my boyfriend passed away during the Covalex Gundo tragedy. They said I would get all of Scott's stuff back once the investigation was complete, but as far as I know, it's been done for a while now and they still haven't given any indication of when I can get his property. It's been hard enough dealing with all this, and knowing that a package is going to show up in a month or two and rip open all these wounds, it's just too much. I would prefer to deal with it now and get it over with. If you could find a way to get his personal effects (Employee ID# 104) and drop them off at ~mission(Destination), I'd be very grateful.\n\nThanks for your help,\nAnya\n\n== Stats ==\naUEC Reward: 8,000
covalexspec_description_0002=My brother was one of those people who died when that Covalex station near Crusader blew. Even worse, he was borrowing something of mine when it happened. Now some red tape asshole is trying to tell me that I have to wait to get my stuff back. Yeah right. First you kill my brother and now you want me to be patient? The nerve of these corporate jillos. Forget that. Instead, I figured I'd hire someone to go to Gundo to get my stuff and take it to ~mission(Destination) for me. I mean, what the hell are they gonna do about it? Anyway, it's what my brother would have wanted. It's gonna be the box marked 156.\n\n- Ed\n\n== Stats ==\naUEC Reward: 8,000
covalexspec_description_0003=Hey,\n\nSo this is a little awkward for me to talk about, but it turns out that one of the people who passed away on that Covalex station disaster, Kyomi Santos, actually bequeathed me something in her will. I was surprised to hear it, but apparantly I'm now the proud owner of everything stored in box #173. The people at Covalex say I'll be able to get it when the station opens back up but ... this is the awkward part ... I kind of really need it right now. Normally I'd just wait, but I'm trying to start my own business (I make cakes in the shape of people's homeworlds) and the credits I get from selling it will really be a huge help. I've got a little bit stashed away now that I can use to pay for someone to deliver it from Gundo to ~mission(Destination) for me. I know the whole things a little bit irregular, but if there was any other way I wouldn't be asking.\n\nThanks for the help,\nThrace\n\n== Stats ==\naUEC Reward: 8,000
covalexspec_description_0004=My son Nico was sadly among the victims of the tragic accident at Covelex's Gundo station and they still haven't returned all of his personal possessions to me. I understand that they have to do things according to regulations, but it seems unconscionable that they wouldn't make some allowances for the grieving family members. To that end, I'm seeking someone who will be able to go to the station for me. To be clear, Gundo is currently considered off limits, meaning that this would not be above board, but I feel my situation warrants special consideration. My sister says that the rate I am offering is the correct amount for retrieving the crate with Nico's belongings (#964) and bringing them to ~mission(Destination), so hopefully I can find a competent individual to settle this matter quickly.\n\nSincerely,\nGloria Theolone\n\n== Stats ==\naUEC Reward: 8,000
covalexspec_description_0005=They said that I could find someone here to go to Gundo for me and grab a crate that belonged to my wife. If the name didn't ring a bell, that's the station where they had that big accident. My wife worked for Covalex and I know it's not really going to make losing her any easier, but I really just want Claudia's stuff back. I think about her photo collection or the necklace I gave her just sitting there in that cold dead station in some box marked 249 and it's not right. She deserves better. So how about it? You willing to go to Gundo and haul her crate back to ~mission(Destination)?\n\n== Stats ==\naUEC Reward: 8,000
covalexspec_description_0006=Hi,\n\nI'm looking for someone to head to the Covalex Gundo station near Crusader and grab some items. I know this may sound like stealing, but it's my dad's stuff. You see, he was on Gundo station when it had its accident. My mom says that we need to wait until Covalex says so, but I don't think that's fair because I miss him so much. I would like something to remember him by and I don't want to wait any longer because I might start forgetting things. I'll pay you to get box 510 for me and take to ~mission(Destination) so I can have it.\n\nThank you very much,\nBaylor Ward\n\n== Stats ==\naUEC Reward: 8,000
crus_markerhunt_from=Crusader Historical Society\n\n== Stats ==\naUEC Reward: 259
crusader_RetrieveConsignment_desc_001=Reports indicate that our security staff at ~mission(location|address) have been wiped out by a group of Nine Tails, who are attempting to steal confidential materials that were recently delivered to the facility. Crusader Security needs an experienced contractor to expel the hostiles and secure these boxes. \n\nBased on the initial reports, we strongly recommend that you come well-equipped and consider bringing back-up. For security purposes, the confidential materials were transported there as part of a consignment with other boxes and locked in an automated vault. The retrieval codes to access the confidential materials are stored on datapads held by high-ranking security staff, but we don’t know who has them now. Odds are that the Nine Tails will be looking for them too.  \n\nWhen you have all the confidential materials, deliver them to ~mission(dropoff1|address) to receive payment. \n\nCONTRACT AUTHORIZED BY: \nLiaison Officer Bautista \nID# 948J030K\n\n== Stats ==\naUEC Reward: 40,000\nReputation XP: +2,000
crusader_RetrieveConsignment_title_001=Support Security Forces and Secure Confidential Materials [2,000 XP]
crusader_UGF_defend_E_desc_001=Crusader Security has learned that ~mission(Location|Address) is currently being threatened by a local gang and we’re looking to hire a contractor to put together a security team to deal with any attacks. \n\nThis gang has a bit of a record, but they’re still pretty green overall. I expect it will be relatively straightforward for you and your team to handle.\n\nCONTRACT AUTHORIZED BY:\nLiaison Officer Bautista\nID# 948J030K\n\n\n== Stats ==\naUEC Reward: 20,000\nReputation XP: +500
crusader_UGF_defend_E_title_001=Guard Site Against Hostiles [500 XP]
crusader_UGF_defend_VH_desc_001=Crusader Security has learned that ~mission(Location|Address) is currently being threatened by a well-known gang operating in the area and we’re looking to hire an experienced security team to deal with any attacks. \n\nTry to make sure that whoever you bring along is properly qualified. You’re going to need all the help you can get to deal with this group.\n\nCONTRACT AUTHORIZED BY:\nLiaison Officer Bautista\nID# 948J030K\n\n\n== Stats ==\naUEC Reward: 30,000\nReputation XP: +500
crusader_UGF_defend_VH_title_001=Guard Site Against Dangerous Hostiles [500 XP]
crusader_UGF_defend_desc_001=Crusader Security has learned that ~mission(Location|Address) is currently being threatened by a group of criminals and we’re looking to hire a contractor to put together a security team to repel any attacks. \n\nI know you may be tempted to try to handle this on your own, but you need to put a team together for this. Trust me, the credits aren’t worth it to try it solo.\n\nCONTRACT AUTHORIZED BY:\nLiaison Officer Bautista\nID# 948J030K\n\n\n== Stats ==\naUEC Reward: 25,000\nReputation XP: +500
crusader_UGF_defend_title_001=Guard Site Against Serious Hostiles [500 XP]
crusader_UGF_destroy_E_desc_001=We’ve discovered that a group is trying to start up their own drug business over at ~mission(Location|Address). While they seem to be your average low-level thugs, the product they’re producing is toxic and responsible for the deaths of multiple civilians, so we can’t afford to allow any more to be sold.\n\nWe’re are working on a larger operation that will shut them down for good, but in the meanwhile we need to stop the flow of their drugs. That’s why Crusader wants you to go the site and destroy the stash they have there.\n\nThey will undoubtedly have guards protecting the stash, but I don’t expect them to be too much of a threat.\n\nCONTRACT AUTHORIZED BY:\nLiaison Officer Bautista\nID# 948J030K\n\n\n== Stats ==\naUEC Reward: 55,000\nReputation XP: +500
crusader_UGF_destroy_E_title_001=Destroy Illegal Drugs [500 XP]
crusader_UGF_destroy_H_desc_001=A fledgling syndicate have set up shop over at ~mission(Location|Address) and have been trying their hand at cracking into the drug market. Unfortunately, their product has been linked to several deaths in and around Crusader. With how potent this stuff is, it’s posing a serious threat to the public. \n\nCrusader is working to take down the whole operation, but as long as their product is circulating, the bodies are starting to pile up. \n\nWe want you to go the site and destroy the stash they have there before they get a chance to sell it. However, you should expect their stash to be extremely well guarded.\n\nCONTRACT AUTHORIZED BY:\nLiaison Officer Bautista\nID# 948J030K\n\n\n== Stats ==\naUEC Reward: 75,000\nReputation XP: +500
crusader_UGF_destroy_H_title_001=Destroy Deadly Contraband [500 XP]
crusader_UGF_destroy_desc_001=We’ve been investigating a recent bout of OD’s and they all seem to have originated with a bad batch of drugs made over at ~mission(Location|Address). \n\nI’m working with other contractors to ferret out those responsible, but people are dying as long is the product is still out there. \n\nI want you to go the site and destroy the stash they have there. Should buy us some time before we shut them down for good.\n\nThey will have guards protecting their supply, so be prepared to engage with hostiles.\n\nCONTRACT AUTHORIZED BY:\nLiaison Officer Bautista\nID# 948J030K\n\n\n== Stats ==\naUEC Reward: 65,000\nReputation XP: +500
crusader_UGF_destroy_title_001=Destroy Toxic Narcotics [500 XP]
crusader_UGF_eliminateall_allies_desc_001=Crusader Security has learned that ~mission(Location|Address) is currently being threatened by a group of criminals.\n\nWhile we have security personnel on site, we are looking to hire additional contractors to help them repel any attacks. \n\nNow, as a contractor, I’m not sure how used to working with a team you are, but I don’t want to hear anything about "friendly fire" or there’s going to be problems.\n\nCONTRACT AUTHORIZED BY:\nLiaison Officer Bautista\nID# 948J030K\n\n\n== Stats ==\naUEC Reward: 10,000\nReputation XP: +500
crusader_UGF_eliminateall_allies_desc_intro=In an effort to increase the safety of Crusader and its environs, Crusader Security is seeking qualified individuals to assist with security work in the sector. \n\nWe have determined that you possess the skill set needed to offer you an initial trial contract. You will be assisting Crusader Security in dealing with a small hostile group that has been making threats against ~mission(Location|Address). \n\nPlease note that we already have security personnel on site, so you will have to be careful with regards to friendly fire.\n\nUpon the successful completion of this contract, you'll become eligible to apply for any future security work as it becomes available.\n\nCONTRACT AUTHORIZED BY:\nLiaison Officer Bautista\nID# 948J030K\n\n\n== Stats ==\naUEC Reward: 10,000\nReputation XP: +500
crusader_UGF_eliminateall_allies_desc_rehire=Congrats! Crusader Security has decided to offer you another chance at being a security contractor. With a little bit of hard work and effort, the hope is that you can rise above any previous performance issues. \n\nFirst though, to reassess your viability, we would like you to assist Crusader Security in dealing with an outlaw group that have been making threats against ~mission(Location|Address).\n\nNow, since you’ve had performance issues in the past, I’m going to remind you that friendly fire will not be tolerated.\n\nUpon the successful completion of this trial, you're eligibility will be restored and you'll once again be able to apply for security work with Crusader.\n\nCONTRACT AUTHORIZED BY:\nLiaison Officer Bautista\nID# 948J030K\n\n\n== Stats ==\naUEC Reward: 10,000\nReputation XP: +500
crusader_UGF_eliminateall_allies_title_001=Provide Backup [500 XP]
crusader_UGF_eliminateall_allies_title_intro=Security Work Assessment [500 XP]
crusader_UGF_eliminateall_allies_title_rehire=Security Work Reassessment [500 XP]
crusader_UGF_eliminateall_desc_001=Crusader Security has learned that ~mission(Location|Address) is currently being used as a base of operations for numerous illegal activities.\n\nIn order to put a stop to this "nest of criminals," we are seeking a contractor to go to the site and clear all the occupants. By force if necessary.\n\nCONTRACT AUTHORIZED BY:\nLiaison Officer Bautista\nID# 948J030K\n\n== Stats ==\naUEC Reward: 30,000\nReputation XP: +500
crusader_UGF_eliminateall_nocivs_desc_001=Crusader Security has learned that ~mission(Location|Address) is currently being used as a base of operations for numerous illegal activities.\n\nIn order to put a stop to this "nest of criminals," we are seeking a contractor to go to the site and clear all the hostile elements. By force if necessary.\n\nAnd just so you know, sometimes gangs like this will bring in civilians to do work for them, often through coercion. This should go without saying, but if you see any civilians they are to be protected. Crusader Security cannot have one of their contractors going around indiscriminately shooting people.\n\nCONTRACT AUTHORIZED BY:\nLiaison Officer Bautista\nID# 948J030K\n\n\n== Stats ==\naUEC Reward: 15,000\nReputation XP: +500
crusader_UGF_eliminateall_title_001=Clear Criminal Nest [500 XP]
crusader_bounty_desc_first=In an effort to increase the safety of Crusader and its environs, Crusader Security is seeking qualified individuals to assist with the collection of bounties in the area. \n\nWe have evaluated that you possess the skill set needed and as such, we would like to offer you an initial trial bounty contract for ~mission(TargetName) last seen at ~mission(Location|Address). \n\nUpon the successful completion of this contract, you will be placed on Crusader's Verified Freelancer list and be eligible for any future bounty collection work as it becomes available.\n\n\nCONTRACT AUTHORIZED BY:\nLiaison Officer Bautista\nID# 948J030K\n\n== Stats ==\naUEC Reward: 4,000\nReputation XP: +500
crusader_bounty_desc_rehire=Good news! Crusader Security has decided to offer you another chance at being a bounty contractor. We are hoping that during this time you have corrected any past performance issues and can once again be a useful asset.\n\nFirst though, we are required to reevaluate you, and as such, would like you to complete this bounty contract for ~mission(TargetName). \n\nUpon the successful completion of this trial, you'll be restored to Crusader's Verified Freelancer list and be eligible for any future bounty collection work as it becomes available.\n\n\nCONTRACT AUTHORIZED BY:\nLiaison Officer Bautista\nID# 948J030K\n\n== Stats ==\naUEC Reward: 4,000\nReputation XP: +500
crusader_bounty_fps_UGF_desc_001=Thanks to a recent arrest, we have learned the location of an active bounty by the name of ~mission(TargetName). They are currently believed to be holed up at ~mission(Location|Address). You have been authorized to enter the site, find them, and resolve the bounty.\n\nWe have every reason to believe that there will be other criminal elements at the site, but for the moment, only ~mission(TargetName|Last) is your concern. \n\nCONTRACT AUTHORIZED BY:\nLiaison Officer Gibbs\nID# 91G66BW0\n\n\n== Stats ==\naUEC Reward: 9,000\nReputation XP: +500
crusader_bounty_fps_UGF_nocivs_desc_001=We got lucky and some recent scans of ~mission(Location|Address) have shown that an open bounty by the name of ~mission(TargetName) is hiding out there. You have been authorized to enter the site, find them, and resolve the bounty.\n\nHowever, in addition to the bounty and their criminal accomplices, the site is likely to have civilians present as well. While we're eager to see ~mission(TargetName|Last) dealt with, we can't have any civilian casualties. Use care when engaging with the hostiles. \n\nCONTRACT AUTHORIZED BY:\nLiaison Officer Gibbs\nID# 91G66BW0\n\n\n== Stats ==\naUEC Reward: 14,000\nReputation XP: +1,000
