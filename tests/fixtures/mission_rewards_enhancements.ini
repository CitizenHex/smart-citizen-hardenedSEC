Intersec_DefendShip_Vanduul_Desc_Super_001=MISSION SPECS\n\nArea of Operation: Nyx System\nHostile Forces: Vanduul\nEquipment Specs: Combat-rated Ship\nBriefing: An operator working with InterSec is currently being attacked by Vanduul ships at <EM4>~mission(Location|Address)</EM4>. The likelihood of them surviving on their own is low, so we’re looking for a contractor willing to provide combat support.  \n\nContractors accepting this mission should be well supplied and ready to face the Vanduul threat head-on. \n\nRespectfully, \n\nDeacon Tobin\nOperations Manager\nInterSec Defense Solutions\n\nThis communication consists of confidential information solely intended for the recipient. Please disregard if received in error and notify the sender. All operations are conducted at the contractor’s own personal risk and must adhere to UEE and system law where applicable.\n\n<EM4>Potential Blueprints</EM4>\n- Pulse "Rouge" Pistol\n- Pulse Laser Pistol Battery (60 Cap)\n- Testudo Arms Combustion\n- Testudo Core Combustion\n- Testudo Helmet Combustion\n- Testudo Legs Combustion\n\n== Stats ==\nReputation XP: +300
Intersec_DefendShip_Vanduul_Desc_VeryHard_001=MISSION SPECS\n\nArea of Operation: Nyx System \nHostile Forces: Vanduul \nEquipment Specs: Combat-rated Ships \nBriefing: We've just lost contact with a pilot who engaged with Vanduul forces at <EM4>~mission(Location|Address)</EM4>.\n\nTravel to their last known location and if they're still alive, defend them long enough to ensure they can escape. Ensuring the safety of the operative is crucial, as is eliminating any Vanduul threats to the UEE.\n\nYou'll most likely need a <EM4>strong group of ships</EM4> to successfully neutralize these Vanduul.\n\nRespectfully,   \n\nDeacon Tobin \nOperations Manager \nInterSec Defense Solutions  \n\nThis communication consists of confidential information solely intended for the recipient. Please disregard if received in error and notify the sender. All operations are conducted at the contractor’s own personal risk and must adhere to UEE and system law where applicable.\n\n<EM4>Potential Blueprints</EM4>\n- Pulse "Rouge" Pistol\n- Pulse Laser Pistol Battery (60 Cap)\n- Testudo Arms Combustion\n- Testudo Core Combustion\n- Testudo Helmet Combustion\n- Testudo Legs Combustion\n\n== Stats ==\nReputation XP: +250
