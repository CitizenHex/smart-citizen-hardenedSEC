LocationRush_CFP_Salvage_Description_01=Following the brutal attack on Pyro and our efforts to combat the vigilante group the Frontier Fighters, our strategic reserves across the system are at an all-time low. Citizens for Prosperity are eager to replenish our stocks before we reach a point of desperation. \n\nTo that end, we were hoping that you could resupply<EM4> ~mission(Destination|Address) with salvaged materials.</EM4> It would go a long way in helping us rebuild what was lost in the attacks.\n\nI leave it up to you to decide how best to acquire what we need, but should be able to find some wrecks to scavenge orbiting around most planets. \n\nYour support of our efforts is much appreciated,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n\n== Stats ==\nTier 1: +400 XP (Failure: -190,500)\nTier 2: +2,400 XP (Failure: -190,500)
