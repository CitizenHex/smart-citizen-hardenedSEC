TarPits_ShipStrip_desc_001=Got a particular salvage job that we could use some extra hands on. \n\nWe need you to find a ~mission(ship) that got punched out around ~mission(location). Security’s already searching for it and if they find it, they’ll ID it for sure and we’ll be in loads of trouble.\n\nSo, we want you to make sure that can’t happen. Either tow the ship out of the search area or rip the entire hull off so nobody can tell who it belonged to. Whatever you decide, keep your mouth shut about this. \n\nWe’ll cred you up and anything you scrap is yours to keep. But if security finds the ship before you’re done, we’ll all be screwed and you won’t get paid so don’t disappoint.\n\n== Stats ==\naUEC Reward: 15,000
Tarpits_assassinate_dc_desc_001=I ain’t got time to waste so I’ll get straight to the point - ~mission(TargetName) needs to be dead and I want you to do it. You can find them over near the ~mission(Location) at ~mission(Location|address). They won’t be alone, but don’t get distracted by those other useless piles. You only get paid for taking out ~mission(TargetName|Last).\n\n== Stats ==\nReputation XP: +1,000
Tarpits_assassinate_dc_title_001=Scrap ~mission(TargetName) [1,000 XP]
Tarpits_destroyitem_dc_desc_001=I’m looking to send a strong message to the crew over at ~mission(Location|Address) and know the perfect way to do it - property damage.\n\nAll you need to do is head on over, destroy a few things here and there, and really drive home an important lesson about respecting your betters. \n\nDo that for me and I’ll be feeling very happy. And generous.\n\nInterested?\n\n\n== Stats ==\nReputation XP: +500
Tarpits_destroyitem_dc_title_001=Demolition Mission [500 XP]
Tarpits_eliminateboss_dc_desc_001=We’ve had our sights set on taking out ~mission(TargetName) for a while now, but we’ve never been able to find the right moment. Enough waiting. You’re going to create the right moment for us.\n\nHead to ~mission(Location|Address) and take out a bunch of lowlifes running around the ~mission(Location). Kill enough of those losers, and ~mission(TargetName|Last) will have no choice but to come face you themselves. That’s when you take ‘em out and earn yourself a nice fat payday. \n\n\n== Stats ==\nReputation XP: +500
Tarpits_eliminateboss_dc_title_001=~mission(TargetName)’s Time Has Come [500 XP]
Tarpits_theft_mines_dc_desc_001=I was hopin’ you’d be interested in pulling a little job for us. Got some goods over at ~mission(Location|Address) that are just right for the taking. Only problem is – and it’s a big one – the bastards running the place have the whole area rigged with proximity mines. \n\nYou’ll need to find someway through, or if you can’t be bothered, someway to trigger the lot. Either way, just try not to blow yourself up. Then you just need to grab the stuff and take it over to ~mission(Destination|Address).\n\nIt won’t be easy to pull off, but if you do, I promise I’ll make it worth your while.\n\n\n== Stats ==\naUEC Reward: 34,000
Test_Description=Mission description (WIP)\n\n== Stats ==\naUEC Reward: 7,500\nReputation XP: +500
Test_Title_Revenge_01=Revenge 01 (WIP) [500 XP]
TheCollector_Intro_Desc=Hello, I am Wikelo. Recent addition to your system and very excited to be here. Spent many time here in UEE and happy to spent more.\n\nHave place where I make things from other things.\n\nNeed person to bring me useful things to finish project I work on. You have list. Get, please. I am at <EM4>~mission(destination|ListAll)</EM4>.\n\nWill give you item for your help.\n\nAlso, when done, if you want to do more. Have many things can make in my humble shop. Come, look at pretty poster and then decide what you want me to make.\n\nBye.\n\n== Stats ==\nReputation XP: +10
TheCollector_Intro_Title=Wikelo Arrive to System [10 XP]
TheCollector_Menu_Desc_PolarisShip=Wikelo recently get many blueprints in trade with human who not very smart. Now can make very big ship. \n\nNot cheap and need many pieces but will make. If you want, go quick, this cost much to Wikelo so won't be able to do for long but I like new Human system so I want to thank you all for welcome.\n\nBring to <EM4>~mission(destination|ListAll)</EM4> if want.\n\nBye.\n\n== Stats ==\nReputation XP: +1,000
TheCollector_Menu_Title_PolarisShip=Now make Polaris. Short Time Deal. [1,000 XP]
TheCollector_Mod_ATLS_Geo_Grad1_Desc=Wikelo travel to one Human planet and find very cold, but very pretty. This remind of that.\n\n== Stats ==\nReputation XP: +20
TheCollector_Mod_ATLS_Geo_Grad1_Name=ATLS Snowland Color [20 XP]
TheCollector_Mod_ATLS_Geo_Grad2_Desc=Many Human work place have orange color there. Must mean work to you. This suit does work. Make sense.\n\n== Stats ==\nReputation XP: +20
TheCollector_Mod_ATLS_Geo_Grad2_Name=ATLS Orange Line [20 XP]
TheCollector_Mod_ATLS_Geo_Grad3_Desc=Wikelo give deep red and green colors to make ATLS legs look like they cooling from heat. Very pretty.\n\n== Stats ==\nReputation XP: +20
TheCollector_Mod_ATLS_Geo_Grad3_Name=ATLS Cool Metal Color [20 XP]
TheCollector_Recipes_Desc_AtlsJump=Find very fun piece to add to big human suit that let you jump very high. Now you shoot and jump. Exciting.\n\nIf you want, bring me these to <EM4>~mission(destination|ListAll)</EM4>. Will make.\n\nWikelo\n\n== Stats ==\nReputation XP: +20
TheCollector_Recipes_Desc_AtlsPew=Hello. Know you human like strange metal suit. How about metal suit with ikti? Sorry, ikti is Banu word, you call it 'gun.' \n\nIf want, bring things I say and I will make for you. Gun will shoot. Cause many damage.\n\nBye.\n\n== Stats ==\nReputation XP: +20
TheCollector_Recipes_Desc_Battle=Bring me armor and other things and I give you special test armor. First version. Very special. Bring and I give. Bye.\n\n== Stats ==\nReputation XP: +25
TheCollector_Recipes_Desc_BigBooma=Wikelo find very strange but functional weapon while wandering through your systems. It very simple but very effective. If you bring me things, I show you what I do to it.\n\nVery fun.\n\n== Stats ==\nReputation XP: +10
TheCollector_Recipes_Desc_GMNI_Shotgun=Shooting can be messy. Red Human Blood everywhere. Not a problem with this shotgun. Splashes blends right in! I give it to you if you give me everything I want on list. Good trade.\n\n== Stats ==\nReputation XP: +10
TheCollector_Recipes_Desc_Hush=You want be hidden. Wikelo understand. Not ask questions why. But what do when you in snow? Wikelo have suit for that.\n\nWelcome.\n\n== Stats ==\nReputation XP: +25
TheCollector_Recipes_Desc_IrrArm=Wikelo had exciting idea during brief work rest. Was thinking about the little glow worms in Pyro and saw armor get changed to look like.\n\nIf you get me parts, bring to <EM4>~mission(destination|ListAll)</EM4> and will make for you then you can glow too.\n\nBye.\n\n== Stats ==\nReputation XP: +25
TheCollector_Recipes_Desc_KopSkull=Hello. Can make fun change to gun if you want. Use kopion skin for pattern and little skull dangle. Very effective. Shoot much better.\n\nAll you need is bring me parts to <EM4>~mission(destination|ListAll)</EM4> and will make. \n\nBye.\n\n== Stats ==\nReputation XP: +10
TheCollector_Recipes_Desc_MiltSkull=Hello. Can do version of gun if you kopion soldier. Make material like soldier camouflage but with dead skull on front. Gun shoot better too.\n\nIf want, bring part to <EM4>~mission(destination|ListAll)</EM4> and will make.\n\n== Stats ==\nReputation XP: +10
TheCollector_Recipes_Desc_Molten=If you have armor, Wikelo can make it look warm. Good look for useful armor. Bring me things and will do.\n\n== Stats ==\nReputation XP: +25
TheCollector_Recipes_Desc_NonePistol=You need a good weapon, yes? Have one for you. Small but powerful. Like an extra spicy balalu pepper. Wikelo make this pistol look extra spicy too. You bring things I need and I do a trade.\n\nBye.\n\n== Stats ==\nReputation XP: +10
TheCollector_Recipes_Desc_RedHunterArmor=Wikelo hear that Humans think red is the color of passion and anger. This armor good for both. You give me items on list and this red armor is yours.\n\n== Stats ==\nReputation XP: +10
TheCollector_Recipes_Desc_SandArmour=Hello, know many humans want saldynium for regen problem. Credits good, yes, but Wikelo can use that, kopion horn, and other things to make special armor. \n\nOnce done, you be very tough. Very scary.\n\nYou see items needed. Bring to <EM4>~mission(destination|ListAll)</EM4> and I make for you.\n\nBye.\n\n== Stats ==\nReputation XP: +25
TheCollector_Recipes_Desc_SlimyLMG=This gun has picture of amazing creature on side. Use it and it make you big and strong like Yormandi. Spit lightning. Bring my items and then you get it. Bye.\n\n== Stats ==\nReputation XP: +10
TheCollector_Recipes_Desc_SpikeyArmor=Vanduul have strange ways. I never talk to them, old souli used to, but not Wikelo. Anyway, though not friendly, they make interesting thing. If you like, Wikelo can make you look more like.\n\nBring things. Will do.\n\nBye.\n\n== Stats ==\nReputation XP: +25
TheCollector_Recipes_Desc_VoltThwack=You feel like gun not angry enough? VOLT shotgun very powerful, very dangerous, but not scary? Bring to me. Can make very scary and angry.\n\nThey respect you then. Bring to <EM4>~mission(destination|ListAll)</EM4> and we make.\n\nBye.\n\n== Stats ==\nReputation XP: +10
TheCollector_Recipes_Desc_ZipZap=Want to shoot long away and stay hiding. But it snowing? Wikelo have gun for you.\n\nBring things. I give.\n\nBye.\n\n== Stats ==\nReputation XP: +10
