foxwell_DefendShip_E_desc_001=Foxwell is looking for an available combat pilot to provide immediate assistance to a ~mission(Ship) under attack over by ~mission(Location|Address). We have not identified the perpetrators in the attack, but have been assured it is a small force.\n\nPlease dispatch quickly and clear out all hostiles. We need the client to make it through this as they haven't paid us yet.\n\nGood luck,\n\nMarcus Clenn\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo
foxwell_DefendShip_E_title_001=Yellow Level Contract: Ship Under Attack <EM4>[BP]</EM4>
foxwell_DefendShip_H_desc_001=An emergency contract just came in about a fight near ~mission(Location|Address). Apparently a group of ships were ambushed by outlaws led by ~mission(TargetName), who's been wanted on multiple planets for murder and ship theft. Foxwell's looking for top tier combat pilots to go and protect the clients against them.\n\nThis one's been flagged as a red level contract so it's really dangerous. If you have people you could bring, you probably should. If you do, you should also let them know about Foxwell's hiring policies. \n\nMarcus Clenn\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo
foxwell_DefendShip_H_title_001=Red Level Contract: Ship Under Attack <EM4>[BP]</EM4>
foxwell_DefendShip_M_desc_001=Got an orange level contract for any available combat pilots. A ~mission(Ship) is under attack around ~mission(Location|Address) and is in desperate need for assistance. We're not sure how many perpetrators there are, but they seem motivated and dangerous so exercise caution.\n\nOnce on site, engage and destroy any hostiles you encounter and protect the client. Once they've transferred the credits, we'll route you your payment.\n\nMarcus Clenn\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo
