cfp_ChainElimAll_1C_ElimSpec_GenAttack_E_desc_001=We need any available security personnel to report to ~mission(Location|Address). A group of armed individuals have attacked one of our outpost clusters and we're in desperate need of help. Although the group seems to be unaffiliated with any of the known gangs, we've received word that their leader is ~mission(TargetName), a local outlaw with a vicious reputation.\n\nPlease head out as soon as you can and secure the area by taking out the outlaws and ~mission(TargetName|Last).\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- Artimex Arms Lodestone\n- Artimex Core Lodestone\n- Artimex Helmet Lodestone\n- Artimex Legs Lodestone\n- Karna "Brimstone" Rifle\n- Karna Rifle Battery (35 cap)\n\n== Stats ==\nReputation XP: +300
cfp_ChainElimAll_1C_ElimSpec_GenAttack_E_title_001=Alert: ~mission(Location) under attack <EM4>[BP]</EM4> [300 XP]
cfp_ChainElimAll_1C_ElimSpec_HHAttack_M_desc_001=We are currently looking for any qualified and available security operatives to head out to ~mission(Location|Address) and reclaim a CFP installation that had been taken by Headhunters. \n\nThe group that's currently occupying the outpost is being led by ~mission(TargetName), a Headhunter of some note who's had a history of aggression against locals and CFP volunteers.\n\nWe need all Headhunters secured and ~mission(TargetName|Last) taken out.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- Artimex Arms Lodestone\n- Artimex Core Lodestone\n- Artimex Helmet Lodestone\n- Artimex Legs Lodestone\n- Karna "Brimstone" Rifle\n- Karna Rifle Battery (35 cap)\n\n== Stats ==\nReputation XP: +300
cfp_ChainElimAll_1C_ElimSpec_HHAttack_M_title_001=Taking back from the Headhunters <EM4>[BP]</EM4> [300 XP]
cfp_ChainElimAll_1C_HHAttack_M_desc_001=We just received a frantic comm from ~mission(Location|Address) and are looking for any available combat specialists to help repel a Headhunter attack. There are still hostiles on site and there are reports of several casualties so we need this handled quickly.\n\nI will provide all relevant data upon acceptance. Thank you for your assistance.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- Artimex Arms (Modified)\n- Artimex Core (Modified)\n- Karna "Fate" Rifle\n- Karna Rifle Battery (35 cap)\n\n== Stats ==\nReputation XP: +300
cfp_ChainElimAll_1C_HHAttack_M_title_001=Help defend ~mission(Location) from Headhunters <EM4>[BP]</EM4> [300 XP]
cfp_ChainElimAll_2C_ElimSpec_GenAttack_M_desc_001=Several CFP clusters near ~mission(Location|Address) just got hit by a group of outlaws led by ~mission(TargetName). We're looking for any available combat specialists to help retake the outposts.\n\nI can provide the locations upon acceptance but we need to clear out the main outpost and satellite installations from all hostile forces and take out ~mission(TargetName|Last) as it's unlikely that they will not cease their hostilities if they escape.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- Artimex Arms Lodestone\n- Artimex Core Lodestone\n- Artimex Helmet Lodestone\n- Artimex Legs Lodestone\n- Karna "Brimstone" Rifle\n- Karna Rifle Battery (35 cap)\n\n== Stats ==\nReputation XP: +300
cfp_ChainElimAll_2C_ElimSpec_GenAttack_M_title_001=Outlaw attack at ~mission(Location) <EM4>[BP]</EM4> [300 XP]
cfp_ChainElimAll_2C_ElimSpec_HHAttack_H_desc_001=Citizens for Prosperity is looking for any available security operatives to retake several former CFP installations near ~mission(Location|Address) from Headhunter control. These clusters were violently taken from us by ~mission(TargetName) and resulted in the deaths of many volunteers.\n\nBringing these outposts back under our control will help provide more stability to the system. Reports indicate that ~mission(TargetName|Last) tends to hide behind their rank and file, so they will likely appear once you've cleared out most of the hostiles.\n\nXenoThreat are trained and motivated so they will not give up easily.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- Artimex Arms Lodestone\n- Artimex Core Lodestone\n- Artimex Helmet Lodestone\n- Artimex Legs Lodestone\n- Karna "Brimstone" Rifle\n- Karna Rifle Battery (35 cap)\n\n== Stats ==\nReputation XP: +300
cfp_ChainElimAll_2C_ElimSpec_HHAttack_H_title_001=Retaking Outposts from Headhunters <EM4>[BP]</EM4> [300 XP]
cfp_ChainElimAll_2C_ElimSpec_XTAttack_H_desc_001=Looking for any available security personnel to reclaim several clusters previously lost to XenoThreat aggressors. Located near ~mission(Location|Address), they had been seized in brutal attacks led by ~mission(TargetName), a notorious XenoThreat lieutenant.\n\nWe're looking to take these clusters back so we can reestablish operations and continue our good work. You'll need to clear all the hostiles still on-site as well as ~mission(TargetName|Last).\n\nJust a reminder, that XenoThreat are highly trained and quick to fight, so prepare accordingly.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- Artimex Arms Lodestone\n- Artimex Core Lodestone\n- Artimex Helmet Lodestone\n- Artimex Legs Lodestone\n- Karna "Brimstone" Rifle\n- Karna Rifle Battery (35 cap)\n\n== Stats ==\nReputation XP: +400
cfp_ChainElimAll_2C_ElimSpec_XTAttack_H_title_001=Reclaiming Outposts from XenoThreat <EM4>[BP]</EM4> [400 XP]
cfp_ChainElimAll_3C_ElimSpec_GenAttack_M_desc_001=The outlaw presence here has become much bolder of late and a lot of people are getting hurt. We've recently lost several clusters around ~mission(Location|Address). While we don't like to have to resort to violence, the board has acknowledged that these locations are crucial to establishing stability in the system and authorized the use of a security detail to retake them.\n\nWe're also aware that the embedded hostiles are being led by ~mission(TargetName) who's had a history of attacking CFP interests. The board would like ~mission(TargetName|Last) dealt with to prevent future attacks.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- Artimex Arms (Modified)\n- Artimex Core (Modified)\n- Karna "Fate" Rifle\n- Karna Rifle Battery (35 cap)\n\n== Stats ==\nReputation XP: +300
cfp_ChainElimAll_3C_ElimSpec_GenAttack_M_title_001=Need multiple CFP outposts retaken <EM4>[BP]</EM4> [300 XP]
cfp_ChainElimAll_3C_ElimSpec_HHAttack_VH_desc_001=Citizens for Prosperity's board just authorized funds to hire security personnel to retake several clusters near ~mission(Location|Address) that have since fallen into the hands of the Headhunters. While we tried to just accept the loss, it's become apparent that they are crucial to our ongoing operations in the system.\n\nYou'll need to clear out each of the locations that will be provided but more importantly, you'll also need to take out ~mission(TargetName), who's in charge of the hostiles on site.\n\nThese Headhunters are heavily embedded and have a history of violence, so you should prepare accordingly. \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- Artimex Arms (Modified)\n- Artimex Core (Modified)\n- Karna "Fate" Rifle\n- Karna Rifle Battery (35 cap)\n\n== Stats ==\nReputation XP: +300
cfp_ChainElimAll_3C_ElimSpec_HHAttack_VH_title_001=Reclaiming Clusters from Headhunters <EM4>[BP]</EM4> [300 XP]
cfp_ChainElimAll_3C_ElimSpec_XTAttack_VH_desc_001=Although Citizens for Prosperity is committed to change through non-violent means, it's become apparent that exceptions might have to be made. CFP safe zones near ~mission(Location|Address) were recently and violently taken by XenoThreat forces under the command of ~mission(TargetName).\n\nWe're looking for any available combat operatives to help take these outposts back. This will undoubtedly be a difficult endeavor as XenoThreat are highly trained and eager to fight, so you should prepare accordingly.\n\nAside from clearing each cluster of XenoThreat forces, you will need to take out ~mission(TargetName|Last), who's loss will certainly make the system safer.\n\nGood luck,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- Artimex Arms (Modified)\n- Artimex Core (Modified)\n- Karna "Fate" Rifle\n- Karna Rifle Battery (35 cap)\n\n== Stats ==\nReputation XP: +400
cfp_ChainElimAll_3C_ElimSpec_XTAttack_VH_title_001=Campaign to reclaim XenoThreat outposts <EM4>[BP]</EM4> [400 XP]
cfp_EliminateSpecific_Generic_E_desc_001=Reports indicate that ~mission(Location|Address) has come under attack from a group of armed individuals led by a notorious outlaw named ~mission(TargetName). There have been multiple reported deaths and injuries, so Citizens for Prosperity has been looking for qualified combat operatives to provide some support. \n\nThough we don't advocate conflict resolution through violence, we believe that the group will disperse if ~mission(TargetName|Last) is not there to lead them.\n\nHead over as soon as you can. Lives are on the line.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +75
cfp_EliminateSpecific_Generic_E_title_001=Protection against ~mission(TargetName|Last) [75 XP]
cfp_HaulCargo_RegionLink_desc_001=Hi, we need to move some cargo across the system and were wondering if you could help. I know this is outside your usual purview, but I'm low on options. This would also be a great way to show your committed to Citizens for Prosperity's greater mission here.\n\nIf you head to <EM4>~mission(Location|Address)</EM4>, there should be some cargo accessible via a freight elevator that we'll need you to take to another freight elevator at <EM4>~mission(Destination|Address)</EM4>.\n\nOnly thing to call out is that your ship must be able to handle <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>. To make your life easier, be sure you have a <EM4>handheld tractor beam</EM4> with you. Otherwise, it should be a simple run. \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +200
cfp_HaulCargo_RegionLink_title_001=Need a Hauler [200 XP]
cfp_RetrieveConsignment_desc_001=You available for a job? One of our secure locations got hit by outlaws and some highly confidential material was stolen. As you can imagine, Citizens for Prosperity is eager to recover them as soon as possible.\n\nThanks to a local contact, we were able to trace the outlaws back to ~mission(Location|Address) where they're storing the confidential materials inside a secure automated vault. To access it, you’ll need to first find the relevant retrieval code and enter it at the vault’s package conveyor. Our best guess is that one of outlaw leaders will be carrying the code on their person so there is a very strong chance you’ll have to engage with them directly to get it.\n  \nOnce you’ve gotten possession of the confidential material, we want you to deliver it to ~mission(Dropoff1|Address).\n\nYou’ll be making a big difference to a lot of people if you manage to pull this off.\n\nThanks in advance,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n\n== Stats ==\naUEC Reward: 40,000
cfp_RetrieveConsignment_title_001=Confidential Material Stolen [2,000 XP]
cfp_bombingrun_E_desc_001=We've been having escalating issues with the outlaws at ~mission(Location|Address) and can no longer stand by and watch as their aggressive actions hurt our community. \n\nWe are wary of launching a full scale assault, but believe that if their fuel stores are wiped out, it would deter them from further hostile actions. \n\nIf you're able, I'd appreciate you handling the destruction of the fuel personally. A ship capable of launching missiles would probably make the most sense, but I leave that up to you.\n\nThanks,\n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- ADP Arms Woodland\n- ADP Core\n- ADP Legs Woodland\n- ADP-mk4 Arms Woodland\n- ADP-mk4 Core Woodland\n- ADP-mk4 Helmet Woodland\n- ADP-mk4 Legs Woodland\n- BR-2 Shotgun\n- BR-2 Shotgun Magazine (12 cap)\n- Balor HCH Helmet\n- FS-9 LMG\n- FS-9 Magazine (75 cap)\n- Gallant Rifle\n- Gallant Rifle Battery (45 cap)\n\n== Stats ==\nReputation XP: +200
cfp_bombingrun_E_title_001=Eliminate Fuel Stores <EM4>[BP]</EM4> [200 XP]
cfp_bombingrun_sabotage_generators_desc_001=There is a group of outlaws at ~mission(Location|Address) that have become increasingly brazen in their attacks on Citizens for Prosperity assets in the system. \n\nTo minimize loss of life, we want to first try convincing them to move on to somewhere else by disabling their generators and destroying their fuel reserves. \n\nHopefully, that should be enough to convince them to move on to greener pastures.\n\nThanks,\n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- ADP Arms Woodland\n- ADP Core\n- ADP Legs Woodland\n- ADP-mk4 Arms Woodland\n- ADP-mk4 Core Woodland\n- ADP-mk4 Helmet Woodland\n- ADP-mk4 Legs Woodland\n- BR-2 Shotgun\n- BR-2 Shotgun Magazine (12 cap)\n- Balor HCH Helmet\n- FS-9 LMG\n- FS-9 Magazine (75 cap)\n- Gallant Rifle\n- Gallant Rifle Battery (45 cap)\n\n== Stats ==\nReputation XP: +300
cfp_bombingrun_sabotage_generators_title_001=Reduce Outlaw's Operational Readiness <EM4>[BP]</EM4> [300 XP]
cfp_bounty_desc_HeadHunters_001=This is a general warning. We have learned that the Headhunters are transporting a large amount of weapons into the system with the intent of launching attacks against CFP-owned settlements.\n\nWhile we believe that change can only come to this system through nonviolence. The presence of these weapons will undoubtedly cause considerably more bloodshed and devastation so we want to remove them from the equation.\n\nAny of our supporters with appropriate combat training are asked to undertake this dangerous assignment out near ~mission(Location|Address). We will compensate you for the tremendous risk you are taking.\n\nThank you and be safe out there,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +200
cfp_bounty_title_HeadHunters_001=Danger: Contraband Weapons Inbound [200 XP]
cfp_defend-criminals_desc_001=We learned that ~mission(Location|Address) is under threat of attack by outlaws and has asked for assistance. We need someone to protect them and drive away the outlaws. \n\nMake sure you stay close after their initial attack. Too often, outlaws win fights just by sending more bodies than anyone can reasonably defend against, so make sure you fight off any reinforcements before leaving the area. \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- Artimex Arms\n- Artimex Core\n- Artimex Helmet\n- Artimex Legs\n- Karna Rifle\n- Karna Rifle Battery (35 cap)\n\n== Stats ==\nTier 1: +75 XP\nTier 2: +200 XP
cfp_defend-criminals_title_001=Defend ~mission(Location) from Outlaws <EM4>[BP]</EM4> [75–200 XP]
cfp_defend-xenothreat_desc_001=We’ve learned that XenoThreat is about to launch an attack on ~mission(Location|Address). If they are successful, the number of casualties is expected to be high. I’m hoping that with your aid in defending them, we can make sure that doesn’t happen.\n \nWe know from past encounters that XenoThreat sends several raiding parties to carry out their attacks, so make sure you don’t leave the outpost until you’ve fought off all the reinforcements. \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- Artimex Arms (Modified)\n- Artimex Core (Modified)\n- Karna "Fate" Rifle\n- Karna Rifle Battery (35 cap)\n\n== Stats ==\nReputation XP: +300
cfp_defend-xenothreat_desc_002=Urgent!\n\nXenoThreat is targeting ~mission(Location|Address) to send a message to other settlers about what happens if they accept our support. \n\nIf you’re able to fend off the attackers, I’m sure they’ll send additional forces, so you’ll need to dig in for multiple assaults. Since XenoThreat has a lot of resources at their disposal, you should think about recruiting others to help you keep everyone safe.\n\nWe’re all counting on you.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- Artimex Arms\n- Artimex Core\n- Artimex Helmet\n- Artimex Legs\n- Karna Rifle\n- Karna Rifle Battery (35 cap)\n\n== Stats ==\nReputation XP: +200
cfp_defend-xenothreat_desc_003=Urgent!\n\nXenoThreat is mobilizing for a massive incursion to wipe ~mission(Location|Address) off the map. You’re their only hope of enduring this assault and protecting them from XenoThreat’s cruelty.\n\nI know I’m asking you to put yourself in the line of fire, but this system won’t change unless people like you are brave enough to take on these dangers. No amount of credits could measure up to how much good you’d be doing by stepping in.\n\nIf you’re willing and able to take on this mission, make sure to take some allies with you. XenoThreat will certainly send in stronger reinforcements once they realize they’re taking losses.\n\nWe believe in you.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- Artimex Arms\n- Artimex Core\n- Artimex Helmet\n- Artimex Legs\n- Karna Rifle\n- Karna Rifle Battery (35 cap)\n\n== Stats ==\nReputation XP: +300
cfp_defend-xenothreat_title_001=Protect ~mission(Location) from XenoThreat Attack <EM4>[BP]</EM4> [300 XP]
cfp_defend-xenothreat_title_002=Protect ~mission(Location) from XenoThreat Raid <EM4>[BP]</EM4> [200 XP]
cfp_defend-xenothreat_title_003=Protect ~mission(Location) from XenoThreat Incursion <EM4>[BP]</EM4> [300 XP]
cfp_defend_boss_Generic_desc_001=We just received reports of a massive attack against ~mission(Location) by a large group of armed individuals led by ~mission(TargetName), a notorious outlaw who has been threatening Citizens for Prosperity personnel for months. Details are still yet to be confirmed but we know there have been multiple casualties.\n\nCitizens for Prosperity is looking for any qualified security personnel to go and retake the outposts from these hostile elements. Our understanding is that ~mission(TargetName|Last) tends to hide behind their soldiers, but will emerge if you take enough of the rank-and-file out.\n\nWhile we don't like to resort to violence, management can see no other way of resolving this situation and continuing our good work in the system.\n\nGood luck,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- Artimex Arms Canuto\n- Artimex Core Canuto\n- Artimex Helmet Canuto\n- Artimex Legs Canuto\n- Karna Rifle\n- Karna Rifle Battery (35 cap)\n\n== Stats ==\nReputation XP: +800
cfp_defend_boss_Generic_title_001=~mission(Location|Address) needs help <EM4>[BP]</EM4> [800 XP]
cfp_defend_cave_Generic_desc_001=We received a distress call from ~mission(Location|Address) saying that they're being robbed by a small group of outlaws. ~mission(Location|CaveSize) Though remote, this outpost is a crucial piece of CFP's infrastructure in the area so we need to take it back.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- Artimex Arms\n- Artimex Core\n- Artimex Helmet\n- Artimex Legs\n- Karna Rifle\n- Karna Rifle Battery (35 cap)\n\n== Stats ==\nReputation XP: +25
cfp_defend_cave_Generic_title_001=Assistance needed at ~mission(Location) <EM4>[BP]</EM4> [25 XP]
cfp_defend_headhunters_H_desc_001=A distress call just came in from ~mission(Location|Address) claiming that a large Headhunter force has just attacked our outpost there. There have been multiple deaths and injuries from those who managed to flee the scene. We're looking for any available security personnel to head there and retake the outpost.\n\nWitness accounts identified the attackers as elite Headhunter enforcers, so watch yourself out there and bring help if you can. \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- Artimex Arms\n- Artimex Core\n- Artimex Helmet\n- Artimex Legs\n- Karna Rifle\n- Karna Rifle Battery (35 cap)\n\n== Stats ==\nReputation XP: +200
cfp_defend_headhunters_H_title_001=Headhunter attack on ~mission(Location) <EM4>[BP]</EM4> [200 XP]
cfp_defend_headhunters_M_desc_001=Headhunters have launched an unprovoked attack against ~mission(Location|Address). Although we don't support the use of violence, Citizens for Prosperity won't let innocent people die. We need qualified security personnel to retake the outpost.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- Artimex Arms\n- Artimex Core\n- Artimex Helmet\n- Artimex Legs\n- Karna Rifle\n- Karna Rifle Battery (35 cap)\n\n== Stats ==\nReputation XP: +100
cfp_defend_headhunters_M_title_001=~mission(Location) needs assistance <EM4>[BP]</EM4> [100 XP]
cfp_defend_regionshift_desc_001=We've received a distress call from ~mission(Location|Address). A group of unknown assailants have launched an attack. There have been multiple deaths reported and we need to reclaim the outpost.\n\nI know this is far from your current position, but we're desperate to secure the area and get the outpost back and running again.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- Artimex Arms\n- Artimex Core\n- Artimex Helmet\n- Artimex Legs\n- Karna Rifle\n- Karna Rifle Battery (35 cap)\n\n== Stats ==\nReputation XP: +100
cfp_defend_regionshift_title_001=Call for Help: ~mission(Location) <EM4>[BP]</EM4> [100 XP]
cfp_defendship_Intro_Desc_001=Citizens for Prosperity is in need of pilots with dogfighting experience. If you’re looking to put your skills to the test, I have a mission here for you to try. \n\nA civilian ship has requested combat support near <EM4>~mission(Location|Address)</EM4>. Head there and show us that you have the skills to excel in these types of missions and we’ll put you to good use.  \n\nPlease be aware. This mission is not a training exercise. This is a real encounter, so please do your best to save the ship in distress. \n\nGood Luck,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity \n\n\n== Stats ==\nReputation XP: +50
cfp_defendship_Intro_title_001=Seeking Experienced Combat Pilots [50 XP]
cfp_defendship_LRT_desc_001=One of our pilots had just picked up a shipment of supplies near ~mission(Location|Address) when they were attacked by some vicious shipjackers. \n\nWe just received their distress beacon and I'm hoping you can go provide them combat support.\n\nAny assistance you could give would make all the difference.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)\n\n== Stats ==\nTier 1: +100 XP\nTier 2: +150 XP
cfp_defendship_LRT_title_001=Pilot Seeking Combat Support <EM4>[BP]</EM4> [100–150 XP]
cfp_defendship_MRT_bombingrun_desc_001=One of our people is currently under attack at ~mission(Location|Address). They have attempted to elude their attackers to get to safely, but the outlaws have proven too skilled for them to break away. \n\nWe need you to fly there, engage with the attackers, and then destroy the nearby fuel reserves. The hope is that this display of destruction will dissuade them from continuing pursuit.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +200
cfp_defendship_MRT_bombingrun_title_001=Assist Retreating Ship [200 XP]
cfp_defendship_MRT_desc_001=A Citizens for Prosperity affiliated ship was attempting to deliver some supplies to ~mission(Location|Address) when they were attacked by the recipients who didn't want to pay for their purchase and chose violence instead.\n\nI'll instruct our traders to be more careful about who they deal with in the future, but for now, I would really appreciate you lending them a hand in fighting off these attackers. \n\nAppreciated,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)\n\n== Stats ==\nTier 1: +150 XP\nTier 2: +200 XP
cfp_defendship_MRT_title_001=Ship Needs Emergency Assistance <EM4>[BP]</EM4> [150–200 XP]
cfp_defendship_VLRT_desc_001=It seems one of the routes that we had thought relatively safe has proven otherwise. Outlaws have attacked one of our pilots over at ~mission(Location|Address) and they won't make it much longer without support. \n\nI'd appreciate it if you could fly there as quickly as possible and help them deal with these attackers.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)\n\n== Stats ==\nReputation XP: +100
cfp_defendship_VLRT_title_001=Pilot in Distress <EM4>[BP]</EM4> [100 XP]
cfp_defendship_multi_HRT_desc_001=We just received word that a convoy of Citizen for Prosperity affiliated ships have been targeted by outlaws and that our people are in dire need of assistance. \n\nIf you are available, we need combat ready pilots at ~mission(Location|Address) to defend our people. Note that at this dire time, we cannot afford even a single lost ship and expect with your assistance for all of our people make it out alive.\n\nGood luck,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)\n\n== Stats ==\nTier 1: +200 XP\nTier 2: +300 XP
cfp_defendship_multi_HRT_title_001=Convoy Caught in Brutal Attack <EM4>[BP]</EM4> [200–300 XP]
cfp_defendship_multi_MRT_desc_001=It appears that we've lost contact with a convoy of Citizen for Prosperity ships at ~mission(Location|Address) after they reported being attacked in their last comm. \n\nWe believe they will be able to hold off the perpetrators until help arrives, but not indefinitely. We need you to rush to their coordinates and deal with the outlaws before its too late.\n\nUnfortunately, we cannot afford even for a single of these vessels to be lost. As such, this contract will only be considered complete if all ships survive the onslaught. \n\nCan you help us?\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +200
cfp_defendship_multi_MRT_title_001=Convoy Needs Emergency Assistance [200 XP]
cfp_defendship_multi_SRT_desc_001=I’m getting reports that a Citizens for Prosperity convoy carrying vital supplies is currently under attack at <EM4>~mission(Location|Address)</EM4>. It’d be a big blow to our operations if we lost that cargo. \n\nIf you’ve got the combat skills to go up against highly aggressive hostiles, we’re more than willing to pay for your help. \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n\n<EM4>Potential Blueprints</EM4>\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)\n\n== Stats ==\nReputation XP: +300
cfp_defendship_multi_SRT_title_001=Come to Aid of Convoy <EM4>[BP]</EM4> [300 XP]
cfp_defendship_multi_VHRT_XT_desc_001=A Citizens for Prosperity convoy transporting urgently needed supplies took a riskier route in order to save time and are savagely being attacked by the XenoThreat. Your combat skills are urgently needed to aid in their defense.\n\nHead to ~mission(Location|Address) as soon as you can. We'll see you well compensated for your assistance.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +1,200
cfp_defendship_multi_VHRT_XT_title_001=Convoy Under XenoThreat Attack [1,200 XP]
cfp_defendship_multi_VHRT_desc_001=A Citizens for Prosperity convoy on a resupply run dropped a distress beacon near <EM4>~mission(Location|Address)</EM4>. They’re not answering any comms, so I assume the situation is serious. That convoy has some skilled pilots, so if they’re not responding then they definitely need the help.\n\nWe’ll compensate you to support that convoy.  \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n\n<EM4>Potential Blueprints</EM4>\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)\n\n== Stats ==\nReputation XP: +250
cfp_defendship_multi_VHRT_title_001=Respond to Distress Beacon <EM4>[BP]</EM4> [250 XP]
cfp_delivery_desc_001=Hi, \n\nGot word folks are waiting for an important supply shipment that’s not arrived. Turns out it accidently got taken to the wrong place. While we look into how the mistake happened, we need someone to head over to <EM4>~mission(Pickup1|Address)</EM4> to pick up package <EM4>#~mission(item1|serialnumber)</EM4> and deliver it to the correct location at <EM4>~mission(Dropoff1|Address)</EM4>. \n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you. \n\nYou available for the run?\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\naUEC Reward: 3,000\nReputation XP: +50
cfp_delivery_desc_002=Hey, \n\nNeed two packages delivered. Package <EM4>#~mission(item1|serialnumber)</EM4> needs to be grabbed from <EM4>~mission(Pickup1|Address)</EM4> and taken to <EM4>~mission(Dropoff1|Address)</EM4>, and package <EM4>#~mission(item2|serialnumber)</EM4> is going from <EM4>~mission(Pickup2|Address)</EM4> to <EM4>~mission(Dropoff2|Address)</EM4>. Should be an easy way to make a few creds. \n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you. \n\nFly safe, \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\naUEC Reward: 6,000\nReputation XP: +50
cfp_delivery_desc_003=Hey, \n\nEvery once and awhile, Citizens for Prosperity likes to surprise members stationed at our outposts with a little gift to keep morale high. We’ve got the next batch ready to go, but need someone to make the deliveries for us. Any interest in spreading some good cheer?\n\nHere’s the delivery list. Feel free to knock them out in any order. \n\n- Package <EM4>#~mission(item1|serialnumber)</EM4> goes from <EM4>~mission(Pickup1|Address)</EM4> to <EM4>~mission(Dropoff1|Address)</EM4>.\n- Package <EM4>#~mission(item2|serialnumber)</EM4> goes from <EM4>~mission(Pickup2|Address)</EM4> to <EM4>~mission(Dropoff2|Address)</EM4>.\n- Package <EM4>#~mission(item3|serialnumber)</EM4> goes from <EM4>~mission(Pickup3|Address)</EM4> to <EM4>~mission(Dropoff3|Address)</EM4>.  \n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you. \n\nThanks,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\naUEC Reward: 9,000\nReputation XP: +50
cfp_delivery_desc_004=Hi,\n\nIf we want regular people to move to Pyro, we need to show them that basic services are reliable. Making things like delivery runs dependable so people don’t think twice about them is exactly what the Citizens of Prosperity are here to do. Care to help us with this? \n\nWe’ve got several deliveries ready to go. Do them in whatever order you want. All that matters is that they get there. \n\n- Package <EM4>#~mission(item1|serialnumber)</EM4> goes from <EM4>~mission(Pickup1|Address)</EM4> to <EM4>~mission(Dropoff1|Address)</EM4>.\n- Package <EM4>#~mission(item2|serialnumber)</EM4> goes from <EM4>~mission(Pickup2|Address)</EM4> to <EM4>~mission(Dropoff2|Address)</EM4>.\n- Package <EM4>#~mission(item3|serialnumber)</EM4> goes from <EM4>~mission(Pickup3|Address)</EM4> to <EM4>~mission(Dropoff3|Address)</EM4>.\n- Package <EM4>#~mission(item4|serialnumber)</EM4> goes from <EM4>~mission(Pickup4|Address)</EM4> to <EM4>~mission(Dropoff4|Address)</EM4>.\n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you. \n\nFly Safe,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\naUEC Reward: 12,000\nReputation XP: +50
cfp_delivery_desc_005=Hey,\n\nGuess there was a technical glitch with our system that marked certain packages as delivered when they never were. Still untangling the mess, but have a few sorted out and good to go. \n\n- Package <EM4>#~mission(item1|serialnumber)</EM4> goes from <EM4>~mission(Pickup1|Address)</EM4> to <EM4>~mission(Dropoff1|Address)</EM4>.\n- Package <EM4>#~mission(item2|serialnumber)</EM4> goes from <EM4>~mission(Pickup2|Address)</EM4> to <EM4>~mission(Dropoff2|Address)</EM4>.\n- Package <EM4>#~mission(item3|serialnumber)</EM4> goes from <EM4>~mission(Pickup3|Address)</EM4> to <EM4>~mission(Dropoff3|Address)</EM4>.\n- Package <EM4>#~mission(item4|serialnumber)</EM4> goes from <EM4>~mission(Pickup4|Address)</EM4> to <EM4>~mission(Dropoff4|Address)</EM4>.\n- Package <EM4>#~mission(item5|serialnumber)</EM4> goes from <EM4>~mission(Pickup5|Address)</EM4> to <EM4>~mission(Dropoff5|Address)</EM4>.\n \nWould be good to get these rectified immediately if you’re available. \n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you. \n\nBest,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\naUEC Reward: 15,000\nReputation XP: +50
cfp_delivery_eliminateall_sabotage_server_H_XT_desc_001=The XenoThreat have mercilessly attacked our people and they are now in desperate need of combat support and medical supplies.\n\nIf you're available, you'll need to pick up the supplies at ~mission(Location|Address) first before heading to <EM4>~mission(Destination|Address)</EM4>. Once on site, it is important that you neutralize all the hostiles before completing delivery of the supplies.\n\nAdditionally, to help prevent an incident like this happening again, we believe that having you destroy the XenoThreat servers at <EM4>~mission(Location1|Address)</EM4> would act as a further deterrent.\n\nThanks,\n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- ADP Arms Woodland\n- ADP Core\n- ADP Legs Woodland\n- ADP-mk4 Arms Woodland\n- ADP-mk4 Core Woodland\n- ADP-mk4 Helmet Woodland\n- ADP-mk4 Legs Woodland\n- BR-2 Shotgun\n- BR-2 Shotgun Magazine (12 cap)\n- Balor HCH Helmet\n- FS-9 LMG\n- FS-9 Magazine (75 cap)\n- Gallant Rifle\n- Gallant Rifle Battery (45 cap)\n\n== Stats ==\nReputation XP: +3,200
cfp_delivery_eliminateall_sabotage_server_H_XT_title_001=Assistance Needed Against XenoThreat Raid <EM4>[BP]</EM4> [3,200 XP]
cfp_delivery_title_001=Delivery for ~mission(Destination) Ready [50 XP]
cfp_delivery_title_002=Multiple Deliveries Ready [50 XP]
cfp_eliminateall_XT_E_desc_001=Despite our efforts to promote non-violence, local outlaw groups continue to attack our organization. XenoThreat recently assaulted ~mission(Location|Address) and chased out our volunteers that had been working there.\n\nWe're looking to enlist combat personnel to retake the outpost. Ideally we could work something out to encourage them to move on, but XenoThreat quickly resorts to violence to solve all their issues so there will undoubtedly be a fight.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- Artimex Arms Canuto\n- Artimex Core Canuto\n- Artimex Helmet Canuto\n- Artimex Legs Canuto\n- Karna Rifle\n- Karna Rifle Battery (35 cap)\n\n== Stats ==\nReputation XP: +200
cfp_eliminateall_XT_E_title_001=Reclaim XenoThreat Outpost <EM4>[BP]</EM4> [200 XP]
cfp_eliminateall_fromCFP_Gen_E_desc_001=Citizens for Prosperity is looking for any available combat operators to ~mission(Location|Address). A group of outlaws have launched an unprovoked attack and our security personnel are desperately in need of support.\n\nPlease dispatch to ~mission(Location) with all urgency and good luck.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- Artimex Arms Canuto\n- Artimex Core Canuto\n- Artimex Helmet Canuto\n- Artimex Legs Canuto\n- Karna Rifle\n- Karna Rifle Battery (35 cap)\n\n== Stats ==\nReputation XP: +25
cfp_eliminateall_fromCFP_Gen_E_title_001=Attack on CFP outpost <EM4>[BP]</EM4> [25 XP]
cfp_eliminateall_fromCFP_XT_M_desc_001=XenoThreat forces launched an unprovoked attack near ~mission(Location|Address). We're looking for any available combat operators to go and provide support. \n\nIf you haven't dealt with them before, it's important to know that XenoThreat are trained fighters so this will not be an easy fight, but it's a necessary one.\n\nGood luck,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- Artimex Arms Canuto\n- Artimex Core Canuto\n- Artimex Helmet Canuto\n- Artimex Legs Canuto\n- Karna Rifle\n- Karna Rifle Battery (35 cap)\n\n== Stats ==\nTier 1: +200 XP\nTier 2: +400 XP
cfp_eliminateall_fromCFP_XT_M_title_001=Protecting outpost from XenoThreat <EM4>[BP]</EM4> [200–400 XP]
cfp_eliminateall_fromCFP_hh_M_desc_001=We received an emergency comm from ~mission(Location|Address) reporting that they are currently under attack by a group of Headhunters. We know our presence in the system has upset the Headhunters, but it hardly excuses this unprovoked attack.\n\nIf available, please gather your gear and head out. Just understand that Headhunters are experienced fighters and will not back down easily.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- Artimex Arms Canuto\n- Artimex Core Canuto\n- Artimex Helmet Canuto\n- Artimex Legs Canuto\n- Karna Rifle\n- Karna Rifle Battery (35 cap)\n\n== Stats ==\nTier 1: +100 XP\nTier 2: +200 XP
cfp_eliminateall_fromCFP_hh_M_title_001=Defenders needed against Headhunters <EM4>[BP]</EM4> [100–200 XP]
cfp_eliminateall_hh_E_desc_001=Citizens for Prosperity is looking for security personnel to take a former CFP outpost that's currently serving as a hideout for Headhunters to launch attacks throughout the system. \n\nLocated near ~mission(Location|Address), reclaiming this outpost will allow CFP to provide greater support to local efforts to build stability.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- Artimex Arms\n- Artimex Core\n- Artimex Helmet\n- Artimex Legs\n- Karna Rifle\n- Karna Rifle Battery (35 cap)\n\n== Stats ==\nReputation XP: +100
cfp_eliminateall_hh_E_title_001=Reclaim Headhunter Outpost <EM4>[BP]</EM4> [100 XP]
cfp_hauling_intro_desc_001=Welcome to the system, not sure if you're familiar with our organization but Citizens for Prosperity are a non-profit organization dedicated to bringing security and civilization to unclaimed systems.\n\nIf you're looking for work in the system and would like to help achieve our goal, we need a package picked up from <EM4>~mission(Location|Address)</EM4> and taken to <EM4>~mission(Destination|Address)</EM4>.\n\nOnce complete, we can offer you a variety of new job opportunities in this system and beyond.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +25
cfp_hauling_intro_title_001=First Haul in System [25 XP]
cfp_maintenance_E_desc_001=Hi,\n\nOne of our outposts at <EM4>~mission(Location|Address)</EM4> is in need of some light repairs. The folks onsite have estimated that you’ll need <EM4>three fuses</EM4>, a <EM4>salvaging tool</EM4>, and <EM4>enough RMC canisters to fix up to three or so pipes.</EM4>\n\nIf you need more information on maintenance work, see <EM4>“Cornerstone Developments' Guide to Maintenance”</EM4> entry in your mobiGlas Journal.\n\nThanks again for your help,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nTier 1: +25 XP\nTier 2: +50 XP
cfp_maintenance_E_title_001=Minor Repairs Needed: ~mission(Location) [25–50 XP]
cfp_maintenance_H_desc_001=We need some help. The CFP facility at <EM4>~mission(Location|Address)</EM4> suffered severe damage during a recent electrical storm and we're looking for anyone who can help with repairs.\n\nSurveying the site, you'll have to bring <EM4>six fuses</EM4>, a <EM4>salvaging tool</EM4>, and <EM4>enough RMC canisters to take care of eight or so pipes</EM4>. That should be enough to repair the damage and get the outpost back in operation.\n\nIf you need more information on maintenance work, see <EM4>“Cornerstone Developments' Guide to Maintenance”</EM4> entry in your mobiGlas Journal.\n\nDo you think you can help?\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nTier 1: +100 XP\nTier 2: +400 XP
cfp_maintenance_H_title_001=Extensive Repairs Needed: ~mission(Location) [100–400 XP]
cfp_maintenance_M_desc_001=Hello,\n\nWe've received word that a devastating storm hit <EM4>~mission(Location|Address)</EM4> which caused some damage to the structures. Our technician on site is still trying to figure out what they can fix but they can’t get everything. If you bring <EM4>six fuses</EM4>, a <EM4>salvaging tool</EM4>, and <EM4>enough RMC canisters to repair around five pipes</EM4>, we should be able to handle any remaining repairs.\n\nIf you need more information on maintenance work, see <EM4>“Cornerstone Developments' Guide to Maintenance”</EM4> entry in your mobiGlas Journal.\n\nThanks,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +100
cfp_maintenance_M_title_001=Moderate Repairs Needed: ~mission(Location) [100 XP]
cfp_missingperson_inv_chain_h_xenothreat_desc_01=An upstanding member of the Citizens for Prosperity community, Doctor ~mission(TargetName), was recently abducted by XenoThreat while distributing vital medical supplies to one of our settlements.\n\nThe kidnappers were last seen entering their base at ~mission(Location|Address), but we are uncertain whether they will remain there for long. XenoThreat maintains multiple outposts throughout this system and has been known to swap locations at a moment's notice. \n\nConsidering the danger and the distance you may have to travel, CFP is prepared to offer a substantial reward for determining what happened to Dr. ~mission(TargetName|Last).\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +400
cfp_missingperson_inv_chain_h_xenothreat_title_01=Missing: ~mission(TargetName) [400 XP]
cfp_missingperson_inv_chain_m_desc_01=Two of our volunteers vanished while on a recent foraging expedition. It has been over two standard days since their disappearance, and their families have begun to fear the worst and are willing to offer a reward if someone can help trace their whereabouts.\n\nThey were last seen in the vicinity of ~mission(Location|Address). It is possible that they may have been injured and sought shelter in an abandoned building or a cave. The area is full of potential hiding spots, so your search will need to be thorough. \n\nThank you for taking this on. \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +800
cfp_missingperson_inv_chain_m_title_01=Missing Volunteers [800 XP]
cfp_missingperson_inv_e_criminalbase_desc_01=~mission(TargetName), a member of the Citizens for Prosperity family, vanished two standard days ago while attempting to find a buyer for some old farming equipment. CFP regrets to report that we have just discovered the wreckage of a vehicle registered under the name of the missing person in an area known to be frequented by pirates. \n\nWe found evidence at the crash site that the victim survived and is most likely being held at ~mission(Location|Address). We are offering a reward to anyone who can track down ~mission(TargetName|First) on our behalf. \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n\n== Stats ==\nReputation XP: +100
cfp_missingperson_inv_e_criminalbase_title_01=Missing: ~mission(TargetName) [100 XP]
cfp_missingperson_inv_e_faunacave_desc_01=Junior surveyor ~mission(TargetName) fell out of contact with their team while identifying potentially viable mineral seams in a cave near ~mission(Location|Address). Wild animals have been known to frequent this location, which has led Citizens for Prosperity to believe that the surveyor may have been attacked while on the job and is currently stranded. \n\nWe need someone to find them and render aid if at all possible. If it's too late and they're beyond help, it will at least comfort the rest of the team to know what happened to their friend. \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +25
cfp_missingperson_inv_e_faunacave_title_01=Missing: ~mission(TargetName) [25 XP]
cfp_missingperson_inv_e_regionlink_desc_01=Citizens for Pyro is concerned about one of our local contractors, ~mission(TargetName). They finished up a trade at ~mission(Location|Address) and haven’t been seen since. We’re hearing reports that outlaws have been frequenting the area, so I suspect that the worst might have happened.\n\nEither way, ~mission(TargetName|Last) has done good work for us in the past and I’d hate for them to wind up as just another one of the system's missing. If you’re willing to find them for me, I’ll see that you get a reward.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +100
cfp_missingperson_inv_e_regionlink_title_01=Missing: ~mission(TargetName) [100 XP]
cfp_missingperson_inv_h_xenothreat_desc_01=During what should have been a routine cargo run, hauler and long-time friend of Citizens for Prosperity ~mission(TargetName) was ambushed and abducted by XenoThreat. The coded distress signal we received from the victim just before their comms went dark gave us just enough information to pinpoint their most likely location: ~mission(Location|Address).\n\nCFP needs someone to slip into the outpost, confirm the whereabouts of ~mission(TargetName|Last), and relay this information back to us so we know exactly where to send our rescue team. Or, in the worst possible scenario, deliver news to the hauler's family that their loved one didn't survive. \n\nWe understand how dangerous it is to approach a XenoThreat stronghold, and are prepared to offer a sizeable reward for putting yourself at risk.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n\n== Stats ==\nReputation XP: +400
cfp_missingperson_inv_h_xenothreat_title_01=Missing: ~mission(TargetName) [400 XP]
cfp_missingperson_inv_m_criminalbase_desc_01=~mission(TargetName), a mechanic who has performed countless services for our community, was abducted by a group of outlaws three standard days ago. CFP has received a ransom comm, but we refuse to negotiate with the types of people who actively work to destroy the peace in this system. If we open that door even once, we will never be safe. \n\nThe outlaws known to have abducted ~mission(TargetName|Last)  were last seen entering ~mission(Location|Address). CFP needs someone to infiltrate the base and confirm our missing person's whereabouts.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n\n== Stats ==\nReputation XP: +200
cfp_missingperson_inv_m_criminalbase_title_01=Missing: ~mission(TargetName) [200 XP]
cfp_missingperson_inv_m_headhunters_desc_01=We've received disturbing news: ~mission(TargetName), the scout that was reported missing last week has been seen in Headhunter custody. According to the witness, they were spotted being loaded into a transport headed to ~mission(Location|Address) this time yesterday. \n\nIf anyone out there can confirm their whereabouts, there's a reward in store. Citizens for Prosperity maintains hope that they are alive and well. If not, their families deserve to know their fates either way. \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nTier 1: +100 XP\nTier 2: +200 XP
cfp_missingperson_inv_m_headhunters_title_01=Missing: ~mission(TargetName) [100–200 XP]
cfp_missingperson_inv_m_headhunters_xs_desc_01=Last night, the homesteader ~mission(TargetName) was abducted by Headhunters for unknown reasons. Citizens for Prosperity has not received a ransom note, nor has the victim's family. However, we have just received word from an informant that the abducted party was most likely taken to ~mission(Location|Address). \n\nWe need someone to determine the validity of this information, and to report back to CFP. A reward will be provided whether your findings are good or bad. \n\nYou may need to utilize a ground vehicle to help you search the area. \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +100
cfp_missingperson_inv_m_headhunters_xs_title_01=Missing: ~mission(TargetName) [100 XP]
cfp_missingperson_multiple_sabotage_servers_H_XT_desc_001=A small group of Citizens for Prosperity members were supposed to be delivering sensitive data back to our headquarters in Stanton, but they never arrived. \n\nWe now believe that they were captured by XenoThreat before they could leave the system. I'd like you to investigate ~mission(Location|Address) to discover what happened to the missing crew and then destroy any servers they could be using to store the stolen data.\n\nYour help is very appreciated,\n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n\n== Stats ==\nReputation XP: +1,500
cfp_missingperson_multiple_sabotage_servers_H_XT_title_001=Find XenoThreat Captives and Stolen Data [1,500 XP]
cfp_missingperson_sabotage_servers_H_HH_desc_001=I just have received confirmation that ~mission(TargetName), a Citizens for Prosperity courier, was captured by the Headhunters while transporting some critical data. \n\nWe need you to investigate ~mission(Location|Address) to discover what happened to ~mission(TargetName|First) and then destroy any Headhunter servers that may contain stolen data.\n\nWe're counting on you,\n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +1,500
cfp_missingperson_sabotage_servers_H_HH_title_001=Find Headhunter Captive and Stolen Data [1,500 XP]
cfp_missingperson_sabotage_servers_H_XT_desc_001=The family of ~mission(TargetName), a Citizens for Prosperity courier, has been in contact with me with the terrible news that they never arrived back home. We learned that ~mission(TargetName|First) was captured by XenoThreat while transporting some critical data. \n\nWe need you to search ~mission(Location|Address) and see if you can learn what has become of ~mission(TargetName|First) and then destroy any XenoThreat servers that may contain stolen data.\n\nThank you,\n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +1,500
cfp_missingperson_sabotage_servers_H_XT_title_001=Find XenoThreat Captive and Stolen Data [1,500 XP]
cfp_missingperson_sabotage_servers_VH_XT_desc_001=One of our most trusted datarunners, ~mission(TargetName), has found themselves the victim of a XenoThreat assault. Now both they and the data they were ferrying have been captured and taken to ~mission(Location|Address). \n\nI am charging you with heading there to ascertain what happened to ~mission(TargetName|First) and to destroy data servers which may be housing the stolen information.\n\nEven if the worst has happened, I think they would want us to make sure they data they were charged with protecting isn't used for nefarious gains.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +1,500
cfp_missingperson_sabotage_servers_VH_XT_title_001=Personnel and Data Captured by XenoThreat [1,500 XP]
cfp_missingperson_sabotage_servers_desc_001=One of our most dedicated people, ~mission(TargetName) has gone missing and I'm beside myself thinking what might have happened to them. They had been working undercover to gather intelligence on some local outlaws and managed to track down where some critical data was being stored. \n\nWe need you to go, discern what happened to them, and if the worst has happened, continue their mission to destroy the sensitive data before it can be used against us.\n\nFrom their last check in with their handler, we believe they were headed to ~mission(Location|Address). I suggest you start your search at the small outposts near there.\n\nPlease hurry,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +800
cfp_missingperson_sabotage_servers_retrievecargo_VH_XT_desc_001=A local courier who has been working for Citizen for Prosperity, ~mission(TargetName), was reported missing earlier this week. We believe that they may have been captured by members of XenoThreat who were after the encrypted data-drives and important cargo they were transporting for us.  \n\nWe would like you to go to ~mission(Location|Address) to ascertain what has happened to ~mission(TargetName|First), destroy any servers which may be housing the stolen data,  and deliver the recovered cargo to ~mission(Destination|Address).\n\nIt's a lot to ask, but I believe you're up to the challenge.\n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nTier 1: +1,200 XP\nTier 2: +1,500 XP
cfp_missingperson_sabotage_servers_retrievecargo_VH_XT_title_001=Investigate Missing Pilot and Cargo [1,200–1,500 XP]
cfp_missingperson_sabotage_servers_title_001=Critical Intelligence Lost [800 XP]
cfp_recovery_desc_001=Hey,\n\nWe could use your help.\n\nA local we work with was completing a delivery for us, but unfortunately, she ran into some outlaws and had to surrender her ~mission(Item). Silver lining is the outlaws didn’t notice the trackers we placed in the cargo and now we know they’ve taken their haul to ~mission(Location|Address). \n\nWe’d like you to recover the packages for us and finish delivering them to ~mission(Destination|Address). I don’t imagine the outlaws will give them up willingly, but I wouldn’t ask you to put yourself in harm’s way if these supplies weren’t of critical importance.\n\nAlso, to make your life easier, I'd suggest you have a <EM4>handheld tractor beam</EM4> with you. \n\nSo, what do you say?\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\naUEC Reward: 10,000\nReputation XP: +50
cfp_recovery_tile_001=Stolen Supplies [50 XP]
cfp_sabotage_VH_desc_001=Citizens for Prosperity have been monitoring a very dangerous outlaw group at ~mission(Location|Address) and we believe that they are in midst of planning a major attack which could throw the whole system into upheaval.\n\nIn order to protect all the progress we've made here, we would like you to raid their compound and destroy all the servers housing their plans. \n\nThis should at least provide us with enough of a reprieve for them to reconsider their offensive.\n\nThank you,\n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- ADP Arms Woodland\n- ADP Core\n- ADP Legs Woodland\n- ADP-mk4 Arms Woodland\n- ADP-mk4 Core Woodland\n- ADP-mk4 Helmet Woodland\n- ADP-mk4 Legs Woodland\n- BR-2 Shotgun\n- BR-2 Shotgun Magazine (12 cap)\n- Balor HCH Helmet\n- FS-9 LMG\n- FS-9 Magazine (75 cap)\n- Gallant Rifle\n- Gallant Rifle Battery (45 cap)\n\n== Stats ==\nReputation XP: +150
cfp_sabotage_VH_title_001=Destroy Outlaw Data Servers <EM4>[BP]</EM4> [150 XP]
cfp_sabotage_drugs_M_desc_001=Citizens for Prosperity has been working hard to improve people's lives across the system, but an already difficult task becomes near impossible when drugs get involved. We've recently seen a dealer specifically targeting our most vulnerable and have experienced setbacks across the board. This needs to stop.\n\nWe would like you to go to ~mission(Location|Address) and put a permanent end to their production line.\n\nDo this and we can hopefully get our people back on track. \n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- ADP Arms Woodland\n- ADP Core\n- ADP Legs Woodland\n- ADP-mk4 Arms Woodland\n- ADP-mk4 Core Woodland\n- ADP-mk4 Helmet Woodland\n- ADP-mk4 Legs Woodland\n- BR-2 Shotgun\n- BR-2 Shotgun Magazine (12 cap)\n- Balor HCH Helmet\n- FS-9 LMG\n- FS-9 Magazine (75 cap)\n- Gallant Rifle\n- Gallant Rifle Battery (45 cap)\n\n== Stats ==\nReputation XP: +150
cfp_sabotage_drugs_M_title_001=Halt Narcotics Operation <EM4>[BP]</EM4> [150 XP]
cfp_sabotage_generators_E_HH_desc_001=With the recent aggression perpetrated by the Headhunters against our people, Citizens for Prosperity has been arranging a full operation that should hopefully deal them a significant blow. \n\nHowever, before that can happen, we need to by some more time to finish our preparations. If you could destroy the power generators at ~mission(Location|Address) it should stall the Headhunters long enough for us to ready our counter attack. \n\nYour assistance will be critical to our success,\n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- A03 Sniper Rifle\n- A03 Sniper Rifle Magazine (15 cap)\n- Argus Helmet\n- CBH-3 Helmet Base\n- P6-LR Magazine (8 cap)\n- P6-LR Sniper Rifle\n- PAB-1 Arms\n- PAB-1 Core\n- PAB-1 Legs\n- TrueDef-Pro Arms\n- TrueDef-Pro Core Base\n- TrueDef-Pro Legs\n\n== Stats ==\nReputation XP: +75
cfp_sabotage_generators_E_HH_title_001=Take Headhunter Stronghold Offline <EM4>[BP]</EM4> [75 XP]
cfp_sabotage_generators_H_desc_001=There is a band of outlaws at ~mission(Location|Address) who have increasingly become an issue for Citizens for Prosperity settlements in the sector.\n\nWhile direct violence against the perpetrators would potentially be effective, it is not in the spirit of our mission here. Instead, we would like you to take the generators near their stronghold offline. This should limit their operational capacity while hopefully preserving life. \n\nI like to think that today's outlaws are tomorrow's productive members of society.\n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- ADP Arms Woodland\n- ADP Core\n- ADP Legs Woodland\n- ADP-mk4 Arms Woodland\n- ADP-mk4 Core Woodland\n- ADP-mk4 Helmet Woodland\n- ADP-mk4 Legs Woodland\n- BR-2 Shotgun\n- BR-2 Shotgun Magazine (12 cap)\n- Balor HCH Helmet\n- FS-9 LMG\n- FS-9 Magazine (75 cap)\n- Gallant Rifle\n- Gallant Rifle Battery (45 cap)\n\n== Stats ==\nReputation XP: +150
cfp_sabotage_generators_H_title_001=Limit Outlaw Operational Capacity <EM4>[BP]</EM4> [150 XP]
cfp_sabotage_generators_M_desc_001=We have gotten word that the outlaws at ~mission(Location|Address) have begun recruiting with the hopes of launching a raid against Citizens for Prosperity. \n\nIn order to deescalate the situation before it gets out of hand, we would like you to disable their power generators and halt their expansion. \n\nPull this off and it could save a lot of lives.\n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- ADP Arms Woodland\n- ADP Core\n- ADP Legs Woodland\n- ADP-mk4 Arms Woodland\n- ADP-mk4 Core Woodland\n- ADP-mk4 Helmet Woodland\n- ADP-mk4 Legs Woodland\n- BR-2 Shotgun\n- BR-2 Shotgun Magazine (12 cap)\n- Balor HCH Helmet\n- FS-9 LMG\n- FS-9 Magazine (75 cap)\n- Gallant Rifle\n- Gallant Rifle Battery (45 cap)\n\n== Stats ==\nReputation XP: +150
cfp_sabotage_generators_M_title_001=Take Outlaws at ~mission(Location) Offline <EM4>[BP]</EM4> [150 XP]
cfp_sabotage_generators_VE_desc_001=Following a series of raids against Citizens for Prosperity aligned settlements, we believe we have traced those responsible back to ~mission(Location|Address).\n\nAttacking them directly will pose too great of a risk and most likely encourage aggressive reprisals. Instead, we believe that if their power generators were to be disable it could force them to settle somewhere else.\n\nDo you think you could handle it for us?\n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- ADP Arms Woodland\n- ADP Core\n- ADP Legs Woodland\n- ADP-mk4 Arms Woodland\n- ADP-mk4 Core Woodland\n- ADP-mk4 Helmet Woodland\n- ADP-mk4 Legs Woodland\n- BR-2 Shotgun\n- BR-2 Shotgun Magazine (12 cap)\n- Balor HCH Helmet\n- FS-9 LMG\n- FS-9 Magazine (75 cap)\n- Gallant Rifle\n- Gallant Rifle Battery (45 cap)\n\n== Stats ==\nReputation XP: +25
cfp_sabotage_generators_VE_title_001=Disable Outlaw Stronghold at ~mission(Location) <EM4>[BP]</EM4> [25 XP]
cfp_sabotage_server_elimiatespecific_HH_desc_001=We're just putting the full picture together now, but so far we've learned that a Headhunter by the name of ~mission(TargetName) recently stole some sensitive data that if exposed will be detrimental to Citizens for Prosperity's cause. \n\nWe need to ensure that all traces of the stolen data are eradicated. This means taking out all the Headhunter servers at ~mission(Location|Address) as well as tracking down ~mission(TargetName|Last) to stop them from further disseminating the information.\n\nYour help is much appreciated,\n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- A03 Sniper Rifle\n- A03 Sniper Rifle Magazine (15 cap)\n- Argus Helmet\n- CBH-3 Helmet Base\n- P6-LR Magazine (8 cap)\n- P6-LR Sniper Rifle\n- PAB-1 Arms\n- PAB-1 Core\n- PAB-1 Legs\n- TrueDef-Pro Arms\n- TrueDef-Pro Core Base\n- TrueDef-Pro Legs\n\n== Stats ==\nReputation XP: +1,500
cfp_sabotage_server_elimiatespecific_HH_title_001=Eradicate All Traces of Headhunter Data <EM4>[BP]</EM4> [1,500 XP]
cfp_sabotage_servers_E_HH_desc_001=With increasing frequency, members of the Headhunters gang have been targeting Citizens for Prosperity settlements when our patrols are too far to offer assistance. \n\nTo accomplish this, they have been using intel gathered on us that is being stored at ~mission(Location|Address). By destroying these servers and the information they contain, we should be able to significantly hamper the Headhunters' ability to move against us.\n\nThanks for the assistance,\n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- ADP Arms Woodland\n- ADP Core\n- ADP Legs Woodland\n- ADP-mk4 Arms Woodland\n- ADP-mk4 Core Woodland\n- ADP-mk4 Helmet Woodland\n- ADP-mk4 Legs Woodland\n- BR-2 Shotgun\n- BR-2 Shotgun Magazine (12 cap)\n- Balor HCH Helmet\n- FS-9 LMG\n- FS-9 Magazine (75 cap)\n- Gallant Rifle\n- Gallant Rifle Battery (45 cap)\n\n== Stats ==\nReputation XP: +75
cfp_sabotage_servers_E_HH_title_001=Wipe Headhunter Data Servers <EM4>[BP]</EM4> [75 XP]
cfp_sabotage_servers_H_XT_desc_001=We got a bit of a problem that I'm hoping you can solve for me. One of our informers has revealed that XenoThreat has been amassing data on Citizens for Prosperity operations throughout the system. \n\nThis information, if used correctly, could put our people at serious risk. The best solution is for you to completely destroy the servers where the data is being stored at ~mission(Location|Address).\n\nWith their trove of information wiped out, it should give our people a fighting chance.\n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- A03 Sniper Rifle\n- A03 Sniper Rifle Magazine (15 cap)\n- Argus Helmet\n- CBH-3 Helmet Base\n- P6-LR Magazine (8 cap)\n- P6-LR Sniper Rifle\n- PAB-1 Arms\n- PAB-1 Core\n- PAB-1 Legs\n- TrueDef-Pro Arms\n- TrueDef-Pro Core Base\n- TrueDef-Pro Legs\n\n== Stats ==\nReputation XP: +75
cfp_sabotage_servers_H_XT_title_001=Destroy XenoThreat Logistic Data <EM4>[BP]</EM4> [75 XP]
cfp_sabotage_servers_M_HH_desc_001=The Headhunters recently attacked one of our transports and were sadly able to get their hands on some secure data. Although the encryption on it is strong, its only a matter of time before they'll be able to access it.\n\nBefore that happens, we need you to go to ~mission(Location|Address) and destroy all traces of the information from their servers.\n\nYou'd really be helping Citizens for Prosperity out if you can pull this off.\n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- ADP Arms Woodland\n- ADP Core\n- ADP Legs Woodland\n- ADP-mk4 Arms Woodland\n- ADP-mk4 Core Woodland\n- ADP-mk4 Helmet Woodland\n- ADP-mk4 Legs Woodland\n- BR-2 Shotgun\n- BR-2 Shotgun Magazine (12 cap)\n- Balor HCH Helmet\n- FS-9 LMG\n- FS-9 Magazine (75 cap)\n- Gallant Rifle\n- Gallant Rifle Battery (45 cap)\n\n== Stats ==\nTier 1: +75 XP\nTier 2: +150 XP
cfp_sabotage_servers_M_HH_title_001=Destroy Headhunter Stolen Data <EM4>[BP]</EM4> [75–150 XP]
cfp_sabotage_servers_M_desc_001=After several attempts at convincing the outlaws at ~mission(Location|Address) to stop their assaults on Citizens for Prosperity aligned settlements, we have decided on a new course of action.\n\nWe want you to wipe out all the records they are storing on their servers. This setback should force them to reconsider their actions, or at the very least, give us time to assess further options.\n\nThanks,\n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- ADP Arms Woodland\n- ADP Core\n- ADP Legs Woodland\n- ADP-mk4 Arms Woodland\n- ADP-mk4 Core Woodland\n- ADP-mk4 Helmet Woodland\n- ADP-mk4 Legs Woodland\n- BR-2 Shotgun\n- BR-2 Shotgun Magazine (12 cap)\n- Balor HCH Helmet\n- FS-9 LMG\n- FS-9 Magazine (75 cap)\n- Gallant Rifle\n- Gallant Rifle Battery (45 cap)\n\n== Stats ==\nReputation XP: +75
cfp_sabotage_servers_M_title_001=Clear Outlaw Data Center <EM4>[BP]</EM4> [75 XP]
cfp_sabotage_servers_VH_XT_desc_001=One of the Citizens for Prosperity members who have been serving as a XenoThreat informer has let us know that the data servers located at ~mission(Location|Address) our housing a trove of information vital to the gang's operation. \n\nIf you were able to destroy these servers on our behalf it would be a huge win for the security of the entire system.\n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- ADP Arms Woodland\n- ADP Core\n- ADP Legs Woodland\n- ADP-mk4 Arms Woodland\n- ADP-mk4 Core Woodland\n- ADP-mk4 Helmet Woodland\n- ADP-mk4 Legs Woodland\n- BR-2 Shotgun\n- BR-2 Shotgun Magazine (12 cap)\n- Balor HCH Helmet\n- FS-9 LMG\n- FS-9 Magazine (75 cap)\n- Gallant Rifle\n- Gallant Rifle Battery (45 cap)\n\n== Stats ==\nReputation XP: +300
cfp_sabotage_servers_VH_XT_title_001=Destroy XenoThreat Data Servers <EM4>[BP]</EM4> [300 XP]
cfp_searchbody_danger_cave_desc_001=We’ve been trying to get in contact with community member ~mission(TargetName), but haven’t heard from them in a few days. From what Citizens for Prosperity has been able to find out, they were scouting out near ~mission(Location|Address) which is a known outlaw hotspot.\n\nWe need someone to go there for us and try to locate them, or worst case scenario, their remains. \n\nIf you are able to find them, there’s a reward on offer.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +100
cfp_searchbody_danger_cave_title_001=Missing: ~mission(TargetName) [100 XP]
cfp_searchbody_danger_outpost_desc_001=Unfortunately, one of our community partners, ~mission(TargetName), has been missing for a few days. Their family contacted Citizens for Prosperity for help and I told them we would do what we could. That said, with so much time passed, I’m not too hopeful.\n\nWhatever their current state is, we're looking for someone to be our eyes on the ground for this one. There’s a strong chance that they were headed to ~mission(Location|Address), an area known to be very dangerous.\n\nIf you can track them down and confirm their status, one way or another, I’ll see that you’re properly compensated.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nTier 1: +100 XP\nTier 2: +200 XP\nTier 3: +400 XP
cfp_searchbody_danger_outpost_title_001=Missing: ~mission(TargetName) [100–400 XP]
cfp_searchbody_danger_station_desc_001=Hey,\n\nI’m getting pretty worried about one of our local contractors, ~mission(TargetName). They finished up a trade at ~mission(Location|Address) and haven’t been seen since. We’re hearing reports that outlaws have been sneaking aboard there, and if that’s true, I suspect that the worst might have happened.\n\nEither way, ~mission(TargetName|First) has done good work for us in the past and I’d hate for them to wind up as just another one of Pyro’s missing. If you’re willing to find them for me, I’ll see that you get a reward. \n\nJust be careful. Hate for you to go missing too.\n\nThanks,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n\n== Stats ==\naUEC Reward: 15,000
cfp_searchbody_nodanger_cave_desc_001=~mission(TargetName) is a local who only has done a few jobs for Citizen for Prosperity, but they had promise. That is, until they went missing while exploring ~mission(Location|Address) last week. Unfortunately, we didn’t hear about it until today. Chances of survival at this point are pretty slim, but we still think its worth confirming what happened to them.\n \nCFP could use help on this if anyone is interested. And besides being a good deed, the payment should make it worth the effort. \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nTier 1: +25 XP\nTier 2: +100 XP
cfp_searchbody_nodanger_cave_title_001=Missing: ~mission(TargetName) [25–100 XP]
cfp_searchbody_nodanger_outpost_desc_001=One of our people, ~mission(TargetName), was supposed to be doing some preliminary scouting work over at ~mission(Location|Address), but they never reported in. We’re hoping that they just ran into some bad luck, but too often out here even the smallest misstep can prove fatal.\n\nI’d appreciate someone heading that way and seeing if they can be located. It’d be great if you find them alive, but if not, some closure is the least we can do for their family.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nTier 1: +25 XP\nTier 2: +100 XP\nTier 3: +150 XP
cfp_searchbody_nodanger_outpost_title_001=Missing: ~mission(TargetName) [25–150 XP]
cfp_searchbody_nodanger_station_desc_001=Two locals we work with were out salvaging at ~mission(Location|Address) when they had some issues with faulty equipment. One managed to escape, but their partner, ~mission(TargetName) was unfortunately left behind.\n\nWith the state they were last reported to be in, I’m guessing they didn’t make it, but I’d like to know for sure. If you’re willing, I could use your help in finding their remains.\n\nIf you can track them down, I’ll see that you’re properly compensated for the effort.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +100
cfp_searchbody_nodanger_station_title_001=Missing: ~mission(TargetName) [100 XP]
