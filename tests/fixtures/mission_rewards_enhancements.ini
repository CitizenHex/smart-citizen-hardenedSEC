LingFamily_RecoverCargo_Easy_Description=Hello,\n\nLooking for a quick job? Got a client who's waiting on a shipment but our hauler ran into some engine trouble. Can't seem to get them up and running so we need someone to take over.\n\nFly out to <EM4>~mission(Location|Address)</EM4> and you'll spot their ship. You can't miss it - it's the one that's sitting still in the middle of space. Make sure you bring a <EM4>heavy-duty tractor beam</EM4> along with a decent ship that can carry <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>.\n\nOnce you've picked up the goods take them to the freight elevator at <EM4>~mission(Destination|Address)</EM4>.\n\nThanks,  \nReyes Ling \nCargo Logistics Coordinator \nLing Family Hauling \n\n\n\n\n\n\n\nLing Family Hauling knows it’s a dangerous and unpredictable universe and has established several protocols to protect both you and our client’s cargo. To ensure you aren’t punished for circumstances outside of your control, total payment will be prorated to the percentage of cargo successfully delivered. A delivery timer will be set for each haul. Any cargo that remains undelivered upon its expiration will be flagged as stolen and treated as such. All pick-ups and deliveries must be autoloaded or done at a freight elevator.\n\n== Stats ==\nReputation XP: +100
LingFamily_RecoverCargo_Easy_Title=Ling Shipment Recovery [100 XP]
LingFamily_RecoverCargo_Hard_Description=Hello,\n\nSome sad news. Unfortunately our hauler ran into some trouble and had to abandoned the cargo they were due to deliver. We haven't heard anything back from them so we're assuming the worse.\n\nWe're in the process of contacting their family and are conscious this is a very sensitive time, but also can't afford to leave a job incomplete. Our trackers show the cargo is still intact over at <EM4>~mission(Location|Address)</EM4>.\n\nIf you could finish the delivery we would be really grateful. We're not picking up on any nearby ships so it should be safe for you to collect. Bring a <EM4>heavy-duty tractor beam</EM4> and a ship that can carry <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>.\n\nDeliver the cargo to the freight elevator at <EM4>~mission(Destination|Address)</EM4> and we'll take care of the rest.\n\nThanks,  \nReyes Ling \nCargo Logistics Coordinator \nLing Family Hauling \n\n\n\n\n\n\n\nLing Family Hauling knows it’s a dangerous and unpredictable universe and has established several protocols to protect both you and our client’s cargo. To ensure you aren’t punished for circumstances outside of your control, total payment will be prorated to the percentage of cargo successfully delivered. A delivery timer will be set for each haul. Any cargo that remains undelivered upon its expiration will be flagged as stolen and treated as such. All pick-ups and deliveries must be autoloaded or done at a freight elevator.\n\n== Stats ==\nReputation XP: +200
LingFamily_RecoverCargo_Hard_Title=Complete Stranded Ling Shipment [200 XP]
LingFamily_RecoverCargo_Medium_Description=Hi,\n\nGot a relatively straightforward one for you if you're interested.\n\nOne of our pilot ignored a maintenance warning and sure enough, a couple of hours later their ship broke down over at <EM4>~mission(Location|Address)</EM4>. They're on their way back to the office now but we could do with a reliable hauler whose got a ship big enough to transport <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> to complete the haul for us.\n\nThink you could help us out? You just need to pick up the stranded shipment and deliver it to the freight elevator at <EM4>~mission(Destination|Address)</EM4>.  And I probably don't have to say this, but a <EM4>heavy-duty tractor beam</EM4> would probably be handy to have along.\n\nThanks,  \nReyes Ling \nCargo Logistics Coordinator \nLing Family Hauling \n\n\n\n\n\n\n\nLing Family Hauling knows it’s a dangerous and unpredictable universe and has established several protocols to protect both you and our client’s cargo. To ensure you aren’t punished for circumstances outside of your control, total payment will be prorated to the percentage of cargo successfully delivered. A delivery timer will be set for each haul. Any cargo that remains undelivered upon its expiration will be flagged as stolen and treated as such. All pick-ups and deliveries must be autoloaded or done at a freight elevator.\n\n== Stats ==\nReputation XP: +150
LingFamily_RecoverCargo_Medium_Title=Rescue Incomplete Ling Delivery [150 XP]
LingFamily_RecoverCargo_Super_Description=Hey,\n\nJust our luck that we land one of the biggest contracts of our life and our hauler's engines seize up. They've tried their best to fix it but seems like it's just not happening.\n\nCan you fly out to <EM4>~mission(Location|Address)</EM4> and grab the cargo for us? It's really important that we show our client that we're just as reliable as the other big players out there.\n\nJust so you know this is a large shipment. You'll need a ship that can handle <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> and a <EM4>heavy-duty tractor beam</EM4> to move it all. Once you've transferred it to your ship, deliver it to the freight elevator at <EM4>~mission(Destination|Address)</EM4> and we'll send confirmation to the client.\n\nConsidering the circumstances, we're paying above market rates to whoever can complete this.\n\nThanks,  \nReyes Ling \nCargo Logistics Coordinator \nLing Family Hauling \n\n\n\n\n\n\n\nLing Family Hauling knows it’s a dangerous and unpredictable universe and has established several protocols to protect both you and our client’s cargo. To ensure you aren’t punished for circumstances outside of your control, total payment will be prorated to the percentage of cargo successfully delivered. A delivery timer will be set for each haul. Any cargo that remains undelivered upon its expiration will be flagged as stolen and treated as such. All pick-ups and deliveries must be autoloaded or done at a freight elevator.\n\n== Stats ==\nReputation XP: +300
LingFamily_RecoverCargo_Super_Title=Stuck Ling Shipment Pending Delivery [300 XP]
LingFamily_RecoverCargo_VeryEasy_Description=Hey,\n\nHere's the thing: one of our haulers has run into some trouble over at <EM4>~mission(Location|Address)</EM4> and had to ditch their ship. Could you head over there and help us finish the delivery?\n\nNot a huge job by any means, but you'll still need a <EM4>heavy-duty tractor beam</EM4> and a ship with enough space to store <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>.\n \nDrop the cargo off at the freight elevator at <EM4>~mission(Destination|Address)</EM4> and we'll send you the creds.\n\nThanks,  \nReyes Ling \nCargo Logistics Coordinator \nLing Family Hauling \n\n\n\n\n\n\n\nLing Family Hauling knows it’s a dangerous and unpredictable universe and has established several protocols to protect both you and our client’s cargo. To ensure you aren’t punished for circumstances outside of your control, total payment will be prorated to the percentage of cargo successfully delivered. A delivery timer will be set for each haul. Any cargo that remains undelivered upon its expiration will be flagged as stolen and treated as such. All pick-ups and deliveries must be autoloaded or done at a freight elevator.\n\n== Stats ==\nReputation XP: +50
LingFamily_RecoverCargo_VeryEasy_Title=Finish Interrupted Ling Delivery [50 XP]
LingFamily_RecoverCargo_VeryHard_Description=Hey,\n\nNeed a reliable contractor to help us out with a bit of a situation.\n\nOur of our haulers has dropped out mid-contract and now our client's cargo is stuck in transit. Think they were trying to negotiate a better rate with us, but that's not how Ling does business. Anyway, they're done and we desperately need the shipment finished.\n\nPetra and I have been working with this client for years now and have built up a good rapport. Be a shame to throw that all a way because of an unreliable hauler. Can you head to <EM4>~mission(Location|Address)</EM4> and collect the shipment? You'll need a <EM4>heavy-duty tractor beam</EM4> and a ship that can carry <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>.\n\nTake the shipment to the freight elevator over at <EM4>~mission(Destination|Address)</EM4> and we'll get you paid as soon as. We'd really appreciate your help with this and I'm sure our client would too.\n\nThanks,  \nReyes Ling \nCargo Logistics Coordinator \nLing Family Hauling \n\n\n\n\n\n\n\nLing Family Hauling knows it’s a dangerous and unpredictable universe and has established several protocols to protect both you and our client’s cargo. To ensure you aren’t punished for circumstances outside of your control, total payment will be prorated to the percentage of cargo successfully delivered. A delivery timer will be set for each haul. Any cargo that remains undelivered upon its expiration will be flagged as stolen and treated as such. All pick-ups and deliveries must be autoloaded or done at a freight elevator.\n\n== Stats ==\nReputation XP: +200
LingFamily_RecoverCargo_VeryHard_Title=Delivery of Abandoned Ling Cargo [200 XP]
LingFamily_UGF_collect_desc_001=Hey,\n\nWe need you to grab a delivery for us over at <EM4>~mission(Location|Address)</EM4> and then take it to <EM4>~mission(Destination|Address)</EM4>.\n\nI was originally going to send my brother Ricki to handle this, but he said the area’s too dangerous. Guess there’s been a bunch of security warnings around there, but as long as you’re careful and bring some guns or whatever, I’m sure you’ll be fine. You probably won’t even run into anything. \n\nThanks, \nConni Ling\nShipment Coordinator\nLing Family Hauling\n\n\n== Stats ==\naUEC Reward: 45,000\nReputation XP: +500
LingFamily_UGF_collect_title_001=Package Delivery for Ling [500 XP]
LocalDelivery_DrugProd_desc_01=~mission(Contractor|LocalDeliveryDrugProdDesc)\n\n== Stats ==\naUEC Reward: 15,000\nReputation XP: +1,000
LocalDelivery_desc=~mission(Contractor|LocalDeliveryDesc)\n\n== Stats ==\naUEC Reward: 8,000
LocationRush_CFP_Mining_Description=Following the brutal attack on Pyro and our efforts to combat the vigilante group the Frontier Fighters, our strategic reserves across the system are at an all-time low. Citizens for Prosperity are eager to replenish our stocks before we reach a point of desperation. \n\nTo that end, we were hoping that you could resupply<EM4> ~mission(Destination|Address). </EM4>\n\nI leave it up to you to decide how best to procure and refine the resources, but the asteroid clusters near LaGrange points might be a good place to start mining.\n\nYour support of our efforts is much appreciated,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n\n== Stats ==\nTier 1: +400 XP (Failure: -190,500)\nTier 2: +2,400 XP (Failure: -190,500)
