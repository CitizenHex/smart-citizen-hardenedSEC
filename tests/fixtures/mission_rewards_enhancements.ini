BHG_Certification_Super_Desc=--------------------------------------------------------\n----------------- BOUNTY CONTRACT -----------------\n--------------------------------------------------------\n\nBOUNTY HUNTERS GUILD\nPROCESSING & DISTRIBUTION\n\nThe Bounty Hunters Guild has authorized an official bounty.\n\nNAME: ~mission(TargetName) \nSYSTEM: ~mission(System) \nRISK ASSESSMENT: Extreme\nLAST KNOWN LOCATION: ~mission(Location)\nKNOWN AFFILIATIONS: <None>\nNOTES: As acknowledgment of your expertise in the craft, the Bounty Hunters Guild would like to offer you the chance to earn a Master Tracker License.\n\nThis license would signify that you are qualified to track and apprehend Extreme-Risk Targets (ERT). These are criminals who travel in sub-capital ships with heavy escorts. This class of bounty only gets assigned to the most experienced of trackers.\n\nTo successfully complete this certification process, you must apprehend an ERT ranked criminal by the name of <EM4>~mission(TargetName)</EM4> last seen at <EM4>~mission(Location|Address)</EM4>.\n\n\nBOUNTY HUNTERS GUILD\nIn Pursuit of Justice\n\nThe Bounty Hunters Guild is a security service sanctioned by the Mercenary Guild and authorized to operate in both the UEE and beyond in accordance with Xenotrade Authority Acts.\n\n== Stats ==\nReputation XP: +50
BHG_Certification_Super_Title=Master Tracker License Certification [50 XP]
BHG_Certification_VeryEasy_Desc=--------------------------------------------------------\n----------------- BOUNTY CONTRACT -----------------\n--------------------------------------------------------\n\nBOUNTY HUNTERS GUILD\nPROCESSING & DISTRIBUTION\n\nThe Bounty Hunters Guild has authorized an official bounty.\n\nNAME: ~mission(TargetName) \nSYSTEM: ~mission(System)\nRISK ASSESSMENT: Very Low\nLAST KNOWN LOCATION: ~mission(Location)\nKNOWN AFFILIATIONS: <None>\nNOTES: Based on an assessment of your abilities, the Bounty Hunters Guild would like to offer you the chance to earn your Tracker Training Permit.\n\nThis permit would signify that you are qualified to track and apprehend Very Low-Risk Targets (VLRT). These criminals traditionally fly smaller ships and rarely have more than one escort. Ideal for Bounty Hunters who are just starting out.\n\nTo successfully complete this certification process, you must apprehend a VLRT ranked criminal by the name of <EM4>~mission(TargetName)</EM4> last seen at <EM4>~mission(Location|Address)</EM4>.\n\n\nBOUNTY HUNTERS GUILD\nIn Pursuit of Justice\n\nThe Bounty Hunters Guild is a security service sanctioned by the Mercenary Guild and authorized to operate in both the UEE and beyond in accordance with Xenotrade Authority Acts.\n\n== Stats ==\nReputation XP: +50
BHG_Certification_VeryEasy_Title=Tracker Training Permit Certification [50 XP]
BHG_Certification_VeryHard_Desc=--------------------------------------------------------\n----------------- BOUNTY CONTRACT -----------------\n--------------------------------------------------------\n\nBOUNTY HUNTERS GUILD\nPROCESSING & DISTRIBUTION\n\nThe Bounty Hunters Guild has authorized an official bounty.\n\nNAME: ~mission(TargetName) \nSYSTEM: ~mission(System) \nRISK ASSESSMENT: Very High\nLAST KNOWN LOCATION: ~mission(Location)\nKNOWN AFFILIATIONS: <None>\nNOTES: With your proven track record, the Bounty Hunters Guild would like to offer you the chance to earn an Advanced Tracker License.\n\nThis license would signify that you are qualified to track and apprehend Very High-Risk Targets (VHRT). These criminals can travel in larger multicrew ships with heavy escorts. With multiple hostiles to deal with, encounters with these targets can often be lethal.\n\nTo successfully complete this certification process, you must apprehend a VHRT ranked criminal by the name of <EM4>~mission(TargetName)</EM4> last seen at <EM4>~mission(Location|Address)</EM4>.\n\n\nBOUNTY HUNTERS GUILD\nIn Pursuit of Justice\n\nThe Bounty Hunters Guild is a security service sanctioned by the Mercenary Guild and authorized to operate in both the UEE and beyond in accordance with Xenotrade Authority Acts.\n\n== Stats ==\nReputation XP: +50
BHG_Certification_VeryHard_Title=Advanced Tracker License Certification [50 XP]
BHG_ShipWaveAttack_DrawOutBoss_H_Desc_001=--------------------------------------------------------\n-------------- BOUNTY CONTRACT ---------------\n--------------------------------------------------------\n\nBOUNTY HUNTERS GUILD\nPROCESSING & DISTRIBUTION\n\nThe Bounty Hunters Guild has authorized an official bounty.\n\nNAME: ~mission(TargetName) \nRISK ASSESSMENT: High\nLAST KNOWN LOCATION:  ~mission(Location|Address)\nKNOWN AFFILIATIONS: Unknown\nNOTES: This particular target has proven very difficult to capture. They tend to remain hidden unless there is a big enough threat to demand their attention. That's why you and your support crew will need to take out enough of their underlings to catch their ire. Just stay put, take out any hostiles that show up, and the target should eventually show themselves.\n\n\nBOUNTY HUNTERS GUILD\nIn Pursuit of Justice\n\nThe Bounty Hunters Guild is a security service sanctioned by the Mercenary Guild and authorized to operate in both the UEE and beyond in accordance with Xenotrade Authority Acts.\n\n== Stats ==\nReputation XP: +200
BHG_ShipWaveAttack_DrawOutBoss_H_Title_001=Reclusive Bounty: ~mission(TargetName) | High Risk [200 XP]
BHG_ShipWaveAttack_DrawOutBoss_S_Desc_001=--------------------------------------------------------\n-------------- BOUNTY CONTRACT ---------------\n--------------------------------------------------------\n\nBOUNTY HUNTERS GUILD\nPROCESSING & DISTRIBUTION\n\nThe Bounty Hunters Guild has authorized an official bounty.\n\nNAME: ~mission(TargetName) \nRISK ASSESSMENT: Extreme\nLAST KNOWN LOCATION:  ~mission(Location|Address)\nKNOWN AFFILIATIONS: Unknown\nNOTES: This particular target has proven very difficult to capture. They tend to remain hidden unless there is a big enough threat to demand their attention. That's why you and your most trusted support fleet will need to take out enough of their underlings to force them to confront you. Just stay put, take out any hostiles that show up, and the target will eventually arrive in their capital ship.\n\n\nBOUNTY HUNTERS GUILD\nIn Pursuit of Justice\n\nThe Bounty Hunters Guild is a security service sanctioned by the Mercenary Guild and authorized to operate in both the UEE and beyond in accordance with Xenotrade Authority Acts.\n\n== Stats ==\nReputation XP: +300
BHG_ShipWaveAttack_DrawOutBoss_S_Title_001=Reclusive Bounty: ~mission(TargetName) | Extreme Risk [300 XP]
BHG_ShipWaveAttack_DrawOutBoss_VH_Desc_001=--------------------------------------------------------\n-------------- BOUNTY CONTRACT ---------------\n--------------------------------------------------------\n\nBOUNTY HUNTERS GUILD\nPROCESSING & DISTRIBUTION\n\nThe Bounty Hunters Guild has authorized an official bounty.\n\nNAME: ~mission(TargetName) \nRISK ASSESSMENT: Very High\nLAST KNOWN LOCATION:  ~mission(Location|Address)\nKNOWN AFFILIATIONS: Unknown\nNOTES: This particular target has proven very difficult to capture. They are seldom seen unless they are required to deal with a large enough threat personally. That's why you and your support crew will need to take out enough of their underlings to ensure they come to engage you. Just stay put, take out any hostiles that show up, and the target should eventually show themselves.\n\n\nBOUNTY HUNTERS GUILD\nIn Pursuit of Justice\n\nThe Bounty Hunters Guild is a security service sanctioned by the Mercenary Guild and authorized to operate in both the UEE and beyond in accordance with Xenotrade Authority Acts.\n\n== Stats ==\nReputation XP: +250
BHG_ShipWaveAttack_DrawOutBoss_VH_Title_001=Reclusive Bounty: ~mission(TargetName) | Very-High Risk [250 XP]
Bitzeroes_bombingrun_dc_desc_001=We’ve been trying to access some sensitive data over at ~mission(Location|Address) but there seems to only be one backdoor we can use. The issue is we need someone onsite to trigger it. And I really do mean trigger it.\n\nIf you can head over there and destroy part of their infrastructure, the emergency back up systems will kick online and we should be able to access everything we want. \n\nWish I could see the surprise look on the faces of the lowlifes running the place when it happens.\n\n-Bit Zeros\n\n\n== Stats ==\naUEC Reward: 20,500\nReputation XP: +500
Bitzeroes_bombingrun_dc_title_001=Up in Smoke [500 XP]
Bitzeroes_destroygen_locked_dc_desc_001=I need your help on a job, but I can’t get too detailed about the specifics. If that doesn’t work for you, than don’t worry about it.\n\nYou’re going to head to ~mission(Location|Address) and blow up a power generator for us. Now, they keep the gen locked up, so you’ll have to hunt down the access codes first. Thankfully, they typically keep copies of the code on datapads. (Thinks it’ll keep ‘em safe from being hacked.)\n\nYou get that generator destroyed, and it’ll be your bank account blowin’ up next.\n\n- Bit Zeros\n\n\n== Stats ==\naUEC Reward: 8,000\nReputation XP: +500
Bitzeroes_destroygen_locked_dc_title_001=Mandatory Black Out [500 XP]
Bitzeroes_destroyitem_dc_desc_001=I won’t go into the whole long boring story of why, but there are a few bits of ~mission(Location|Address) that we need destroyed. The important part is that I want to pay you a hefty chunk of credits to do it. I almost feel like you should be paying us for this because of how fun it’s going to be.\n\nDon’t even care how you get it done. Grenades, rocket launcher, day old Torpedo Burrito, it’s all the same to us.\n\n-Bit Zeros \n\n\n== Stats ==\naUEC Reward: 16,750\nReputation XP: +500
Bitzeroes_destroyitem_dc_title_001=Major Malfunction [500 XP]
Bitzeroes_destroyservers_locked_dc_desc_001=Hey,\n\nGot a problem we could use your help on. One of our former new-recruits did a complete crap job on a hack and wound up leaving a digital footprint so messy that it might as well be a full confession. \n\nA remote deletion’s not going to be good enough so I want you to go to ~mission(Location|Address) and make sure their data servers are wiped from existence.\n\nAs if this wasn’t a big enough of a mess already, the access codes to the locked server room door are only stored physically on site. That means you’re going to have to liberate a datapad with the code on it first before you can even get close to them.\n\nDon’t worry though. I’ll make sure the creds are worth all the hassle.  \n\n- Bit Zeros\n\n\n== Stats ==\naUEC Reward: 41,000\nReputation XP: +1,000
Bitzeroes_destroyservers_locked_dc_title_001=Server Not Found [1,000 XP]
Bitzeroes_destroystash_dc_desc_001=The muckers over at ~mission(Location|Address) decided that it would be a good idea to interfere with our business, and now we need to let them know unequivocally that they were mistaken. \n\nA little bit of sniffin’ through their data and we were able to sus out where the idiots keep their stash. Now all we need you to do is head over there and destroy every last bit of it. \n\nFigure that should drive the point home.\n\n- Bit Zeros\n\n\n== Stats ==\naUEC Reward: 34,000\nReputation XP: +500
Bitzeroes_destroystash_dc_title_001=Hit 'Em Where it Hurts [500 XP]
Bitzeroes_eliminateall_dc_desc_001=The slimy little cretins over at ~mission(Location|Address) have been selling us trash data all while trying to double deal. Can’t let it stand.\n\nWe want you to go teach them one final lesson and wipe out all the cowards you can find. Last I heard is they were holed up over near the ~mission(Location). \n\nSpill their blood, and we’ll fill your wallet. \n\n-Bit Zeros\n\n\n== Stats ==\naUEC Reward: 55,000\nReputation XP: +1,000
Bitzeroes_eliminateall_dc_title_001=Permanently Delete [1,000 XP]
Bitzeroes_theft_dc_desc_001=All right,\n\nOver at ~mission(Location|Address) there a few certain things they have in their possession that need to be liberated. Sure there may be a few guards or concerned individuals you’ll have to deal with, but for the most part it’s a relatively straight forward transaction – grab the stuff from the ~mission(Location) and take it to us at ~mission(Destination|Address). \n\nSometimes simple is best.\n\n-Bit Zeros \n\n\n== Stats ==\naUEC Reward: 34,000\nReputation XP: +1,000
Bitzeroes_theft_dc_title_001=Ownership Reassignment [1,000 XP]
Bitzeroes_theft_mines_dc_desc_001=I’m really hoping you’re going to agree to do this since there doesn’t seem to be too many folks eager to take on a whole bunch of proximity mines. See, there’s a score that we’ve sourced at ~mission(Location|Address) but the physical security is proving more difficult than expected. \n\nIf you can find a way to navigate through the mines or possibly a way to trigger them remotely, it should be relatively easy to grab the goods and make your way out of there. Drop them off at ~mission(Destination|Address) and you’ll get more than your fair cut of the credits for taking on the risk.\n\n-Bit Zeros\n\n\n== Stats ==\naUEC Reward: 34,000
BlockadeRunner_Desc=*FOR IMMEDIATE SYSTEM-WIDE RELEASE*\n\nA hostile fleet of ships equipped with quantum jammers have created a blockade around  ~mission(Location|address), disabled the station's defensive turrets, and stolen a large supply of Zeta-Prolanide. In response, the CDF has received authorization to activate its volunteer force. \n\nThough the overall situation is dire, the theft of the Zeta-Prolanide is our priority. Without direct action, the loss of the sector's Zeta-Prolanide stores could have a devastating effects to the wider economy of the whole system. \n\nWhile local security forces are investigating the incursion, they've tracked the stolen inventory to several locations. CDF volunteers are tasked with heading to these locations, recovering the stolen Zeta-Prolanide, and transferring it back to the station before the material completely degrades and is no longer viable. Just be careful, intel suggests that larger clusters of Zeta-Prolanide have a higher outlaw presence.\n\nSince time is of the essence, having a tractor beam to assist in moving the cargo is highly advised.\n\nAs an added incentive, volunteers will receive regular bonus payments for their combined efforts.\n\n== Stats ==\naUEC Reward: 25,000\nReputation XP: +1,000
BlockadeRunner_Title=CDF ALERT: ~mission(Location) Blockade Runners Needed [1,000 XP]
CFP_Delivery_OutpostToStation_desc_001=Hey,\n\nGot word that folks are waiting for an important supply shipment that hasn’t arrived. We thought maybe it had been destroyed but turns out that it accidently got taken to the wrong place. While we look into how the mistake happened, we need someone to head over to <EM4>~mission(Location|Address)</EM4> to pick up package <EM4>#~mission(item1|SerialNumber)</EM4> and deliver it to the correct location at <EM4>~mission(Destination|Address)</EM4>.\n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you. \n\nYou available for the run?\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +50
CFP_Delivery_OutpostToStation_title_001=Rectify Delivery Error [50 XP]
CFP_Delivery_OutpostToTradepost_MultiToSingle_desc_001=Hi,\n\nAll the hard work the volunteers at Citizens for Prosperity have been doing is starting to pay off. Not only have we established outposts to house and protect people looking for a peaceful life, but our goal of making each outpost prosperous in their own right is coming to fruition.\n\nThere’s a handful of outposts that have produced some valuable commodities that are ready for pick up and delivery to <EM4>~mission(Destination|Address)</EM4>. Any chance you could swing by the outposts to grab the goods?\n\nHere’s where everything needs to be picked up from: \n\nPick up package <EM4>#~mission(Item1|SerialNumber)</EM4> at <EM4>~mission(Location|Address)</EM4>.\nPick up package <EM4>#~mission(Item4|SerialNumber)</EM4> at <EM4>~mission(Location|Address)</EM4>.\nPick up package <EM4>#~mission(Item5|SerialNumber)</EM4> at <EM4>~mission(Location1|Address)</EM4>.\nPick up package <EM4>#~mission(Item2|SerialNumber)</EM4> at <EM4>~mission(Location1|Address)</EM4>.\nPick up package <EM4>#~mission(Item3|SerialNumber)</EM4> at <EM4>~mission(Location2|Address)</EM4>.\n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you. \n\nAs always, thanks for your help making this system a little brighter.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +1,500
CFP_Delivery_OutpostToTradepost_MultiToSingle_title_001=Multiple Pick-Up Delivery [1,500 XP]
CFP_Delivery_OutpostToTradepost_desc_001=Hey,\n\nJust got word that <EM4>~mission(Location|Address)</EM4> has finished sorting and packing a few boxes of goods. Next step is for us to get them over to <EM4>~mission(Destination|Address)</EM4>. \n\nGetting these goods sold will support CFP operations and show folks that good, honest work is possible in this system. You available for the run? \n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you. \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nTier 1: +200 XP\nTier 2: +400 XP\nTier 3: +800 XP
CFP_Delivery_OutpostToTradepost_title_001=Delivery for ~mission(Destination) Ready [200–800 XP]
CFP_Delivery_OutpostToXSOutpost_desc_001=Hey, \n\nSome CFP members have put together a little care package for some folks living at <EM4>~mission(Location|Address)</EM4>. Unfortunately, they got called away before they could drop it off. Feel like handling this one for us?    \n\nThe remote outpost isn’t too far away from the main outpost. Guess you could walk it, if you really want, but driving or flying it there would be a lot faster. Your choice.\n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you. \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +25
CFP_Delivery_OutpostToXSOutpost_title_001=Remote Outpost Run [25 XP]
CFP_Delivery_Outpost_MultiToSingle_desc_001=Hi, \n\nWe’re a little shorthanded at one of our outposts and could use some help. We need someone to gather supplies spread across a few buildings and bring them to one spot.\n\nHere’s what needs to be gathered:\n\nPick up package <EM4>#~mission(Item1|SerialNumber)</EM4> at <EM4>~mission(Location|Address)</EM4>.\nPick up package <EM4>#~mission(Item4|SerialNumber)</EM4> at <EM4>~mission(Location|Address)</EM4>.\nPick up package <EM4>#~mission(Item5|SerialNumber)</EM4> at <EM4>~mission(Location1|Address)</EM4>.\nPick up package <EM4>#~mission(Item2|SerialNumber)</EM4> at <EM4>~mission(Location1|Address)</EM4>.\nPick up package <EM4>#~mission(Item3|SerialNumber)</EM4> at <EM4>~mission(Location2|Address)</EM4>.\n  \nEach one needs to end up at <EM4>~mission(Destination|Address)</EM4>. Simple enough, right?\n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you. \n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +800
CFP_Delivery_Outpost_MultiToSingle_title_001=Gather Supplies Across Outpost [800 XP]
CFP_Delivery_Outpost_Multi_desc_001=Hi,\n\nCitizens for Prosperity needs help moving supplies around one of our outposts. The boxes need to be picked up from <EM4>~mission(Location|Address)</EM4> and taken to <EM4>~mission(Destination|Address)</EM4>. \n\nDoesn’t sound too difficult, does it? Just make sure you’re wearing a comfy pair of shoes. Also, to make your life easier, I'd bring a <EM4>handheld tractor beam</EM4> with you. \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nTier 1: +200 XP\nTier 2: +400 XP\nTier 3: +800 XP
CFP_Delivery_Outpost_Multi_title_001=Inter-Outpost Delivery at ~mission(Destination) - Multiple Boxes [200–800 XP]
CFP_Delivery_Outpost_SingleToMulti_desc_001=Hey,\n\nWe need someone to make a couple runs if you’re interested. Some important supplies need to be distributed across ~mission(Location). Here are the details. \n\nEverything needs to be picked up from <EM4>~mission(Location|Address)</EM4> then distributed to the following spots: \n\nPackage <EM4>#~mission(Item1|SerialNumber)</EM4> to <EM4>~mission(Destination|Address)</EM4>.\nPackage <EM4>#~mission(Item4|SerialNumber)</EM4> to <EM4>~mission(Destination|Address)</EM4>.\nPackage <EM4>#~mission(Item5|SerialNumber)</EM4> to <EM4>~mission(Destination1|Address)</EM4>.\nPackage <EM4>#~mission(Item2|SerialNumber)</EM4> to <EM4>~mission(Destination1|Address)</EM4>.\nPackage <EM4>#~mission(Item3|SerialNumber)</EM4> to <EM4>~mission(Destination2|Address)</EM4>.\n\nShouldn’t be too difficult. Plus, it’ll give you the chance to familiarize yourself with the outpost and see all the good work the CFP is doing.\n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you. \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +800
CFP_Delivery_Outpost_SingleToMulti_title_001=Distribute Supplies Across ~mission(Destination) [800 XP]
CFP_Delivery_Outpost_desc_001=Hey,\n\nWe’ve got an opportunity for any haulers interested in lending a hand or two to Citizens for Prosperity.\n\nThere’s a box that needs to be moved from <EM4>~mission(Location|Address)</EM4> to <EM4>~mission(Destination|Address)</EM4>. Shouldn’t take long, if you’re around the outpost and available. \n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you. \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +50
CFP_Delivery_Outpost_title_001=Inter-Outpost Delivery at ~mission(Destination) [50 XP]
CFP_Delivery_StationToOutpost_desc_001=Hey, \n\nEvery once and awhile, Citizens for Prosperity likes to surprise members stationed at our outposts with a little gift to keep morale high. We’ve got the next box ready to go from <EM4>~mission(Location|Address)</EM4> to <EM4>~mission(Destination|Address)</EM4>, but need someone to make the delivery for us. Any interest in spreading some good cheer?\n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you. \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +50
CFP_Delivery_StationToOutpost_title_001=Deliver Good Cheer [50 XP]
CFP_Delivery_TradepostToOutpost_SingleToMulti_desc_001=Hi,\n\nKeeping Citizens for Prosperity outposts stocked with supplies is key to our mission in this system. Happy folks make happy homes. Can you help us deliver some much needed provisions to a few of them? \n\nEverything can be collected at <EM4>~mission(Location|Address)</EM4>. Then here’s the breakdown of where everything goes: \n\nPackage <EM4>#~mission(Item1|SerialNumber)</EM4> to <EM4>~mission(Destination|Address)</EM4>.\nPackage <EM4>#~mission(Item4|SerialNumber)</EM4> to <EM4>~mission(Destination|Address)</EM4>.\nPackage <EM4>#~mission(Item5|SerialNumber)</EM4> to <EM4>~mission(Destination1|Address)</EM4>.\nPackage <EM4>#~mission(Item2|SerialNumber)</EM4> to <EM4>~mission(Destination1|Address)</EM4>.\nPackage <EM4>#~mission(Item3|SerialNumber)</EM4> to <EM4>~mission(Destination2|Address)</EM4>.\n\nGreat way to make some creds and see a few of the CFP’s thriving outposts.\n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you. \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +1,500
CFP_Delivery_TradepostToOutpost_SingleToMulti_title_001=Multiple Drop-Off Delivery [1,500 XP]
CFP_Delivery_TradepostToOutpost_desc_001=Hi,\n\nIf we want regular people to move to this system, we need to show them that basic services are reliable. Making things like delivery runs dependable so people don’t think twice about them is exactly what the Citizens for Prosperity are here to do. Care to help us with this? \n\nThere’s a few boxes waiting at <EM4>~mission(Location|Address)</EM4> that need to get to <EM4>~mission(Destination|Address)</EM4>. Can you get those supplies to the outpost for us? This might be a simple supply run, but doing these consistently only strengthens our position in the system. \n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you. \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nTier 1: +200 XP\nTier 2: +400 XP\nTier 3: +800 XP
CFP_Delivery_TradepostToOutpost_title_001=Outpost Supply Run [200–800 XP]
CFP_Delivery_TradepostToTradepost_desc_001=Hi,\n\nIt’s incredible how many Citizens for Prosperity locations have started to thrive throughout the system. To sustain these locations, we need to be able to move important supplies between them. Got one such important run here, if you’re interested.  \n\nThere’s a few boxes of goods waiting at <EM4>~mission(Location|Address)</EM4> that need to cross the system to <EM4>~mission(Destination|Address)</EM4>. Could you move them for us and help us all build a better future?\n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you. \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +400
CFP_Delivery_TradepostToTradepost_title_001=Cross System Haul [400 XP]
CFP_MissingPerson_RetrieveStolenGoods_XT_H_desc_001=Hey, \n\nOne of our veteran haulers got sick and backed out of a run that we desperately needed. ~mission(TargetName) stepped up and offered to do it. I was hesitant to give it to ‘em because it’s riskier than the routes they normally do. Seems like my concern was warranted. Last update we got from ‘em was near ~mission(Location|Address), which is XenoThreat territory.\n\nCan’t have this hanging over my head much longer. Any chance you’d be willing to head to their last known location and see if you can find out what happened? It’d mean a lot to me and others. Not only to know the status of ~mission(TargetName) but also the cargo, which is really needed at ~mission(Destination|Address). If you find it and complete the delivery, it would be a huge help to the CFP members there.   \n\nFly safe out there,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +3,200
CFP_MissingPerson_RetrieveStolenGoods_XT_H_title_001=Find Missing Cargo Hauler [3,200 XP]
CFP_MissingPerson_Theft_Outpost_HH_H_desc_001=Hey,\n\nI’ve been tracking Headhunters activity at ~mission(Location|Address). Recently, they stocked it with supplies we believe were stolen from one of our cargo convoys. ~mission(TargetName) offered to go get our goods back but hasn’t checked in since. Really need to know what happened to them and if our supplies are there.\n\nThink this is something you could handle? You’ll probably have to deal with Headhunters forces to get to the bottom of this. Also, any goods you grab should go to ~mission(Destination|Address) once you’re out of there.\n\nThanks, \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +800
CFP_MissingPerson_Theft_Outpost_HH_H_title_001=Investigate Headhunters Outpost [800 XP]
CFP_MissingPerson_Theft_Outpost_XT_VH_desc_001=Hey,\n\nWondering if you can help me. I’ve lost touch with a dedicated CFP volunteer named ~mission(TargetName) who was tracking down supplies taken by XenoThreat. Their last comm said they believed our stuff was being held at ~mission(Location|Address). I told them to be careful, but haven’t heard anything since.\n\nAny chance you can head out and try to locate ~mission(TargetName|First)? While there, if you spot the supplies, please bring them to ~mission(Destination|Address). I’ll give you the same warning I gave ~mission(TargetName|First), that spot is a known Xeno stronghold. Better be prepared. Would hate for you to disappear too after visiting that spot. \n\nBe Safe, \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +1,500
CFP_MissingPerson_Theft_Outpost_XT_VH_title_001=Find ~mission(TargetName) and Missing Supplies [1,500 XP]
CFP_MissingPerson_Theft_XSOutpost_XT_H_desc_001=Hi,\n\nGot a tough assignment here. There’s a small, satellite outpost near ~mission(Location|Address) that needs to be investigated. I received intel that it’s housing some of our stolen supplies and sent ~mission(TargetName) to retrieve them. Haven’t heard anything from them in a while and am worried they ran into trouble.\n\nXenoThreat controls that location, but I hoped ~mission(TargetName|First) could slip in and out without getting noticed. Seems like that spot might be more heavily guarded than expected. Looking for someone to take a look and see what happened to ~mission(TargetName|First). Also, if any of our supplies are found there, I need them taken to ~mission(Destination|Address). \n\nDo you think you can give it a shot? I’m guessing that the Xenos are entrenched there. Prepare accordingly and don’t expect them to make this easy on you.  \n\nThanks, \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +800
CFP_MissingPerson_Theft_XSOutpost_XT_H_title_001=Search a XenoThreat Remote Outpost [800 XP]
CFP_RecoverCargo_Easy_Description=Life is tough on the frontier, and every delivery to our settlers is important. We really can't afford to lose any more this year.\n\nOne of our key suppliers has been hit by a group of outlaws over at <EM4>~mission(Location|Address)</EM4> and gone silent on us. I fear the worst, but if we can still recover the supplies they were transporting, it could make a huge difference.\n\nChances are the outlaws who attacked them are still lurking around there so be on your guard. Once you've dealt with them, grab the cargo and take it to the freight elevator at <EM4>~mission(Destination|Address)</EM4>. Make sure you're flying a ship that can carry <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> and bring a <EM4>heavy-duty tractor beam</EM4> too.\n\nFly safe out there,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- C54 SMG\n- C54 SMG Magazine (50 cap)\n- G-2 Helmet Woodland\n- ORC-mkV Arms\n- ORC-mkV Core\n- ORC-mkV Legs\n- ORC-mkX Arms Woodland\n- ORC-mkX Core Woodland\n- ORC-mkX Helmet Woodland\n- ORC-mkX Legs Woodland\n- P8-SC SMG\n- P8-SC SMG Magazine (45 cap)\n- S71 Rifle\n- S71 Rifle Magazine (30 cap)\n\n== Stats ==\nReputation XP: +100
CFP_RecoverCargo_Easy_Title=Intercepted Supply Run <EM4>[BP]</EM4> [100 XP]
CFP_RecoverCargo_Hard_Description=We were in the process of delivering an urgent shipment to the folks over at <EM4>~mission(Destination|Address)</EM4> when our pilot ran into a group of outlaws. They tried to run, but it was already too late.\n\nThere is silver lining though. The trackers are showing the cargo is still intact, located at <EM4>~mission(Location|Address)</EM4>. There's a good chance the outlaws are guarding it while they locate a ship big enough to transport everything. While I don't want to risk losing another pilot, the need of the cargo aboard is desperate enough that it justifies the decision to send someone to recover it.\n\nThis won't be easy, these outlaws showed our pilot no mercy. You'll need to take them out first before getting the cargo back. Bring a ship that can store <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> and a <EM4>heavy-duty tractor beam</EM4> for the moving. Deliver it to the freight elevator at <EM4>~mission(Destination)</EM4>  and let's make this right.\n\nFly safe,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- C54 SMG\n- C54 SMG Magazine (50 cap)\n- G-2 Helmet Woodland\n- ORC-mkV Arms\n- ORC-mkV Core\n- ORC-mkV Legs\n- ORC-mkX Arms Woodland\n- ORC-mkX Core Woodland\n- ORC-mkX Helmet Woodland\n- ORC-mkX Legs Woodland\n- P8-SC SMG\n- P8-SC SMG Magazine (45 cap)\n- S71 Rifle\n- S71 Rifle Magazine (30 cap)\n\n== Stats ==\nReputation XP: +200
CFP_RecoverCargo_Hard_Title=Crucial Supplies Need Retrieving <EM4>[BP]</EM4> [200 XP]
CFP_RecoverCargo_Medium_Description=A Citizens for Prosperity ship has been ambushed by a group of outlaws over at <EM4>~mission(Location|Address)</EM4> and we need a skilled pilot to help them out.\n\nWe lost contact with them mid comms, but it sounded like they were taking heavy fire. It may be too late for them, but the vital supplies they were carrying could still be put to good use. Fly over there, take out any hostiles, and recover the shipment. You'll need a ship that can support <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> and a <EM4>heavy-duty tractor beam</EM4> to transport the supplies onto your ship.\n\nTake them to the freight elevator at <EM4>~mission(Destination|Address)</EM4> and I'll guarantee they'll be put to good use.\n\nBe safe out there,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- C54 SMG\n- C54 SMG Magazine (50 cap)\n- G-2 Helmet Woodland\n- ORC-mkV Arms\n- ORC-mkV Core\n- ORC-mkV Legs\n- ORC-mkX Arms Woodland\n- ORC-mkX Core Woodland\n- ORC-mkX Helmet Woodland\n- ORC-mkX Legs Woodland\n- P8-SC SMG\n- P8-SC SMG Magazine (45 cap)\n- S71 Rifle\n- S71 Rifle Magazine (30 cap)\n\n== Stats ==\nReputation XP: +150
CFP_RecoverCargo_Medium_Title=Recovering Valuable Supplies <EM4>[BP]</EM4> [150 XP]
CFP_RecoverCargo_Super_Description=I wouldn't normally ask someone to do something so risky, but these are exceptional circumstances.\n\nOur pilot was transporting some vital cargo when they were targeted by a group of outlaws. Under no circumstances can we allow them to get their hands on the cargo.\n\nWith the size of the hostile force who attacked, you won't be able to do this on your own, you'll need to bring a skilled crew with you to  <EM4>~mission(Location|Address)</EM4> in order to  take out these outlaws and get the cargo back. Make sure at least one of you has a ship that can store <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> and a <EM4>heavy-duty tractor beam</EM4>.\n\nIf by some miracle you can get that cargo back, take it to the freight elevator located at <EM4>~mission(Destination|Address)</EM4>.\n\nIt's a lot to ask, but if you can pull this off you'll have my and the whole organizations appreciation.\n\nBest of luck,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- C54 SMG\n- C54 SMG Magazine (50 cap)\n- G-2 Helmet Woodland\n- ORC-mkV Arms\n- ORC-mkV Core\n- ORC-mkV Legs\n- ORC-mkX Arms Woodland\n- ORC-mkX Core Woodland\n- ORC-mkX Helmet Woodland\n- ORC-mkX Legs Woodland\n- P8-SC SMG\n- P8-SC SMG Magazine (45 cap)\n- S71 Rifle\n- S71 Rifle Magazine (30 cap)\n\n== Stats ==\nReputation XP: +300
CFP_RecoverCargo_Super_Title=Special Recovery Operation <EM4>[BP]</EM4> [300 XP]
CFP_RecoverCargo_VeryHard_Description=More and more CFP ships are being targeted lately, and despite our best efforts to keep our trading routes quiet, we're still losing haulers to outlaw attacks.\n\nOur pilot over at <EM4>~mission(Location|Address)</EM4> is the latest casualty. It pains me to think about how much we've lost, but as long as there are people who need our help, we have to keep on fighting.\n\nIf you have a ship that can carry <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> and a <EM4>heavy-duty tractor beam</EM4>, we need you to head to the above location and recover that cargo.\n\nThis won't be easy, the pilot was one of our best and wouldn't go down without a fight. Let's not underestimate these outlaws, bring a trustworthy crew and watch each other's backs.\n\nOnce you've got the cargo, deliver it to the freight elevator at <EM4>~mission(Destination|Address)</EM4> and I'll get it processed.\n\nGood luck and take care,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n<EM4>Potential Blueprints</EM4>\n- C54 SMG\n- C54 SMG Magazine (50 cap)\n- G-2 Helmet Woodland\n- ORC-mkV Arms\n- ORC-mkV Core\n- ORC-mkV Legs\n- ORC-mkX Arms Woodland\n- ORC-mkX Core Woodland\n- ORC-mkX Helmet Woodland\n- ORC-mkX Legs Woodland\n- P8-SC SMG\n- P8-SC SMG Magazine (45 cap)\n- S71 Rifle\n- S71 Rifle Magazine (30 cap)\n\n== Stats ==\nReputation XP: +200
CFP_RecoverCargo_VeryHard_Title=Cargo Shipment Must Be Completed <EM4>[BP]</EM4> [200 XP]
CFP_RetrieveCargo_AsteroidBase_E_desc_001=Hey,\n\nOutlaws have been targeting CFP supply caches and we’re sick of it. We started hiding trackers in the cargo containers and some just got lifted and taken to ~mission(Location|Address).\n\nCan you head there, get back what’s ours, and then take it to ~mission(Destination|Address)?\n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you. \n\nThanks, \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +200
CFP_RetrieveCargo_AsteroidBase_E_title_001=Return Stolen Supplies [200 XP]
CFP_RetrieveCargo_AsteroidBase_VE_desc_001=Hi,\n\nSomeone knocked out one of our supply ships and towed it to ~mission(Location|Address). We really need the cargo onboard. You available to head over there and recover that cargo? \n\nOnce you’ve got the goods, we need them taken to their original destination at ~mission(Destination|Address). Did a little digging into this group, and let’s just say, they don’t come off as very professional. Shouldn’t give you too much resistance, but still best to show up ready to throw down.\n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you. \n\nFly Safe, \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nTier 1: +25 XP\nTier 2: +100 XP
CFP_RetrieveCargo_AsteroidBase_VE_title_001=Recover Cargo [25–100 XP]
CFP_RetrieveCargo_CrimBase_H_desc_001=Hey,\n\nOutlaws in the system have been getting aggressive lately, targeting more of our convoys. They recently ambushed one of our cargo ships and stole supplies desperately needed by our operations. If we don’t get it back, we’re worried that the locals will start losing faith. They need to know that Citizens for Prosperity can’t just be bullied out of operation.\n\nWe managed to track the outlaws to ~mission(Location|Address). Now we need someone who isn’t afraid of crossing these criminals to recover the shipment and deliver it to ~mission(Destination|Address). \n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you. \n\nSo, do you think you could make the run for us?\n\nThanks,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +1,200
CFP_RetrieveCargo_CrimBase_H_title_001=Raid to Recover Supplies [1,200 XP]
CFP_RetrieveCargo_CrimBase_M_desc_001=Hey,\n\nOutlaws used a fake distress beacon to lure one of our cargo ships into a trap and steal the supplies onboard. Thankfully, we placed trackers in the cargo containers, because the stuff is valuable mining and construction materials needed at ~mission(Destination). \n\nLooks like the goods ended up at ~mission(Location|Address). Need someone to head there, reclaim the supplies, and take them to ~mission(Destination|Address). Doubt they’ll make it easy for you, but if it helps, they didn’t show any mercy to our ship crew. Reclaiming those supplies will not only help the CFP but ensure that our crew didn’t die in vain.   \n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you. \n\nThanks,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +150
CFP_RetrieveCargo_CrimBase_M_title_001=Reclaim Stolen Cargo [150 XP]
CFP_RetrieveCargo_CrimBase_XT_VH_desc_001=Hey,\n\nOne of our supply ships fell prey to a XenoThreat ambush. I’ll spare you the grisly details, but all that really remains is the cargo our people were carrying to ~mission(Destination|Address). Trackers hidden within the cargo shows that XenoThreat collected the goods and then took them to a few locations spread out across ~mission(Location|Address).\n \nWe can’t let the XenoThreat get away with what they did to our crew and keep all those goods too. That’s why we want to strike back on both fronts. We need someone who can raid that location, retrieve the stolen cargo, and teach the Xenos that there will be consequences for their horrendous actions. Can you help us fight back?\n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you. \n\nThanks,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity \n\n\n== Stats ==\nReputation XP: +2,400
CFP_RetrieveCargo_CrimBase_XT_VH_title_001=Regain Supplies from XenoThreat [2,400 XP]
CFP_RetrieveCargo_DerelictOutpost_E_desc_001=Hi,\n\nBunch of basic goods needed at ~mission(Destination|Address) were stolen while in transit. Got a tip that the supplies were taken to ~mission(Location|Address). Can you head there and reclaim them for us? \n\nThe place is allegedly abandoned, but looks can be deceiving. My advice, prepare for the worst but hope for the best. \n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you. \n\nThanks,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +150
CFP_RetrieveCargo_DerelictOutpost_E_title_001=Search Outpost for Our Supplies [150 XP]
CFP_RetrieveCargo_Lagrange_E_desc_001=Hi,\n\nIt appears an electrical issue caused us to lose track of a ~mission(Ship) carrying medical supplies. Thankfully, I received word that the ship was found at ~mission(Location|Address). We really need someone to get out there and recover the supplies onboard before someone else does. Those provisions are desperately needed at ~mission(Destination|Address). Any chance you could grab them and complete the delivery? \n\nMakes me nervous seeing that the ship is at a lagrange point. Lots of folks scour them for stuff like this. Would be smart to come prepared to defend yourself if someone else comes looking to steal it.\n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you.    \n\nThanks,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +25
CFP_RetrieveCargo_Lagrange_E_title_001=Retrieve Supplies [25 XP]
CFP_RetrieveCargo_Lagrange_M_desc_001=Hey,\n\nI’m concerned a ~mission(Ship) moving medical supplies for us might’ve come under attack. The signal was lost around ~mission(Location|Address), which has seen a spike in outlaw activity recently. Losing that ship alone would be bad enough, but it’ll be even worse if those supplies don’t make it to ~mission(Destination). \n\nWe would need you to search for the ship at its last known position, recover the supplies, and then take them to ~mission(Destination|Address). Your help would make a bad situation better. \n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you. \n\nThanks,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +150
CFP_RetrieveCargo_Lagrange_M_title_001=Find Lost Supply Ship [150 XP]
CFP_RetrieveCargo_OccuCave_HH_M_desc_001=Hi,\n\nOur intel team intercepted a comm between Headhunters talking about how they stocked ~mission(Location|Address) with cargo stolen from us. Asked around about that cave and it’s been a known Headhunters cache for decades. Always seems to be staffed by grunts too. \n\nKnow it’s risky but we really need to take our cargo back. You up for raiding that cave?\n\nDo whatever you need to get our supplies back and then take them to ~mission(Destination|Address).\n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you. \n\nThanks, \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +50
CFP_RetrieveCargo_OccuCave_HH_M_title_001=Raid Headhunters Cave [50 XP]
CFP_RetrieveCargo_OccuCave_M_desc_001=Hey,\n\nSome desperate crew raided one of our outposts and ran off with a bunch of essential supplies. A CFP member tracked them to ~mission(Location|Address) but didn’t have the right gear or training to raid the cave themselves. Better that we hire a skilled and well-prepared professional to take care of it for us. \n\nHere’s some other important intel you should know before taking the job. This crew seems to be based out of that cave and not just using it as a dead drop, so I’d expect that you’ll have to deal with them to get to the cargo. Next, you can bring everything you recover to ~mission(Destination|Address).\n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you. \n\nBe Safe,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +50
CFP_RetrieveCargo_OccuCave_M_title_001=Search Cave for Our Supplies [50 XP]
CFP_RetrieveCargo_Outpost_HH_M_desc_001=Hey,\n\nI’ve been hustling to track down what happened to a bunch of important supplies stolen from a CFP outpost. As I suspected, they were taken by the Headhunters who currently have them stashed at ~mission(Location|Address). \n\nMy source also warned me that they might be moving the supplies to a more secure location soon. Feels like our window of getting them back is closing fast. Can you head over to that outpost and reclaim them before they disappear again?\n\nClearly, it’s a risky op but I wouldn’t be asking if those supplies weren’t important. Secure them and then bring them to ~mission(Destination|Address).\n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you. \n\nBe safe out there, \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +600
CFP_RetrieveCargo_Outpost_HH_M_title_001=Raid Headhunters Outpost [600 XP]
CFP_RetrieveCargo_XSOutpost_HH_E_desc_001=Hi,\n\nWe’ve got a CFP team monitoring Headhunter activity at ~mission(Location|Address). They let me know a batch of recently stolen CFP supplies were moved into it. Since there’s fewer defenses and personnel there, it feels like a good spot to strike and get our goods back. Interested?    \n\nDo this right and the bigger outpost won’t know until it’s too late. Get in, get the goods, and then bring them to ~mission(Destination|Address). Sound like a plan?\n\nAlso, to make your life easier, I'd make sure you have a <EM4>handheld tractor beam</EM4> with you. \n\nFly safe out there,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +150
CFP_RetrieveCargo_XSOutpost_HH_E_title_001=Get Supplies from Remote Outpost [150 XP]
CFP_SabotageRelays_HH_001_Desc=Violence is never our first choice, but sometimes it must be used as a preventative measure.\n\nWe’re planning a strike on a Headhunter controlled outpost and need your help.\n\nWe need to make sure that if something goes wrong they won’t be able to call for backup and escalate the situation. That’s where you come in. We need you to head over to <EM4>~mission(Location|Address)</EM4> and disable the communication towers. There should be a <EM4>control panel located at the top</EM4> of each tower that you can use to deactivate them.\n\nIf you’re able to do this, Citizens for Prosperity will be able to gain some vital ground in Pyro.\n\nIt’s also worth keeping in mind for future contracts that you can choose to take out the comms towers instead of risking a fight with reinforcement dropships.\n\nStay alert and stay safe.\n\nThank you,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +75
CFP_SabotageRelays_HH_001_Title=Disable Headhunter Comm Towers [75 XP]
CFP_SabotageRelays_XT_001_Desc=Citizens for Prosperity are eager to help the people of Pyro, and it starts with freeing them from the grasp of XenoThreat.\n\nWe’re preparing a team to infiltrate one of their outposts, but we need someone to go in ahead to take out their communication towers first. Once those towers are offline, they won’t be able to call for reinforcements and we can proceed with our plan.\n\nHead to <EM4>~mission(Location|Address)</EM4> and find the towers. At the <EM4>top is a control panel</EM4> that can be used to disable them.\n\nAlso, it’s worth noting that most outposts use a similar system, so you’ll know how to disable the comms towers rather than risk fighting reinforcement dropships when you’re doing other jobs.\n\nGood luck,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +100
CFP_SabotageRelays_XT_001_Title=Shutdown Xenothreat Comm Towers [100 XP]
CFP_Salvage_FPS_desc_001=Hi,\n\nA repair crew has been making some much needed changes and upgrades to our outposts. After finishing some work at ~mission(Location|Address), they've set aside some scrap they didn’t have time to deal with. \n\nLooking to hire someone to go there and salvage it so it’s out of the way. Should be a quick clean up if you’re interested. Any RMC is yours to keep.\n\nThanks,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n\n== Stats ==\nReputation XP: +25
CFP_Salvage_FPS_title_001=Clear ~mission(Location) of Salvage [25 XP]
CFP_SecurityPatrol_E_Desc_001=We’ve noted an increase in traffic along one of the travel lanes we monitor. Chances are that we won’t be the only ones paying attention. I’d like you to head out there in a combat-ready ship and make sure there are no outlaws attempting to take advantage of this sense of security.\n\nOnce you’ve accepted this contract, make your way to the <EM4>location marker</EM4> on your HUD and scan the waypoints along the route. After all of them have been secured, the main contractor will get a bonus of <EM4>~mission(ScripAmount) MG Scrip.</EM4>\n\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n\n== Stats ==\nReputation XP: +100
CFP_SecurityPatrol_E_Title_001=Patrol Risky Travel Lanes [100 XP]
CFP_SecurityPatrol_H_Desc_001=We’ve identified a sector that’s been plagued by outlaw attacks recently and hopefully, with your help, we can change that. We’d suggest <EM4>bringing some backup</EM4> in combat-ready ships to confront any hostile forces you might encounter.\n\nOnce you’ve accepted this contract, make your way to the <EM4>location marker</EM4> on your HUD and scan the waypoints along the route. After all of them have been secured, the main contractor will get a bonus of <EM4>~mission(ScripAmount) MG Scrip.</EM4>\n\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n\n== Stats ==\nReputation XP: +200
CFP_SecurityPatrol_H_Title_001=Patrol Outlaw Hunting Grounds [200 XP]
CFP_SecurityPatrol_M_Desc_001=Outlaws have been increasing their activity along one of the more popular routes in the system and we’re hoping to provide a deterrent before the problem gets out of hand. As such, we’d like you to head out there in a combat-ready ship and deal with any hostiles you might encounter.\n\nOnce you’ve accepted this contract, make your way to the <EM4>location marker</EM4> on your HUD and scan the waypoints along the route. After all of them have been secured, the main contractor will get a bonus of <EM4>~mission(ScripAmount) MG Scrip.</EM4>\n\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n\n== Stats ==\nReputation XP: +150
CFP_SecurityPatrol_M_Title_001=Patrol Dangerous Travel Lanes [150 XP]
CFP_SecurityPatrol_S_Desc_001=After weeks of seeing crime rates increase, we’ve been able to identify a sector that we believe to be the source of the outlaw activity that has been leeching into the surrounding areas. While it would be too much to expect to eradicate all threats, we believe that by sending combat patrols into the area we might be able to start reversing this worrisome trend. Our in-house combat analysts recommend bringing around <EM4>three wingmen</EM4> in combat-ready ships to confront any hostile forces you might encounter.\n\nOnce you’ve accepted this contract, make your way to the <EM4>location marker</EM4> on your HUD and scan the waypoints along the route. After all of them have been secured, the main contractor will get a bonus of <EM4>~mission(ScripAmount) MG Scrip.</EM4>\n\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n\n== Stats ==\nReputation XP: +300
CFP_SecurityPatrol_S_Title_001=Patrol Extremely Dangerous Sector [300 XP]
CFP_SecurityPatrol_VE_Desc_001=We need someone with combat experience to patrol a travel lane for us. Over the years, we’ve found that it's good to get out there and make ourselves visible. Sometimes a pilot like yourself traveling through an area is enough to deter any potential outlaws. But in case you run into any that are feeling a bit more ambitious, a ship ready for combat is recommended.\n\nOnce you’ve accepted this contract, make your way to the <EM4>location marker</EM4> on your HUD. After you’ve scanned all the waypoints and ensured that the route is secure, the main contractor will get a bonus of <EM4>~mission(ScripAmount) MG Scrip.</EM4>\n\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n\n== Stats ==\nReputation XP: +100
CFP_SecurityPatrol_VE_Title_001=Patrol Travel Lanes [100 XP]
CFP_SecurityPatrol_VH_Desc_001=We’ve identified a sector that’s been increasingly riddled with outlaw attacks and we think that if we begin to actively patrol the area we can turn things around. We’d recommend gathering at least <EM4>two wingmen</EM4> to head out there in combat-ready ships and confront any hostile forces you might encounter.\n\nOnce you’ve accepted this contract, make your way to the <EM4>location marker</EM4> on your HUD and scan the waypoints along the route. After all of them have been secured, the main contractor will get a bonus of <EM4>~mission(ScripAmount) MG Scrip.</EM4>\n\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +250
CFP_SecurityPatrol_VH_Title_001=Patrol Dangerous Outlaw Sector [250 XP]
CFP_ShipWaveAttack_ClearHostiles_Desc_E_001=To help protect our pilots, Citizens for Prosperity will often recommend the use of less traditional routes through the system. However, it seems that a gang of outlaws has gotten word and has begun to stage repeated ambushes along one such flightpath. Rather than just go around the problem and risk it persisting along the new route, we feel it we be prudent to meet these outlaws head on.\n\nYou and whatever support ships you enlist will head to ~mission(Location|Address) and neutralize any hostiles you find laying in wait there. They have been known to operate in smaller packs, so it's vital that you wait until all of the hostiles have been dealt with.\n\nYour assistance is much appreciated,\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +100
CFP_ShipWaveAttack_ClearHostiles_Desc_H_001=A criminal fleet has taken up root in a sector that Citizens For Prosperity is trying to develop and all forward progress has stopped thanks to their violent actions. It is imperative to a long term goals that we find a way to neutralize this fleet before that cause any further damage.\n\nYou and your most trusted support ships will head to ~mission(Location|Address) and neutralize any hostiles you find laying in wait there. They have been known to operate in smaller packs, so it's vital that you wait until all of the hostiles have been dealt with.\n\nYour assistance is much appreciated,\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +200
CFP_ShipWaveAttack_ClearHostiles_Desc_M_001=It feels that whenever we start to make real progress in the system, the outlaws are there to push one step back. We had recently cleared out ~mission(Location|Address) only to learn that a new outlaw gang has taken root there, using it as a launching point for various criminal enterprises. \n\nSince we can't afford to let this rot spread, you and a few support ships are being charged with heading there to clear out all the gang's packs. After you deal with one pack, be sure to wait until all of the hostile packs have been dealt with.\n\nKnow that you are helping to make a real difference,\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +150
CFP_ShipWaveAttack_ClearHostiles_Desc_VE_001=Recently we've had incident reports of numerous Citizens for Prosperity contractors in the system having run-ins with an outlaw hunting party operating out of ~mission(Location|Address). \n\nTo help re-establish safer routes through that sector, you will be dispatched to head there and engage with these outlaws. The group is known to travel in smaller packs, so its important that you and whatever backup you bring wait in the area to deal with all of them or else there's a chance the threat will remain. \n\nThank you for helping us,\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +100
CFP_ShipWaveAttack_ClearHostiles_Title_E_001=Clear CFP Route of Hostiles [100 XP]
CFP_ShipWaveAttack_ClearHostiles_Title_H_001=Neutralize Dangerous Criminal Fleet [200 XP]
CFP_ShipWaveAttack_ClearHostiles_Title_M_001=Remove Upstart Gang From Sector [150 XP]
CFP_ShipWaveAttack_ClearHostiles_Title_VE_001=Help Deal with Outlaw Hunting Party [100 XP]
CFP_theft_Outpost_HH_M_desc_001=Hey,\n\nGet this. Headhunters raided one of our outposts and ran off with all the supplies. That’s left the folks there in a tough spot because it’s going to take a bit to get new goods to them. But a different plan came to mind that I hope you can help with. \n\nSee, we know the Headhunters have a bunch of their own supplies stashed at ~mission(Location|Address). Feels only fair that we go get them to replace the ones they took from us. I’m looking for someone who not only feels this is fair but is skilled enough to overcome whatever forces are there. When the good are in your hands, they need to go to ~mission(Destination|Address), so our folks there can keep that outpost up and running. \n\nThanks, \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +300
CFP_theft_Outpost_HH_M_title_001=Supplies For Supplies [300 XP]
CFP_theft_Outpost_XT_VH_desc_001=Hi,\n\nXenoThreat really has us in their crosshairs. Beefing up our defenses will help, but we can’t sit back and let them keep stealing our stuff. There’s too many CFP outposts that are already desperately low on goods.  \n\nThat’s why we need to be proactive in getting some goods back. One of our ops recently identified ~mission(Location|Address) as a spot where the Xenos store a lot of supplies. Considering the outpost’s location relative to attacks on our convoy and outposts, there’s got to be a fair share of our goods in there. \n\nThis isn’t an easy ask for many reasons, but we really need someone who can handle any Xenos at that spot and grab whatever cargo they can. Anything you acquire can be brought to ~mission(Destination|Address) where we’ll sort it and then send to our outposts that need it the most. \n\nThanks, \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +600
CFP_theft_Outpost_XT_VH_title_001=Return the Favor at XenoThreat Outpost [600 XP]
CFP_theft_XSOutpost_HH_M_desc_001=Hi, \n\nHeadhunters must be getting sick of us. I’ve noticed they’ve adjusted their strategy to target more of our supply convoys. Our ability to establish long-lasting security in this system will be based on the strength of supply chains, and the Headhunters know our outposts won’t survive unless they get a constant supply of goods. \n\nGoing to be honest with you. They’re plan is working. They’re knocking out supply convoys faster than we can get new goods into the system. The only way we’ll survive is by finding another supply source. Since they’re already taking so many of ours, I feel justified in taking some of theirs right back. \n\nThere’s one place in particular that I’ve had my eye on. It’s ~mission(Location|Address) that the Headhunter use to store goods. Need someone to go there, take care of any guards, grab whatever supplies they have, and then take them to ~mission(Destination|Address).\n\nThink you could help us with this?\n\nBe safe, \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +100
CFP_theft_XSOutpost_HH_M_title_001=Get Supplies from Headhunters Remote Outpost [100 XP]
CFP_theft_XSOutpost_XT_H_desc_001=Hey,\n\nXenoThreat just raided one of our convoys and made off with a bunch of supplies. I’m not sure exactly where they took them, but I know they have a cache of stolen cargo not too far away. If I had to guess, that’s exactly where they took them. \n\nThe spot is ~mission(Location|Address). Need someone to go there, grab the goods inside, and bring them to ~mission(Destination|Address). The outpost is a little ways away from their main operations hub. Normally, there’s fewer forces there than the main outpost, but don’t think this will be a walk in the park. Just be smart and prepared. \n\nBe safe, \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n== Stats ==\nReputation XP: +600
CFP_theft_XSOutpost_XT_H_title_001=Get Back at XenoThreat [600 XP]
Covalex_Delivery_Nyx_Medium_Desc_001=Hi,\n\nPretty straightforward this one - We've got a bunch of stuff that needs moving through Nyx and need a competent contractor with a <EM4>handheld tractor beam</EM4> and a ship that can carry <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>.\n\nDetails are attached. Good luck out there!\n\n~mission(Contractor|SignOff)\n\nElla Tieno\nJr. Logistics Coordinator\nCovalex Shipping\n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\nReputation XP: +100
Covalex_Delivery_Nyx_Medium_Title_001=Med. Distance Covalex Delivery Nyx [100 XP]
Covalex_Delivery_Stanton_Hard_Desc_001=Hi,\n\nNeed a reliable contractor to pick up some packages for us and deliver them to their destination.\n\nThis route is a longer one so make sure you have enough fuel and don't forget a <EM4>handheld tractor beam</EM4>.\n\nAnd not sure what you were planning on flying, but you'll need a ship that can transport <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>\n\n~mission(Contractor|SignOff)\n\nElla Tieno\nJr. Logistics Coordinator\nCovalex Shipping\n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\nReputation XP: +100
Covalex_Delivery_Stanton_Hard_Title_001=Long Distance Covalex Delivery Stanton [100 XP]
Covalex_Delivery_Stanton_Medium_Desc_001=Hi,\n\nLooking for a contractor with a ship that can carry <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> to run a delivery for us across Stanton.\n\nThis isn't a particularly long delivery route, but you will be moving between couple of different locations. To make sure things go smoothly, bring enough fuel and a <EM4>handheld tractor beam</EM4> to speed up moving the boxes.\n\n~mission(Contractor|SignOff)\n\nElla Tieno\nJr. Logistics Coordinator\nCovalex Shipping\n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\nReputation XP: +100
Covalex_Delivery_Stanton_Medium_Title_001=Med. Distance Covalex Delivery Stanton [100 XP]
Covalex_Delivery_Stanton_Super_Desc_001=Got a special assignment - Loads of packages ready to delivered across the system. Its a bit more than the usual so I'm only reaching out to my best contractors for this one.\n\nObviously, a part of that payment will be to cover your fuel because you'll be going super far with this one. You'll need all the usual as well like a <EM4>handheld tractor beam</EM4> and a ship with space to store <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>.\n\nGood luck. I'm counting on you.\n\n~mission(Contractor|SignOff)\n\nElla Tieno\nJr. Logistics Coordinator\nCovalex Shipping\n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\nReputation XP: +200
Covalex_Delivery_Stanton_Super_Title_001=Special Covalex Delivery Stanton System [200 XP]
Covalex_Delivery_Stanton_VeryHard_Desc_001=Hiya,\n\nCovalex requires a safe pair of hands to pick up some packages and get them where they need to go.\n\nDesignating this a long distance delivery so stock up on fuel and supplies. And definitely make sure you bring a <EM4>handheld tractor beam</EM4>.\n\nAs for what ship to bring, you'll also need something that can move <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>.\n\n~mission(Contractor|SignOff)\n\nElla Tieno\nJr. Logistics Coordinator\nCovalex Shipping\n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\nReputation XP: +150
Covalex_Delivery_Stanton_VeryHard_Title_001=Very Long Distance Covalex Delivery Stanton [150 XP]
Covalex_HaulCargo_AToB_Intro_desc=Earning such accolades as 'Imperial Finances' Top 10 Shipping Companies' and 'Delivery Digest's 2945's Most Trusted Transport,' Covalex is busier than ever. And that means more cargo going to more places. That's where you come in.  \n\nCovalex is looking for dependable and industrious pilots to join our expanding family. Do you have access to a ship that can hold <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>? Can you pass an Advocacy background check if required? Then a universe of opportunity is waiting for you. \n\nSimply complete an 'Evaluation Trial’ by picking up a shipment of <EM4>~mission(Item)</EM4> from a freight elevator at <EM4>~mission(Location|Address)</EM4> and successfully delivering it to a freight elevator at <EM4>~mission(Destination|Address)</EM4>.\n\nUpon satisfactory completion, you'll be eligible to become part of Covalex Shipping's vast network of independent transport specialists*.\n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\n*Covalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\naUEC Reward: 50,250\nReputation XP: +50
Covalex_HaulCargo_AToB_Intro_title=Opportunity for Independent Cargo Hauler [50 XP]
Covalex_HaulCargo_AToB_Rehire_desc=Hey,\n\nHave a bit of good news for you. Covalex recently finished an evaluation of our contractor pool, and decided to reconsider your status as a cargo hauler. To requalify, all you need is to successfully complete the following delivery.\n\nPick up <EM4>~mission(Item)</EM4> from a freight elevator at <EM4>~mission(Location|Address)</EM4> and deliver it to a freight elevator at <EM4>~mission(Destination|Address)</EM4>. In order to complete this haul in a fast and efficient manner, you'll need a ship that can haul <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>.\n\nHopefully everything goes smoothly so we can welcome you back to the team.\n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\naUEC Reward: 50,250\nReputation XP: +50
Covalex_HaulCargo_AToB_Rehire_title=Covalex Cargo Hauling Re-evaluation [50 XP]
Covalex_HaulCargo_AToB_Scrap=Hello,\n\nThere’s some junk waiting at a freight elevator in <EM4>~mission(Location|Address)</EM4> that needs to go to a freight elevator at <EM4>~mission(Destination|Address)</EM4> for processing. I've confirmed that the containers won't be bigger than <EM4>~mission(MissionMaxSCUSize)</EM4>. \n\nMy mom would’ve loved this run. She’s one of those who thinks every scrapyard is filled with hidden treasures. Can’t even tell you how many hours I spent bored out of my mind following her around one. If that’s your thing, here’s a chance to actually make credits going to one.\n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n \n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\naUEC Reward: 62,000\nReputation XP: +500
Covalex_HaulCargo_AToB_Stanton_Interstellar=Hey,\n\nAny interest in doing the Stanton leg of an interstellar run? \n\nThere’s a haul of <EM4>~mission(Item)</EM4> waiting in containers <EM4>~mission(MissionMaxSCUSize)</EM4> or smaller to be picked up from a freight elevator at <EM4>~mission(Location|Address)</EM4> and delivered to a freight elevator at <EM4>~mission(Destination|Address)</EM4>. No need to take it any further than that. I’ve got someone else lined up to run it through the jump to its final destination. \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\naUEC Reward: 128,000\nReputation XP: +2,000
Covalex_HaulCargo_AToB_title=~mission(ReputationRank) Rank - Direct ~mission(CargoGradeToken) Cargo Haul [500 XP]
Covalex_HaulCargo_AtoB_desc_ProcessedFood_Stanton2=Hi, \n\nLooks like Orison needs another resupply of processed food and pressurized ice. They have this stuff on a standard delivery schedule but they just requested a shipment as soon as possible.  \n\nAre you available to make the run? The stuff (<EM4>~mission(MissionMaxSCUSize) containers</EM4> or smaller) is waiting to be picked up from a freight elevator at <EM4>~mission(Location|Address)</EM4>. Should be a quick and easy run for you to a freight elevator at <EM4>~mission(Destination|Address)</EM4>. \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\naUEC Reward: 163,250\nReputation XP: +2,000
Covalex_HaulCargo_AtoB_desc_RawOre_Stanton1=Hey,\n\nA Hurston logistics manager just requested priority pick up from their facility. Sounds like they struck a new vein of ore and need to make room for what they're extracting.\n\nThe raw ore needs to be moved from a freight elevator at <EM4>~mission(Location|Address)</EM4> to a freight elevator at <EM4>~mission(Destination|Address)</EM4>. Will be containers <EM4>~mission(MissionMaxSCUSize)</EM4> or smaller. Sound like something you could handle? \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\naUEC Reward: 69,250\nReputation XP: +500
Covalex_HaulCargo_AtoB_desc_RefinedOre_Stanton4=Hi, \n\n<EM4>~mission(Destination|Address)</EM4> needs a delivery of refined ore to keep their production lines humming. The cargo (<EM4>~mission(MissionMaxSCUSize) containers</EM4> or smaller) is ready and waiting for pick up from a freight elevator at <EM4>~mission(Location|address)</EM4>. Any chance you’re available to collect and deliver it to a freight elevator at ~mission(Destination)?\n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\naUEC Reward: 50,250\nReputation XP: +50
Covalex_HaulCargo_AtoB_desc_ScrapWaste_Stanton3=Hey, \n\nThere's a bunch of scrap and waste waiting at a freight elevator at <EM4>~mission(Location|Address)</EM4> that needs to go to a freight elevator at <EM4>~mission(Destination|Address)</EM4> for sorting. I know ArcCorp started an initiative to reduce waste and recycle more scrap on planet, but I haven’t seen any decrease in these types of hauls from them yet.\n\nAre you available to move this batch of assorted junk (<EM4>~mission(MissionMaxSCUSize) containers</EM4> or smaller) off-world for them? \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\naUEC Reward: 53,000\nReputation XP: +50
Covalex_HaulCargo_MultiToSingle_Waste_Waste_Stanton1=Hi,\n\nNeed the trash collected from a few Hurston locations and then taken to a freight elevator at <EM4>~mission(Destination|Address)</EM4>. Don't worry, none of the containers are bigger than <EM4>~mission(MissionMaxSCUSize)</EM4>.\n\nPICK UP LOCATIONS (ANY ORDER)\n\n~mission(MultiToSingleToken)\n\nFun fact for you. Hurston is the only planet in Stanton that doesn’t separate their trash and scrap. One of their workers told me that the company did a cost-benefit analysis on it decades ago that determined it wasn’t worth putting a planet-wide system in place to facilitate it. Isn’t that the most Hurston thing ever?   \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\naUEC Reward: 140,000\nReputation XP: +2,000
Covalex_HaulCargo_MultiToSingle_desc_RawOre_Stanton1=Hi,\n\nHurston is requesting that we prioritize pick ups from the local mining facilities to free up space for what they’re extracting. Here’s everywhere you need to go:  \n\nPICK UP LOCATIONS (ANY ORDER)\n\n~mission(MultiToSingleToken)\n\nOnce collected, everything needs to get to a freight elevator at <EM4>~mission(Destination|Address)</EM4>. They've said that all the containers will be at most <EM4>~mission(MissionMaxSCUSize)</EM4> in size. Sound like something you could handle? \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\naUEC Reward: 118,750\nReputation XP: +1,000
Covalex_HaulCargo_MultiToSingle_desc_ScrapWaste_Stanton3=Hi there,\n\nThere’s a few sites on ArcCorp that need their waste and scrap collected (all boxes <EM4>~mission(MissionMaxSCUSize)</EM4> or smaller) and taken to a freight elevator at <EM4>~mission(Destination|Address)</EM4>. Doesn’t matter what order you do the run, as long as you grab it all.    \n\nPICK UP LOCATIONS (ANY ORDER)\n\n~mission(MultiToSingleToken)\n\nYou know, my mom was a hauler who specialized in runs like this. It might not be the most glamorous stuff, but she claimed these runs had the best pay-to-risk ratio. Pirates never gave her any trouble when they found out what was on board.  \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\naUEC Reward: 139,000\nReputation XP: +2,000
Covalex_HaulCargo_MultiToSingle_title=~mission(ReputationRank) Rank - ~mission(CargoGradeToken) Cargo Haul [500 XP]
Covalex_HaulCargo_SingleToMulti_Processed_Mixed_QTFuelHydroFuelShipAmmo=Hey,\n\nThe folks at <EM4>~mission(Location|Address)</EM4> have what I like to call a “pilot’s special” waiting to be distributed - a haul of quantum fuel, hydrogen fuel, and ship ammo. Load it up from a freight elevator and deliver it to the following spots in whatever order works best for you. Expect the containers to all be <EM4>~mission(MissionMaxSCUSize)</EM4> or smaller.   \n\nDROP OFF LOCATIONS (ANY ORDER)\n\n~mission(SingleToMultiToken) \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\naUEC Reward: 369,500\nReputation XP: +8,000
Covalex_HaulCargo_SingleToMulti_Processed_Stims=Hi,\n\nThere’s a load of stims at <EM4>~mission(Location|Address)</EM4> ready to be picked up from a freight elevator and delivered to a few spots. They will be packaged up in containers <EM4>~mission(MissionMaxSCUSize)</EM4> or smaller. Any chance you can knock this one out for me? \n\nDoesn’t matter what order you drop them off.    \n\nDROP OFF LOCATIONS (ANY ORDER)\n\n~mission(SingleToMultiToken)\n\nGlad I never picked up the habit myself because I swear I get more delivery update requests for “where are my stims?!?” than any other kind of shipment. \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\naUEC Reward: 139,000\nReputation XP: +2,000
Covalex_HaulCargo_SingleToMulti_RefinedOre=Hi there,\n\nThe refinery at <EM4>~mission(Location|Address)</EM4> has been busy. They’ve processed a bunch of <EM4>~mission(Item)</EM4> into containers <EM4>~mission(MissionMaxSCUSize)</EM4> or smaller, and are looking to get it shipped out from a freight elevator. I just checked with the LEOs to see which ones needed this stuff and was able to put together this run.  \n\nDROP OFF LOCATIONS (ANY ORDER)\n\n~mission(SingleToMultiToken)\n\nShould be an easy run for you, if you’re free. \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\naUEC Reward: 319,000\nReputation XP: +4,000
Covalex_HaulCargo_SingleToMulti_desc_ProcessedFood_Stanton2=Hi, \n\nThere’s a few Crusader facilities that need to be restocked with processed food and pressurized ice. Don’t know why but I’m always surprised when I see how much of this stuff they need delivered.\n\nAnyways, there’s a haul of containers no bigger than <EM4>~mission(MissionMaxSCUSize)</EM4> waiting at <EM4>~mission(Location|Address)</EM4>. Once you grab the goods from a freight elevator, these are the facilities where it needs to go:\n\nDROP OFF LOCATIONS (ANY ORDER)\n\n~mission(SingleToMultiToken) \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\naUEC Reward: 90,250\nReputation XP: +1,000
Covalex_HaulCargo_SingleToMulti_desc_RefinedOre_Mixed=Hey,\n\nThe refinery at <EM4>~mission(Location|Address)</EM4> has been busy. They’ve processed a mix of refined ores and are looking to get the containers (<EM4>~mission(MissionMaxSCUSize)</EM4> or smaller) shipped out from a freight elevator. I just checked with the LEOs to see where this stuff is needed and was able to put together this run.  \n\nDROP OFF LOCATIONS (ANY ORDER)\n\n~mission(SingleToMultiToken)\n\nShould be an easy run for you, if you’re free. \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\naUEC Reward: 384,000\nReputation XP: +8,000
Covalex_HaulCargo_SingleToMulti_desc_RefinedOre_Stanton4=Hey there,\n\nThere’s some refined ore in containers <EM4>~mission(MissionMaxSCUSize)</EM4> or smaller that needs to be moved from a freight elevator at <EM4>~mission(Location|Address)</EM4> to production facilities on microTech. You can plan the drop offs anyway you want. Doesn’t matter what order they get done as long as they get there.  \n\nDROP OFF LOCATIONS (ANY ORDER)\n\n~mission(SingleToMultiToken) \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\naUEC Reward: 99,500\nReputation XP: +1,000
