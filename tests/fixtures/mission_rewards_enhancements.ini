headhunters_EliminateSpecific_CFP_H_desc_001=Headhunters are launching an attack near ~mission(Location|Address). This ex-Marine asshole named ~mission(TargetName) has been sending their mercs to clear out nearby encampments if they don't surrender their weapons.\n\nWhile all the security have been greenlit, ~mission(TargetName|Last) has been singled out. In their last raid, they beat a squatter to death for talking back. Turns out that squatter was the cousin of one of our Clips, so they're paying extra to make sure justice is done.\n\nWatch yourself though, ~mission(TargetName|Last) may be a scumbag who has this coming, they're still ex-military so they won't be easy to take down.\n\n-Stows\n\n<EM4>Potential Blueprints</EM4>\n- Devastator "Midnight" Shotgun\n- Devastator "Warhawk" Shotgun\n- Devastator Shotgun\n- Devastator Shotgun Battery (12 cap)\n- Morozov-SH Arms Thule\n- Morozov-SH Core Thule\n- Morozov-SH Helmet Thule\n- Morozov-SH Legs Thule\n\n== Stats ==\nReputation XP: +1,200
headhunters_EliminateSpecific_CFP_H_title_001=Paid Target in CFP <EM4>[BP]</EM4> [1,200 XP]
headhunters_EliminateSpecific_CFP_M_desc_001=Need an available trigger to take down a target in a CFP outpost. They're a real piece of work named ~mission(TargetName). Old school merc filled with lead-pipe cruelty. \n\nHeard they're posted over at ~mission(Location|Address). Swing by and take them out. Try not to cause too much damage. They're the target, not anyone else.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Coda "Big Boss" Pistol\n- Coda "Nighthawk" Pistol\n- Coda Pistol\n- Coda Pistol Magazine (6 cap)\n- Morozov-SH Arms\n- Morozov-SH Core\n- Morozov-SH Helmet\n- Morozov-SH Legs\n- Scalpel Sniper Rifle\n- Scalpel Sniper Rifle Magazine (12 cap)\n\n== Stats ==\nTier 1: +75 XP\nTier 2: +100 XP
headhunters_EliminateSpecific_CFP_M_title_001=Need a CFP taken down <EM4>[BP]</EM4> [75–100 XP]
headhunters_EliminateSpecific_Carvers_XenoThreat_H_desc_001=Got some people over at ~mission(Location|Address) weathering the storm of a XenoThreat assault. That sucks, sure, but turns out it's providing an opportunity for some payback. Those XenoThreat pukes are being led by ~mission(TargetName) who's been on the shit list of my boss for weeks now.\n\nI'm looking for you to head out there and put 'em down.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Coda "Big Boss" Pistol\n- Coda "Nighthawk" Pistol\n- Coda Pistol\n- Coda Pistol Magazine (6 cap)\n- Morozov-SH Arms\n- Morozov-SH Core\n- Morozov-SH Helmet\n- Morozov-SH Legs\n- Scalpel Sniper Rifle\n- Scalpel Sniper Rifle Magazine (12 cap)\n\n== Stats ==\nReputation XP: +1,200
headhunters_EliminateSpecific_Carvers_XenoThreat_H_title_001=Need a scalpel at Carver's <EM4>[BP]</EM4> [1,200 XP]
headhunters_EliminateSpecific_Defector_desc_001=This shit saddens me. Not sure if you've ever crossed paths with ~mission(TargetName) in your dealings with us. Thought they were a real good one. Been with the Headhunters for years, but something must have happened because they went running to CFP for protection. Sold out some of our brothers and sisters along the way.\n\nAll the Judges are furious and wants blood. That's where you come in. Go to ~mission(Location|Address), find ~mission(TargetName|Last), and kill them.\n\nDoesn't have to be anything fancy. Just want the result.\n\nDamn shame.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Devastator "Midnight" Shotgun\n- Devastator "Warhawk" Shotgun\n- Devastator Shotgun\n- Devastator Shotgun Battery (12 cap)\n- Morozov-SH Arms Thule\n- Morozov-SH Core Thule\n- Morozov-SH Helmet Thule\n- Morozov-SH Legs Thule\n\n== Stats ==\nReputation XP: +100
headhunters_EliminateSpecific_Defector_title_001=Plug a traitor <EM4>[BP]</EM4> [100 XP]
headhunters_EliminateSpecific_Generic_E_desc_001=Looking for any hitters available for a quick gig. Over at ~mission(Location|Address), they're getting hit by some geniuses led by ~mission(TargetName). We've tussled against ~mission(TargetName|Last) in the past so it's no surprise they haven't wised up. \n\nWe want you to head there and take them down. Kill whoever you like, but ~mission(TargetName|Last) should be your focus.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Coda "Big Boss" Pistol\n- Coda "Nighthawk" Pistol\n- Coda Pistol\n- Coda Pistol Magazine (6 cap)\n- Morozov-SH Arms\n- Morozov-SH Core\n- Morozov-SH Helmet\n- Morozov-SH Legs\n- Scalpel Sniper Rifle\n- Scalpel Sniper Rifle Magazine (12 cap)\n\n== Stats ==\nTier 1: +50 XP\nTier 2: +100 XP
headhunters_EliminateSpecific_Generic_E_title_001=Kill the king <EM4>[BP]</EM4> [50–100 XP]
headhunters_EliminateSpecific_Generic_M_desc_001=Got a crew that's been hitting Headhunter ships lately. Their leader's a real piece of work named ~mission(TargetName). We've tracked them to  ~mission(Location|Address), so we're looking for someone to put them down for good.\n\nThis group likes to fight, but shouldn't be a problem for someone like you. \n\nGet over there and get it done.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Coda "Big Boss" Pistol\n- Coda "Nighthawk" Pistol\n- Coda Pistol\n- Coda Pistol Magazine (6 cap)\n- Morozov-SH Arms\n- Morozov-SH Core\n- Morozov-SH Helmet\n- Morozov-SH Legs\n- Scalpel Sniper Rifle\n- Scalpel Sniper Rifle Magazine (12 cap)\n\n== Stats ==\nTier 1: +25 XP\nTier 2: +50 XP
headhunters_EliminateSpecific_Generic_M_title_001=Need someone taken out <EM4>[BP]</EM4> [25–50 XP]
headhunters_EliminateSpecific_Generic_VH_desc_001=Word's come down through my bosses that we're settling old debts. I've got an open line on this old-time hitter named ~mission(TargetName) who's racked up a hefty kill list. We caught wind that they were hiding out with some people over at ~mission(Location|Address) who aren't the biggest fans of us, so they probably won't take kindly to you. ~mission(TargetName|Last) is the target here, but you might have to mix it up with them.\n\nAgain, whenever we've tried to take out ~mission(TargetName|Last), they've killed their killer. I feel like you'll fare better, but I'd bring backup if you got it.\n\nGood luck.\n\n-Stows\n\n<EM4>Potential Blueprints</EM4>\n- Coda "Big Boss" Pistol\n- Coda "Nighthawk" Pistol\n- Coda Pistol\n- Coda Pistol Magazine (6 cap)\n- Morozov-SH Arms\n- Morozov-SH Core\n- Morozov-SH Helmet\n- Morozov-SH Legs\n- Scalpel Sniper Rifle\n- Scalpel Sniper Rifle Magazine (12 cap)\n\n== Stats ==\nReputation XP: +1,200
headhunters_EliminateSpecific_Generic_VH_title_001=Green light on ~mission(TargetName|Last) <EM4>[BP]</EM4> [1,200 XP]
headhunters_EliminateSpecific_Riviera_XenoThreat_VH_desc_001=So we got a situation over at ~mission(Location|Address). One of our outposts is getting hit by XenoThreat. While that kinda blows, it is giving us an interesting opportunity. See the attack's being led by ~mission(TargetName) who's been on the Headhunters shit list for some time now.\n\nWe want you to head there and take them out. Feel free to kill any other XenoThreat assholes you want, but ~mission(TargetName|Last) is the target. Lotta people have tried before so it definitely won't be easy. I'd even recommend bringing some friends, whatever it takes to finally put ~mission(TargetName|Last) down.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Coda "Big Boss" Pistol\n- Coda "Nighthawk" Pistol\n- Coda Pistol\n- Coda Pistol Magazine (6 cap)\n- Morozov-SH Arms\n- Morozov-SH Core\n- Morozov-SH Helmet\n- Morozov-SH Legs\n- Scalpel Sniper Rifle\n- Scalpel Sniper Rifle Magazine (12 cap)\n\n== Stats ==\nReputation XP: +600
headhunters_EliminateSpecific_Riviera_XenoThreat_VH_title_001=Need a hit on the Riviera <EM4>[BP]</EM4> [600 XP]
headhunters_EliminateSpecific_TheYard_XenoThreat_H_desc_001=Not sure if you've heard but ~mission(Location|Address) is getting hit by XenoThreat. Situation's not good, but under control. Here's the deal though, the assholes attacking are being led by some real trash named ~mission(TargetName). We've dealt with ~mission(TargetName|Last) before and they continually slip away before we can put them down.\n\nThat changes. We want you to head there and take out ~mission(TargetName|Last) before they squirm out of this noose.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Coda "Big Boss" Pistol\n- Coda "Nighthawk" Pistol\n- Coda Pistol\n- Coda Pistol Magazine (6 cap)\n- Morozov-SH Arms\n- Morozov-SH Core\n- Morozov-SH Helmet\n- Morozov-SH Legs\n- Scalpel Sniper Rifle\n- Scalpel Sniper Rifle Magazine (12 cap)\n\n== Stats ==\nReputation XP: +200
headhunters_EliminateSpecific_TheYard_XenoThreat_H_title_001=Hit on XenoThreat at the Yard <EM4>[BP]</EM4> [200 XP]
headhunters_EliminateSpecific_Windfall_XenoThreat_H_desc_001=Clashing with some XenoThreat scumbags over at ~mission(Location|Address) and learned that ~mission(TargetName) is leading them. I ran it by my Judge and she lit up at the chance to take this asshole down, so we want you to head out there and make sure they don't walk away from this attack.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Coda "Big Boss" Pistol\n- Coda "Nighthawk" Pistol\n- Coda Pistol\n- Coda Pistol Magazine (6 cap)\n- Morozov-SH Arms\n- Morozov-SH Core\n- Morozov-SH Helmet\n- Morozov-SH Legs\n- Scalpel Sniper Rifle\n- Scalpel Sniper Rifle Magazine (12 cap)\n\n== Stats ==\nReputation XP: +1,200
headhunters_EliminateSpecific_Windfall_XenoThreat_H_title_001=Head of the snake <EM4>[BP]</EM4> [1,200 XP]
headhunters_EliminateSpecific_XenoThreat_H_desc_001=Headhunters just rallied up a crew to go hit ~mission(Location|Address) and wipe out the XenoThreat there, but I'm looking to add some extra insurance. \n\nSee there's this heavy hitter there named ~mission(TargetName) who's up in the XenoThreat command structure and we want them taken out. Every other one you kill is gravy, but they're your prime target.\n\n-Stows\n\n<EM4>Potential Blueprints</EM4>\n- Coda "Big Boss" Pistol\n- Coda "Nighthawk" Pistol\n- Coda Pistol\n- Coda Pistol Magazine (6 cap)\n- Morozov-SH Arms\n- Morozov-SH Core\n- Morozov-SH Helmet\n- Morozov-SH Legs\n- Scalpel Sniper Rifle\n- Scalpel Sniper Rifle Magazine (12 cap)\n\n== Stats ==\nReputation XP: +75
headhunters_EliminateSpecific_XenoThreat_H_title_001=XenoThreat Lieutenant needs some killing <EM4>[BP]</EM4> [75 XP]
headhunters_EliminateSpecific_XenoThreat_VH_desc_001=Here's the deal, we just got word that a XenoThreat power player named ~mission(TargetName) just came out of hiding and was spotted at ~mission(Location|Address). \n\nHeadhunters have been hungry to put this asshole in the ground for months, so we launched an assault against the outpost, but the Judge wants to make sure ~mission(TargetName|Last) doesn't slip away, so they want to use you as insurance.\n\nThis'll be a tough kill in the middle of a warzone, but we'll pay out if you pull it off.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Coda "Big Boss" Pistol\n- Coda "Nighthawk" Pistol\n- Coda Pistol\n- Coda Pistol Magazine (6 cap)\n- Morozov-SH Arms\n- Morozov-SH Core\n- Morozov-SH Helmet\n- Morozov-SH Legs\n- Scalpel Sniper Rifle\n- Scalpel Sniper Rifle Magazine (12 cap)\n\n== Stats ==\nReputation XP: +600
headhunters_EliminateSpecific_XenoThreat_VH_title_001=Wanted: ~mission(TargetName) <EM4>[BP]</EM4> [600 XP]
headhunters_EliminateSpecific_XenoThreat_desc_001=Got a line on a XenoThreat that's been a pain in the ass. Not sure if you've heard the name, but ~mission(TargetName) is a scumbag even by XenoThreat standards. Vicious, sadistic, and a prick to boot. We want someone to punch their number. You up for it?\n\nLast word was that they were somewhere around ~mission(Location|Address). Head there and take 'em out. Pretty simple.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Devastator "Midnight" Shotgun\n- Devastator "Warhawk" Shotgun\n- Devastator Shotgun\n- Devastator Shotgun Battery (12 cap)\n- Morozov-SH Arms Thule\n- Morozov-SH Core Thule\n- Morozov-SH Helmet Thule\n- Morozov-SH Legs Thule\n\n== Stats ==\nReputation XP: +400
headhunters_EliminateSpecific_XenoThreat_title_001=Drop a XenoThreat <EM4>[BP]</EM4> [400 XP]
headhunters_HaulCargo_RegionLink_desc_001=You been doing good work for us, so I got a favor to ask. I'll still pay you, but it's a favor. Got some cargo that needs to get bounced from <EM4>~mission(Location|Address)</EM4> to <EM4>~mission(Destination|Address)</EM4> and the guy that was supposed to do it found himself on the wrong side of an airlock, but hey, shit still needs to get done.\n\nOnly thing is you'll need a ship that can carry <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>.  A <EM4>handheld tractor beam</EM4> would also be smart to bring along. \n\nIf you could sort it out for me, that'd be great.\n\n- Stows out\n\n== Stats ==\nReputation XP: +200
headhunters_HaulCargo_RegionLink_title_001=Hauling ask. [200 XP]
headhunters_bombingrun_E_CFP_desc_001=It seems like I can't go a day without waking up to one of my people bitchin' and moanin' about how hard Citizens for Prosperity is making their life. \n\nEventually we're going wipe those do-gooders out of the system, but for now I'll settle for some peace and quiet. \n\nGo to ~mission(Location|Address) and destroy the fuel stores CFP have got there. That should at least keep them out of our business for a bit.\n\n-Stows out\n\n== Stats ==\nTier 1: +100 XP\nTier 2: +200 XP
headhunters_bombingrun_E_CFP_title_001=Take Out Citizens for Prosperity Fuel Supply [100–200 XP]
headhunters_bombingrun_E_desc_001=Some competition has taken root at ~mission(Location|Address) and they've really been gumming up the works for our operations in the area.\n\nNow part of me sees some potential in the upstarts so I'm hoping to bring them into fold, but at the same time, I can't really afford to have them flying around causing trouble.\n\nInstead, I want you to go and blow up their fuel tanks. That should keep them grounded long enough for me to talk some sense into their thick heads.\n\n-Stows out\n\n== Stats ==\nTier 1: +25 XP\nTier 2: +100 XP
headhunters_bombingrun_E_title_001=No Fly Zone [25–100 XP]
headhunters_bombingrun_H_XT_desc_001=It seems that XenoThreat has gotten the same intel we did and are looking to pull off the same job as us. \n\nI want you to knock the competition out of the picture. Go to ~mission(Location|Address) and take out the fuel tanks they got there.\n\nThen my people can finish up without worrying about XenoThreat crashing the party.\n\n-Stows out\n\n== Stats ==\nTier 1: +100 XP\nTier 2: +1,500 XP
headhunters_bombingrun_H_XT_title_001=Blow Up XenoThreat Fuel Reserves [100–1,500 XP]
headhunters_bombingrun_H_desc_001=Look, Headhunters don't waste time on petty revenge, but I'm not about to let this nonsense fly either.\n\nSome asshole took out a bunch of my crew and has been bragging all over about it. I've also heard that this nullbrain is stockpiling quantum fuel over at <EM4>~mission(Location|Address)</EM4>. I'd like to see how they deal with some real heat when you fly over there and burn everything they've built to the ground. Oh, and with the amount of firepower they got gathered over there, wouldn't be smart to fly alone on this one, so take a crew with you.\n\n-Stows out\n\n== Stats ==\nReputation XP: +200
headhunters_bombingrun_H_title_001=Wasting Their Stockpile [200 XP]
headhunters_bombingrun_M_CFP_desc_001=I'm getting pretty bloody sick of Citizens for Prosperity sticking their noses where they don't belong. \n\nStarted thinking that it might be pretty nice to ground their fleet for a little bit. We blow up their fuel tanks at ~mission(Location|Address) and those little pissheads won't be going nowhere quick.\n\nSound like your kinda thing?\n\n-Stows out\n\n== Stats ==\nTier 1: +100 XP\nTier 2: +200 XP
headhunters_bombingrun_M_CFP_title_001=Blow Up Citizens for Prosperity Fuel Reserves [100–200 XP]
headhunters_bombingrun_M_title_001=Stopping the Competition\n\n== Stats ==\nReputation XP: +150
headhunters_bombingrun_S_desc_001=We've heard news that a new gang are planning a bombing run on a place over at <EM4>~mission(Location|Address)</EM4>. They figure if they can take out the fuel supplies there then it's theirs for the taking.\n\nBut little do they know that we're gonna send you in first to blow the fuel tanks so we can claim the place before they do. If it all goes to plan, we can clear the location out and stick it to that gang at the same time. Two birds, one stone.\n\nOnly problem is this place is armed to the teeth. Bring a crew and get those fuel tanks out of action. We'll take care of the rest.\n\n-Stows out\n\n== Stats ==\nReputation XP: +300
headhunters_bombingrun_S_title_001=Outsmarting our Enemies [300 XP]
headhunters_bombingrun_VE_desc_001=Headhunters didn't get to be what it is today by playing nice. We've tracked down the hideout of a bunch of scraggy upstarts that have been making inroads into our territory. Need you to send a message.\n\nHead to <EM4>~mission(Location|Address)</EM4> and blow out of their fuel tanks. They'll think twice about muscling in on our operations when their ships are grounded.\n\n-Stows out\n\n== Stats ==\nReputation XP: +100
headhunters_bombingrun_VE_title_001=Ground The Upstarts [100 XP]
headhunters_bombingrun_VH_XT_desc_001=I won't get into the long and complicated politics of why I'm asking you to do this, but it's enough for you to know that I want it done. \n\nGo to ~mission(Location|Address) and blow up the XenoThreat fuel reserves there. It'll really be helping me out of a tight spot.\n\n-Stows\n\n== Stats ==\nReputation XP: +3,200
headhunters_bombingrun_VH_XT_title_001=Destroy XenoThreat Fuel Reserves [3,200 XP]
headhunters_bombingrun_VH_desc_001=Got a plan to take care of a rat I've been dealing with and need a hand.\n\nHad a client default on some debts and now they've decided they ain't going to pay up. Got a tip that they're hiding out over at <EM4>~mission(Location|Address)</EM4>. If you can take out their fuel tanks they'll have no choice but to reconsider their crap decisions.\n\nJust be sure you don't underestimate this slimebag. They might be dumb but they're not stupid, if you get me. I've heard this place is swarming with ships and turrets, you'd have to be a total nullbrain not to bring backup.\n\n-Stows out\n\n== Stats ==\nReputation XP: +250
headhunters_bombingrun_VH_title_001=Trapping a Rat [250 XP]
headhunters_bombingrun_killship_M_desc_001=Everyone has been talking about a new player named ~mission(TargetName) who is operating out of ~mission(Location|Address). They've become a real concern for the Headhunters. \n\nIt's time to shut them down. \n\nHead over, take out ~mission(TargetName|Last) and then clear out any fuel stores they have there to convince anyone remaining to leave. \n\nFigure after you pull this off, nobody will even remember their name.\n\n-Stows\n\n== Stats ==\nReputation XP: +200
headhunters_bombingrun_killship_M_title_001=Convince Upstarts to Abandon Sector [200 XP]
headhunters_bombingrun_multi_E_CFP_desc_001=Every day it seems like Citizens for Prosperity is out here trying to snatch up more people for their shitty little cause and make life more difficult for hardworkin' folks like ourselves. \n\nI figure they could use a reminder about who really is in charge here. Head to ~mission(Location|Address) and bomb the living hell out of the area. \n\nNothing like a bit of property damage to get a point across.\n\n-Stows out\n\n== Stats ==\nReputation XP: +100
headhunters_bombingrun_multi_E_CFP_title_001=Teach Citizens for Prosperity A Lesson [100 XP]
headhunters_bombingrun_sabotage_servers_VH_desc_001=When will people learn that they can't just do whatever they feel like on Headhunter turf? These idiots are planning a big job and thought that I'd just let them get away with it? No way in hell.\n\nI want you to fly to ~mission(Location|Address) and destroy their fuel tanks and data servers. Show them what the Headhunters really think of them.\n\nLet's see them try to pull off anything after that.\n\n-Stows out\n\n== Stats ==\nReputation XP: +3,200
headhunters_bombingrun_sabotage_servers_VH_title_001=Stop Rivals from Launching Heist [3,200 XP]
headhunters_defend_Generic_M_Carvers_desc_001=I swear all the local scumbags have gotten a lot bolder since Citizens for Prosperity moved into here. Now we got a group attacking ~mission(Location|Address), so I need someone to take it back and remind them that Headhunters are still the power in the system.\n\nIf you take them out, I don't have to figure out who they are, so get to it.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nReputation XP: +150
headhunters_defend_Generic_M_Carvers_title_001=Take back Carvers Ridge <EM4>[BP]</EM4> [150 XP]
headhunters_defend_Generic_M_GoldenRivera_desc_001=Call's out for anybody itching to cause some violence. Some stupid skags thought they could knock over ~mission(Location|Address) and we wouldn't kick back. Go show them how wrong their thinking was.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nReputation XP: +300
headhunters_defend_Generic_M_GoldenRivera_title_001=Rally at ~mission(Location) <EM4>[BP]</EM4> [300 XP]
headhunters_defend_Generic_M_TheYard_desc_001=Putting the word out. We got a Headhunter outpost near ~mission(Location|Address) under attack and could use some backup. Haven't quite figured out who's doing the attacking but don't really care. You step to the Headhunters, get ready to get clapped back.\n\nGet over there pronto and take them down.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nReputation XP: +150
headhunters_defend_Generic_M_TheYard_title_001=The Yard's under attack <EM4>[BP]</EM4> [150 XP]
headhunters_defend_Generic_M_WindFall_desc_001=Need some triggers to get over to ~mission(Location|Address) and defend one of our places that's under attack. Not sure who's looking for an early death, but we can figure that out once they're cold and still.\n\nBring some people if you want just make sure we take it back.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nReputation XP: +150
headhunters_defend_Generic_M_WindFall_title_001=Don't let Windfall Fall <EM4>[BP]</EM4> [150 XP]
headhunters_defend_Generic_M_desc_001=Some geniuses thought it would be a good idea to try and knock over ~mission(Location|Address), so we're putting together a response to put them in the ground and also show everyone else what happens if you touch Headhunter turf.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nReputation XP: +150
headhunters_defend_Generic_M_title_001=~mission(Location|Address) under attack <EM4>[BP]</EM4> [150 XP]
headhunters_defend_xt_desc_001=Those XenoThreat punks launched an attack against ~mission(Location|Address) so we're looking for people to go fend them off. \n\nGet out there and waste every XenoThreat you see.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- DustUp Arms Tactical\n- DustUp Core Tactical\n- DustUp Helmet Tactical\n- DustUp Legs Tactical\n- Yubarev "Igniter" Pistol\n- Yubarev "Mirage" Pistol\n- Yubarev Pistol\n- Yubarev Pistol Battery (10 cap)\n\n== Stats ==\nReputation XP: +200
headhunters_defend_xt_title_001=Back up needed at outpost <EM4>[BP]</EM4> [200 XP]
headhunters_defendship_LRT_PA_desc_001=You busy? A promising prospect was doing a special run for me but ran into trouble with the People’s Alliance around <EM4>~mission(Location|Address)</EM4>. This one’s on me. Knew they weren’t the best dogfighter but thought they could do this without running into any other ships. \n\nTold ‘em to hold tight and do everything they can to stay alive until support gets there. Shouldn’t be too much trouble for someone with your skillset.  \n\n-Stows\n\n== Stats ==\nReputation XP: +100
headhunters_defendship_LRT_PA_title_001=Headhunter Needs Help [100 XP]
headhunters_defendship_LRT_desc_001=Just got word that a Headhunter over near ~mission(Location|Address) got roped into a fight and now they can't see it through. The idiot wants me to save their sorry ass.\n\nGuess I'm a soft touch, because I'm actually going to pay you to do it for me. What do you say? Wanna save a moron's life?\n\n-Stows\n\n== Stats ==\nReputation XP: +150
headhunters_defendship_LRT_title_001=Headhunter Pilot in Trouble [150 XP]
headhunters_defendship_MRT_PA_desc_001=Some People’s Alliance members with a death wish decided to target one of our ships. Need someone to hustle over to <EM4>~mission(Location|Address)</EM4> and show ‘em what happens when you mess with the Headhunters.\n\nStows out.\n\n== Stats ==\nReputation XP: +150
headhunters_defendship_MRT_PA_title_001=Backup Needed Now [150 XP]
headhunters_defendship_MRT_desc_001=One of my pilots wasn't thinking straight and got themselves mixed up in a heap of trouble over at ~mission(Location|Address). \n\nThe real kicker is the fool has a full hold. Can't really afford to lose the stuff they're carrying, so I'd appreciate it if you could go bail them out for me. \n\n- Stows out\n\n== Stats ==\nReputation XP: +200
headhunters_defendship_MRT_title_001=Headhunter Ship Needs Backup [200 XP]
headhunters_defendship_VLRT_PA_desc_001=Guess some folks just can’t dogfight. Sent a young prospect out on patrol, and am now being barraged with comms about how they’re barely hanging on. Had them update me with the details about who they’re up against and I damn near fell outta my chair laughing.    \n\nIf this kid can’t handle a People’s Alliance ship, they sure ain’t ready for flight assignments. Appreciate it if you could save their hide anyway.\n\nIf you’re free, could you head over to <EM4>~mission(Location|Address)</EM4> and show ‘em how it’s done?\n\n-Stows\n\n\n== Stats ==\nReputation XP: +100
headhunters_defendship_VLRT_PA_title_001=Help Headhunters Prospect [100 XP]
headhunters_defendship_VLRT_desc_001=Seems we got some upstarts trying to muscle in our operations by hitting a Headhunter ship near ~mission(Location|Address). Not sure how they expected to get away with it.\n\nThey need to learn the hard way that's not how things work in Pyro. You up for heading over there and teaching these bastards a lesson?\n\n- Stows out\n\n== Stats ==\nReputation XP: +100
headhunters_defendship_VLRT_title_001=Headhunter Pilot Needs a Hand [100 XP]
headhunters_defendship_multi_HRT_PA_desc_001=Sent ships to investigate a distress beacon only for it to turn into an ambush by the People’s Alliance. They’ve been fighting like hell to get away but can’t seem to extract themselves.\n\nLet’s get ‘em some help on the double. Think you can go on over to <EM4>~mission(Location|Address)</EM4> to give ‘em some support?\n\n-Stows\n\n== Stats ==\nReputation XP: +200
headhunters_defendship_multi_HRT_PA_title_001=Bring Down the Hammer [200 XP]
headhunters_defendship_multi_HRT_desc_001=Turns out some double-crossing assholes set us up. We were supposed to meet for a deal, but they attacked our ships instead. Now my people got a fight on their hands, and I'll be honest, I'm not sure they're gonna make it out alive.\n\nWould be good if they had some extra firepower on their side. Think you could hurry over to ~mission(Location|Address) and take out a few of these lying lowlifes for me?\n\nWill make it worth your while, but only if all the Headhunters make it out in one piece.\n\n- Stows Out\n\n== Stats ==\nReputation XP: +300
headhunters_defendship_multi_HRT_title_001=Headhunter Ships in Big Trouble [300 XP]
headhunters_defendship_multi_MRT_desc_001=A few Headhunters just comm'd to say they were jumped as they were leaving ~mission(Location|Address).\n\nThey'll probably be fine, but I'll feel a whole lot better if you could go there and lend a hand. \n\nI've got a stack of credits for you if you manage to save all of them.\n\n-Stows Out\n\n== Stats ==\nTier 1: +150 XP\nTier 2: +200 XP
headhunters_defendship_multi_MRT_title_001=Headhunter Ships Need Backup [150–200 XP]
headhunters_defendship_multi_SRT_PA_desc_001=Got ourselves in a real mess here. A Headhunters ship on an important mission got attacked near <EM4>~mission(Location|Address)</EM4>. Can’t get too into the specifics but it’s absolutely vital that they survive. The People’s Alliance know this too because they’re throwing everything they can at ‘em.\n\nNot gonna pull any punches. This is a serious-ass situation that many wouldn’t survive. If you do, I’ll sing your praises and make sure you’re paid well.   \n\n-Stows\n\n== Stats ==\nReputation XP: +300
headhunters_defendship_multi_SRT_PA_title_001=Looking for a Damn Hero [300 XP]
headhunters_defendship_multi_VHRT_PA_desc_001=One of our Clips is in a tight spot. Just got a comm from ‘em saying their convoy is being swarmed by the People’s Alliance and they need help on the double. Well, they said it in a more colorful way than that. All I’ll say is that I don’t want to hear what they’ll say to me if they don’t survive and are forced to regen. \n\nSituation must be serious if this Clip is freaking out. Really need you to get to <EM4>~mission(Location|Address)</EM4> immediately, and ensure that they make it out alive.\n\nStows out.\n\n== Stats ==\nReputation XP: +250
headhunters_defendship_multi_VHRT_PA_title_001=Rally to Help Clips Convoy [250 XP]
headhunters_defendship_multi_VHRT_XT_desc_001=Some of my more hotheaded Headhunters got themselves embroiled in a battle against a host of XenoThreat ships, and it's looking more and more certain that they can't get themselves out of it.\n\nThink you can head to ~mission(Location|Address) and give 'em a hand?\n\n-Stows\n\n== Stats ==\nReputation XP: +1,200
headhunters_defendship_multi_VHRT_XT_title_001=Headhunter Ships Ambushed by XenoThreat [1,200 XP]
headhunters_eliminateall_Generic_M_desc_001=Caught wind that a crew of hardcore shipjackers are holed up around ~mission(Location|Address). They swiped a couple of Headhunter ships a few months ago after dumping the crew out the airlock, so we've been keeping an eye out for them ever since.\n\nWant you to go there and show them the same kinda mercy they showed our people. Clear?\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nReputation XP: +150
headhunters_eliminateall_Generic_M_title_001=Wipe ~mission(Location) out <EM4>[BP]</EM4> [150 XP]
headhunters_eliminateall_XT_derelicts_desc_01=One of our Judges caught wind of XenoThreat trying to move in on our territory. Seems like they’re trying to take over ~mission(Location|Address). We don’t want to let those psychos get any more of a foothold in system than they already have, so we’re putting some creds on the line to get ‘em to back off.\n\nWe want you to come down on them hard. Don’t let up till the whole place is a graveyard. We’ll send your payment once the bodies are ready to bury.\n\n- Stows out.\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nReputation XP: +200
headhunters_eliminateall_XT_derelicts_title_01=Turf War <EM4>[BP]</EM4> [200 XP]
headhunters_eliminateall_base_Generic_E_desc_001=So here's the deal, we got some small time dirtbags who think they're hotshots running out of a base near ~mission(Location|Address). I don't know what toxic shit they're drinking but they thought it'd be a good idea to step to some Headhunter Clips. Killed one, injured three more. So I'm looking to send someone there to blast their ambition right out of their skulls.\n\nHead over and get it done. You'll get a nice bump of creds for it.\n\n- Stows\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nReputation XP: +50
headhunters_eliminateall_base_Generic_E_title_001=Need a hitter <EM4>[BP]</EM4> [50 XP]
headhunters_eliminateall_cfp_E_desc_001=Need someone to sweep ~mission(Location|Address). CFP security forces seized the outpost from a group of locals that'd been there for years. Beat the hell out of 'em from what I heard, so they came to Headhunters asking for revenge. \n\nNeed it done fast and clean. \n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nReputation XP: +50
headhunters_eliminateall_cfp_E_title_001=Hitting a CFP site <EM4>[BP]</EM4> [50 XP]
headhunters_eliminateall_cfp_M_desc_001=Word came down from the Judge that we're to hit ~mission(Location|Address). It's owned by CFP and security there have been less than hospitable to some of the locals, so they gotta go.\n\nThey may talk a big game about bringing security, but they got guns and are more than happy to use 'em.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nReputation XP: +150
headhunters_eliminateall_cfp_M_title_001=~mission(Location) has been greenlit <EM4>[BP]</EM4> [150 XP]
headhunters_eliminateall_cfp_desc_001=Here's the deal. Some of those mercs that CFP hired as security went and shot up some Headhunters that were just moving through the system. They weren't even doing anything, just flying.\n\nAnyway, we tracked them back to ~mission(Location|Address) and want to dish out some payback. Grab your gear and be our weapon, we'll make it worth your while.\n\n- Stows\n\n<EM4>Potential Blueprints</EM4>\n- DustUp Arms Tactical\n- DustUp Core Tactical\n- DustUp Helmet Tactical\n- DustUp Legs Tactical\n- Yubarev "Igniter" Pistol\n- Yubarev "Mirage" Pistol\n- Yubarev Pistol\n- Yubarev Pistol Battery (10 cap)\n\n== Stats ==\nReputation XP: +100
headhunters_eliminateall_cfp_title_001=Looking for a little revenge <EM4>[BP]</EM4> [100 XP]
headhunters_eliminateall_outpost_desc_01=Some assholes are refusing to pay us what we’re owed. Problem is, these idiots are bragging about it. Had they kept it quiet, we could’ve taken care of this more surgically, but now we need to send a message.\n\nThe fools are operating from ~mission(Location|Address). We need them all gone. Make it as loud as you can. We’ll send your payment once everyone’s taken care of.\n\n- Stows out.\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nTier 1: +25 XP\nTier 2: +50 XP\nTier 3: +300 XP
headhunters_eliminateall_outpost_title_01=Reputation Management <EM4>[BP]</EM4> [25–300 XP]
headhunters_eliminateall_retrievestolen_base_Generic_M_desc_001=Local crew decided to hit one of our convoys and steal our shit. They got away, but we aren't gonna let them celebrate for long. I want you to head out to ~mission(Location|Address) where they got a base, blast them into ash, and get our stuff back. \n\nOnce you got the cargo, take it over to ~mission(Destination|Address) and we can all forget these assholes ever existed.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nReputation XP: +150
headhunters_eliminateall_retrievestolen_base_Generic_M_title_001=Death and cargo <EM4>[BP]</EM4> [150 XP]
headhunters_eliminateall_retrievestolen_missingperson_base_Generic_M_desc_001=One of the local Judges has been trying to get info on some of new gangs in the area. You know, see if anyone's got eyes on what we got. That kinda thing. Anyway, we sent ~mission(TargetName) undercover to try and suss out if anyone's getting bright ideas to try and make a move.\n\nAnyway, ~mission(TargetName|First) was heading to ~mission(Location|Address) to make a deal with some local grunts or whatever but we haven't heard back. Judge is afraid ~mission(TargetName|Last) might've been sniffed then snuffed, so we want you to head there and see what's what.\n\nGo find what happened to ~mission(TargetName|Last) and get our cargo back. Odds are you'll need to shwack anyone you come across because if ~mission(TargetName|Last) is dead, these assholes killed a Headhunter.\n\nOnce you get the cargo, drop it off at ~mission(Destination|Address) and get a nice little payday.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nReputation XP: +300
headhunters_eliminateall_retrievestolen_missingperson_base_Generic_M_title_001=A tricky tricky task <EM4>[BP]</EM4> [300 XP]
headhunters_eliminateall_xt_desc_001=It's sad to say but we lost one of our outposts to XenoThreat. Appalling if you ask me, but that's why we're looking for someone who's got the time and ammunition to take it back.\n\nIf that's you, head over to ~mission(Location|Address) and take it back.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- DustUp Arms Tactical\n- DustUp Core Tactical\n- DustUp Helmet Tactical\n- DustUp Legs Tactical\n- Yubarev "Igniter" Pistol\n- Yubarev "Mirage" Pistol\n- Yubarev Pistol\n- Yubarev Pistol Battery (10 cap)\n\n== Stats ==\nReputation XP: +100
headhunters_eliminateall_xt_title_001=Green light on ~mission(Location) <EM4>[BP]</EM4> [100 XP]
headhunters_eliminatespecific_desc_001=Some interesting information just fell into my lap. Guess the notorious XenoThreat leader ~mission(TargetName) is holed up at ~mission(location|address) working on some big op for them. Perfect opportunity to kill the piece of shit once and for all.\n\nThing is, the Xenos have their eyes all over Headhunter operations at the moment. There’s no way we can mobilize and deploy a crew without ~mission(TargetName|Last) getting tipped off. So I’m offering you the chance to make Pyro a better place and earn some creds at the same time.\n\nIf interested, I suggest gearing up and finding some backup before heading out. You'll only get paid if you take out ~mission(TargetName|Last), but don’t hesitate to kill any other little XenoThugs that might be hiding there with ‘em.  \n\nStows out.\n\n== Stats ==\naUEC Reward: 12,000\nReputation XP: +1,000
headhunters_eliminatespecific_title_001=Ripe for Retribution [1,000 XP]
headhunters_killship_asteroid_rank0_desc_001=So here's the deal, Headhunters are looking to expand their talent pool and have a few openings for anyone who's got the stones.\n\nThere's a real piece of work named ~mission(TargetName) who thinks they've been really clever pinching cargo off of haulers moving through the system. We asked for a cut of their profits as a licensing tax to continue operating. When ~mission(TargetName|Last) responded, they were very disrespectful.\n\nWe've tracked their ship to ~mission(Location|Address) and need them taken out. You should know, they're being smart and sticking close to some allies so they won't be alone.\n\nDo this and we'll consider you for future Headhunter work.\n\nStows out.\n\n== Stats ==\nReputation XP: +50
headhunters_killship_asteroid_rank0_title_001=Target takedown for a fast track in [50 XP]
headhunters_killship_asteroid_rank1_desc_001=There's a nest that needs to be taken out around ~mission(Location|Address) that has been taken over by some squatters. We don't care about most of them, but word's gotten back to us that they're sheltering ~mission(TargetName) who has a long history of stealing Headhunter loot. Time's come to take them out.\n\nWord is that ~mission(TargetName|Last) is in a ship, but may rely on the base's defenses to protect them, so be careful. You kill 'em, you get paid. \n\nYou know, the usual.\n\nStows out.\n\n== Stats ==\nReputation XP: +50
headhunters_killship_asteroid_rank1_title_001=Target at ~mission(Location) [50 XP]
headhunters_killship_cfp_hrt_desc_001=Need another CFP ship taken out. It belongs to ~mission(TargetName), who's been  driving locals out of their homes if they don't accept Citizens for Prosperity help. They're a real piece of work and we've been given the go-ahead to take them down.\n\nTheir ship was spotted around ~mission(Location|Address), so head out there and do the deed.\n\nStows out.\n\n== Stats ==\nReputation XP: +600
headhunters_killship_cfp_hrt_title_001=Kill Order [600 XP]
headhunters_killship_cfp_mrt_desc_001=CFP Security forces have been attacking locals and we're looking to balance the scales. Caught wind of one in particular named ~mission(TargetName|Last) who's been causing some damage and we need them taken out.\n\nYou can find them flying around ~mission(Location|Address). Go introduce yourself.\n\nStows out.\n\n== Stats ==\nReputation XP: +300
headhunters_killship_cfp_mrt_title_001=Hit a CFP Ship [300 XP]
headhunters_killship_cfp_vhrt_desc_001=Got a platinum target that needs to get taken down. ~mission(TargetName) is a heavy hitter who's one of the people running security for Citizens for Prosperity. Although ~mission(TargetName|Last) might have forgotten, the Headhunters remember their work with a merc company a few years ago that lead to the deaths of five brothers and sisters. We want blood for blood.\n\nThey've been spotted poking around ~mission(Location|Address), so you should still be able to find them there.\n\nThey're a mean bastard, so bring some friends but make sure they end up dead.\n\nStows out.\n\n== Stats ==\nReputation XP: +1,200
headhunters_killship_cfp_vhrt_title_001=Primo Target [1,200 XP]
headhunters_killship_gen_hrt_desc_001=We got a greenlight to finally take out ~mission(TargetName). They've been a pain in our ass ever since they came to the system a few years ago and it's finally time to take them out once and for all. \n\nWe've gotten word that ~mission(TargetName|Last) was spotted flying near ~mission(Location|Address) and the Judge wants this handled now.\n\nTake 'em out.\n\n- Stows out.\n\n== Stats ==\nReputation XP: +600
headhunters_killship_gen_hrt_title_001=Wanted: ~mission(TargetName) [600 XP]
headhunters_killship_gen_lrt_desc_001=Got another scumbag who needs their ticket punched. ~mission(TargetName) is just a low level thug who doesn't seem to learn. We've warned them to either throw in with us or move system, but they don't seem to be listening so we're out of patience.\n\nHead to ~mission(Location|Address) and you should find ~mission(TargetName|Last) flying around. \n\nStows out.\n\n== Stats ==\nReputation XP: +75
headhunters_killship_gen_lrt_title_001=Simple Hit [75 XP]
headhunters_killship_gen_mrt_desc_001=Another gang tried to make a move and carve out some territory for themselves. They failed but Headhunters don't forget. We've taken out most of them but one of the last members named ~mission(TargetName) has been spotted flying around ~mission(Location|Address).\n\nOdds are they're getting desperate, so don't underestimate them in the fight.\n\nYou'll get paid when it's done.\n\nStows out.\n\n== Stats ==\nReputation XP: +300
headhunters_killship_gen_mrt_title_001=Treat yourself to a fight [300 XP]
headhunters_killship_gen_vlrt_desc_001=Got a small fry who thinks they can hit the Headhunters and get away with it. So ~mission(TargetName) tried to knock over one of our stashes and think they can get away with it. \n\nLast we heard they were spotted around ~mission(Location|Address). We need someone to head over and send a very clear message who is the reigning power in the system.\n\nDo it quick and clean.\n\nStows out.\n\n== Stats ==\nReputation XP: +50
headhunters_killship_gen_vlrt_rank0_desc_001=You know us. You know what we do. System’s getting a little crowded, so we’re looking for some good soldiers to help keep our place here.\n\nIf you’re up for it and don’t mind getting your hands dirty, we’ve got something to prove you’ve got the stuff we’re looking for.\n\n~mission(TargetName) was a former member who sold us out to XenoThreat and got some of their brothers and sisters killed. Now they think they can just live their life without consequence.\n\nYou take them out. You get boosted in. Sounds like a fair trade.\n\nThey’ve been spotted around ~mission(Location|Address), so get there and take care of it.\n\nStows out.\n\n== Stats ==\nReputation XP: +50
headhunters_killship_gen_vlrt_rank0_title_001=Wanna be a Headhunter? [50 XP]
headhunters_killship_gen_vlrt_title_001=~mission(TargetName) needs stomping [50 XP]
headhunters_killship_xenothreat_ert_desc_001=Need you to move quick on this one. There's a XenoThreat lieutenant named ~mission(TargetName) who's popped up for air. Judge thinks this is a big chance to mess with XenoThreat's command by taking them out. I heard ~mission(TargetName|Last) was spotted flying around ~mission(Location|Address), so get there quick before they disappear again.\n\nI'd bring some support, I doubt they'll go down without a fight. \n\nStows out.\n\n== Stats ==\nReputation XP: +3,200
headhunters_killship_xenothreat_ert_title_001=Ghost some XenoTrash [3,200 XP]
headhunters_maintenance_E_desc_001=One of our spots at <EM4>~mission(Location|Address)</EM4> got kinda wrecked in an attack recently and we need someone to head over there and patch things up.\n\nFrom what they tell me, you’ll need <EM4>about three fuses</EM4>, a <EM4>salvaging tool</EM4>, and <EM4>enough RMC canisters to sort out at least three pipes.</EM4> Get it done and we’ll get you paid.\n\nHopefully you know what you're doing, but just in case, the <EM4>”Guide to Maintenance”</EM4> in your mobiGlas Journal might be worth a look.\n\nStows out.\n\n== Stats ==\nTier 1: +25 XP\nTier 2: +50 XP
headhunters_maintenance_E_title_001=~mission(Location) needs some repairs [25–50 XP]
headhunters_maintenance_H_desc_001=The storms over at <EM4>~mission(Location|Address)</EM4> are getting to be a real pain in the ass. One of our outposts got absolutely reamed yesterday and needs some serious repairs so we're looking for help.\n\nFigure you'd need to bring <EM4>about six fuses</EM4>, a <EM4>salvaging tool</EM4>, and <EM4>enough RMC canisters to deal with at most eight busted pipes</EM4>. We think that’ll cover, but you'll get exact numbers on site.\n\nHell with this place.\n\nHopefully you know what you're doing, but just in case, that <EM4>“Guide to Maintenance”</EM4> in your mobiGlas Journal might be worth a look.\n\nStows out.\n\n== Stats ==\nReputation XP: +400
headhunters_maintenance_H_title_001=~mission(Location) needs massive repairs [400 XP]
headhunters_maintenance_M_desc_001=Need somebody handy with tools to pop over to <EM4>~mission(Location|Address)</EM4> and help out with some repairs. Our last repair guy knocked out most of the fixes but there's still some stuff that could use looking at.\n\nI think if you've got <EM4>six fuses</EM4>, a <EM4>salvaging tool</EM4>, and <EM4>enough RMC canisters to patch up around five pipes</EM4>, you should be covered.\n\nHopefully you know what you're doing, but just in case, the <EM4>“Guide to Maintenance”</EM4> in your mobiGlas Journal might be worth a look.\n\nStows out.\n\n== Stats ==\nReputation XP: +100
headhunters_maintenance_M_title_001=~mission(Location) needs a bunch of repairs [100 XP]
headhunters_maintenance_local_E_desc_001=Hey if you’re reading this, we need a hand. An outpost of ours down at <EM4>~mission(Location|Address)</EM4> got hit by a nasty storm and suffered some damage. None of our usual techs are available (or alive) to swing by so we wanna hire someone to go fix some fuses (no idea how many but <EM4>no more than three</EM4> I think). If you can bring a <EM4>salvaging tool</EM4> with <EM4>enough RMC canisters to sort out around three pipes</EM4>, we should be good.\n\nHopefully you know what you're doing, but just in case, the <EM4>“Guide to Maintenance”</EM4> in your mobiGlas Journal might be worth a look.\n\nStows out.\n\n== Stats ==\nTier 1: +25 XP\nTier 2: +50 XP
headhunters_maintenance_local_E_title_001=~mission(Location) needs some repairs [25–50 XP]
headhunters_missingperson_sabotage_M_desc_001=I'm not having the best day so far. I sent ~mission(TargetName) out to do a bit of destruction at ~mission(Location|Address)  and I haven't heard from them. \n\nDo me a favor, huh? Go on over and see if you can figure out what happened to ~mission(TargetName|NickOrFirst). And whatever the case, I want you to make sure their job is finished.\n\n-Stows out\n\n== Stats ==\nReputation XP: +200
headhunters_missingperson_sabotage_M_title_001=Find Headhunter Crewmember and Help Finish the Job [200 XP]
headhunters_missingperson_sabotage_VH_XT_desc_001=You ever get a bad feeling that you just can't shake? I had sent ~mission(TargetName) to take out the some XenoThreat servers at ~mission(Location|Address) and I'm starting think they ran into some serious trouble.\n\nDo me a favor, huh? Go on over and see if you can figure out what happened to them and make sure that those servers are destroyed for good.\n\n-Stows out\n\n== Stats ==\nReputation XP: +800
headhunters_missingperson_sabotage_VH_XT_title_001=Find Headhunter Crewmember and Help Finish the Job [800 XP]
headhunters_missingperson_sabotage_server_H_XT_desc_001=I'm a bit at the end of my rope. I had sent ~mission(TargetName), a pretty dependable Headhunter, out to destroy the XenoThreat data servers at ~mission(Location|Address).\n\nThat was a while ago and I still haven't heard from them and the servers are still sitting there intact. \n\nDo me a favor, huh? Go on over and see if you can figure out what happened to ~mission(TargetName|NickOrFirst) and help finish destroying the servers.\n\n-Stows out\n\n== Stats ==\nTier 1: +400 XP\nTier 2: +600 XP
headhunters_missingperson_sabotage_server_H_XT_title_001=Find Headhunter Crewmember and Help Finish the Job [400–600 XP]
headhunters_multikillship_base_Generic_M_desc_001=A lotta wannabe gangs have stepped to the Headhunters over the years thinking that they could force their way into the system. We're still here. They aren't. But it seems the survivors of these groups have decided to band together and try again. Guess some people never learn.\n\nLatest group hit a couple of our convoys while on supply runs. Shouldn't be a surprise that the Judge wants to stomp them out quick. We've learned they're out near ~mission(Location|Address) and likely rearming for another attack. \n\nWe want you to go there and make them wish they died with their old gang.\n\nStows out\n\n== Stats ==\nReputation XP: +300
headhunters_multikillship_base_Generic_M_title_001=Crash some ships [300 XP]
headhunters_sabotage_generators_E_CFP_desc_001=We got big plans about to go down but unfortunately Citizens for Prosperity have people nearby at  ~mission(Location|Address).\n\nSince I can't afford to have those bastards cockin' things up for us, I want you to go there and take out their power generators.\n\nShould keep them sidelined until we're done with our business. \n\n-Stows out\n\n== Stats ==\nReputation XP: +75
headhunters_sabotage_generators_E_CFP_title_001=Cut Citizens For Prosperity Power [75 XP]
headhunters_sabotage_generators_VE_desc_001=This is a fairly straightforward job. We got some assholes at ~mission(Location|Address) who have been thinking they're better than they are. Go and shut off their power to remind them that Headhunters are in charge.\n\n-Stows out\n\n== Stats ==\nReputation XP: +25
headhunters_sabotage_generators_VE_title_001=Shut Off Power at ~mission(Location) [25 XP]
headhunters_sabotage_generators_multi_M_desc_001=Got a few scavs that have rooted themselves into ~mission(Location|Address). We have our own plans there and need the place cleared out. \n\nThat's why I want you to ho and turn off their power. Let's see if that doesn't cause these rats to abandon the place for good.\n\n-Stows\n\n== Stats ==\nReputation XP: +200
headhunters_sabotage_generators_multi_M_title_001=Knock Power Out [200 XP]
headhunters_sabotage_servers_E_CFP_desc_001=Long story, short - a Headhunter messed up real bad and now Citizens for Prosperity has gotten their hands on some data that could really do some damage to us. \n\nThe bastard is going to need some time to heal so that leaves it to you to clean up the mess. Can you go to ~mission(Location|Address) and destroy the servers they got stored there? I wanna make sure there's no chance of this info getting out there.\n\n-Stows out\n\n== Stats ==\nReputation XP: +75
headhunters_sabotage_servers_E_CFP_title_001=Clear Citizens for Prosperity Servers [75 XP]
headhunters_sabotage_servers_H_XT_Title_001=Wipe Out XenoThreat Servers [75–1,500 XP]
headhunters_sabotage_servers_H_XT_desc_001=Something just fell into my lap that is way too good to pass up. XenoThreat's intelligence gathering is a bit of legend in the circles I run in and it turns out that they're storing a whole heap of their best intel at ~mission(Location|Address).\n\nWould be a shame if someone, say like you, were to go there and blow it all up, huh? \n\n-Stows out\n\n== Stats ==\nTier 1: +75 XP\nTier 2: +1,500 XP
headhunters_sabotage_servers_M_CFP_desc_001=Turns out those Citizens for Prosperity bastards have been gathering intel on us. They're going to try to cut us off from several revenue streams and bleed us dry. Can't let that happen. \n\nHead to ~mission(Location|Address) and destroy their data storage. \n\nThat should teach them not to stick their noses where they don't belong.\n\n-Stows out\n\n== Stats ==\nTier 1: +75 XP\nTier 2: +200 XP
headhunters_sabotage_servers_M_CFP_title_001=Wipe Citizens for Prosperity Data Farm [75–200 XP]
headhunters_sabotage_servers_VH_XT_desc_001=I'm so mad right now I can barely see straight. A Headhunter who I thought I could trust just went over to the XenoThreat. Yeah, aliens killed your family. Shit sucks, but you don't turn your back on your people. \n\nTo add insult to injury, the bastard gave XenoThreat a bunch of our intel. I have some other folks tracking the traitor down, but I need you to take care of wiping out the stolen data for me. It's being kept on servers at ~mission(Location|Address).\n\n-Stows out\n\n== Stats ==\nReputation XP: +3,200
headhunters_sabotage_servers_VH_XT_title_001=Purge XenoThreat Servers [3,200 XP]
headhunters_searchbody_danger_outpost_desc_001=Some of my people were involved with a raid over at ~mission(Location|Address). Most of them got out clean, but after the dust settled nobody is sure of what happened to ~mission(TargetName).\n\nA lot of other gangs would just leave the poor bastard to rot, but that’s not the way the Headhunters do things. I want to know for sure if ~mission(TargetName|Last) is alive or dead and I’m willing to pay you good credits to find out.\n\nJust be careful when you get there because I bet the assholes who live there are still gunning for a fight.\n\n- Stows\n\n== Stats ==\nReputation XP: +200
headhunters_searchbody_danger_outpost_title_001=Track Down ~mission(TargetName) [200 XP]
headhunters_searchbody_danger_station_desc_001=We’re on the market for a new stash house, so I sent ~mission(TargetName) over to ~mission(Location|Address). They were supposed to just have a quick look and report back to me if any of the hangars would work for us, but I haven’t heard from them since.\n\nMy guess is that someone else was already using the hangar, but I’d sleep better knowing for sure.\n\nIf the credits seem right, head over and see if you can find out what happened to ~mission(TargetName|Last). Just be careful. I’d hate to have to hire someone to find your body next.\n\nStows out.\n\n== Stats ==\nReputation XP: +200
headhunters_searchbody_danger_station_title_001=Track Down ~mission(TargetName) [200 XP]
headhunters_searchbody_nodanger_outpost_desc_001=I know better than to send someone like ~mission(TargetName) out by themselves, but that didn’t stop me from being a fool and doing it. Now the dumb SOB hasn’t returned my comms and nobody has set eyes on them in a few days.\n\nIf you got the time, I could use someone to go over to ~mission(Location|Address) and see if they’re still there. You get paid even if they wind up being dead.\n\n-Stows\n\n== Stats ==\nReputation XP: +50
headhunters_searchbody_nodanger_outpost_title_001=Anybody Seen ~mission(TargetName)? [50 XP]
headhunters_searchbody_nodanger_station_desc_001=So, I sent one of our people, a new recruit by the name ~mission(TargetName), to do a hand-off over at ~mission(Location|Address), but now the bastard’s gone missing.\n\nI’m thinking they either ran off with Headhunter credits and they’re good as dead, or they were robbed and now they’re lying there actually good as dead. Either way, I’d like for you to go have a look and see if you can find them.\n\nIf you settle the matter, I’ll give you what their cut would have been.\n\n-Stows\n\n== Stats ==\nTier 1: +25 XP\nTier 2: +50 XP
headhunters_searchbody_nodanger_station_title_001=Anybody Seen ~mission(TargetName)? [25–50 XP]
hh_killanimals_e_derelictoutpostscaves_desc_001=Headhunters need someone to take out a pack of kopions that've been giving our guys a hard time. Last saw the things at ~mission(Location|Address). There's some creds in it for you if you finish the job.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nReputation XP: +50
hh_killanimals_e_derelictoutpostscaves_title_001=Deal with Kopions at ~mission(Location) <EM4>[BP]</EM4> [50 XP]
hh_killanimals_h_derelictoutpostscaves_desc_001=Huge swarm of kopions ran down one of our Clips the other day. Never found the body. Word is they ate the poor bastard. \n\nWe need someone to head to ~mission(Location|Address) and shoot every kopion they see. Don't stop ’til the assholes are all dead. \n\nWatch your back when you go in. If you can’t guess, these bastards are mean. If you get yourself killed, that's on you. \n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nReputation XP: +200
hh_killanimals_h_derelictoutpostscaves_title_001=Butcher Kopion Pack at ~mission(Location) <EM4>[BP]</EM4> [200 XP]
hh_killanimals_m_derelictoutpostscaves_desc_001=Bunch of kopions set up shop in Headhunter territory. Mean ones. Having to fight off wild animals every few hours is making it tough to do business. \n\nIf you get rid of them for us, you get paid. Do it however you want – as long as they end up dead. \n\nYou can find them at ~mission(Location|Address).\n\n-Stows\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nReputation XP: +150
hh_killanimals_m_derelictoutpostscaves_title_001=Kill Kopions at ~mission(Location) <EM4>[BP]</EM4> [150 XP]
hh_missingperson_inv_chain_h_xenothreat_desc_01=Those XenoThreat assholes ambushed one of our outposts. We eventually kicked their ass out of there but once the cowards knew they'd been beat, they took ~mission(TargetName) hostage as a Human shield. We let 'em go, because we don't betray our own like that, but we're not planning on letting this stand. \n\nWord is that they fled to their base at ~mission(Location|Address). We need someone to break in, find ~mission(TargetName|Last), and relay the info back to me. There's a lot of creds in it for you if you do the job right. \n\nKeep in mind this isn't their only outpost in the system. If they give you the slip, you may need to track them to another sector. \n\nStows out.\n\n== Stats ==\nReputation XP: +400
hh_missingperson_inv_chain_h_xenothreat_title_01=Track Down ~mission(TargetName) [400 XP]
hh_missingperson_inv_e_criminalbase_desc_01=Sent ~mission(TargetName) out to check out a strange noise in one of our storehouses and haven't heard from them in a while. Turns out they got themselves kidnapped. We've got intel that says they're being held at ~mission(Location|Address), but we're not sure about the source. Need someone to swing by and make sure the info is legit.  \n\nWhether it's good news or bad, there are some creds in it for you. \n\nStows out.\n\n== Stats ==\nReputation XP: +50
hh_missingperson_inv_e_criminalbase_title_01=Track Down ~mission(TargetName) [50 XP]
hh_missingperson_inv_e_faunacave_desc_01=A few days back I dispatched ~mission(TargetName|Last) to scope out a cave system for potential use as a storehouse. Haven't heard from them since. \n\nMy gut tells me they ran into trouble. The local wildlife isn't known for being friendly, and ~mission(TargetName|Last) isn't exactly known for being cautious. If you're in need of some creds, I'm offering some up for anyone who can get in there and figure out what happened. \n\nStows out.\n\n== Stats ==\nTier 1: +25 XP\nTier 2: +50 XP\nTier 3: +200 XP
hh_missingperson_inv_e_faunacave_title_01=Track Down ~mission(TargetName) [25–200 XP]
hh_missingperson_inv_m_criminalbase_desc_01=Last night, some no-name drifters threw down with our enforcers and ran when things got too hot. Didn't find out 'til they were long gone, but they made off with one of our Prospects when they split. Goes by the name of ~mission(TargetName). \n\nLast we saw, they were headed in the direction ~mission(Location|Address). We need someone to head there and track down our missing Prospect. \n\nIf you take any of them down while you're at it, all the better.\n\nStows out.\n\n== Stats ==\nTier 1: +200 XP\nTier 2: +400 XP
hh_missingperson_inv_m_criminalbase_title_01=Find ~mission(TargetName|Last)\n [200–400 XP]
hurston_RetrieveConsignment_desc_001=HURSTON DYNAMICS\nOUTSOURCING DEPARTMENT\n\nCONTRACT: Facility Sweep & Package Retrieval\nCONTRACTOR AFFILIATION: Independent\nOUTSOURCE MANAGER: G. Livingston\nRISK ASSESSMENT: High\nRUSH CONTRACT: Yes\n\nHurston has learned that the Nine Tails are attacking ~mission(Location|address). Our on-site forces have suffered heavy casualties and stopped responding to comms. Initial reports indicated that the gang was attempting to obtain confidential material recently delivered to the facility. Thankfully, we have security measures in place that should give us time to respond. We need an operative to head to the facility immediately, retrieve those boxes, and deliver them to a secure location.\n\nYou and whatever backup you choose to bring are authorized to take any actions necessary when confronting the trespassers. Suspects are considered armed and dangerous. Hurston will not provide material support and/or updates regarding the status of the facility's security forces. \n\nThe confidential materials were discreetly delivered alongside other boxes in a consignment and locked in our automated vault with access codes kept on datapads held by senior security staff. However, there’s a strong chance Nine Tails may already have gotten their hands on them. You’ll need to find those datapads and then enter the codes at the package conveyor to retrieve the confidential materials. Payment will be sent once they have been delivered to ~mission(dropoff1|address). \n\n\n** The information transmitted may contain confidential and/or privileged material. Any review, retransmission, dissemination, or other use of or taking action in reliance upon this information by persons or entities other than the intended recipient is prohibited. **\n\n== Stats ==\naUEC Reward: 500
hurston_RetrieveConsignment_title_001=Defend Site and Retrieve Confidential Materials [2,000 XP]
hurston_UGF_defend_E_desc_001=HURSTON DYNAMICS\nOUTSOURCING DEPARTMENT\n\nCONTRACT: Facility Protection\nCONTRACTOR AFFILIATION: Independent\nOUTSOURCE MANAGER: T. Spooner\nRISK ASSESSMENT: High\nRUSH CONTRACT: No\n\nA small local gang has been making threats against ~mission(Location|Address) and Hurston Security is seeking a contractor to put together a security team to protect the facility against any incursions.\n\nPayment will be sent once the facility is confirmed to be safe. \n\n\n\n** The information transmitted may contain confidential and/or privileged material. Any review, retransmission, dissemination, or other use of or taking action in reliance upon this information by persons or entities other than the intended recipient is prohibited. **\n\n\n== Stats ==\naUEC Reward: 20,000\nReputation XP: +500
hurston_UGF_defend_E_title_001=Guard Facility Against Threat [500 XP]
hurston_UGF_defend_VH_desc_001=HURSTON DYNAMICS\nOUTSOURCING DEPARTMENT\n\nCONTRACT: Facility Protection\nCONTRACTOR AFFILIATION: Independent\nOUTSOURCE MANAGER: T. Spooner\nRISK ASSESSMENT: Very High\nRUSH CONTRACT: No\n\nA growing outlaw faction have been making threats against ~mission(Location|Address) and Hurston Security requires a contractor to put together a security team and guard the facility against any incursions.\n\nPayment will be sent once the facility is confirmed to be safe. \n\n\n\n** The information transmitted may contain confidential and/or privileged material. Any review, retransmission, dissemination, or other use of or taking action in reliance upon this information by persons or entities other than the intended recipient is prohibited. **\n\n\n== Stats ==\naUEC Reward: 30,000\nReputation XP: +500
hurston_UGF_defend_VH_title_001=Guard Facility Against Dangerous Hostiles [500 XP]
hurston_UGF_defend_desc_001=HURSTON DYNAMICS\nOUTSOURCING DEPARTMENT\n\nCONTRACT: Facility Protection\nCONTRACTOR AFFILIATION: Independent\nOUTSOURCE MANAGER: T. Spooner\nRISK ASSESSMENT: High\nRUSH CONTRACT: No\n\nLocal criminals have been making threats against ~mission(Location|Address) and Hurston Security is seeking a contractor to put together a security team to guard the facility against any incursions.\n\nPayment will be sent once the facility is confirmed to be safe. \n\n\n\n** The information transmitted may contain confidential and/or privileged material. Any review, retransmission, dissemination, or other use of or taking action in reliance upon this information by persons or entities other than the intended recipient is prohibited. **\n\n\n== Stats ==\naUEC Reward: 25,000\nReputation XP: +500
hurston_UGF_defend_title_001=Guard Facility Against Hostiles [500 XP]
hurston_UGF_destroy_E_desc_001=HURSTON DYNAMICS\nOUTSOURCING DEPARTMENT\n\nCONTRACT: Contraband Elimination\nCONTRACTOR AFFILIATION: Independent\nOUTSOURCE MANAGER: R. Russel\nRISK ASSESSMENT: Medium\nRUSH CONTRACT: No\n\nLocal thugs have been using ~mission(Location|Address) to manufacture large quantities of contraband. Hurston Security requires a contractor to go to the facility and destroy all contraband being stored there.\n\nPayment will be sent once all the contraband is eliminated. \n\n\n\n** The information transmitted may contain confidential and/or privileged material. Any review, retransmission, dissemination, or other use of or taking action in reliance upon this information by persons or entities other than the intended recipient is prohibited. **\n\n\n== Stats ==\naUEC Reward: 20,000\nReputation XP: +500
hurston_UGF_destroy_E_title_001=Eliminate Contraband Stash [500 XP]
hurston_UGF_destroy_H_desc_001=HURSTON DYNAMICS\nOUTSOURCING DEPARTMENT\n\nCONTRACT: Contraband Elimination\nCONTRACTOR AFFILIATION: Independent\nOUTSOURCE MANAGER: R. Russel\nRISK ASSESSMENT: Very High\nRUSH CONTRACT: No\n\nA small syndicate have been using ~mission(Location|Address) to manufacture large quantities of highly dangerous narcotics. Hurston Security is seeking a contractor to go to the facility and eliminate all the contraband being stored there.\n\nPayment will be sent once all the contraband is eliminated. \n\n\n\n** The information transmitted may contain confidential and/or privileged material. Any review, retransmission, dissemination, or other use of or taking action in reliance upon this information by persons or entities other than the intended recipient is prohibited. **\n\n\n== Stats ==\naUEC Reward: 30,000\nReputation XP: +500
hurston_UGF_destroy_H_title_001=Eliminate Narcotic Stash [500 XP]
hurston_UGF_destroy_desc_001=HURSTON DYNAMICS\nOUTSOURCING DEPARTMENT\n\nCONTRACT: Contraband Elimination\nCONTRACTOR AFFILIATION: Independent\nOUTSOURCE MANAGER: R. Russel\nRISK ASSESSMENT: High\nRUSH CONTRACT: No\n\nLocal criminals have been identified using ~mission(Location|Address) to manufacture large quantities of illegal. Hurston Security requires a contractor to go to the facility and eliminate all contraband being stored there.\n\nPayment will be sent once all the contraband is eliminated. \n\n\n\n** The information transmitted may contain confidential and/or privileged material. Any review, retransmission, dissemination, or other use of or taking action in reliance upon this information by persons or entities other than the intended recipient is prohibited. **\n\n\n== Stats ==\naUEC Reward: 25,000\nReputation XP: +500
hurston_UGF_destroy_title_001=Eliminate Drug Stash [500 XP]
hurston_UGF_eliminateall_allies_desc_001=HURSTON DYNAMICS\nOUTSOURCING DEPARTMENT\n\nCONTRACT: Facility Protection\nCONTRACTOR AFFILIATION: Independent\nOUTSOURCE MANAGER: T. Spooner\nRISK ASSESSMENT: High\nRUSH CONTRACT: No\n\nThe security personnel at ~mission(Location|Address) is being threatened by a local criminal element and Hurston Security is seeking contractors to bolster their defenses and eliminate any hostiles who attempt to breach the site.\n\nNote that you are only cleared to engage with confirmed hostiles. Assaulting any security personnel at the site will result in a breach of contract.\n\nPayment will be sent once the facility is confirmed to be safe. \n\n\n\n** The information transmitted may contain confidential and/or privileged material. Any review, retransmission, dissemination, or other use of or taking action in reliance upon this information by persons or entities other than the intended recipient is prohibited. **\n\n\n== Stats ==\naUEC Reward: 10,000\nReputation XP: +500
hurston_UGF_eliminateall_allies_desc_intro=HURSTON DYNAMICS\nOUTSOURCING DEPARTMENT\n\nCONTRACT: Facility Protection\nCONTRACTOR AFFILIATION: Independent\nOUTSOURCE MANAGER: T. Spooner\nRISK ASSESSMENT: High\nRUSH CONTRACT: No\n\nA local criminal group has been threatening ~mission(Location|Address) and Hurston Security is seeking contractors to bolster their defenses and eliminate any hostiles who attempt to breach the site.\n\nNote that you are only cleared to engage with confirmed hostiles. Assaulting any security personnel at the site will result in a breach of contract.\n\nPayment will be sent once the facility is confirmed to be safe. Successful completion of this evaluation will allow you to be considered for future work as a security contractor.\n\n\n\n** The information transmitted may contain confidential and/or privileged material. Any review, retransmission, dissemination, or other use of or taking action in reliance upon this information by persons or entities other than the intended recipient is prohibited. **\n\n\n== Stats ==\naUEC Reward: 10,000\nReputation XP: +500
hurston_UGF_eliminateall_allies_desc_rehire=HURSTON DYNAMICS\nOUTSOURCING DEPARTMENT\n\nCONTRACT: Facility Protection\nCONTRACTOR AFFILIATION: Independent\nOUTSOURCE MANAGER: T. Spooner\nRISK ASSESSMENT: High\nRUSH CONTRACT: No\n\nOur department performs periodic reevaluations of past security contractors and have determined that you may be a suitable candidate for possible reinstatement.\n\nTo reclaim your status, Hurston Security is seeking contractors to assist with eliminating a local criminal element threatening ~mission(Location|Address).\n\nNote that you are only cleared to engage with confirmed hostiles. Assaulting any security personnel at the site will result in a breach of contract.\n\nPayment will be sent once the facility is confirmed to be safe. Successful completion of this reevaluation will allow you to be considered for future work as a security contractor.\n\n\n\n** The information transmitted may contain confidential and/or privileged material. Any review, retransmission, dissemination, or other use of or taking action in reliance upon this information by persons or entities other than the intended recipient is prohibited. **\n\n\n== Stats ==\naUEC Reward: 10,000\nReputation XP: +500
