vaughn_assassination_FPS_UGF_illegal_boss_desc_001=I am not sure if you’re acquainted with ~mission(Location|Address), but ~mission(TargetName) is the one who calls the shots there. I need them eliminated.\n\nThat is easier said then done, I'm afraid. They are notoriously reluctant to see to matters personally, preferring their underlings to handle the dirty work. That said, eliminate enough of the underlings and they will have no choice but to deal with you themselves.\n\nEarnestly,\nVaughn\n\n\n== Stats ==\naUEC Reward: 37,500\nReputation XP: +8,000
vaughn_assassination_FPS_UGF_illegal_desc_001=They say there is no honor among thieves. Today, it seems, you're targeting one of your own. \n\nPlease head to ~mission(Location|Address) and kill ~mission(TargetName). What you do with the others there is entirely up to you.\n\nEarnestly,\nVaughn\n\n\n<EM4>Potential Blueprints</EM4>\n- Badami Helmet\n- Deadrig Shotgun\n- Deadrig Shotgun Magazine (8 cap)\n- Killshot Rifle\n- Killshot Rifle Magazine (45 Cap)\n- Overlord Arms Supernova\n- Overlord Core Supernova\n- Overlord Helmet Supernova\n- Overlord Legs Supernova\n- Piecemeal Armor Arms\n- Piecemeal Armor Core\n- Piecemeal Armor Legs\n\n== Stats ==\nTier 1: +1,000 XP (Failure: -500)\nTier 2: +8,000 XP (Failure: -4,000)
vaughn_assassination_FPS_UGF_illegal_title_001=All Things Come To An End <EM4>[BP]</EM4> [1,000–8,000 XP]
vaughn_assassination_FPS_UGF_legal_boss_desc_001=A senior security official by the name of ~mission(TargetName) is about to have their long career come to a very violent and sudden end. While they are currently at ~mission(Location|Address), they will not be easy to get to. I fear that a bit of work will be required to draw them out.  \n\nI recommend killing enough of their underlings that they will be forced to face you personally. Of course, once they do decide to finally show their face, it should be a rather straightforward matter. \n\nEarnestly,\nVaughn\n\n\n== Stats ==\naUEC Reward: 45,000\nReputation XP: +4,000
vaughn_assassination_FPS_UGF_legal_boss_nocivs_desc_001=A senior security official by the name of ~mission(TargetName) has been marked for termination. While they can be found at ~mission(Location|Address), they will not be easy to get to. I fear that a bit of work will be required to draw them out.  \n\nNormally, I would recommend killing enough of their underlings that they will be forced to face you personally. However, in this instance a more delicate touch is required. While you should feel free to eliminate any and all of the security forces on site, you must ensure the safety of all the civilian workers there.\n\nTiresome for sure, but a requirement none the less. \n\nEarnestly,\nVaughn\n\n\n== Stats ==\naUEC Reward: 47,500\nReputation XP: +8,000
vaughn_assassination_FPS_UGF_legal_desc_001=A security officer by the name of ~mission(TargetName) is in desperate need of an early retirement. They are currently stationed at ~mission(Location|Address) along with a host of other eager types in uniforms. \n\nFeel free to indulge your violent whims, but it is only the death of ~mission(TargetName) which will earn you my credit and thanks.\n\nEarnestly,\nVaughn\n\n\n<EM4>Potential Blueprints</EM4>\n- Carnifex Armor Core\n- Carnifex Armor Legs\n- Citadel Arms Base\n- Citadel Core Base\n- Citadel Legs Base\n- Fortifier Helmet Base\n- Pulverizer LMG\n- Pulverizer LMG Magazine (120 Cap)\n- Tripledown Pistol\n- Tripledown Pistol Magazine (12 Cap)\n\n== Stats ==\nTier 1: +500 XP (Failure: -250)\nTier 2: +4,000 XP (Failure: -2,000)
vaughn_assassination_FPS_UGF_legal_title_001=They Will Be Missed <EM4>[BP]</EM4> [500–4,000 XP]
vaughn_assassination_VE_desc_intro=Firstly, allow me to introduce myself. To put it rather dramatically, I deal in lives. \n\nPeople hire me when some soul needs to be extinguished, and I in return employ the perfect person to serve as the extinguishant. This provides security to all parties involved as none know the identity of the other. An ideal situation as far as these things go.\n\nI was recently made aware that you may possess skills that would make you of service to me and decided that it would be worthwhile to pursue the validity of this claim. \n \nIf you have any interest in forging a working relationship, I will need a demonstration of said skills. \n\nSeek out and discreetly kill ~mission(TargetName) over at ~mission(Location|Address).\n\nDo so successfully and you will be rewarded. Not only that, but you will have proven yourself worthy of further consideration.\n\nSincerely,\nVaughn\n\n\n== Stats ==\nReputation XP: +100
vaughn_assassination_VE_desc_rehire=It is not often in life that we get another chance to make a first impression, but I am going to provide to you with just that.\n\nTo say I was disappointed in how things last transpired on your last assassination attempt would be a severe understatement. However, here is your chance to prove yourself capable of more. \n\nKill ~mission(TargetName) over at ~mission(Location|Address) and I will consider the slate wiped clean. \n\nSincerely,\nVaughn\n\n\n== Stats ==\nTier 1: +50 XP\nTier 2: +500 XP (Failure: -250)
vaughn_assassination_VE_title_intro=A Chance to Impress [100 XP]
vaughn_assassination_VE_title_rehire=Another Chance to Impress [50–500 XP]
