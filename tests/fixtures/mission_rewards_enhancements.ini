LocationRush_HH_Mining_Description=Kicking the crap out of those Frontier Fighter bastards seriously depleted our supplies and now our stash of resources is practically out of stock. \n\nThat’s why you’re going to do a resupply run to<EM4> ~mission(Destination|Address). </EM4>\n\nUp to you how you get the stuff. Mine it, steal it, buy it from a trader - I don’t care as long as I get what I need refined and delivered. Might be worth checking the asteroid clusters near LaGrange points to start.\n\nI’m trustin’ you to get it done,\nStows  \n\n\n== Stats ==\nTier 1: +400 XP (Failure: -190,500)\nTier 2: +2,400 XP (Failure: -190,500)
