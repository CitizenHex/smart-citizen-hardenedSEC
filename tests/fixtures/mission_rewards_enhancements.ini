TheCollector_Ships_Drake_Golem_Dec=Universe need resources so Wikelo always respect people who dig. Good profession. If you starting and want boost to Golem ship. I can do. \n\nBring. \n\nI make.\n\n== Stats ==\nReputation XP: +30
