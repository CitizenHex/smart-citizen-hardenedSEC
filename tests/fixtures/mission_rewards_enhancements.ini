TheCollector_Ships_Anvil_Asgard_Desc=Wikelo mod Asgard and so that it fights more. You in a fight, this mod is what you want. Plus, good deal on the trade. Just bring items here and I give you the ship.\n\n== Stats ==\nReputation XP: +250
