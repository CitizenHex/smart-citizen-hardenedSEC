RAIN_CollectResources_storm_desc_001=To all available contractors,\n\nWe at Rayari are dedicating all our energy to stopping the regeneration technology crisis in its tracks, but for our scientists to continue their efforts they need resources that the company's suppliers have been unable to deliver. \n\nThere is a sizeable population of kopions that have been exposed to radiation near <EM4>~mission(Location)</EM4>. Rayari is seeking an contractor to collect <EM4>irradiated kopion horns</EM4> and deliver them to <EM4>~mission(Destination|Address)</EM4>. Due to the scarcity of this resource, we are prepared to pay a high service fee. \n\nTogether we can make the universe better for all.\n\nNarina Lerrem\nSenior Manager\nClinical Research Outsourcing\n\n== Stats ==\nReputation XP: +150
RAIN_CollectResources_storm_desc_002=To all available contractors,\n\nWe at Rayari are stopping at nothing to halt the ongoing regeneration crisis, but to continue their efforts our scientists need a rare resource that the company's suppliers cannot obtain. \n\nRayari is seeking an experienced contractor to gather <EM4>irradiated valakkar pearls</EM4>, which can be extracted from adult valakkar that have been extensively exposed to radiation. Our scans have found a qualifying population inside the storm near <EM4>~mission(Location)</EM4>. Because these animals are highly dangerous, Rayari is prepared to generously compensate anyone who can assist with gathering the pearls. \n\nOnce attained, please take these valuable resources to <EM4>~mission(Destination|Address)</EM4>.\n\nTogether we can make the universe better for all.\n\nNarina Lerrem\nSenior Manager\nClinical Research Outsourcing\n\n== Stats ==\nReputation XP: +150
RAIN_CollectResources_storm_desc_003=To all available contractors,\n\nWe at Rayari are dedicating all our energy to stopping the regeneration technology crisis in its tracks, but to continue their efforts our scientists need materials that the company's suppliers cannot obtain. \n\nRayari is seeking an experienced contractor to gather <EM4>irradiated valakkar fangs</EM4>, which can be extracted from adult valakkar that have been extensively exposed to radiation. Our scans have uncovered the existence of a qualifying population inside the storm near <EM4>~mission(Location)</EM4>. \n\nBecause these animals are highly dangerous, Rayari is offering premium pay to anyone who can assist with collecting the fangs.  \n\nOnce attained, please take these valuable resources to <EM4>~mission(Destination|Address)</EM4>.\n\nTogether we can make the universe better for all.\n\nNarina Lerrem\nSenior Manager\nClinical Research Outsourcing\n\n== Stats ==\nReputation XP: +150
RAIN_CollectResources_storm_desc_004=To all available contractors,\n\nWe at Rayari are working day and night to solve the current regen crisis, but to continue their efforts our scientists need rare resources that the company's suppliers cannot deliver. \n\nWe are therefore seeking a contractor to secure an <EM4>irradiated valakkar egg</EM4>. Our scans have confirmed several radioactive storms with known a valakkar presence on Pyro I, you can find a shuttle near <EM4>~mission(Location)</EM4> that will take you inside the storm. One more thing, analysis indicates that these eggs will decay over time, the state of the egg shouldn't affect our research but sooner would be better.\n\nDue to the health risks associated with radiation exposure that will be needed to deliver a viable sample, Rayari is ready to pay well for anyone who can safely secure and deliver this item.\n\nOnce attained, please take this valuable resource to <EM4>~mission(Destination|Address)</EM4>.\n\nTogether we can make the universe better for all.\n\nNarina Lerrem\nSenior Manager\nClinical Research Outsourcing\n\n== Stats ==\nReputation XP: +150
