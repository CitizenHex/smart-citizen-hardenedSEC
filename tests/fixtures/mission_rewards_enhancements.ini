TheCollector_Ships_Constellation_Taurus_Desc=Wikelo came across plans to build Constellation Taurus ship. Nice ship, but Wikelo make a little better. Prettier too. If you want, bring stuff.\n\n== Stats ==\nReputation XP: +250
TheCollector_Ships_Constellation_Taurus_TItle=Want Taurus ship [250 XP]
TheCollector_Ships_Crusader_A2_Desc=Bring Wikelo the things and I make you A2 Starlifter that fights better. Does war so good make you call it A1! Bye.\n\n== Stats ==\nReputation XP: +500
