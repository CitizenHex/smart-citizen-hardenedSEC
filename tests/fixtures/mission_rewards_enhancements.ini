Foxwell_bombingrun_E_desc_001=We've just received the location of an outlaw outpost where some up-and-coming criminals have been hanging out. Now, our client says there's no reason to engage these folks directly. Instead you will be targeting their supply lines.\n\nFly on over to <EM4>~mission(Location|Address)</EM4> and take out their fuel stores while dealing with any minimal resistance they may put up. It will be your call on how much you engage with the hostile forces, just don't forget that your main objective is ensuring those fuel tanks are out of action.\n\nThis is a yellow level contract so pay will be proportionate.\n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo\n\n== Stats ==\nReputation XP: +100
Foxwell_bombingrun_E_title_001=Yellow Level Contract: Disrupt Operations <EM4>[BP]</EM4> [100 XP]
Foxwell_bombingrun_H_desc_001=An opportunity has presented itself for a client to take action against a group of criminals who have been harassing their business.\n\nAccording to reports, this group of outlaws are currently laying low at <EM4>~mission(Location|Address)</EM4>. The client thinks this is a good time to catch them off guard and bring them to justice. The job is to take out their fuel tanks and putting an end to their smuggling operations once and for all.\n\nThese folks are not to be underestimated. You better bring some backup and fly low to avoid the turrets. Priority as always is the fuel tanks.\n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo\n\n== Stats ==\nReputation XP: +200
Foxwell_bombingrun_H_title_001=Orange Level Contract: Destroy Outlaw Infrastructure <EM4>[BP]</EM4> [200 XP]
Foxwell_bombingrun_M_desc_001=We're in need of a sharp contractor for a hit and run operation. Client says some local thugs have been congregating in concerning numbers and we have been tasked with disrupting their base of operations.\n\nGet on over to <EM4>~mission(Location|Address)</EM4> and take out their fuel tanks. If you're successful we can set these folks plans back a while, and most importantly, without having to deal with them directly.\n\nReports are showing there's a couple of ships buzzing around the area and some defense turrets. Just focus on the fuel tanks and you should be alright.\n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo\n\n== Stats ==\nReputation XP: +150
Foxwell_bombingrun_M_title_001=Orange Level Contract: Take Out Fuel Supplies <EM4>[BP]</EM4> [150 XP]
Foxwell_bombingrun_S_desc_001=We are looking for a highly competent mercenary team to assist with a challenging demolition for a VIP client.\n\nThe outlaws operating at <EM4>~mission(Location|Address)</EM4> has been identified as a threat of growing concern in the area and to help deal with this situation your team is being tasked with taking out the fuel tanks at the location. \n\nHowever, it won't be as easy as just slipping in and out - expect to deal with multiple hostiles and turrets that will be expecting you. The stronger your crew the better your chances at completing this operation successfully.\n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo\n\n== Stats ==\nReputation XP: +300
Foxwell_bombingrun_S_title_001=Red Level Contract: Destroy Outlaw Infrastructure <EM4>[BP]</EM4> [300 XP]
Foxwell_bombingrun_VE_desc_001=A bunch of outlaws have been harassing our client and recently things have taken a turn for the worse. They've taken over their property and we've exhausted all other options.\n\nWe need a decent pilot to head to <EM4>~mission(Location|Address)</EM4> and take out their fuel tanks. If you can cut off their supplies, you can pave the way for the client to take back their property.\n\nThis shouldn't be a tough one. You might run into a ship or two and maybe a few turrets, but you've been authorized to use lethal force. All we need for you to do is get in there, get the fuel tanks, and get out.\n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo\n\n== Stats ==\nReputation XP: +100
Foxwell_bombingrun_VE_title_001=Yellow Level Contract: Limiting Potential Threat <EM4>[BP]</EM4> [100 XP]
Foxwell_bombingrun_VH_desc_001=Foxwell have been hired by a client to take part in a multi-stage operation on a known outlaw base at <EM4>~mission(Location|Address)</EM4> and need a strong pilot to play their part in this.\n\nYou, and whatever additional support ships you arrange, will be tasked with taking out the fuel tanks located there to set the stage for the rest of the operation to follow. \n\nUnfortunately, this place is swarming with ships and anti-air turrets. So make sure you and your people are ready, and remember, the fuel tanks are your priority. No need to be a hero.\n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo\n\n== Stats ==\nReputation XP: +250
Foxwell_bombingrun_VH_title_001=Red Level Contract: Fuel Container Demolition <EM4>[BP]</EM4> [250 XP]
HaulCargo_AtoB_desc=~mission(Contractor|HaulCargo_AtoB)\n\n== Stats ==\naUEC Reward: 10,000\nReputation XP: +500
HaulCargo_MultiToSingle_desc=~mission(Contractor|HaulCargo_MultiToSingle)\n\n== Stats ==\naUEC Reward: 5,000\nReputation XP: +500
HaulCargo_SingleToMulti_desc=~mission(Contractor|HaulCargo_SingleToMulti)\n\n== Stats ==\naUEC Reward: 25,000\nReputation XP: +500
HeadHunters_RecoverCargo_Easy_Description=Managed to intercept a ship carrying some goods over at <EM4>~mission(Location|Address)</EM4> but we hit a snag - our guys didn’t have enough space in their ships to store it. You wanna make some quick creds? Head over there and grab the stuff. Could be a few scavs there by now so be on your guard.\n\nJust don’t forget to bring a <EM4>heavy-duty tractor beam</EM4> as that shit’s heavy.\n\nWhen you’re done, drop it off at the freight elevator at <EM4>~mission(Destination|Address)</EM4> and we’ll take care of the rest.\n\nStows out.\n\n== Stats ==\nReputation XP: +100
HeadHunters_RecoverCargo_Easy_Title=Taking what’s ours [100 XP]
HeadHunters_RecoverCargo_Hard_Description=Looking for a hauler to pick up some cargo for me. Thing is, there’s a catch.\n\nThe cargo’s in the back of an abandoned ship located at <EM4>~mission(Location|Address)</EM4>. As you may have figured, this ain’t our cargo, but it sure as hell doesn’t deserve to go to anyone else. I’ll be damned if those CFP assholes get their hands on it before we do.\n\nBe lucky as hell if we were the first to know about this, but I’d wager there’s gonna be more ships swarming around there than flies on a kopian carcass. If you got some pals you can trust, bring them along and ghost those assholes. And don’t forget your <EM4>heavy-duty tractor beam</EM4> of course.\n\nYou manage to get that cargo and bring it to the freight elevator at <EM4>~mission(Destination|Address)</EM4>, I can get you a nice cut of the sale.\n\nStows out.\n\n== Stats ==\nReputation XP: +200
HeadHunters_RecoverCargo_Hard_Title=Jackpot [200 XP]
HeadHunters_RecoverCargo_Medium_Description=One of our pilots was supposed to bring a shipment back to us, but seems like he got into some trouble over at <EM4>~mission(Location|Address)</EM4>. Either he got his brains blasted all over the cockpit, or freaked out and ditched his ship. For his sake, I hope it’s the first one so I don’t have the hunt this asshole down. What’s important right now is that our cargo’s just sitting out there.\n\nIf you’ve got a <EM4>heavy-duty tractor beam</EM4> and a decent ship, can you head over there and get our stuff? Chances are the assholes who attacked my pilot are still there, and I’m betting they’re pretty tough.\n\nIf you get out alive, take the cargo to the freight elevator at ~mission(Destination|Address) and I’ll get you paid.\n\nStows out.\n\n== Stats ==\nReputation XP: +150
HeadHunters_RecoverCargo_Medium_Title=Finish the job [150 XP]
HeadHunters_RecoverCargo_Super_Description=This’ll be a fun one for you. We just got word that a transport ship has broken down at <EM4>~mission(Location|Address)</EM4>. Only problem is, every skag and their mother seems to know about it. Place is crawling with all kinds of outlaws trying to get their hands on the cargo onboard. That’s where you come in.\n\nIf you can get your best pilots together and <EM4>a heavy-duty tractor beam</EM4> you can take out the competition and snag the cargo. It ain’t gonna be easy though. One of my scouts said the assholes guarding this ship have got some serious tech on them.  \n\nI’ve already got a buyer waiting, you just need to take the cargo to the freight elevator at <EM4>~mission(Destination|Address)</EM4> and I’ll send you the creds.\n\nStows out.\n\n== Stats ==\nReputation XP: +300
HeadHunters_RecoverCargo_Super_Title=Worth the trouble [300 XP]
HeadHunters_RecoverCargo_VeryEasy_Description=Just got word of an abandoned ship with a fat stack of cargo ripe for the pluckin’. If you’re interested, you’ll need to head to <EM4>~mission(Location|Address)</EM4>. Word might have gotten around, so there’s probably some skags hanging around, but just ghost them and get the stash.\n\nBring the cargo to the freight elevator at ~mission(Destination|Address) and I’ll get you your creds.\n\nMake sure you got a <EM4>heavy-duty tractor beam</EM4> on you too, no idea how big or small that cargo is.\n\nStows out.\n\n== Stats ==\nReputation XP: +50
HeadHunters_RecoverCargo_VeryEasy_Title=Grab ‘n’ go [50 XP]
HeadHunters_RecoverCargo_VeryHard_Description=Here’s the thing, I got a situation over at <EM4>~mission(Location|Address)</EM4> and need someone with a brain between their ears to sort it out for me. Former pilot of mine thought he could cut a deal with another gang and unsurprisingly it didn’t work out for him. Now my cargo is sitting idle and being guarded by a whole bunch of nullbrains waiting for their hauler to come pick it up.\n\nNeed you to head there with a <EM4>heavy-duty tractor beam</EM4> and a strong crew to get my shit back before its gone for good.\n\nTake it all to the freight elevator at <EM4>~mission(Destination|Address)</EM4> and I’ll give you a generous cut of the takings.\n\nStows out.\n\n== Stats ==\nReputation XP: +200
HeadHunters_RecoverCargo_VeryHard_Title=Getting what we deserve [200 XP]
HeadHunters_ShipAmbush_E_desc_001=Any interest in taking out a <EM4>~mission(AmbushTarget)</EM4> for us? \n\nShouldn’t be too much trouble. We’ve already done the legwork and figured out that they're scheduled to pass by <EM4>~mission(Location|Address)</EM4> soon. Just go dark in the nearby emission cloud and you’ll get a good jump on ‘em.  \n\nThey might roll through solo or with some friends. All would be single-seaters but they can hold their own in a dogfight. We’ll drop some forces in the region who can provide support once the fun starts.\n\nYou pull this off and I'll toss <EM4>~mission(ScripAmount) Council Scrip</EM4> to the main contractor for a job well done.\n\n- Stows\n\n== Stats ==\nTier 1: +100 XP\nTier 2: +1,000 XP
HeadHunters_ShipAmbush_E_title_001=Silent Strike [100–1,000 XP]
HeadHunters_ShipAmbush_H_desc_001=A squad of ships recently shanked one of our convoys, and ten credits says they’re gonna try and do it again. Looking for someone to launch a reprisal attack before that can happen.  \n\nWe’ve ID’d the idiots as consisting of several large craft and a sizable escort. We believe the leader is flying a <EM4>~mission(AmbushTarget)</EM4> and set that ship as the primary target. Since it’s a sizable and aggressive squad, a surprise attack seems like a smart play. They often pass by <EM4>~mission(Location|Address)</EM4>, which has an emission cloud to hide in. Be smart and patient then strike when the time is right. \n\nUnless you fancy yourself a real ace, it’s probably best to bring some friends. Maybe you can entice folks by letting them know they can pick through the wreckage for valuables once the deed is done.\n\nAnd on top of that, I'll give the main contractor a bonus <EM4>~mission(ScripAmount) Council Scrip</EM4> to sweeten the pot.\n\nStows out.\n\n== Stats ==\nTier 1: +200 XP\nTier 2: +2,000 XP
HeadHunters_ShipAmbush_H_title_001=Reprisal Attack [200–2,000 XP]
HeadHunters_ShipAmbush_Intro_desc_001=Got an opportunity for someone eager to show off their flying skills. Headhunters have been running afoul of this numbrain flying a<EM4>~mission(AmbushTarget)</EM4> and we’re gonna put a stop to it once and for all.\n\nYou’re gonna help us set a trap for them. See, there’s an <EM4>emission cloud</EM4> near <EM4>~mission(Location|Address)</EM4> that they fly by frequently. \n\nHead there, hide inside the cloud by powering down your ship, and attack the asshole as soon as you see ‘em and other single-seaters dumb enough to fly with them. It’ll be all you for that first hit, but we’ll put some support ships nearby to help finish the job. \n\nAnd in honor of this being your first surprise attack for us, there's a bonus of <EM4>~mission(ScripAmount) Council Scrip</EM4> for the main contractor at the end of the job. \n\nStows out.\n\n\n== Stats ==\nTier 1: +100 XP\nTier 2: +500 XP
HeadHunters_ShipAmbush_Intro_title_001=Setting a Trap [100–500 XP]
HeadHunters_ShipAmbush_M_desc_001=One of our Clips put out a kill order on a <EM4>~mission(AmbushTarget)</EM4>. Feel like making ‘em happy by taking it out?\n\nHere’s what you need to know. The target and their escort are scheduled to pass by <EM4>~mission(Location|Address)</EM4>. Looks like there’s an emission cloud nearby that can hide your ship’s sig. Wait there until you’re ready to strike. \n\nThe Clip only cares about wiping out the target. Anything of value you find floating in the wreckage is all yours. \n\nAnd on top of that, I'll give the main contractor a bonus <EM4>~mission(ScripAmount)</EM4> Council Scrip to sweeten the pot. \n\n- Stows\n\n== Stats ==\nTier 1: +150 XP\nTier 2: +2,000 XP
HeadHunters_ShipAmbush_M_title_001=Ambush Op [150–2,000 XP]
HeadHunters_ShipAmbush_S_desc_001=Headhunters are looking for someone with the skills and crew to execute an elite op. A military frigate and escort ships are stalking one of our Clips around the system. Don’t know their intentions but it can’t be good. Figure while they’ve got their eyes focused on their prize, we get someone to gather a crew to hit ‘em.  \n\nAlready got a spot picked out. If you get to <EM4>~mission(Location|Address)</EM4> there’s an emission cloud that’s exactly what we need. Head there with friends, power down your ships, and wait for the <EM4>~mission(AmbushTarget)</EM4> and its escorts to pass by. \n\nWith a bonus of <EM4>~mission(ScripAmount) Council Scrip</EM4> for the main contractor, payment alone should make this worth your while, but you can also keep anything you scrounge from the wreckage.\n\n- Stows\n\n== Stats ==\nTier 1: +300 XP\nTier 2: +16,000 XP
HeadHunters_ShipAmbush_S_title_001=Elite Op [300–16,000 XP]
HeadHunters_ShipAmbush_VE_desc_001=Some numskull flying a <EM4>~mission(AmbushTarget)</EM4> was caught spying on our ops. We ran ‘em off with a warning only to spot ‘em doing the same shit someplace else. Since they didn’t get the message, seems we gotta send a stronger one.    \n\nThere’s an emission cloud near <EM4>~mission(Location|Address)</EM4> that they fly by frequently. Primo place to power down, hide, and launch a surprise attack. Sometimes they fly solo, sometimes there’s other single-seaters with them. It’ll be all you for that first hit, but we’ll put some support ships nearby to help finish the job. \n\nAnd if you needed some extra motivation, there's a bonus of <EM4>~mission(ScripAmount) Council Scrip</EM4> for the main contractor at the end of the job. \n\nStows out.\n\n== Stats ==\nTier 1: +100 XP\nTier 2: +500 XP
HeadHunters_ShipAmbush_VE_title_001=Surprise Party [100–500 XP]
HeadHunters_ShipAmbush_VH_desc_001=Some folks don’t seem happy with us. Got word that several sub-capital ships and a number of escorts are targeting our ops. Figured the best way to keep ‘em from causing us trouble is to hit them before they hit us. \n\nWe got eyes on a <EM4>~mission(AmbushTarget)</EM4> that’s part of this squad, and it looks like they regularly pass by <EM4>~mission(Location|Address)</EM4>, a spot tailor made for a surprise attack. A nearby emission cloud can hide you and anyone you bring along for muscle.\n\nNo sugarcoating it. This ain’t gonna be easy. But the payoff should make it worth your while. Finish the job and the main contractor gets a bonus <EM4>~mission(ScripAmount) Council Scrip</EM4>. \n\nPlus, who knows what kinda good stuff you’ll find floating in all that wreckage.\n\nStows out.\n\n== Stats ==\nTier 1: +250 XP\nTier 2: +8,000 XP
HeadHunters_ShipAmbush_VH_title_001=Tactical Strike [250–8,000 XP]
Headhunters_DefendLocation_E_Desc_001=Some idiots with a deathwish are attacking our ships around <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4>. Can’t let ‘em do that without paying the price. Want to do the honors?\n\nIf so, head out and get after ‘em. The crew there is tracking the attacker’s movements and I’ll pass along situational updates as they come in. \n\nAlso, I’ll sweeten the pot by giving the main contractor a bonus of <EM4>~mission(ScripAmount) Council Scrip</EM4> just to show my appreciation. \n\nStows out.\n\n== Stats ==\nTier 1: +100 XP\nTier 2: +1,000 XP
Headhunters_DefendLocation_E_Title_001=Protect Our Site [100–1,000 XP]
Headhunters_DefendLocation_H_Desc_001=Got word that Headhunters ships heading to <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4> are coming under attack. Scans have revealed enemy forces in the wider region intent on targeting our ops. \n\nThere’s enough of them that it’s gonna take more than one person to clear away all that trash. If you can grab your gear and a few friends, I could really use you out there.  \n\nThe specific attack areas and targets are evolving. Don’t worry about the details now. Just get there and I’ll let you know where you’re needed.  \n\nHandle this right and I’ll give the main contractor a bonus <EM4>~mission(ScripAmount) Council Scrip</EM4>.\n\n- Stows\n\n== Stats ==\nTier 1: +200 XP\nTier 2: +2,000 XP
Headhunters_DefendLocation_H_Title_001=Help Headhunters at ~mission(DefendLocationWrapperLocation) [200–2,000 XP]
Headhunters_DefendLocation_M_Desc_001=Our airspace around <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4> has been compromised. Enemy ships are threatening the base and any of our ships in the area. Gotta put a stop to this immediately, so get your shit in order and get over there. Just get going and I’ll update you with any relevant info on where you’re needed. \n \nIf you need any extra motivation, I’m adding a bonus <EM4>~mission(ScripAmount) Council Scrip</EM4> for the main contractor.\n\n- Stows\n\n== Stats ==\nTier 1: +150 XP\nTier 2: +2,000 XP
Headhunters_DefendLocation_M_Title_001=Secure Our Airspace [150–2,000 XP]
Headhunters_DefendLocation_S_Desc_001=Our crew at <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4> needs help. Enemy ships are swarming the area and attacking anything and everything they can find. That’d be bad enough as is, but this site has some absolutely crucial gear and personnel that we can’t have destroyed or compromised. \n\nConsidering the size and scale of the attack, you’re gonna need a fully supplied ship and some reliable wingmen. Gather your crew, fly out to the site, and I’ll send you specifics on where you’re needed most.\n\nTo prove just how serious we are about getting this done right, the main contractor will earn a bonus <EM4>~mission(ScripAmount) Council Scrip</EM4> for making sure absolutely nothing goes wrong.\n\n- Stow\n\n== Stats ==\nTier 1: +300 XP\nTier 2: +16,000 XP
Headhunters_DefendLocation_S_Title_001=Restore Order at ~mission(DefendLocationWrapperLocation) [300–16,000 XP]
Headhunters_DefendLocation_VE_Desc_001=Headhunters flying in and out of <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4> are being harassed by some aggressive upstarts. Need them dealt with before they become a real pain in the ass.   \n\nGet there and I’ll update you on what these pests are doing so you can hunt ‘em down. \n\nClear ‘em all out I’ll throw <EM4>~mission(ScripAmount) Council Scrip</EM4> to whoever accepted this gig as a bonus.\n\n- Stows\n\n== Stats ==\nTier 1: +100 XP\nTier 2: +500 XP
Headhunters_DefendLocation_VE_Title_001=Eliminate Annoyance [100–500 XP]
Headhunters_DefendLocation_VH_Desc_001=Looking for someone who can not only dogfight but recruit others to the Headhunters cause. Our operations center at <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4>, along with any ships going to and from it, are being targeted by hostile forces. We need support there pronto. \n\nNot gonna lie, but there’s lots of heat around there. That’s why you’ll need to be fully supplied and find some trustworthy friends to fly at your wing. When you get your crew together, head out there and I’ll update you if there’s any flare ups in the area that need your attention.\n\nThis op needs to go off without a hitch, so I’m offering the main contractor a bonus <EM4>~mission(ScripAmount) Council Scrip</EM4> for a job well done. \n\nStows out.\n\n== Stats ==\nTier 1: +250 XP\nTier 2: +8,000 XP
Headhunters_DefendLocation_VH_Title_001=Stop Attack at ~mission(DefendLocationWrapperLocation) [250–8,000 XP]
Headhunters_Delivery_OutpostToStation_desc_001=Looking for someone to hand deliver a cargo crate. The package has got to go from <EM4>~mission(Location|Address)</EM4> to <EM4>~mission(Destination|Address)</EM4>. \n\nBe fast and discreet about it, ok?  A <EM4>handheld tractor beam</EM4> would also be smart to bring along. \n\n- Stows\n\n== Stats ==\nReputation XP: +50
Headhunters_Delivery_OutpostToStation_title_001=Special Cargo for ~mission(Destination) [50 XP]
Headhunters_Delivery_OutpostToTradepost_MultiToSingle_desc_001=Headhunters crews have been having a streak of good luck. I figure why take them off the job and stop them earning when I could just hire someone to deliver their spoils instead. Here’s the list of pick-ups needed:    \n\nPick up package <EM4>#~mission(Item1|SerialNumber)</EM4> at <EM4>~mission(Location|Address)</EM4>.\nPick up package <EM4>#~mission(Item4|SerialNumber)</EM4> at <EM4>~mission(Location|Address)</EM4>.\nPick up package <EM4>#~mission(Item5|SerialNumber)</EM4> at <EM4>~mission(Location1|Address)</EM4>.\nPick up package <EM4>#~mission(Item2|SerialNumber)</EM4> at <EM4>~mission(Location1|Address)</EM4>.\nPick up package <EM4>#~mission(Item3|SerialNumber)</EM4> at <EM4>~mission(Location2|Address)</EM4>.\n\nOnce you grab ‘em, everything needs to go to <EM4>~mission(Destination|Address)</EM4>.\n\nMake sure it gets done and done right. A <EM4>handheld tractor beam</EM4> would also be smart to bring along. \n\nStows out.\n\n== Stats ==\nReputation XP: +1,500
Headhunters_Delivery_OutpostToTradepost_MultiToSingle_title_001=Loaded with Loot [1,500 XP]
Headhunters_Delivery_OutpostToTradepost_desc_001=Got some goods that need to be moved up the chain for us. There are a few boxes sitting at <EM4>~mission(Location|Address)</EM4> that have to make their way to <EM4>~mission(Destination|Address)</EM4>.   \n\nNever thought when I joined the Headhunters that supply chain management would be part of my job, but someone’s gotta keep the goods flowing, I guess. \n\nA <EM4>handheld tractor beam</EM4> would also be smart to bring along. \n\nStows out.\n\n== Stats ==\nTier 1: +200 XP\nTier 2: +400 XP\nTier 3: +800 XP
Headhunters_Delivery_OutpostToTradepost_title_001=Get the Goods [200–800 XP]
Headhunters_Delivery_OutpostToXSOutpost_desc_001=Got a special delivery for a Headhunter. Problem is they were reassigned to <EM4>~mission(Location|Address)</EM4>, so I need someone to go to the main outpost, grab package <EM4>#~mission(Item1|SerialNumber)</EM4>, and take it to their new spot.   \n\nGood news is the two aren’t too far apart from each other. You could hoof it between the two, if you really want to get your cardio in for the day. Otherwise, it should be quick and easy to fly or drive it over. \n\nA <EM4>handheld tractor beam</EM4> would also be smart to bring along. \n\nStows out.\n\n== Stats ==\nReputation XP: +50
Headhunters_Delivery_OutpostToXSOutpost_title_001=Wrong Address [50 XP]
Headhunters_Delivery_Outpost_MultiToSingle_desc_001=Seems like they can’t tell their ass from their elbow over at ~mission(Location) and the place is a mess. I need help collecting supplies spread across the outpost and putting them where they’re supposed to go. Here are the specifics:\n\nPick up package <EM4>#~mission(Item1|SerialNumber)</EM4> at <EM4>~mission(Location|Address)</EM4>.\nPick up package <EM4>#~mission(Item4|SerialNumber)</EM4> at <EM4>~mission(Location|Address)</EM4>.\nPick up package <EM4>#~mission(Item5|SerialNumber)</EM4> at <EM4>~mission(Location1|Address)</EM4>.\nPick up package <EM4>#~mission(Item2|SerialNumber)</EM4> at <EM4>~mission(Location1|Address)</EM4>.\nPick up package <EM4>#~mission(Item3|SerialNumber)</EM4> at <EM4>~mission(Location2|Address)</EM4>.\n  \nAll of the above need to end up at <EM4>~mission(Destination|Address)</EM4>. Easy and low-risk work, if you’re interested.\n\nA <EM4>handheld tractor beam</EM4> would also be smart to bring along. \n \nStows out.\n\n== Stats ==\nReputation XP: +800
Headhunters_Delivery_Outpost_MultiToSingle_title_001=Consolidate Supplies at ~mission(Destination) [800 XP]
Headhunters_Delivery_Outpost_Multi_desc_001=Got a bunch of boxes sitting at <EM4>~mission(Location|Address)</EM4> that have to be moved to <EM4>~mission(Destination|Address)</EM4>. Seems easy enough, right? Well, guess it ain’t. \n\nThe idiot who was supposed to move these things threw out his back trying to carry all of ‘em at once. So, you know, maybe bring a <EM4> handheld tractor beam</EM4> and try taking ‘em one at a time like a normal person. But, hey, don’t let me tell you how to do your job. Just get it done. \n\nStows out.\n\n== Stats ==\nTier 1: +200 XP\nTier 2: +400 XP\nTier 3: +800 XP
Headhunters_Delivery_Outpost_Multi_title_001=Little Heavy Lifting at ~mission(Destination) [200–800 XP]
Headhunters_Delivery_Outpost_SingleToMulti_desc_001=Got all our prospects at ~mission(Location) busy preppin’ for an upcoming job so there’s a bunch of boxes sitting there that need to be moved to other parts of the outpost. Feel like making some easy creds doing it for us? \n\nEverything can be picked up from <EM4>~mission(Location|Address)</EM4>. Then moved around the outpost to these spots:   \n\nPackage <EM4>#~mission(Item1|SerialNumber)</EM4> to <EM4>~mission(Destination|Address)</EM4>.\nPackage <EM4>#~mission(Item4|SerialNumber)</EM4> to <EM4>~mission(Destination|Address)</EM4>.\nPackage <EM4>#~mission(Item5|SerialNumber)</EM4> to <EM4>~mission(Destination1|Address)</EM4>.\nPackage <EM4>#~mission(Item2|SerialNumber)</EM4> to <EM4>~mission(Destination1|Address)</EM4>.\nPackage <EM4>#~mission(Item3|SerialNumber)</EM4> to <EM4>~mission(Destination2|Address)</EM4>.\n\nA <EM4>handheld tractor beam</EM4> would also be smart to bring along. \n\n-Stows\n\n== Stats ==\nReputation XP: +800
Headhunters_Delivery_Outpost_SingleToMulti_title_001=Spread Some Supplies [800 XP]
Headhunters_Delivery_Outpost_desc_001=Got a box sitting at <EM4>~mission(Location|Address)</EM4> that needs to make its way over to <EM4>~mission(Destination|Address)</EM4>. Any chance you can knock this out real quick?\n\nMight be the easiest gig I’ve ever assigned out. Only real threat would be tripping over your own feet. A <EM4>handheld tractor beam</EM4> would also be smart to bring along. \n\nStows out.\n\n== Stats ==\nReputation XP: +50
Headhunters_Delivery_Outpost_title_001=~mission(Destination) Errand [50 XP]
Headhunters_Delivery_StationToOutpost_desc_001=Got a crate that needs to get to <EM4>~mission(Destination|Address)</EM4>. There’s a Clip waiting there for it. They’re a real nasty bastard too, so best not mess this up. \n\nJust grab the package from <EM4>~mission(Location|Address)</EM4>. Don’t do anything dumb with it, and you’ll be fine. A <EM4>handheld tractor beam</EM4> would also be smart to bring along. \n\nStows out.\n\n== Stats ==\nReputation XP: +50
Headhunters_Delivery_StationToOutpost_title_001=Important Cargo Run to ~mission(Destination) [50 XP]
Headhunters_Delivery_TradepostToOutpost_SingleToMulti_desc_001=Several of our outposts said that they’re running low on a few essentials. Looks like everything needed is currently at <EM4>~mission(Location|Address)</EM4>. Hiring someone to head there, grab everything, and take it to the places below.   \n\nPackage <EM4>#~mission(Item1|SerialNumber)</EM4> to <EM4>~mission(Destination|Address)</EM4>.\nPackage <EM4>#~mission(Item4|SerialNumber)</EM4> to <EM4>~mission(Destination|Address)</EM4>.\nPackage <EM4>#~mission(Item5|SerialNumber)</EM4> to <EM4>~mission(Destination1|Address)</EM4>.\nPackage <EM4>#~mission(Item2|SerialNumber)</EM4> to <EM4>~mission(Destination1|Address)</EM4>.\nPackage <EM4>#~mission(Item3|SerialNumber)</EM4> to <EM4>~mission(Destination2|Address)</EM4>.\n\nAin’t the most glamorous gig but shouldn’t be too dangerous either. A <EM4>handheld tractor beam</EM4> would also be smart to bring along. \n\nStows out.\n\n== Stats ==\nReputation XP: +1,500
Headhunters_Delivery_TradepostToOutpost_SingleToMulti_title_001=Spread Supplies [1,500 XP]
Headhunters_Delivery_TradepostToOutpost_desc_001=Our crew at ~mission(Destination) needs a restock on some essentials. Looking for someone who can be trusted to move ‘em without any ‘slippage’ or other funny business.  \n\nThe boxes are waiting at <EM4>~mission(Location|Address)</EM4> and need to be dropped at <EM4>~mission(Destination|Address)</EM4>. Any interest?   \n\nA <EM4>handheld tractor beam</EM4> would also be smart to bring along. \n\n-Stows\n\n== Stats ==\nTier 1: +200 XP\nTier 2: +400 XP\nTier 3: +800 XP
Headhunters_Delivery_TradepostToOutpost_title_001=~mission(Destination) Restock Run [200–800 XP]
Headhunters_Delivery_TradepostToTradepost_desc_001=Headhunters got people placed all across the system. Keeping them all stocked and ready to rock if something goes down is essential to our success. Got a cargo run here that’ll help us do just that. \n\nWe got some crates sitting at <EM4>~mission(Destination|Address)</EM4> that need to move across the system to <EM4>~mission(Location|Address)</EM4>. Think you can handle this for us?\n\nA <EM4>handheld tractor beam</EM4> would also be smart to bring along. \n\n-Stows\n\n== Stats ==\nReputation XP: +400
Headhunters_Delivery_TradepostToTradepost_title_001=Shuffle Supplies Across System [400 XP]
Headhunters_HaulCargo_AToB_OLP_Illegal_desc_01=Need someone to snag some cargo for us. We were using an old Hathor PAF for dead drops, but a local gang has dug in and we can’t get our shit.\n\nIf you feel like kicking some ass, grab the cargo from the freight elevator at <EM4>~mission(Location|Address)</EM4> and deliver it to the freight elevator at <EM4>~mission(Destination|Address)</EM4>. \n\nFrom what I’ve heard this place is full of all sorts. Won’t be easy getting out stuff back, but that’s what we’re paying you for.\n\nJust make sure you got a ship that can handle a <EM4>~mission(MissionMaxSCUSize)</EM4> load, and try not to get shot in the process. A <EM4>handheld tractor beam</EM4> would also be smart to bring along. \n\nStows out.\n\n== Stats ==\nReputation XP: +1,000
Headhunters_HaulCargo_AToB_OLP_title_01=Cargo Retrieval [1,000 XP]
Headhunters_HaulCargo_AToB_PAF_Illegal_desc_01=I won’t bore you with the details, all you need to know is: one of our haulers got attacked and now our goods are sitting in a freight elevator at <EM4>~mission(Location|Address)</EM4>. \n\nUp to you how you get the goods out, but if you happen to ghost a few of our rivals in the process, I ain’t complaining. Once you’ve got the stuff take it to the freight elevator at <EM4>~mission(Destination|Address)</EM4>, then we can sort your payment. \n\nA <EM4>handheld tractor beam</EM4> would also be smart to bring along. \n\nStows out.\n\n== Stats ==\nReputation XP: +1,000
Headhunters_HaulCargo_AToB_PAF_title_01=Stock Taking [1,000 XP]
Headhunters_HaulCargo_MultiToSingle_desc_01=We’ve been using the old Hathor <EM4>~mission(Location1|Address)</EM4> and <EM4>~mission(Location2|Address)</EM4> as stashes, but it turns out some over-eager nullbrains sniffed them out and are trying to boost our shit for their own.\n\nLuckily, the goods are still there - for now. We need someone to visit that PAF and OLP, grab our stuff from the freight elevators, and take it to the freight elevator at <EM4>~mission(Destination|Address)</EM4> where we should be able to keep it on ice. \n\nHere’s the list of what to grab. Don’t care what order you do ‘em in. Be sure to bring a ship that can store <EM4>~mission(MissionMaxSCUSize)</EM4> at the very least. \n\n~mission(MultiToSingleToken)\n\nMake sure you’re ready to deal with whatever assholes you run across. A <EM4>handheld tractor beam</EM4> would also be smart to bring along. \n\nStows out.\n\n== Stats ==\nReputation XP: +1,000
Headhunters_HaulCargo_MultiToSingle_title_01=Getting Our Goods Back [1,000 XP]
Headhunters_RetrieveCargo_CrimBase_E_desc_001=Just got a frantic comm from a ~mission(Ship) that cut out quite dramatically. Seems like they were dumb enough to get lured into a trap, even though I made it damn clear that getting those goods to ~mission(Destination|Address) was all they should worry about.   \n \nWell, it looks like they failed. Trackers hidden in the cargo now show it at ~mission(Location|Address). Time to send in backup to reclaim our goods and teach a lesson to those who took it. You interested in delivering that message then delivering the goods?\n\n- Stows\n\n== Stats ==\nReputation XP: +150
Headhunters_RetrieveCargo_CrimBase_E_title_001=Return Goods [150 XP]
Headhunters_RetrieveCargo_CrimBase_H_desc_001=Need someone to raid a base at ~mission(Location|Address) for us. Not sure exactly who’s dug in there, but they attacked one of our ships and took the drugs they were hauling. Really need that shit back. That batch is full of high potency stuff that’s worth a premium. \n\nDoubt they’ll want to give it back to you, so plan to take it by force. Then bring the goods to ~mission(Destination|Address). And don’t act like an idiot and get any ideas of what you could do with that stuff. Trust me, you don’t wanna get on my bad side. \n\n- Stows\n\n== Stats ==\nReputation XP: +1,200
Headhunters_RetrieveCargo_CrimBase_H_title_001=Get the Good Stuff [1,200 XP]
Headhunters_RetrieveCargo_CrimBase_XT_VH_desc_001=An informant passed along some interesting news. XenoThreat are about to do a massive ammo resupply run for their forces, and in preparation, they’ve brought all that cargo to ~mission(Location|Address). Seems like a prime time to strike. You interested in killing a bunch of Xenos and then stealing their ammo for us?    \n\nIf so, get your shit in order and then clear that base. Once done, grab all the ammo and bring it to ~mission(Destination|Address). You’ll get paid well, and I’m sure we’ll find something fun to do with all that ammo. \n\nStows out.\n\n== Stats ==\nReputation XP: +2,400
Headhunters_RetrieveCargo_CrimBase_XT_VH_title_001=Two Birds, One Stone [2,400 XP]
Headhunters_RetrieveCargo_Intro_desc_001=Heahunters are on the lookout for motivated and competent contractors who can be trusted to do a wide range of work supporting our operations. If you think you have what it takes, I’ve got a mission here that’ll test your skills in several ways. \n\nA ~mission(Ship) transporting cargo for us is currently under attack at ~mission(Location|Address). Don’t think it’s looking good for our ship, but that cargo is too important to let fall into someone else’s hands. Need you to head to the location and deal with the attackers before they get away, then collect our cargo and take it to ~mission(Destination|Address). \n\nIf you can handle this, then there'll be lots more work I can send your way.  \n\nStows out.\n\n== Stats ==\nReputation XP: +25
Headhunters_RetrieveCargo_Intro_title_001=Test Your Mettle [25 XP]
Headhunters_RetrieveCargo_Lagrange_E_desc_001=Someone with a death wish attacked one of our ships hauling some primo product. Our crew on the scene is outta commission, so we need someone to get there fast and recover the stash before those bozos make off with it. Any chance you can handle this for us?  \n  \nLooks like the attack went down at ~mission(Location|Address). Head over there and deal with the attackers before they get away. Then grab the goods from the ~mission(Ship) and take ‘em to ~mission(Destination|Address). Oh, and don’t be an idiot and get high on that supply, unless you want me to send someone after you next. \n\n- Stows\n\n== Stats ==\nReputation XP: +25
Headhunters_RetrieveCargo_Lagrange_E_desc_002=Just lost contact with a ~mission(Ship) on an important run. Before they went dark, the crew was convinced someone was following them, so I’d put money on them being under attack. \n\nLooking for someone to get their ass over to ~mission(Location|Address) to search for the ship and retrieve the goods. If I’m right, there will be some uninvited guests hanging around that will need to be dealt with too. Once you’ve secured the stuff, it needs to go to ~mission(Destination|Address).   \n\nYou down to crack a few skulls and lug some cargo. Sounds simple enough, right? \n\nStows out.\n\n== Stats ==\nReputation XP: +150
Headhunters_RetrieveCargo_Lagrange_E_title_001=Get Our Shit! [25 XP]
Headhunters_RetrieveCargo_Lagrange_E_title_002=Search for Ship [150 XP]
Headhunters_RetrieveCargo_OccuCave_M_desc_001=Some crew whose name doesn’t even deserve to cross my lips stole a bunch of our supplies, and then hid them in ~mission(Location|Address). As if we wouldn’t be able to track them down. Now that we know where they hid the goods it’s time to make them pay. \n\nInterested in raiding that cave and getting our shit back? Do your worst to whoever’s inside just don’t damage our goods. Then bring everything to  ~mission(Destination|Address). Sounds kinda fun. Makes me miss my days when I applied my other skills to help the gang.\n\nStows out.\n\n== Stats ==\nReputation XP: +50
Headhunters_RetrieveCargo_OccuCave_M_title_001=Cave Raid [50 XP]
Headhunters_RetrieveCargo_RegionLink_E_desc_001=Not sure what happened, but a ship moving some important supplies across the system disappeared around ~mission(Location|Address). Our crew at ~mission(Destination|Address) really needs that cargo for an upcoming operation. Any chance you could go looking for the ship and help complete the delivery?\n\nHave no idea what happened, but my bet’s that they got ghosted. Maybe it’s just me, but I’d rather be a prepared pessimist and an ill-equipped optimist. \n\n- Stows\n\n== Stats ==\nReputation XP: +150
Headhunters_RetrieveCargo_RegionLink_E_title_001=Gone But Not Forgotten [150 XP]
Headhunters_SabotageRelays_CFP_001_Desc=CFP think they’re safe over at <EM4>~mission(Location|Address)</EM4> but we got big plans for them. You’re gonna pave the way for us by heading there and shutting down their comm towers.\n\nThere should be a <EM4>control terminal at the top</EM4> that you can use to shut the tower down. You get that sorted and they won’t be able to call for backup. Then we can show those skags who this system belongs to.\n\nMost outposts use the same system, so this’ll come in handy next time you want to make sure reinforcements don’t mess with you.\n\n\nStows out.\n\n== Stats ==\nReputation XP: +75
Headhunters_SabotageRelays_CFP_001_Title=Shutdown CFP’s Comms [75 XP]
Headhunters_SabotageRelays_XT_001_Desc=We’re making a play to hit some XenoThreat assholes where it hurts but need to be smart about it. That’s why we’re sending you in first to take out their comm towers so they can’t call for backup. You do that and we can be in and out before they know it.\n\nHead to <EM4>~mission(Location|Address)</EM4> and climb the comm towers there. Should be a <EM4>control panel at the top</EM4> you can use to switch them off.\n\nIn fact, same goes for most other outposts. Rather than having to deal with reinforcements, you can just turn off the comm towers. But hey, if you wanna ring the bell to ghost a few more Xenothreat I ain’t complaining.\n\n\nStows out.\n\n== Stats ==\nReputation XP: +100
Headhunters_SabotageRelays_XT_001_Title=Silence the Xenothreat [100 XP]
Headhunters_Salvage_FPS_desc_001=Need a hand taking care of some scrap at ~mission(Location|Address). The team there put it all in one place but can’t be bothered to salvage it. Just clear it out for them to get some RMC and make some easy creds. \n\n- Stows  \n\n\n== Stats ==\nReputation XP: +25
Headhunters_Salvage_FPS_title_001=Scrap Salvage at ~mission(Location) [25 XP]
Headhunters_SecurityPatrol_E_Desc_001=Headhunters have been expanding, but still need help getting a lay of our new territory. I’ve got a run to check spots we want scanned ready to go. \n\nThis one kicks off at the <EM4>location marker</EM4> on your HUD and will look at a few more locations after that, but I’ll update you as we clear them out. Not expecting you to run into any trouble but no guarantees. Trouble seems to follow us.\n\nGet this done and I'll toss the main contractor <EM4>~mission(ScripAmount) Council Scrip</EM4> as a thanks.\n\nStows out.\n\n== Stats ==\nTier 1: +100 XP\nTier 2: +1,000 XP
Headhunters_SecurityPatrol_E_Title_001=Scout and Scan [100–1,000 XP]
Headhunters_SecurityPatrol_H_Desc_001=I’ve noticed an uptick in attacks on Headhunter ships and it's got me feelin' jumpy. Got an important resupply shipment that we can’t afford to lose, and need help determining what route to send it. I’ve strung together a few potential spots that I’d set up in if I was gonna hit ‘em. Any chance you could visit and clear out any lowlifes that may be hiding there? \n\nThe route starts at the <EM4>location marker</EM4> on your HUD. After you scan it and clear whatever’s there, I’ll send you to a few other areas that could work. I’ve been hearing people have been rolling through these spots, so would be smart to <EM4>bring a friend</EM4> to watch your back.\n\nYou make it to the end and I'll give the main contractor a bonus <EM4>~mission(ScripAmount) Council Scrip</EM4> as thanks. \n\n- Stows\n\n== Stats ==\nTier 1: +200 XP\nTier 2: +2,000 XP
Headhunters_SecurityPatrol_H_Title_001=Looking For Trouble [200–2,000 XP]
Headhunters_SecurityPatrol_M_Desc_001=The local Clip wants current intel on several of our sectors. Not sure what they’re looking for but I’m not about to ask. My job is to find someone willing to swing through and scan these locations. You available? \n\nAll you need to do is head to the <EM4>location marker</EM4> on your HUD, run a scan, and if it’s clear, move to the next spot. If you run into any issues, take care of it. \n\nAin’t sound too tough now does it? Plus, I'll give the main contractor a bonus <EM4>~mission(ScripAmount) Council Scrip</EM4> as thanks. \n\n\nStows out.\n\n== Stats ==\nTier 1: +150 XP\nTier 2: +2,000 XP
Headhunters_SecurityPatrol_M_Title_001=Space Patrol [150–2,000 XP]
Headhunters_SecurityPatrol_S_Desc_001=Got some asshole’s trying to push us out of the system. You up for pushing back?\n\nSee, there are some folks who really don’t want us here, and have started sending out hunting parties of five to seven ships, often with a bigger gun ship, to places where we’re building up our presence. Time for us to show that we’re here to stay.  \n\nI’ve strung together a few spots starting at the <EM4>location marker</EM4> on your HUD where we’re seeing the most hostile encounters. Need you to visit each one and scan to see if we can bait them into a fight.\n\nKnow this is going to be a hard one, so don't be cocky and try to go it alone. If I were you, I'd bring at least <EM4>three friends</EM4> onboard for support. To make it worth your while, I'm promising a bonus of <EM4>~mission(ScripAmount) Council Scrip</EM4> to the main contractor that pulls it off. \n\n- Stows\n\n== Stats ==\nTier 1: +300 XP\nTier 2: +16,000 XP
Headhunters_SecurityPatrol_S_Title_001=Hunt Some Heads [300–16,000 XP]
Headhunters_SecurityPatrol_VE_Desc_001=Headhunters want some intel on what’s happening around territory. We’ve already set up some monitoring satellites, but nothing beats a good ol’ patrol. You up for it?\n\nIf so, get on over to the <EM4>location marker</EM4> on your HUD. Start by scanning that region and then we’ll guide you to a few more spots that we want info on. \n\nAnd if you needed some extra motivation, there's a bonus of <EM4>~mission(ScripAmount) Council Scrip</EM4> for the main contractor at the end of the job. \n\n- Stows\n\n== Stats ==\nTier 1: +100 XP\nTier 2: +500 XP
Headhunters_SecurityPatrol_VE_Title_001=See What’s Out There [100–500 XP]
Headhunters_SecurityPatrol_VH_Desc_001=We’re getting pushback from folks who don’t seem happy that we’re here. Folks have gotten keen to our haunts and started sending out squads to hit our ships. You down to visit a few of those spots to show that we won’t be scared off? \n\nIf so, start by seeing what’s around the <EM4>location marker</EM4> on your HUD. From there I’ll guide you to a few other hotspots that we need checked. Better get your shit in order before heading out. I'd recommend loading up on ammo and convincing <EM4>two friends</EM4> to join the patrol.\n\nYou do this for the Headhunters and I'll see to it that the main contractor gets a bonus of <EM4>~mission(ScripAmount) Council Scrip</EM4>. \n\nStows out.\n\n== Stats ==\nTier 1: +250 XP\nTier 2: +8,000 XP
Headhunters_SecurityPatrol_VH_Title_001=Stand Our Ground [250–8,000 XP]
Headhunters_bounty_desc_001=The Headhunters recently loaned credits to ~mission(TargetName) under some clear conditions. Specifically, pay us back or we’ll kill you. Wild to think that wasn’t enough of an incentive, but here we are past the payment deadline. Now as much as we like ~mission(TargetName|First), I need you to make good on our promise.\n\n~mission(TargetName|Last) was last seen at ~mission(Location|Address). Track ‘em down, ghost ‘em, and get paid. It’s as simple as that. \n\nStows out.\n\n== Stats ==\naUEC Reward: 5,500\nReputation XP: +50
Headhunters_bounty_desc_002=Time is up for ~mission(TargetName). The skav is way past due on paying back the Headhunters, so I need you to punch them out. \n\nKill ‘em, not hit ‘em, just in case that’s unclear. \n\nSomeone recently spotted ~mission(TargetName|Last) around ~mission(Location|Address), so head there and take ‘em out.  \n\nFull disclosure, we’ve gotten reports they used some of our creds to hire extra protection. Prepare accordingly. \n\nStows out.\n\n== Stats ==\naUEC Reward: 7,500\nReputation XP: +100
Headhunters_bounty_desc_003=~mission(TargetName) borrowed a bunch of creds from the Headhunters and thought the smart move was to try and hide instead of paying us back, so I need someone to make an example of ~mission(TargetName|Last).\n\nThey were just spotted at ~mission(Location|Address), so I’d recommend heading there now before the trail goes cold. ~mission(TargetName|Last) is a paranoid sort, so don’t be surprised if they’re not alone. Handle it however you want as long as ~mission(TargetName|Last) is dust when you’re done.   \n\nStows out.\n\n== Stats ==\naUEC Reward: 9,500\nReputation XP: +250
Headhunters_bounty_title_001=Deadbeat [50 XP]
Headhunters_bounty_title_002=Past Due [100 XP]
Headhunters_bounty_title_003=Collection Notice [250 XP]
Headhunters_bounty_xenothreat_desc_001=Headhunters got word there’s a XenoThreat op in the works that's targeting one of our crews. We don’t have precise details about the plan but we know that ~mission(TargetName) is organizing it. Instead of sitting back and waiting for something to happen, we’ve decided to be proactive. \n\n~mission(TargetName|Last) was just spotted with others around ~mission(Location|Address). We can’t mobilize anyone fast enough to get there. I want you to rush there and deliver a preemptive strike.   \n\nStows out.\n\n== Stats ==\naUEC Reward: 9,000
Headhunters_bounty_xenothreat_desc_002=XenoThreat recently hit a Headhunters' stronghold. I’ll spare you the details, but they did some truly heinous shit to our crew. We’ve identified the leader of the op as ~mission(TargetName) and are looking for a little payback. We don’t care what you do to get the job done. Only that ~mission(TargetName|Last) is dead. \n\nA source just told us that you can track down this XenoThreat scum over at ~mission(Location|Address). This sicko’s a pro and never travels alone, so don’t expect taking them out to be a walk in the park.  \n\nStows out.\n\n== Stats ==\naUEC Reward: 12,000
Headhunters_bounty_xenothreat_desc_003=~mission(TargetName) was recently revealed to be a mole for XenoThreat. It all makes sense now because the skav was a major asshole. Unfortunately, they split before we could handle it ourselves. \n\nBased on all they learned about our ops, we need ‘em taken out pronto. They see one of us coming and they’ll just run again, but I figured someone like you has a better chance of getting close enough for a killshot. \n\nWe just got word ~mission(TargetName|Last) was hanging around ~mission(Location|Address). Looks like there’s other ships around protecting ‘em too. Think you got the skill to rid the ‘verse of a traitorous bastard and their bastard friends?  \n\nStows out.\n\n\n== Stats ==\naUEC Reward: 15,000
Headhunters_claimsweep_desc_easy=Some numbskull is trying to dig up dirt on the Headhunters. Some orbital sentries were dropped at ~mission(location|address) to spy on us. We’ve also spotted a ship checking on them. Simple proposition for you. Go wipe out the sentries there and we’ll pay you for it. That sound like something you’d be into?\n\nAs for the ship, you can do whatever you want with it, but if it spots you, don’t be surprised if it tries to go get some back up. That’s just how these things go.\n\nStows out.\n\n== Stats ==\naUEC Reward: 10,000\nReputation XP: +50
Headhunters_claimsweep_desc_hard=Some idiots think they can blatantly spy on the Headhunters and get away with it. They’ve set up several orbital sentries at ~mission(location|address) and have a few ships patrolling the area. We don’t know who’s behind it but we honestly don’t care. We just need it gone. \n\nLet us know if you feel like putting some real brash bastards in their place. We’ll pay you well and deliver the creds the second the job is done. \n\nKeep in mind that it’s really only the sentries we care about. The ships they got patrolling are only a concern if they get in your way or if they try to call in some friends to stop you. \n \nStows out.\n\n== Stats ==\naUEC Reward: 20,000\nReputation XP: +250
Headhunters_claimsweep_desc_intro=Got a minor annoyance the Headhunters need dealt with. There's an orbital sentry at ~mission(location|address) that some pesky little troublemaker set up to spy on our ops. Want to make some easy creds and go blow it up for us?\n\nStows out.\n\n== Stats ==\naUEC Reward: 5,000\nReputation XP: +50
Headhunters_claimsweep_desc_medium=Headhunters are looking for a merc to do a little clean up for us. Found out that someone’s trying to spy on us over at ~mission(location|address). Can’t let that stand. We need a skilled operator to take care of the orbital sentries they dropped there, and if needed, deal with any of their ships that get in your way. Seems like a decently run op, so hitting it might not be easy but it sure should be fun. \n\nLet us know if you’re the right one for the gig. Creds will be transferred once our scans show it’s gone. \n\nStows out.\n\n== Stats ==\naUEC Reward: 15,000\nReputation XP: +100
Headhunters_claimsweep_desc_rand=Headhunters recently discovered some orbital sentries focused on our operations and we don’t like it one bit. I’m looking to pay someone to go to ~mission(location|address) and make it abundantly clear they should stay the hell out of our business. Doubt they’ll be receptive to a discussion about it, so I’d be prepared to evict them with extreme force. \n\nBased on our scans, this won’t be a walk in the park. Wouldn’t be a bad idea to come prepared with plenty of ammo. Payment will be sent promptly once the job is done. \n\nStows out.\n\n== Stats ==\naUEC Reward: 22,000\nReputation XP: +100
Headhunters_claimsweep_title_easy=Eliminate Eavesdroppers [50 XP]
Headhunters_claimsweep_title_hard=Exterminate Eavesdroppers [250 XP]
Headhunters_claimsweep_title_intro=Erase Eavesdropper [50 XP]
Headhunters_claimsweep_title_medium=Eradicate Eavesdroppers [100 XP]
Headhunters_claimsweep_title_rand=Execute Eavesdroppers [100 XP]
Headhunters_defend_XT_H_desc_001=Not sure how familiar you are with what’s going down in Pyro, but we’re currently in a hell of a turf war with XenoThreat. It’s been pretty brutal lately, and I just learned that XenoThreat are about to attack ~mission(Location|Address). Thing is that I can’t rally any Clips to get there in time to defend it, so I need you to do it for us. \n\nGrab your gear, get some friends, and get to the location as fast as you can. Xenos like to stagger the arrival of their troops, so don’t blow through all your ammo during the initial defense ‘cause there’s a good chance more are coming. \n\nKeep them from taking over the site and I’ll pay you for the trouble.\n\n-Stows out\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nReputation XP: +150
Headhunters_defend_XT_H_title_001=Halt XenoThreat Expansion <EM4>[BP]</EM4> [150 XP]
Headhunters_defend_XT_VH_desc_001=XenoThreat are on the warpath right now. They’ve launched simultaneous attacks on several Headhunters sites and stretched our fighters thin. Got word they’re planning to storm ~mission(Location|Address) next, and we can’t get anyone there to defend it. \n\nI’m looking to pay someone to pull together a crew, gather supplies, and mount a strong defense for us. Gonna be honest with you, this is shaping up to be a hell of a fight. Xenos are sending some of their most experienced forces there. Not much else I can say except that they’ll probably stagger the arrival of their forces, wipe them all out and you’ll be paid handsomely. \n\nThink you can rise to the occasion?  \n\n-Stows\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nReputation XP: +200
Headhunters_defend_XT_VH_title_001=Block XenoThreat Expansion <EM4>[BP]</EM4> [200 XP]
Headhunters_eliminateall_caves_desc_01=Hey,\n\nSome two-bit thugs are holed up in ~mission(Location|Address). Wouldn’t pay them any mind, except the arrogant skags tried to hit an outpost under our protection.\n\nWe chased 'em off with little trouble, but we can't let that kind of disrespect go unpunished. Our Clips are busy with some bigger fish, so we'd like you to take care of this for us. \n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nReputation XP: +50
Headhunters_eliminateall_caves_title_01=A Swift Reprisal <EM4>[BP]</EM4> [50 XP]
Headhunters_theft_DerelictOutpost_E_desc_001=Get this. There’s a new crew trying to make a name for themselves. From what I’ve heard, they’re in way over their head, but that didn’t stop them from spending some serious creds to acquire ~mission(Item).\n\nCurrently, some of them are holed up at ~mission(Location|Address). Go there, relieve them, of the ~mission(Item), and then bring it to ~mission(Destination|Address). Hopefully when word of what happened there spreads to the rest of the crew, they’ll reconsider their choices in life. \n\nStows out.\n\n== Stats ==\nReputation XP: +200
Headhunters_theft_DerelictOutpost_E_title_001=Commandeer Supplies [200 XP]
Headhunters_theft_OccuCave_CFP_M_desc_001=CFP recently got a delivery of ~mission(Item) that we want. Think they know that too, because they hid it in a cave near ~mission(Location|Address) and have a handful of mercs watching over it. Let’s show ‘em that nothing gets by the Headhunters around here.  \n\nRaid the cave, grabs the goods, and bring them to ~mission(Destination|Address). Sound like a plan?\n\n- Stows\n\n== Stats ==\nReputation XP: +50
Headhunters_theft_OccuCave_CFP_M_title_001=Cave Raid [50 XP]
Headhunters_theft_RegionLink_E_desc_001=One of our Judges put out a bulletin asking Headhunters to keep an eye on for ~mission(Item). Got word yesterday that some can be found at ~mission(Location|Address). Feel like making a high ranking Headhunter happy?\n\nAll you need to do is get your hands on the goods then run ‘em across system to ~mission(Destination|Address).\n\nStows out.\n\n== Stats ==\nReputation XP: +400
Headhunters_theft_RegionLink_E_title_001=Grab Requested Goods [400 XP]
Headhunters_theft_XSOutpost_CFP_E_desc_001=Been looking for ~mission(Item), and one of our people inside CFP let me know some was just delivered to ~mission(Location|Address). Should only be a few soft CFP guards around for you to deal with. Then grab the shit and bring it to ~mission(Destination|Address).\n\nStows out.\n\n== Stats ==\nReputation XP: +200
Headhunters_theft_XSOutpost_CFP_E_title_001=Easy Pickings [200 XP]
Headhunters_theft_XSOutpost_M_desc_001=Less you know about this the better. Trust me. \n\nThere’s some ~mission(Item) sitting at ~mission(Location|Address). Go deal with anyone there and steal it. Then hustle it over to ~mission(Destination|Address). \n\nShould be a breezy job and easy creds, so get it done. \n\n- Stows\n\n== Stats ==\nReputation XP: +200
Headhunters_theft_XSOutpost_M_title_001=Steal Some ~mission(Item) [200 XP]
Headhunters_theft_XSOutpost_XT_H_desc_001=We’ve been watching ~mission(Location|Address) for a while. Felt like a primo XenoThreat spot to hit, since there are fewer guards around protecting the goods, but didn’t want to kick down the door until we knew something worthwhile was inside. Well, that glorious day has come.   \n\nGot word that the latest delivery left ~mission(Item) there. We want to get our hands on it, so are looking for someone who can swipe it and then bring it to ~mission(Destination|Address). Sure the forces there won’t make it easy for you, but do this right and try to get out before anyone from the main outpost knows what’s going on.    \n\n- Stows\n\n== Stats ==\nReputation XP: +800
Headhunters_theft_XSOutpost_XT_H_title_001=Steal and Slip Away [800 XP]
Headhunters_theft_intro_desc_001=Headhunters are always on the lookout for talented folks that can quickly and discreetly acquire items that we have our eye on. If that’s you, I’ve got a job that should test your skills. Ace it and I have plenty more I can start sending your way.  \n\nThere’s a crate of ~mission(Item) currently at ~mission(Location|Address). Go liberate it from its current owners and deliver it to ~mission(Destination|Address). Should be quick and easy. \n\n- Stows\n\n== Stats ==\nReputation XP: +25
Headhunters_theft_intro_title_001=Sticky Fingers [25 XP]
Headhunters_theft_outpost_CFP_M_desc_001=Our crew at ~mission(Destination|Address) is running low on ~mission(Item). Want to get them restocked, and know that the CFP outpost at ~mission(Location|Address) has some lying around. Wanna go there and grab it for us?\n\n- Stows\n\n== Stats ==\nReputation XP: +800
Headhunters_theft_outpost_CFP_M_title_001=Time to Resupply [800 XP]
Headhunters_theft_outpost_XT_VH_title_001=Smash and Dash\n\n== Stats ==\nReputation XP: +600
HexPenetrator_Bounty_desc=Our analysts have examined the intel seized from those XenoThreat recon teams but the data appears to be locked behind a sophisticated encryption system and requires a custom cryptokey to access.\n\nWe've managed to locate several XenoThreat lieutenants operating in the system, you are to find and engage the suspects and see if they are in possession of a cryptokey that will allows us to access the intel.\n\nAs a reminder, the military has generously donated some old F7A Hornets for CDF members who see this initiative through to the end.\n\n== Stats ==\naUEC Reward: 19,500
HexPenetrator_Comm_Description=One of the suspects captured during the recent attacks revealed that XenoThreat is looking to remotely access a number of comm arrays around the system.\n\nHaving XenoThreat listening into comms is extremely dangerous for the people living here, so the CDF has been enlisted to reset the comm array, then defend it from any XenoThreat Vanguards that will attempt to reconnect to the servers. \n\nOnce those Vanguards have been defeated, clear out any remaining hostile ships in the area.\n\nAs a reminder, the military has generously donated some old F7A Hornets for CDF members who see this initiative through to the end.\n\n== Stats ==\naUEC Reward: 8,500
HexPenetrator_DataHeist_description=We've received tips that XenoThreat's intending to launch another attack on Stanton system. The CDF has petitioned the Advocacy to create a new initiative called Operation Overdrive to stop this attack before it happens. \n\nThe CDF is dispatching volunteers to infiltrate and obtain any intel that could give insight into what they're planning. Needless to say, expect heavy resistance from any XenoThreat on site.\n\nAs an added incentive, the military has generously donated some old F7A Hornets for CDF members who see this initiative through to the end.\n\n== Stats ==\naUEC Reward: 23,000
HexPenetrator_Incursion_Desc=Waves of XenoThreat ships have been pushing into Stanton system and attacking random civilians. We can't tell if this is an isolated attack or a reaction to our recent initiatives, but we need them stopped.\n\nAs a reminder, the military has generously donated some old F7A Hornets for CDF members who see this initiative through to the end.\n\n== Stats ==\naUEC Reward: 29,000
HexPenetrator_Kareah_Desc=Attention all CDF volunteers, we received a distress call from Security Post Kareah. It turns out XenoThreat used the comm arrays as a distraction to lure law enforcement away so they could launch an attack on the station.\n\nWe've learned that they're attempting to access their systems, so all volunteers must immediately divert to retake Kareah and clear out all XenoThreat forces.\n\nAs a reminder, the military has generously donated some old F7A Hornets for CDF members who see this initiative through to the end.\n\n== Stats ==\naUEC Reward: 14,000
HexPenetrator_RecoverDeliver_description=Attention CDF volunteers, XenoThreat's gone off the grid. We suspect that they have gone dark in order to prep for the final phase of their plan. \n\nHistory has proven that XenoThreat like to fight so it stands to reason that this might be an attack of some kind so we're calling on volunteers to deliver supplies to the Gateway station near the Stanton-Pyro jump point to shore up for a potential assault.\n\nAs a reminder, the military has generously donated some old F7A Hornets for CDF members who see this initiative through to the end.\n\n== Stats ==\naUEC Reward: 8,000
HexPenetrator_RewardRecord_Desc=Thank you for your diligence on this Overdrive Initiative. \n\nAs promised, we've approved you for an upgrade from a civilian F7C mk ii to a military grade F7A mk ii if you have one.\n\nIn addition, you've been given a temporary rental of a military F7A mk ii that you can access in your ASOP.\n\n\n_________________\n\nTo upgrade, visit the RSI website to apply the token, then restart the game and access the ship.\n\n== Stats ==\naUEC Reward: 8,000
Highpoint_KillAnimal_OneType_desc=We’ve been monitoring a situation at <EM4>~mission(Location)</EM4> regarding an uptick in the <EM4>~mission(Creature)</EM4> population over the past few months. Our models indicate that if this continues many of the native plants and animals will be adversely affected. It’s imperative that the <EM4>~mission(Creature)</EM4> population is reduced before that happens.     \n\nIf you can help, please refer to <EM4>"The Guide to Stanton Wildlife"</EM4> in your Journal for more specifics on the targeted creature.\n\nBest,\n\nWanda Werkheiser\nContract Manager\nHighpoint Wilderness Specialists\n\n== Stats ==\nReputation XP: +1,000\nFailure Penalty: -250 XP
Highpoint_KillAnimals_AtLocation_desc=There’s a growing <EM4>~mission(Creature)</EM4> problem at <EM4>~mission(Location|address)</EM4>. Looking for a contractor to quickly and professionally take care of this infestation issue.  \n\nFor further details on the targeted creature, please refer to <EM4>"The Guide to Stanton Wildlife"</EM4> in your Journal.\n\nBest,\n\nWanda Werkheiser\nContract Manager\nHighpoint Wilderness Specialists\n\n== Stats ==\nTier 1: +1,000 XP (Failure: -250)\nTier 2: +2,000 XP (Failure: -500)\nTier 3: +4,000 XP (Failure: -2,000)
Highpoint_KillAnimals_AtLocation_title=Pest Control [1,000–4,000 XP]
Highpoint_KillAnimals_Derelictoutpostscaves_Desc_E_001=Highpoint Wilderness is seeking a contractor to cull a pack of kopions that are threatening to overrun one of Citizens for Prosperity's outposts. After an initial assessment, it has been decided that relocation is impossible and a culling of them is the only viable option. If you're interested, head to <EM4>~mission(Location|Address)</EM4>  and once we've received confirmation that the task is complete we will send payment.\n\nBest,\n\nWanda Werkheiser\nContract Manager\nHighpoint Wilderness Specialists\n\n== Stats ==\nReputation XP: +75
Highpoint_KillAnimals_Derelictoutpostscaves_Desc_H_001=Members of the group Citizens for Prosperity were recently ambushed by several packs of kopions at <EM4>~mission(Location|Address)</EM4> and have requested Highpoint's services in dealing with them. For the safety of everyone trying to settle in the area, we require the immediate services of someone who can deal with this on our behalf.\n\nExpect a large number of animals and prepare yourself accordingly.\n\nBest,\n\nWanda Werkheiser\nContract Manager\nHighpoint Wilderness Specialists\n\n== Stats ==\nReputation XP: +300
Highpoint_KillAnimals_Derelictoutpostscaves_Title_E_001=Pack of Kopions Threatening CFP [75 XP]
Highpoint_KillAnimals_Derelictoutpostscaves_Title_H_001=Protect Settlement from Kopion Packs [300 XP]
Highpoint_KillAnimals_MultiType_H_desc=Native plants and animals near <EM4>~mission(Location)</EM4> are on the verge of environmental collapse due to the dramatic population spikes of several invasive species. We’ve been contracted to dramatically reduce the current population of these species to help avoid an environmental collapse. We need a dedicated and highly skilled exterminator to carry out this contract.     \n\nYou can better acquaint yourself with the creatures in question by referencing <EM4>"The Guide to Stanton Wildlife"</EM4> in your Journal.     \n\nBest,\n\nWanda Werkheiser\nContract Manager\nHighpoint Wilderness Specialists\n\n== Stats ==\nReputation XP: +4,000\nFailure Penalty: -2,000 XP
Highpoint_KillAnimals_MultiType_H_title=Intensive Eradication Effort [4,000 XP]
Highpoint_KillAnimals_MultiType_M_desc=Highpoint Wilderness Specialists are dedicated to keeping the delicate ecosystems of the empire in balance. A client recently hired us to evaluate the environmental impact of a number of invasive creatures near <EM4>~mission(Location)</EM4>. We’ve determined that to preserve the natural order of the region a conscientious culling of these species is necessary.  \n\nLooking for someone able and willing to help in this effort. Please refer to <EM4>"The Guide to Stanton Wildlife"</EM4> in your Journal for further information on the creatures being targeted.     \n\nBest,\n\nWanda Werkheiser\nContract Manager\nHighpoint Wilderness Specialists\n\n== Stats ==\nReputation XP: +2,000\nFailure Penalty: -500 XP
Highpoint_KillAnimals_MultiType_M_title=Cull Invasive Creatures [2,000 XP]
Highpoint_KillAnimals_OneType_title=Reduce Overpopulation [1,000 XP]
Highpoint_KillAnimals_rockcracker_desc_E_001=If you have any work that's going to be bringing you to one of those old QV Breaker Stations in the Keeger Belt, we have something else that we could use your help on while you're there.\n \nWe've recently been contacted by the People's Alliance to assist with an initiative to help prepare these abandoned stations for repairs. Unfortunately, a Valakkar infestation is creating serious problems for not only the stations' infrastructure, but also for the chances of them being brought back online one day. Due to Valakkar's status as an invasive species, we have decided that culling them is the only viable option.\n \nReduce the Valakkar numbers at any of the old QV Breaker Stations and we will offer you payment.\n \nBest,\n \nWanda Werkheiser\n\nContract Manager\n\nHighpoint Wilderness Specialists\n\n\n<EM4>Potential Blueprints</EM4>\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)\n\n== Stats ==\nReputation XP: +100
Highpoint_KillAnimals_rockcracker_title_E_001=Reduce Valakkar Breaker Station Population <EM4>[BP]</EM4> [100 XP]
Highpoint_Killanimals_Derelictoutpostscaves_Desc_E_002=We’re putting out a contract for anyone who is capable of hunting animals responsibly. Citizens for Prosperity needs a group of aggressive kopions who have been harassing their people culled from <EM4>~mission(Location|Address)</EM4>. After some initial monitoring, it looked as if they may on, but unfortunately we’ve been forced to take action. This is a relatively straightforward job, but when dealing with dangerous animals, cautious is always advised.\n\nBest,\n\nWanda Werkheiser\nContract Manager\nHighpoint Wilderness Specialists\n\n== Stats ==\nReputation XP: +75
Highpoint_Killanimals_Derelictoutpostscaves_Desc_M_001=Citizens for Prosperity recently reported to us that one of their scouts was injured by kopions during a routine exploration mission. According to them, this isn't the first time this particular pack has posed a problem, so they've requested our services to clear out the area. The report shows they were last seen at <EM4>~mission(Location|Address)</EM4>.\n\nThis behavior is typical of kopions looking to expand their territory, so it is highly likely that you will be dealing with more kopions than initially observed. Caution is advised. \n\nBest,\n\nWanda Werkheiser\nContract Manager\nHighpoint Wilderness Specialists\n\n== Stats ==\nTier 1: +25 XP\nTier 2: +150 XP
Highpoint_Killanimals_Derelictoutpostscaves_Nearoutposts_Desc_E_001=Highpoint Wilderness needs someone to exterminate an overpopulated pack of kopions that's threatening one of CFP's settlements. This pack can be found at <EM4>~mission(Location|Address)</EM4>. Remember to exhibit caution when approaching them and arm yourself accordingly.\n\nBest,\n\nWanda Werkheiser\nContract Manager\nHighpoint Wilderness Specialists\n\n== Stats ==\nReputation XP: +75
Highpoint_Killanimals_Derelictoutpostscaves_Nearoutposts_Desc_M_001=Citizens for Prosperity have approached us with information that multiple groups of kopions have been attacking people at <EM4>~mission(Location|Address)</EM4> without provocation. Currently, no deaths have been reported, but they are concerned their most vulnerable will be at risk if these kopions continue running rampant.\n\nEnsure you are prepared adequately, kopions hunt in packs and it is easy to become overwhelmed by their sheer numbers.\n\nBest,\n\nWanda Werkheiser\nContract Manager\nHighpoint Wilderness Specialists\n\n== Stats ==\nReputation XP: +150
Highpoint_Killanimals_Derelictoutpostscaves_Nearoutposts_Title_E_001=Overpopulated Kopions Need Exterminating [75 XP]
Highpoint_Killanimals_Derelictoutpostscaves_Nearoutposts_Title_M_001=Protect CFP Members from Overactive Kopions [150 XP]
Highpoint_Killanimals_Derelictoutpostscaves_Title_E_002=Kopion Culling for CFP [75 XP]
Highpoint_Killanimals_Derelictoutpostscaves_Title_M_001=Overaggressive Kopions Need Removing [25–150 XP]
Hockcrow_SearchBody_Easy_Description_001=Hockrow Agency \nCase File #MP51132\nLead Investigator: Arken Mallor\n\nCase Summary: \nNeed an operative to help us locate the current whereabouts of a client's employee. They were on assignment in ~mission(System) but has failed to report in. Our client is beginning to fear the worst.\n\nContract Investigator Actions:\nLocate <EM4>~mission(MissingPersonList)</EM4> at <EM4>~mission(Location|Address)</EM4> and confirm their status. \n\nIf they are deceased, examine the body closely so we can verify their death via your mobiGlas.\n\nAdditional Notes:\nThis contract has been flagged as <EM4>combat-likely</EM4> so prepare accordingly.\n\n== Stats ==\nReputation XP: +100
Hockcrow_SearchBody_Easy_Title_001=Locate Missing Employee [100 XP]
Hockcrow_SearchBody_Hard_Description_001=Hockrow Agency \nCase File #MP45648\nLead Investigator: Arken Mallor\n\nCase Summary: \nA client has tasked us with tracking down with one of their family members who has gone missing. After exhibiting erratic behavior, they cut off all communications and left for ~mission(System). We were able to track down their general whereabouts but need an investigator to head there in person to assess the situation.\n\nContract Investigator Actions:\nLocate <EM4>~mission(MissingPersonList)</EM4> at <EM4>~mission(Location|Address)</EM4> and confirm their status. \n\nIf they are deceased, examine the body closely so we can verify their death via your mobiGlas.\n\nAdditional Notes:\nThere is a high chance that you will encounter hostiles while conducting your search. We recommend considering bringing along backup to support you.\n\n== Stats ==\nReputation XP: +200
Hockcrow_SearchBody_Hard_Title_001=Locate Missing Family Member [200 XP]
Hockcrow_SearchBody_Medium_Description_001=Hockrow Agency \nCase File #MP74384\nLead Investigator: Arken Mallor\n\nCase Summary: \nWe had sent in a two-person team to ~mission(System) to investigate a case, but have received no reports from them for several days. At this juncture we are forced to assume that they had run into an unforeseen obstacle and may be in need of rescue, or worse, have been killed.\n\n\nContract Investigator Actions:\nLocate <EM4>~mission(MissingPersonList)</EM4> at <EM4>~mission(Location|Address)</EM4> and confirm their status. \n\nIf they are deceased, examine the body closely so we can verify their death via your mobiGlas.\n\nAdditional Notes:\nConsider the dangerous nature of their investigation, there is a very strong chance there will be hostiles on site.\n\n== Stats ==\nReputation XP: +150
Hockcrow_SearchBody_Medium_Title_001=Locate Missing Team [150 XP]
Hockcrow_SearchBody_Super_Description_001=Hockrow Agency \nCase File #MP65648\nLead Investigator: Arken Mallor\n\nCase Summary: \nA whole crew has gone missing while undertaking a contract in ~mission(System) for a client that I'm unfortunately not allowed to disclose the full details of to you. Lets just say that it wasn't the safest job and the fact the crew is not responding comms is not surprising but it is concerning. It's vital that we ascertain what happened to them. \n\nContract Investigator Actions:\nLocate <EM4>~mission(MissingPersonList)</EM4> at <EM4>~mission(Location|Address)</EM4> and confirm their status. \n\nIf they are deceased, examine the body closely so we can verify their death via your mobiGlas.\n\nAdditional Notes:\nThis investigation has high potential for there to be aggressive and dangerous hostiles on site. Arm yourself accordingly and consider bringing other skilled associates with you.\n\n== Stats ==\nReputation XP: +300
Hockcrow_SearchBody_Super_Title_001=Locate Missing Crew [300 XP]
Hockcrow_SearchBody_VeryEasy_Description_001=Hockrow Agency \nCase File #MP51643\nLead Investigator: Arken Mallor\n\nCase Summary: \nLooking for an operative to confirm the status of a client. They and their partner missed a scheduled meeting and all attempts to contact them have proven in vain. Last we heard they were undertaking some business in ~mission(System) and fear that they may be the victim of some unfortunate tragedy.\n\nContract Investigator Actions:\nLocate <EM4>~mission(MissingPersonList)</EM4> at <EM4>~mission(Location|Address)</EM4> and confirm their status. \n\nIf they are deceased, examine the body closely so we can verify their death via your mobiGlas.\n\nAdditional Notes:\nBe cautious while conducting your search. If the client did meet harm, it would be unfortunate for you to meet the same fate.\n\n== Stats ==\nReputation XP: +100
Hockcrow_SearchBody_VeryEasy_Title_001=Locate Missing Clients [100 XP]
Hockcrow_SearchBody_VeryHard_Description_001=Hockrow Agency \nCase File #MP12854\nLead Investigator: Arken Mallor\n\nCase Summary:\nWe have been asked to track down two contractors who work for a client of ours after they lost contact with them. They were last known to be traveling together in ~mission(System). Until their exact situation can be assessed, our client is stuck in a waiting pattern. \n\nContract Investigator Actions:\nLocate <EM4>~mission(MissingPersonList)</EM4> at <EM4>~mission(Location|Address)</EM4> and confirm their status. \n\nIf they are deceased, examine the body closely so we can verify their death via your mobiGlas.\n\nAdditional Notes:\nYou'll be heading into what is regarded as a particularly dangerous spot. Backup is highly recommended for this encounter.\n\n== Stats ==\nReputation XP: +200
Hockcrow_SearchBody_VeryHard_Title_001=Locate Missing Contractors [200 XP]
Hockrow_FacilityDelve_P2M1_Repeat_desc=Hockrow Agency \nCase File #JD10285\nLead Investigator: Arken Mallor\n\nCase Update: \nIt would be helpful to have the most recent energy anomaly data so that we can compare it to what you delivered last time. Any difference between the two data sets could prove useful.\n\nContract Investigator Actions:\nExplore the <EM4>Engineering</EM4> wing and <EM4>retrieve the Energy Anomaly data</EM4> and deliver it to <EM4>~mission(Destination|Address)</EM4>.\n\nAdditional Notes:\nBe wary of possible hostile forces on site. \n\nTravel to Onyx in a vehicle that can be stored in a large hangar.\n\nOnce you hand off this data, I'll send you a <EM4>ASD Secure Drive</EM4> that you can collect at your home location.\n\n\n<EM4>Potential Blueprints</EM4>\n- Corbel Arms Smolder\n- Corbel Core Smolder\n- Corbel Helmet Smolder\n- Corbel Legs Smolder\n- Fresnel "Icebox" Energy LMG\n- Fresnel Energy LMG Battery (165 Cap)\n- Geist Armor Arms Rogue\n- Geist Armor Arms Whiteout\n- Geist Armor Core Rogue\n- Geist Armor Core Whiteout\n- Geist Armor Helmet Rogue\n- Geist Armor Helmet Whiteout\n- Geist Armor Legs Rogue\n- Geist Armor Legs Whiteout
Hockrow_FacilityDelve_P2M1_Repeat_title=Jorrit Dossier: Updated Energy Anomaly Data <EM4>[BP]</EM4>
Hockrow_FacilityDelve_P2M2_Repeat_desc=Hockrow Agency \nCase File #JD10285\nLead Investigator: Arken Mallor\n\nCase Update: \nOut of an over-abundance of caution, it would be good to see if the security systems have picked up anything new since the last batch of data you delivered. That way we can make sure we’re up-to-date on what’s been happening down there.\n\nContract Investigator Actions:\nExplore the <EM4>Research</EM4> wing and <EM4>retrieve the Security data</EM4> and deliver it to <EM4>~mission(Destination|Address)</EM4>.\n\nAdditional Notes:\nBe wary of possible hostile forces on site. \n\nTravel to Onyx in a vehicle that can be stored in a large hangar.\n\nOnce you hand off this data, I'll send you a <EM4>ASD Secure Drive</EM4> that you can collect at your home location.\n\n<EM4>Potential Blueprints</EM4>\n- Corbel Arms Patina\n- Corbel Core Patina\n- Corbel Helmet Patina\n- Corbel Legs Patina\n- Fresnel "Rockfall" Energy LMG\n- Fresnel Energy LMG Battery (165 Cap)\n- Geist Armor Arms\n- Geist Armor Core\n- Geist Armor Helmet\n- Geist Armor Legs\n- Zenith "Landslide" Laser Sniper Rifle
Hockrow_FacilityDelve_P2M2_Repeat_title=Jorrit Dossier: Updated Security Data <EM4>[BP]</EM4>
Hockrow_FacilityDelve_P2M3_Repeat_desc=Hockrow Agency \nCase File #JD10285\nLead Investigator: Arken Mallor\n\nCase Update: \nOne of the biggest issue when it comes to ongoing investigations is intel growing stale. To help alleviate that, I’m going to have you head back into Onyx and grab the latest seismic sensor data. Would be good to see what the latest readings say.\n\nContract Investigator Actions:\nExplore the <EM4>Research</EM4> wing and <EM4>retrieve the Seismic data</EM4> and deliver it to <EM4>~mission(Destination|Address)</EM4>.\n\nAdditional Notes:\nBe wary of possible hostile forces on site.\n \nTravel to Onyx in a vehicle that can be stored in a large hangar.\n\nOnce you hand off this data, I'll send you a <EM4>ASD Secure Drive</EM4> that you can collect at your home location.\n\n<EM4>Potential Blueprints</EM4>\n- Corbel Arms Halcyon\n- Corbel Core Halcyon\n- Corbel Helmet Halcyon\n- Corbel Legs Halcyon\n- Geist Armor Arms Desert\n- Geist Armor Arms Whiteout\n- Geist Armor Core Desert\n- Geist Armor Core Whiteout\n- Geist Armor Helmet Desert\n- Geist Armor Helmet Whiteout\n- Geist Armor Legs Desert\n- Geist Armor Legs Whiteout\n- Zenith "Thunderstrike" Laser Sniper Rifle\n- Zenith Laser Sniper Rifle Battery (22 Cap)
