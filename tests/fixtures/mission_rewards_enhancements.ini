UDM_courier_fromdc_small_desc_001=Greetings Qualified Shipping Partner!\n\nIf you’re on the hunt for a straightforward way to earn credits, then look no further! There are a few packages waiting to be delivered in the ~mission(Pickup1|Address) at ~mission(Pickup1).\n\nPACKAGES FOR PICK UP \n     · All Packages in the <EM4>~mission(Pickup1)</EM4> at <EM4>~mission(Pickup1|Address)</EM4>\n\nDROP OFF LOCATIONS (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> to the <EM4>~mission(Dropoff1|Address)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> to the <EM4>~mission(Dropoff2|Address)</EM4>\n     · Package <EM4>#~mission(Item3|SerialNumber)</EM4> to the <EM4>~mission(Dropoff3|Address)</EM4>\n     · Package <EM4>#~mission(Item4|SerialNumber)</EM4> to the <EM4>~mission(Dropoff4|Address)</EM4>\n     · Package <EM4>#~mission(Item5|SerialNumber)</EM4> to the <EM4>~mission(Dropoff5|Address)</EM4> \n\nLooking forward to working with you,\n\nUnified Distribution Management\n -Delivering the Total Package-\n\n\n== Stats ==\naUEC Reward: 10,000\nReputation XP: +500
UDM_courier_todc_med_desc_001=Greetings Qualified Shipping Partner!\n\nReady to try your hand delivering a fairly sizeable shipment of packages? Then how about you assist with taking this allotment to the ~mission(Dropoff1) at ~mission(Dropoff1|Address). Just clear enough space on your ship first and you should be all set!\n\nPACKAGES FOR PICK UP (ANY ORDER) \n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> from the <EM4>~mission(Pickup1|Address)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> from the <EM4>~mission(Pickup2|Address)</EM4>\n     · Package <EM4>#~mission(Item3|SerialNumber)</EM4> from the <EM4>~mission(Pickup3|Address)</EM4>\n     · Package <EM4>#~mission(Item4|SerialNumber)</EM4> from the <EM4>~mission(Pickup4|Address)</EM4>\n     · Package <EM4>#~mission(Item5|SerialNumber)</EM4> from the <EM4>~mission(Pickup5|Address)</EM4>\n     · Package <EM4>#~mission(Item6|SerialNumber)</EM4> from the <EM4>~mission(Pickup5|Address)</EM4>\n     · Package <EM4>#~mission(Item7|SerialNumber)</EM4> from the <EM4>~mission(Pickup6|Address)</EM4>\n     · Package <EM4>#~mission(Item8|SerialNumber)</EM4> from the <EM4>~mission(Pickup6|Address)</EM4>\n     · Package <EM4>#~mission(Item9|SerialNumber)</EM4> from the <EM4>~mission(Pickup7|Address)</EM4>\n     · Package <EM4>#~mission(Item10|SerialNumber)</EM4> from the <EM4>~mission(Pickup7|Address)</EM4>\n\nDROP OFF LOCATION\n     · All Packages delivered to the <EM4>~mission(Dropoff1)</EM4> at <EM4>~mission(Dropoff1|Address)</EM4>\n\nLooking forward to working with you,\n\nUnified Distribution Management\n -Delivering the Total Package-\n\n\n== Stats ==\naUEC Reward: 15,500\nReputation XP: +1,000
UDM_courier_todc_small_desc_001=Greetings Qualified Shipping Partner!\n\nInterested in a simple shipping route without a lot of complications? Then taking a few packages to the ~mission(Dropoff1) at ~mission(Dropoff1|Address) should be the perfect job for you!\n\nPACKAGES FOR PICK UP (ANY ORDER) \n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> from the <EM4>~mission(Pickup1|Address)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> from the <EM4>~mission(Pickup2|Address)</EM4>\n     · Package <EM4>#~mission(Item3|SerialNumber)</EM4> from the <EM4>~mission(Pickup3|Address)</EM4>\n     · Package <EM4>#~mission(Item4|SerialNumber)</EM4> from the <EM4>~mission(Pickup4|Address)</EM4>\n     · Package <EM4>#~mission(Item5|SerialNumber)</EM4> from the <EM4>~mission(Pickup5|Address)</EM4>\n\nDROP OFF LOCATION\n     · All Packages delivered to the <EM4>~mission(Dropoff1)</EM4> at <EM4>~mission(Dropoff1|Address)</EM4>\n\nLooking forward to working with you,\n\nUnified Distribution Management\n -Delivering the Total Package-\n\n\n== Stats ==\naUEC Reward: 10,000\nReputation XP: +500
UDM_internaldelivery_dc_desc_001=Greetings Qualified Package Handler!\n\nExcited to delve into the complex world of storage management and facility realignment? Then don’t miss this chance to assist with organizing the following packages at <EM4>~mission(Location|Address)</EM4>.\n\nPACKAGES FOR PICK UP (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> from the <EM4>~mission(Pickup1)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> from the <EM4>~mission(Pickup2)</EM4>\n\n\nDROP OFF LOCATIONS (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> to the <EM4>~mission(Dropoff1)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> to the <EM4>~mission(Dropoff2)</EM4>\n\nIf this sounds like something you're interested in, please accept this offer right away! \n\nLooking forward to working with you,\n\nUnified Distribution Management\n -Delivering the Total Package-\n\n\n== Stats ==\naUEC Reward: 3,000\nReputation XP: +500
UDM_internaldelivery_dc_desc_003=Greetings Qualified Package Handler!\n\nReady to tackle a challenging yet rewarding job in a shipping adjacent compacity? Then we have a perfect opportunity for you at <EM4>~mission(Location|Address)</EM4>. \n\nPACKAGES FOR PICK UP (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> from the <EM4>~mission(Pickup1)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> from the <EM4>~mission(Pickup2)</EM4>\n     · Package <EM4>#~mission(Item3|SerialNumber)</EM4> from the <EM4>~mission(Pickup3)</EM4>\n     · Package <EM4>#~mission(Item4|SerialNumber)</EM4> from the <EM4>~mission(Pickup4)</EM4>\n\nDROP OFF LOCATIONS (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> to the <EM4>~mission(Dropoff1)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> to the <EM4>~mission(Dropoff2)</EM4>\n     · Package <EM4>#~mission(Item3|SerialNumber)</EM4> to the <EM4>~mission(Dropoff3)</EM4>\n     · Package <EM4>#~mission(Item4|SerialNumber)</EM4> to the <EM4>~mission(Dropoff4)</EM4>\n\nSo pick up that contract and let's get to work.\n\nLooking forward to working with you,\n\nUnified Distribution Management\n -Delivering the Total Package-\n\n\n== Stats ==\naUEC Reward: 4,750\nReputation XP: +1,000
UDM_internaldelivery_dc_desc_005=Greetings Qualified Package Handler!\n\nWhile they might not be going too far, the following packages at <EM4>~mission(Location|Address)</EM4> still need to be handled with expert care. Are you the expert we’re looking for?\n\nPACKAGES FOR PICK UP (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> from the <EM4>~mission(Pickup1)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> from the <EM4>~mission(Pickup2)</EM4>\n     · Package <EM4>#~mission(Item3|SerialNumber)</EM4> from the <EM4>~mission(Pickup3)</EM4>\n     · Package <EM4>#~mission(Item4|SerialNumber)</EM4> from the <EM4>~mission(Pickup4)</EM4>\n     · Package <EM4>#~mission(Item5|SerialNumber)</EM4> from the <EM4>~mission(Pickup5)</EM4>\n     · Package <EM4>#~mission(Item6|SerialNumber)</EM4> from the <EM4>~mission(Pickup6)</EM4>\n\nDROP OFF LOCATIONS (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> to the <EM4>~mission(Dropoff1)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> to the <EM4>~mission(Dropoff2)</EM4>\n     · Package <EM4>#~mission(Item3|SerialNumber)</EM4> to the <EM4>~mission(Dropoff3)</EM4>\n     · Package <EM4>#~mission(Item4|SerialNumber)</EM4> to the <EM4>~mission(Dropoff4)</EM4>\n     · Package <EM4>#~mission(Item5|SerialNumber)</EM4> to the <EM4>~mission(Dropoff5)</EM4> \n     · Package <EM4>#~mission(Item6|SerialNumber)</EM4> to the <EM4>~mission(Dropoff6)</EM4>\n\nAll you need to do is accept the contract and you'll be on your way.\n\nLooking forward to working with you,\n\nUnified Distribution Management\n -Delivering the Total Package-\n\n\n\n== Stats ==\naUEC Reward: 6,000\nReputation XP: +2,000
UDM_internaldelivery_dc_title_001=UDM Package Handler [500 XP]
Vaughn_EliminateBoss_FPS_Rockcracker_Warehouse_desc_001=One of the leaders of the mysterious Claw Salamanders gang, a ~mission(TargetName), has worn out their welcome and has now become our problem to deal with. It's hardly a surprise figuring no one except their friends could understand what they're saying. \n\nUnfortunately, it won't be as easy as heading to ~mission(Location|Address) and dealing with them directly. Not only will you have to ensure the station is operational to reach them, it seems that you will have to draw them out of hiding too by taking out a fair number of their compatriots first.\n\nNot the simplest of jobs, but I'm sure you'll rise to the occasion.\n\nAll the best,\nVaughn\n\n<EM4>Potential Blueprints</EM4>\n- Monde Arms Crimson Camo\n- Monde Arms Daimyo\n- Monde Core Crimson Camo\n- Monde Core Daimyo\n- Monde Helmet Crimson Camo\n- Monde Helmet Daimyo\n- Monde Legs Crimson Camo\n- Monde Legs Daimyo\n- R97 "Scorched" Shotgun\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)\n\n== Stats ==\nReputation XP: +4,000\nFailure Penalty: -2,000 XP
Vaughn_EliminateBoss_FPS_Rockcracker_Warehouse_name_001=End of a Salamander <EM4>[BP]</EM4> [4,000 XP]
Vaughn_EliminateSpecific_FPS_Rockcracker_Power_desc_001=A request has made its way to my desk regarding the untimely end of one ~mission(TargetName), a member of the Claw Salamander who is currently scuttling around an old QV Breaker Station. \n\nIt is highly likely that you will find them at ~mission(Location|Address).  Be mindful though that with a station this large it may take a bit of searching to track them down. \n\nHope you enjoy your time in Nyx,\nVaughn\n\n<EM4>Potential Blueprints</EM4>\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)\n\n== Stats ==\nReputation XP: +150
Vaughn_EliminateSpecific_FPS_Rockcracker_title_001=A Well Deserved Break <EM4>[BP]</EM4> [150 XP]
Vaughn_EliminateSpecific_FPS_storm_H_desc_001=I've been conscripted to provide a trigger pull for a very motivated client. The target is <EM4>~mission(TargetName)</EM4>, a loathsome character by all accounts who's seemed to relish the temporary authority that their mercenary position affords them. They believe their sadism to be righteous and my client would like to remind them otherwise.\n\nThey have recently been hired by ASD as part of a mercenary team at <EM4>~mission(Location)</EM4>, so it won't be an easy approach as there will undoubtedly be other armed individuals. I'll expect you to react accordingly, but ~mission(TargetName|Last) is your target.\n\nYou will be paid upon completion.\n\nAll the best,\n\nVaughn\n\n<EM4>Potential Blueprints</EM4>\n- Badami Helmet\n- Deadrig Shotgun\n- Deadrig Shotgun Magazine (8 cap)\n- Killshot Rifle\n- Killshot Rifle Magazine (45 Cap)\n- Overlord Arms Supernova\n- Overlord Core Supernova\n- Overlord Helmet Supernova\n- Overlord Legs Supernova\n- Piecemeal Armor Arms\n- Piecemeal Armor Core\n- Piecemeal Armor Legs\n\n== Stats ==\nReputation XP: +1,000\nFailure Penalty: -500 XP
Vaughn_EliminateSpecific_FPS_storm_H_title_001=A Challenging Contract <EM4>[BP]</EM4> [1,000 XP]
WSTR_TimeTrial_repeat_desc_01=Ready to set a new personal best with Wildstar Racing Amateur League?\n\n~mission(RaceDetails)\n\nDISCLAIMER\nWildstar Racing requires the contracted racer to be the vehicle pilot, no substitutes or stand-ins are allowed. Please be mindful that Wildstar Racing utilizes publicly accessible tracks and that other individuals may be present. Wildstar Racing is not responsible for any damage your ship may suffer while racing.\n\n== Stats ==\naUEC Reward: 10,000
XenoThreat_claimsweep_desc_easy=Our resistance movement is growing by the day, but that comes with some unwanted attention.  Recent scans discovered orbital sentries at ~mission(location|address) and a ship running a patrol pattern. We believe this is part of an espionage campaign targeting XenoThreat, most likely funded by the UEE. \n\nWe’re looking for an experienced merc willing to destroy the sentries ASAP.  Since they already have eyes and ears on us, sending in someone from outside the org would draw less attention. If you take the gig, you’ll be paid promptly once the sentries are destroyed.\n \nNow, while the patrol ship isn’t the main target, we suspect that if it escapes it might have reinforcements in reserve. Might be smart to deal with it promptly. \n\nIf you decide to help us, XenoThreat will remember you’re someone willing to fight for what’s right.\n\nComm. Spec. Engler\n\n== Stats ==\naUEC Reward: 10,000\nReputation XP: +50
XenoThreat_claimsweep_desc_hard=Recent scans discovered several orbital sentries and ships at ~mission(location|address). We believe they’re part of an espionage campaign targeting XenoThreat, in response to our recent actions in the Stanton system. Seems XenoThreat must be doing something right, if they’re out here spying like this.\n\nWe’re looking for an experienced and highly-skilled merc willing to eliminate this operation. If you don’t want Pyro to become a surveillance system, then this is your chance to stop it. The sentries probably won’t be too big of an issue, but pay mind to the patrol ships. If they manage to break away, you’ll have a whole lot more trouble breathing down your neck. \n\nYou’ll have our gratitude and a sizable payment once the job is done. \n\nComm. Spec. Engler\n\n== Stats ==\naUEC Reward: 20,000\nReputation XP: +250
XenoThreat_claimsweep_desc_intro=It seems our struggle to free Humanity has got the government lapdogs back on Earth feeling nervous. Recent scans discovered an orbital sentry at ~mission(location|address) that we believe is part of an UEE espionage campaign. Good credits says they’re handing the data direct to the slinks themselves. \n\nOnly one sentry has been detected so far, but who knows how big the operation will grow if it’s not taken off-line. Shouldn’t be too much trouble for a skilled merc. If that sounds like you, payment will be sent promptly once the sentry is destroyed. Plus, XenoThreat will remember that you’re someone willing to fight for what’s right.\n\nComm. Spec. Engler\n\n== Stats ==\naUEC Reward: 5,000\nReputation XP: +50
XenoThreat_claimsweep_desc_medium=Do you value Humanity’s freedom? If so, I’m offering you a chance to prove it. Recent scans discovered orbital sentries and patrolling ships at ~mission(location|address). We believe they’re part of a UEE espionage campaign targeting XenoThreat. It’s important that we stop their intelligence gathering before we launch our next mission.\n\nWe’re looking for an experienced merc willing to eliminate these forces immediately. The sentries are the priority, but the ships might prove a bigger issue if they’re allowed to escape. You’ll have to evaluate the situation more closely once you’re on site. \n\nWe could take care of it ourselves, but want to send in a contractor so the scum behind it don’t know who hit them. Payment will be sent promptly upon completion. Plus, the satisfaction of knowing you’re helping a good cause.\n\nComm. Spec. Engler\n\n== Stats ==\naUEC Reward: 15,000\nReputation XP: +100
XenoThreat_claimsweep_desc_rand=It appears the UEE are stepping up their efforts to stop our movement. One of our pilots discovered a few orbital sentries and ships at ~mission(location|address). We believe they’re part of a UEE espionage campaign targeting XenoThreat and it's vital that it be stopped before they gather anything that could harm our ongoing efforts.\n\nWe’re looking for a skilled merc willing to eliminate this threat and stop this invasion of privacy before it spreads even further. Who knows how much bigger this operation will get if it’s not taken off-line immediately? Payment will make it worth your while and be sent promptly once everything is blown to bits. \n\nSee it done, and help be a part of the right side of history.\n\nComm. Spec. Engler\n\n== Stats ==\naUEC Reward: 22,000\nReputation XP: +100
XenoThreat_claimsweep_title_easy=Silence Sentries [50 XP]
XenoThreat_claimsweep_title_hard=Annihilate Sentries [250 XP]
XenoThreat_claimsweep_title_intro=Surveillance Termination [50 XP]
XenoThreat_claimsweep_title_medium=Eradicate Sentries [100 XP]
XenoThreat_claimsweep_title_rand=Eliminate Sentries [100 XP]
Xenothreat_bounty_headhunter_desc_001=XenoThreat has placed a kill order on ~mission(TargetName). As a Clips level member of the Headhunters gang, ~mission(TargetName|Last) has led operations that have targeted XenoThreat operatives, missions, and infrastructure. For these transgressions, XenoThreat will pay anyone who successfully tracks down and assassinates ~mission(TargetName|Last).  \n\nLOCATION UPDATE: ~mission(TargetName|Last) was seen near ~mission(Location|Address) not too long ago.  If you decide to accept this contract, you should head to the coordinates immediately. ~mission(TargetName|Last) knows we’re looking for ‘em and has been traveling with an escort recently. Don’t be surprised if they’re not alone.\n\nComm. Spec. Engler\n\n== Stats ==\naUEC Reward: 9,000
Xenothreat_bounty_headhunter_desc_002=XenoThreat has placed a kill order on ~mission(TargetName). A known member of the Headhunters gang, ~mission(TargetName|Last) has betrayed Humankind by being a known alien ally who associates with them in both a personal and business capacity. XenoThreat wants these traitorous associations stopped immediately before they bring more alien influence to Pyro. We’ll pay anyone who successfully tracks down and assassinates ~mission(TargetName|Last) for these crimes against Humanity.  \n\nLOCATION UPDATE: ~mission(TargetName|Last) was recently spotted with an escort at ~mission(Location|Address). \n\nComm. Spec. Engler\n\n== Stats ==\naUEC Reward: 12,000
Xenothreat_bounty_headhunter_desc_003=XenoThreat has placed a kill order on the head of ~mission(TargetName). As a member of the Headhunters gang, ~mission(TargetName|Last) hacked into XenoThreat systems to steal information on our operations and personnel. The harm done can only be rectified by ensuring ~mission(TargetName|Last) can never do something like this again. That’s why XenoThreat will pay anyone who can track down and assassinate ~mission(TargetName|Last).     \n\nLOCATION UPDATE: Recent scans identified ~mission(TargetName|Last) traveling with other ships near ~mission(Location|Address). \n\nComm. Spec. Engler\n\n== Stats ==\naUEC Reward: 15,000
Xenothreat_destroyitems_CFP_vehicle_desc_01=The armchair “activists” of Citizens for Prosperity continue to try to spread their influence throughout the system. With your assistance, there is an opportunity to sever their operations at the roots.\n\nThe group is using ~mission(location|address) to distribute supplies to independents scattered around the planet. If we destroy the ~mission(ship) located there, their network will fall.\n\nBombardment would send a clear message, but I’ll leave it to you to decide the means of destruction.\n\nComm. Spec. Engler\n\n== Stats ==\naUEC Reward: 6,000
Xenothreat_theft_outpost_cfp_desc_001=Leave it to the lying UEE to say they’re not involved with the operations of Citizens for Prosperity simply because they “donate” supplies to a tertiary aid organization who then immediately delivers it right to them. \n\nWe just got word that one of these government aid shipments was dropped off at a Citizens for Prosperity aligned outpost. That’s why we’ll pay you to raid ~mission(Pickup1|Address) and claim the ~mission(item) for the cause. Once you deliver everything to ~mission(Dropoff1|Address) we can redistribute the shipment to help in our fight. Nothing better than using the enemies resources against them. \n\nBut don’t think they’ll just hand the stuff over to you. Even though Citizens for Prosperity are supposedly here to bring peace, you best be prepared to go toe to toe with ‘em. \n\nComm. Spec. Engler\n\n== Stats ==\naUEC Reward: 10,000
Xenothreat_theft_outpost_headhunters_desc_001=As much as XenoThreat has strived to make Pyro a pure haven for Humans, not everyone is aligned with our goals. Chief among them is the Headhunters, who have debased themselves by hiring an alien hauler to deliver supplies to them. We missed the chance to hit that shipment, but still want to send the message that working with aliens in any capacity will not be tolerated in this system. \n\nThat shipment was delivered to ~mission(Pickup1|Address). We want someone to hit the outpost, claim the ~mission(item), and take it to ~mission(Dropoff1|Address) so we can properly dispose of it. \n\nYou up for keeping Pyro free from alien influence?\n\nComm. Spec. Engler\n\n== Stats ==\naUEC Reward: 10,000
Xenothreat_theft_station_cfp_desc_001=Citizens for Prosperity have entrenched themselves at ~mission(Pickup1|Address). To keep them from getting too comfy at that station, we want to show them what life is really like in our system. We’ll pay you to hit the station, grab the ~mission(item), and kill anyone that gets in your way. \n\nPayment hinges on you delivering those supplies to ~mission(Dropoff1|Address). Anyone you kill will just be a perk.     \n\nComm. Spec. Engler\n\n== Stats ==\naUEC Reward: 6,000
Xenothreat_theft_station_roughready_desc_001=Not sure if you’d had the pleasure of dealing with the Rough & Ready, but the gang is laser focused on cornering the fuel market in Pyro. Smart play, but one we can’t let happen without them providing us some concessions. Since they’re currently not interested in negotiating, we’re forced to show them what happens to those who oppose us.\n\nWe’ve identified ~mission(Pickup1|Address) as a prime target for such an attack. We also know they recently received some supplies that should be a fitting price for their obstinance. Once inside the station, do whatever you need to do to confiscate the ~mission(item). We’ll send payment once you’ve delivered them to ~mission(Dropoff1|Address).      \n\nComm. Spec. Engler\n\n== Stats ==\naUEC Reward: 6,000
