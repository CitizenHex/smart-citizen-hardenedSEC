mtps_UGF_defend_VH_desc_001=ABOUT THE JOB\nmicroTech Protection Services is looking for a detail-oriented mercenary professional who can assemble a security team in order to protect ~mission(Location|Address) against serious hostile threats. \n\nRESPONSIBILITIES\n• Provide own transportation to ~mission(Location|Address).\n• Provide own security team to assist.\n• Protect the site against hostile threats; using force as necessary.\n\nMINIMUM QUALIFICATIONS\n• 2 years of combined mercenary and/or security experience.\n• Access to combat equipment and mode of transport.\n• Available for immediate deployment.\n\nPREFERRED QUALIFICATIONS\n• Experience with managing a team.\n\n\n== Stats ==\naUEC Reward: 30,000\nReputation XP: +500
