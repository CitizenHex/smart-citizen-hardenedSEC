recovery_desc=~mission(Contractor|RecoverItemDescription)\n\n<EM4>Potential Blueprints</EM4>\n- Monde Arms Delta Camo\n- Monde Arms Hemlock Camo\n- Monde Core Delta Camo\n- Monde Core Hemlock Camo\n- Monde Helmet Daimyo\n- Monde Helmet Delta Camo\n- Monde Legs Delta Camo\n- Monde Legs Hemlock Camo\n- R97 "Kismet" Shotgun\n- R97 "Righteous" Shotgun\n- R97 Shotgun Magazine (18 cap)\n\n== Stats ==\nReputation XP: +100
