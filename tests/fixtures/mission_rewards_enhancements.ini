bhg_EliminateBoss_FPS_Rockcracker_Warehouse_desc_001=--------------------------------------------------------\n----------------- BOUNTY CONTRACT -----------------\n--------------------------------------------------------\n\nBOUNTY HUNTERS GUILD\nPROCESSING & DISTRIBUTION\n\nThe Bounty Hunters Guild has authorized an official bounty.\n\nNAME: ~mission(TargetName) \nSYSTEM: Nyx\nRISK ASSESSMENT: High\nLAST KNOWN LOCATION:  ~mission(Location|Address)\nKNOWN AFFILIATIONS: Claw Salamanders\nNOTES: Because these abandoned QV Breaker Stations are not fully functional, there is a good chance that you will have to perform some repairs before your able to access the target's location. You may also have to deal with other hazards like dangerous fauna.\n\nAdditionally, the intel gathered on ~mission(TargetName) has them as a high ranking member of the Claw Salamanders, one who will not appear unless suitably drawn out of hiding. Engage with enough of their lower ranked associates and they will be forced to come deal with you themselves.\n\n\nBOUNTY HUNTERS GUILD\nIn Pursuit of Justice\n\nThe Bounty Hunters Guild is a security service sanctioned by the Mercenary Guild and authorized to operate in both the UEE and beyond in accordance with Xenotrade Authority Acts.\n\n<EM4>Potential Blueprints</EM4>\n- Monde Arms Crimson Camo\n- Monde Arms Daimyo\n- Monde Core Crimson Camo\n- Monde Core Daimyo\n- Monde Helmet Crimson Camo\n- Monde Helmet Daimyo\n- Monde Legs Crimson Camo\n- Monde Legs Daimyo\n- R97 "Scorched" Shotgun\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)\n\n== Stats ==\nReputation XP: +250
bhg_EliminateBoss_FPS_Rockcracker_Warehouse_name_001=High-Risk Bounty: ~mission(TargetName) at QV Breaker Station <EM4>[BP]</EM4> [250 XP]
bhg_bounty_desc_ASD_Engineering_001=--------------------------------------------------------\n----------------- BOUNTY CONTRACT -----------------\n--------------------------------------------------------\n\nBOUNTY HUNTERS GUILD\nPROCESSING & DISTRIBUTION\n\nThe Bounty Hunters Guild has authorized an official bounty.\n\nNAME: ~mission(TargetName) \nSYSTEM: Stanton\nRISK ASSESSMENT: Medium\nLAST KNOWN LOCATION:  ~mission(Location|Address)\nKNOWN AFFILIATIONS: <None>\nNOTES: We have tracked this bounty target to the <EM4>Engineering wing</EM4> of an abandoned Associated Science and Development research facility. While shuttered, various scavengers and other unsavory types are known to frequent the area.\n\nThe facility itself might also pose a risk as the nature of the research being conducted there is unknown. Be on the lookout for potential environmental hazards while in pursuit of the target.\n\n\nBOUNTY HUNTERS GUILD\nIn Pursuit of Justice\n\nThe Bounty Hunters Guild is a security service sanctioned by the Mercenary Guild and authorized to operate in both the UEE and beyond in accordance with Xenotrade Authority Acts.\n\n<EM4>Potential Blueprints</EM4>\n- Palatino Arms Sunstone\n- Palatino Core Sunstone\n- Palatino Helmet Sunstone\n- Palatino Legs Sunstone\n\n== Stats ==\nReputation XP: +50
bhg_bounty_desc_ASD_Research_001=--------------------------------------------------------\n----------------- BOUNTY CONTRACT -----------------\n--------------------------------------------------------\n\nBOUNTY HUNTERS GUILD\nPROCESSING & DISTRIBUTION\n\nThe Bounty Hunters Guild has authorized an official bounty.\n\nNAME: ~mission(TargetName) \nSYSTEM: Stanton\nRISK ASSESSMENT: Medium\nLAST KNOWN LOCATION:  ~mission(Location|Address)\nKNOWN AFFILIATIONS: <None>\nNOTES: We have tracked this bounty target to the <EM4>Research wing</EM4> of an abandoned Associated Science and Development facility. While shuttered, various scavengers and other unsavory types are known to frequent the area.\n\nThe facility itself might also pose a risk as the nature of the research being conducted there is unknown. Be on the lookout for potential environmental hazards while in pursuit of the target.\n\n\nBOUNTY HUNTERS GUILD\nIn Pursuit of Justice\n\nThe Bounty Hunters Guild is a security service sanctioned by the Mercenary Guild and authorized to operate in both the UEE and beyond in accordance with Xenotrade Authority Acts.\n\n<EM4>Potential Blueprints</EM4>\n- Palatino Arms Daystar\n- Palatino Arms Metropolis\n- Palatino Core Daystar\n- Palatino Core Metropolis\n- Palatino Helmet Daystar\n- Palatino Helmet Metropolis\n- Palatino Legs Metropolis\n- Palatino Legs Sunstone\n\n== Stats ==\nReputation XP: +50
bhg_bounty_desc_FPS_intro=--------------------------------------------------------\n----------------- BOUNTY CONTRACT -----------------\n--------------------------------------------------------\n\nBOUNTY HUNTERS GUILD\nPROCESSING & DISTRIBUTION\n\nThe Bounty Hunters Guild has authorized an official bounty.\n\nNAME: ~mission(TargetName) \nSYSTEM: Stanton\nRISK ASSESSMENT: Medium\nLAST KNOWN LOCATION:  ~mission(Location|Address)\nKNOWN AFFILIATIONS: <None>\nNOTES: This preliminary bounty is being offered to you as a formal evaluation of your skills. Successful completion of this contract will lead to additional bounty work being made available. \n\nIt is believed that the target will be on foot and well armed, so be prepared to engage in a firefight. Additionally, there may be other hostiles forces at the site, while they should not be your primary focus, you may have to engage with them while in pursuit of the target.\n\n\nBOUNTY HUNTERS GUILD\nIn Pursuit of Justice\n\nThe Bounty Hunters Guild is a security service sanctioned by the Mercenary Guild and authorized to operate in both the UEE and beyond in accordance with Xenotrade Authority Acts.\n\n<EM4>Potential Blueprints</EM4>\n- P8-AR Rifle\n- P8-AR Rifle Magazine (15 Cap)\n- Palatino Arms\n- Palatino Arms Moonfall\n- Palatino Core\n- Palatino Core Moonfall\n- Palatino Helmet\n- Palatino Helmet Moonfall\n- Palatino Legs\n- Palatino Legs Moonfall\n\n== Stats ==\nTier 1: +500 XP (Failure: -100)\nTier 2: +500 XP (Failure: -250)\nTier 3: +1,000 XP (Failure: -500)\nTier 4: +2,000 XP (Failure: -1,000)\nTier 5: +8,000 XP (Failure: -4,000)\nTier 6: +16,000 XP (Failure: -8,000)
bhg_bounty_desc_HeadHunters_001=--------------------------------------------------------\n----------------- BOUNTY CONTRACT -----------------\n--------------------------------------------------------\n\nBOUNTY HUNTERS GUILD\nPROCESSING & DISTRIBUTION\n\nThe Bounty Hunters Guild has authorized an official bounty.\n\nNAME: ~mission(TargetName) \nSYSTEM: ~mission(System)\nRISK ASSESSMENT: ~mission(Danger)\nLAST KNOWN LOCATION:  ~mission(Location|Address)\nKNOWN AFFILIATIONS: HeadHunters\nNOTES: Headhunters are a reputed criminal organization who have a long history of clashes with law enforcement. There is a good chance that they might have other gang members when confronted so exercise caution when engaging.\n\n\nBOUNTY HUNTERS GUILD\nIn Pursuit of Justice\n\nThe Bounty Hunters Guild is a security service sanctioned by the Mercenary Guild and authorized to operate in both the UEE and beyond in accordance with Xenotrade Authority Acts.\n\n== Stats ==\nTier 1: +2,000 XP (Failure: -1,000)\nTier 2: +8,000 XP (Failure: -4,000)
bhg_bounty_desc_Rockcracker_Zone1_001=--------------------------------------------------------\n----------------- BOUNTY CONTRACT -----------------\n--------------------------------------------------------\n\nBOUNTY HUNTERS GUILD\nPROCESSING & DISTRIBUTION\n\nThe Bounty Hunters Guild has authorized an official bounty.\n\nNAME: ~mission(TargetName) \nSYSTEM: Nyx\nRISK ASSESSMENT: Medium\nLAST KNOWN LOCATION:  ~mission(Location|Address)\nKNOWN AFFILIATIONS: Claw Salamanders\nNOTES: These old, abandoned QV Breaker Stations should be approached with caution. Not only are they are in a state of significant disrepair, but they are frequently inhabited by dangerous fauna and outlaws, like the target's associate gang members.\n\n\nBOUNTY HUNTERS GUILD\nIn Pursuit of Justice\n\nThe Bounty Hunters Guild is a security service sanctioned by the Mercenary Guild and authorized to operate in both the UEE and beyond in accordance with Xenotrade Authority Acts.\n\n<EM4>Potential Blueprints</EM4>\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)\n\n== Stats ==\nReputation XP: +150
bhg_bounty_desc_ShatteredBlade_001=--------------------------------------------------------\n-------------- BOUNTY CONTRACT ---------------\n--------------------------------------------------------\n\nBOUNTY HUNTERS GUILD\nPROCESSING & DISTRIBUTION\n\nThe Bounty Hunters Guild has authorized an official bounty.\n\nNAME: ~mission(TargetName) \nSYSTEM: Nyx\nRISK ASSESSMENT: High\nLAST KNOWN LOCATION:  ~mission(Location|Address)\nKNOWN AFFILIATIONS: Shattered Blade\nNOTES: The Shattered Blade are known for targeting Vanduul in order to acquire and sell black market tech, however they also have been reported to use violence against authority figures who interfere in their affairs.\n\n\nBOUNTY HUNTERS GUILD\nIn Pursuit of Justice\n\nThe Bounty Hunters Guild is a security service sanctioned by the Mercenary Guild and authorized to operate in both the UEE and beyond in accordance with Xenotrade Authority Acts.\n\n<EM4>Potential Blueprints</EM4>\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)\n\n== Stats ==\nTier 1: +500 XP (Failure: -250)\nTier 2: +1,000 XP (Failure: -500)\nTier 3: +2,000 XP (Failure: -1,000)\nTier 4: +8,000 XP (Failure: -4,000)\nTier 5: +16,000 XP (Failure: -8,000)
bhg_bounty_desc_XT_001=--------------------------------------------------------\n----------------- BOUNTY CONTRACT -----------------\n--------------------------------------------------------\n\nBOUNTY HUNTERS GUILD\nPROCESSING & DISTRIBUTION\n\nThe Bounty Hunters Guild has authorized an official bounty.\n\nNAME: ~mission(TargetName) \nSYSTEM: ~mission(System)\nRISK ASSESSMENT: ~mission(Danger)\nLAST KNOWN LOCATION:  ~mission(Location|Address)\nKNOWN AFFILIATIONS: XenoThreat\nNOTES: Xenothreat has consistently displayed unprovoked aggression against any law enforcement or security personnel. There is a good chance that they might have other gang members when confronted so exercise caution when engaging.\n\n\nBOUNTY HUNTERS GUILD\nIn Pursuit of Justice\n\nThe Bounty Hunters Guild is a security service sanctioned by the Mercenary Guild and authorized to operate in both the UEE and beyond in accordance with Xenotrade Authority Acts.\n\n== Stats ==\nReputation XP: +16,000\nFailure Penalty: -8,000 XP
