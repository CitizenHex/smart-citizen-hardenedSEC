Intersec_KillShip_Desc_Easy_001=MISSION SPECS\n\nArea of Operation: Nyx System\nHostile Forces: Outlaws\nEquipment Specs: Combat-rated Ships\nBriefing: InterSec has identified more outlaws who are planning an operation against UEE interests from within Nyx. Your mission will be to neutralize this potential threat before they can enact their plans.\n\nTravel to <EM4>~mission(Location|Address)</EM4> and dispatch the leader of these outlaws, <EM4>~mission(TargetName)</EM4> without hesitation. We have scouted a small number of ships, but our report suggest these are competent pilots - <EM4>bringing back up is advised.</EM4>\n\nRemember that eliminating these outlaws not only serves the people of Nyx, but the UEE too.\n\nRespectfully,\n\nDeacon Tobin\nOperations Manager\nInterSec Defense Solutions\n\nThis communication consists of a non-binding offer that upon acceptance may be immediately terminated by either party without any given notice. All operations are conducted at the contractor’s own personal risk and must adhere to system law where applicable.\n\n<EM4>Potential Blueprints</EM4>\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)\n\n== Stats ==\nReputation XP: +100
Intersec_KillShip_Desc_Hard_001=MISSION SPECS\n\nArea of Operation: Nyx System\nHostile Forces: Outlaws\nEquipment Specs: Combat-rated Ships\nBriefing: InterSec requires a skilled contractor to eliminate a highly dangerous group of criminals based in Nyx who are planning a coordinated strike on a prominent member of the UEE Navy.\n\nWe have intercepted a crucial piece of intelligence suggesting a known terrorist by the name of <EM4>~mission(TargetName)</EM4> intends to carry out this assassination along with the help of local criminal elements.\n\nThey are currently located at <EM4>~mission(Location|Address)</EM4>, making this an ideal time for us to strike. Be warned, these outlaws are experienced killers - bringing a <EM4>group of trustworthy allies</EM4> is advised.\n\nRespectfully, \n\nDeacon Tobin \nOperations Manager \nInterSec Defense Solutions  \n\nThis communication consists of a non-binding offer that upon acceptance may be immediately terminated by either party without any given notice. All operations are conducted at the contractor’s own personal risk and must adhere to system law where applicable.\n\n<EM4>Potential Blueprints</EM4>\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)\n\n== Stats ==\nReputation XP: +200
Intersec_KillShip_Desc_Intro_001=MISSION SPECS\n\nArea of Operation: Nyx System\nHostile Forces: Outlaws\nEquipment Specs: Combat-rated Ships\nBriefing: InterSec has been hired to combat the rising number of outlaws using Nyx as a staging ground for their operations, with the intention of attacking neighboring UEE systems.\n\nAs a preventative measure, we require you to travel to <EM4>~mission(Location|Address)</EM4> and eliminate the ringleader <EM4>~mission(TargetName)</EM4> to deter their planned attack on Stanton. They and their crew are highly dangerous and you are <EM4>advised  to bring a wingman</EM4> for support.\n\nContractors who can prove themselves reliable and competent in executing operations will be eligible for future missions with InterSec.\n\nRespectfully,\n\nDeacon Tobin\nOperations Manager\nInterSec Defense Solutions\n\nThis communication consists of a non-binding offer that upon acceptance may be immediately terminated by either party without any given notice. All operations are conducted at the contractor’s own personal risk and must adhere to system law where applicable.\n\n<EM4>Potential Blueprints</EM4>\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)\n\n== Stats ==\nReputation XP: +100
Intersec_KillShip_Desc_Medium_001=MISSION SPECS\n\nArea of Operation: Nyx System\nHostile Forces: Outlaws\nEquipment Specs: Combat-rated Ships\nBriefing: Seemingly unsatisfied with their takings in Nyx, an outlaw group lead by <EM4>~mission(TargetName)</EM4> has been planning a major strike against the UEE. This cannot be allowed to come to pass.\n\nThanks to the work of our Intelligence team, we've been able to track them down to <EM4>~mission(Location|Address)</EM4>.\n\nHead there as soon as you can and engage before they have a chance to leave the system. Based on our strategic analysis, we recommend a <EM4>well-armed and skilled fleet</EM4> will be necessary for the successful completion of this mission.\n\nRespectfully, \n\nDeacon Tobin \nOperations Manager \nInterSec Defense Solutions  \n\nThis communication consists of a non-binding offer that upon acceptance may be immediately terminated by either party without any given notice. All operations are conducted at the contractor’s own personal risk and must adhere to system law where applicable.\n\n<EM4>Potential Blueprints</EM4>\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)\n\n== Stats ==\nReputation XP: +150
