Covalex_RecoverCargo_Easy_Description=Hiya,\n\nI've got a client who's been messaging me all morning about a shipment they were supposed to receive and when I checked up on the cargo it turns out that it's sitting completely still in the middle of space.\n\nThis is obviously bad for a number of reasons, and not just because I had to spend 20 minutes getting yelled at. Can you head over to <EM4>~mission(Location|Address)</EM4> and see what happened? The original contract called for a ship that could carry <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> so make sure you've got that and a <EM4>heavy-duty tractor beam</EM4>.\n\nOnce you've got the cargo, can you make sure it's delivered to the freight elevator at <EM4>~mission(Destination|Address)</EM4>? Thanks a bunch.\n\n~mission(Contractor|SignOff)\n\nElla Tieno \nJr. Logistics Coordinator \nCovalex Shipping   \n'Anything you need, anywhere you need it.' \n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\nReputation XP: +100
Covalex_RecoverCargo_Easy_Title=Small Covalex Shipment Needs Recovering [100 XP]
Covalex_RecoverCargo_Hard_Description=Hi, it's El.\n\nNeed a hauler for a job ASAP. One of our contractors had a "personal emergency" and had to ditch their ship and it seems like they're not coming back. Not ideal, really.\n\nGood news is the cargo is still intact, at least according to the tracker. It'd be a huge win for me if you could finish the job by grabbing the cargo at <EM4>~mission(Location|Address)</EM4> and bringing it to the freight elevator at <EM4>~mission(Destination|Address)</EM4>.\n\nSeems like this was a pretty big one, you'll need a ship that can transport <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> and a <EM4>heavy-duty tractor beam</EM4> to move it all. Really appreciate your help.\n\n~mission(Contractor|SignOff)\n\nElla Tieno \nJr. Logistics Coordinator \nCovalex Shipping   \n'Anything you need, anywhere you need it.' \n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\nReputation XP: +200
Covalex_RecoverCargo_Hard_Title=Large Covalex Shipment Needs Recovering [200 XP]
Covalex_RecoverCargo_Medium_Description=Hey El here,\n\nGot a weird one for you. I was checking the delivery stats for the past week and noticed some discrepancies. Seems we have a couple of deliveries marked as fulfilled but the cargo trackers are still showing as active.\n\nOne of these is located at <EM4>~mission(Location|Address)</EM4> so I was hoping you could fly over and get to the bottom of this. The order says the hauler was using a ship that could carry <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> so make sure you have the same. A <EM4>heavy-duty tractor beam</EM4> is a must for this one too.\n\nThat cargo needs to be delivered yesterday, so as soon as you've got it take it to a freight elevator at <EM4>~mission(Destination|Address)</EM4> and I'll get your payment sorted for you.\n\n~mission(Contractor|SignOff)\n\nElla Tieno \nJr. Logistics Coordinator \nCovalex Shipping   \n'Anything you need, anywhere you need it.' \n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\nReputation XP: +150
Covalex_RecoverCargo_Medium_Title=Med. Covalex Shipment Needs Recovering [150 XP]
Covalex_RecoverCargo_Super_Description=Hey,\n\nOnly looking for contractors who are the best of the best for this one. One of our most valued clients is expecting an incredibly important shipment which is now seriously overdue.\n\nHere at Covalex, we pride ourselves on treating all of our clients equally, offering outstanding levels of service regardless of what we're delivering. That being said, if we lose this contract someone's gonna be in hot water and I really can't afford for that person to be me.\n\nThe tracker is reporting that the last contractor's ship is over at <EM4>~mission(Location|Address)</EM4>. Don't take any chances with this one, you'll need a ship that can hold <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> and a <EM4>heavy-duty tractor beam</EM4> to collect it all.\n\nDeliver the shipment to the freight elevator at <EM4>~mission(Destination|Address)</EM4> and we can put this whole mess behind us. And you'll make a sizeable heap of credits in the process. Not bad, right?\n\n~mission(Contractor|SignOff)\n\nElla Tieno \nJr. Logistics Coordinator \nCovalex Shipping   \n'Anything you need, anywhere you need it.' \n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\nReputation XP: +300
Covalex_RecoverCargo_Super_Title=Recover VIP Covalex Shipment [300 XP]
Covalex_RecoverCargo_VeryEasy_Description=Hi,\n\nSo I had a contractor who was supposed to deliver some stuff for us but has completely gone off the radar. I've pinged their ship and I've got no idea what's happened but they're floating around somewhere over at <EM4>~mission(Location|Address)</EM4>. If you could head over there recover the cargo and take it to the freight elevator at <EM4>~mission(Destination|Address)</EM4> you'd be doing me a huge favor.\n\nDon't forget to bring a <EM4>heavy-duty tractor beam</EM4> to move all the cargo. Oh and a ship that can transport <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>.\n\n~mission(Contractor|SignOff)\n\nElla Tieno \nJr. Logistics Coordinator \nCovalex Shipping   \n'Anything you need, anywhere you need it.' \n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\nReputation XP: +50
Covalex_RecoverCargo_VeryEasy_Title=Extra Small Covalex Shipment Needs Recovering [50 XP]
Covalex_RecoverCargo_VeryHard_Description=Hi,\n\nHere's the situation. After spending an hour on comms talking to the hauler, trying to help them diagnose what's wrong with their ship, it's been decided that we now need to get someone to head over to <EM4>~mission(Location|Address)</EM4> and complete the delivery.\n\nThis is a pretty big one. You'll need a ship that can store <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> and unless you're super strong a <EM4>heavy-duty tractor beam</EM4> to shift it all.\n\nI would really appreciate if we could just get this one done. Take the cargo to the freight elevator at <EM4>~mission(Destination|Address)</EM4> and we can put this all behind us.\n\n~mission(Contractor|SignOff)\n\nElla Tieno \nJr. Logistics Coordinator \nCovalex Shipping   \n'Anything you need, anywhere you need it.' \n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\n== Stats ==\nReputation XP: +200
