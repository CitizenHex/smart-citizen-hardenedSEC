DeadSaints_HaulCargo_AToB_desc_ToGrimHEX_Danger=If you're looking for creds, the Saints need someone with hauling experience to do a supply run from <EM4>~mission(Location|Address)</EM4> to <EM4>~mission(Destination|Address)</EM4>. \n\nYou're gonna need a ship that can hold size <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> and a <EM4>handheld tractor beam</EM4> to move the boxes around. \n\nDon't open the crates but just so you know, most of this stuff is legal but not all of it. Try not to cross paths with anyone who might make that a problem for you. Get me?\n\n-Twitch\n\n== Stats ==\nReputation XP: +100
DeadSaints_HaulCargo_AToB_intro_desc=Call me Twitch. I run the Dead Saints. \n\nI doubt this is the first time you've heard of us, but in case you haven't, we do a lot of things, but one of them is transporting goods that need discreet handling. \n\nI got your info from one of my contacts. They say you've got the stuff we like in a hauler, which works for me, because we're looking for one. \n\nHere's my proposal – we're offering creds to the pilot that can transport some special cargo for us. Your ship’s hold will need room for <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>, and you'll need a <EM4>handheld tractor beam</EM4> for loading and unloading. All you have to do is get everything from <EM4>~mission(Location|Address)</EM4> to <EM4>~mission(Destination|Address)</EM4> without getting security involved. \n \nIf you can pull the job off, the Saints will have more contracts for you down the line. \n\n-Twitch\n\n== Stats ==\nTier 1: +50 XP\nTier 2: +100 XP
DeadSaints_HaulCargo_AToB_intro_title=DEAD SAINTS - Trial Cargo Haul [50–100 XP]
DeadSaints_HaulCargo_AToB_title=DEAD SAINTS -- ~mission(ReputationRank) Rank, ~mission(CargoGradeToken) Scale Cargo Run [100 XP]
DeadSaints_HaulCargo_MultiToSingle_desc_Drugs_Danger=One of our best distributors got busted in Stanton so we need a replacement. The guy was an incredible salesman, but a shit smuggler. We need someone who won't run face-first into a security patrol or a pack of pirates to pick up some merchandise at these locations:\n\nPICK UP LOCATIONS (ANY ORDER) \n\n~mission(MultiToSingleToken)\n\nAnd bring it all to <EM4>~mission(Destination|Address)</EM4> before security catches on to what's happening. You'll need enough space on your ship for size <EM4>~mission(MissionMaxSCUSize)</EM4> containers, and a <EM4>handheld tractor beam</EM4> should make loading and unloading nice and easy. \n\n-Twitch\n\n== Stats ==\nReputation XP: +100
DeadSaints_HaulCargo_MultiToSingle_title=DEAD SAINTS - ~mission(ReputationRank) Rank - ~mission(CargoGradeToken) Cargo Haul [100 XP]
DeadSaints_HaulCargo_SingleToMulti_desc_Drugs_Danger_Timed=We've got a shipment of contraband that needs to be hauled to a couple of different places. If you like creds, head to <EM4>~mission(Location|Address)</EM4>, load everything up, and bring it to these drop points:  \n\nDROP OFF LOCATIONS (ANY ORDER)\n\n~mission(SingleToMultiToken)\n\nYou're gonna need a <EM4>handheld tractor beam</EM4> to move the boxes and enough room in your cargo hold for size <EM4>~mission(MissionMaxSCUSize)</EM4> containers. \n\nAvoid other ships if you can. Security will bust you if they figure out what you're hauling, and raiders will just take it for themselves. \n\n-Twitch\n\n== Stats ==\nReputation XP: +100
DeadSaints_HaulCargo_SingleToMulti_title=DEAD SAINTS - ~mission(ReputationRank) Rank - ~mission(CargoGradeToken) Cargo Haul [100 XP]
DeadSaints_RecoverCargo_Easy_Description=You know when you ask someone a question and you have a feeling they’re lying, but you choose to give them the benefit of the doubt? Yeah. That’s what I’m dealing with right now.\n\nTwo “expert” haulers I hired to transport some gear for me ran into some trouble and ended up ditching my goods over at <EM4>~mission(Location|Address)</EM4>. Needless to say, I’ve ordered a hit on them, but what I need from you is to go recover that cargo. The tracker says the cargo’s still on the ship, so you’ll just need a <EM4>a heavy-duty tractor beam</EM4> and your own ship to recover it.\n\nYou might run into a couple of scavengers lurking around there, but I doubt you’ll have any trouble with them.\n\nWhen you’re done, take the stuff to <EM4>~mission(Destination|Address)</EM4> and I’ll sort you out with a reward.\n\n-Twitch\n\n== Stats ==\nReputation XP: +100
DeadSaints_RecoverCargo_Easy_Title=Cleaning Up Someone Else’s Mess [100 XP]
DeadSaints_RecoverCargo_Hard_Description=Some upstarts hit my hauling crew on their way to do a delivery. Our tracker is telling us that our ship’s still located at <EM4>~mission(Location|Address)</EM4> so I need you to head over there and get the cargo. You’ll need <EM4>a heavy-duty tractor beam</EM4> to lug the goods from the ship.\n\nI’d bet that whoever attacked us is still there waiting. Arm up, bring your crew, and if you can, give them one from me.\n\nOnce you’ve taken back our goods, drop it off at the freight elevator located at <EM4>~mission(Destination|Address)</EM4>.\n\n-Twitch\n\n== Stats ==\nReputation XP: +200
DeadSaints_RecoverCargo_Hard_Title=Taking Back Our Goods [200 XP]
DeadSaints_RecoverCargo_Medium_Description=You got a ship and <EM4>a heavy-duty tractor beam</EM4>? Good. I’ve got work for you.\n\nDon’t know how they knew we were coming, but one of my haulers got jumped over at <EM4>~mission(Location|Address)</EM4>. The pilot’s gone silent so I assume they’ve been ghosted, but the cargo tracker is stationary for now.\n\nExpect the bastards who took out my pilot to still be around, so bring backup. Get the cargo and get out, don’t need to risk anymore good haulers on this mess.\n\nGet the goods to the freight elevator to <EM4>~mission(Destination|Address)</EM4> and I’ll send your payment.\n\n-Twitch\n\n== Stats ==\nReputation XP: +150
DeadSaints_RecoverCargo_Medium_Title=Retrieval Op [150 XP]
DeadSaints_RecoverCargo_Super_Description=A rival crew was able to get their hands on our delivery routes and now they have one of my cargo ships pinned down at <EM4>~mission(Location|Address)</EM4>.\n\nNow the ship’s sitting there being guarded by a full crew of these assholes. They must be waiting for someone to show up with a transport ship, but you’re going to get there first.\n\nHead there with a crew of your own and a <EM4>heavy-duty tractor beam</EM4> to take the goods away. Make sure they’re the best people you got. It’d be a mistake to underestimate these bastards.\n\nGhost them and bring my cargo back to the freight elevator at <EM4>~mission(Destination|Address)</EM4> and I’ll make sure you’re seriously comp’d for this.\n\n-Twitch\n\n== Stats ==\nReputation XP: +300
DeadSaints_RecoverCargo_Super_Title=Lost But Not Gone [300 XP]
DeadSaints_RecoverCargo_VeryEasy_Description=One of my haulers has run into some trouble over at <EM4>~mission(Location|Address)</EM4> and was forced to ditch their ship. I need someone to go there with <EM4>a heavy-duty tractor beam</EM4> to grab the cargo and finish the job.\n\nThey were carrying a decent supply of gear for me, and the last thing I need is for some do-gooder to come across it and trace it back to us.\n\nIf you do run into anybody, no need to be friendly. Just shoot the asshole and get my gear. Understood?\n\nTake it to the freight elevator over at <EM4>~mission(Destination|Address)</EM4> and I’ll make sure you get a cut of the sale.\n\n-Twitch\n\n== Stats ==\nTier 1: +50 XP\nTier 2: +200 XP
DeadSaints_RecoverCargo_VeryEasy_Title=Finishing The Job [50–200 XP]
EckhartSecurity_Defend_E_Desc_001=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Defend Location\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nA client has intercepted comms between gang members and discovered that they’re planning an attack on <EM4>~mission(Location|Address)</EM4>. Now they need our help to ensure the attack isn’t successful.   \n\nLooking for a contractor who can defend the location from this offensive. Don’t have any specifics on the outlaws, but doubt they’re that skilled if our client cracked their comms so easily. \n\nPayment will be issued upon successful completion of contract.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n== Stats ==\nReputation XP: +500\nFailure Penalty: -1,000 XP
EckhartSecurity_Defend_E_Title_001=Secure Site [500 XP]
EckhartSecurity_Defend_H_Desc_001=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Defend Location\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nThere’s a serious problem brewing for one of our clients at <EM4>~mission(Location|Address)</EM4>. They’ve been warned that a highly skilled outlaw crew has their sights set on overrunning and occupying that location. We’ve been hired to make sure that doesn’t happen. \n\nNeed a contractor to deploy to the location immediately. Based on the intel provided by the client, this won’t be a walk in the park. We strongly advise you to bring allies and plenty of supplies to help ward of the impending attack.   \n\nPayment will be issued upon successful completion of contract.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n== Stats ==\nReputation XP: +500\nFailure Penalty: -4,000 XP
EckhartSecurity_Defend_H_Title_001=Repel Raiders [500 XP]
EckhartSecurity_Defend_M_Desc_001=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Defend Location\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nWe’ve gotten word that outlaws have their sights set on attacking <EM4>~mission(Location|Address)</EM4>. Our client is concerned the attack is imminent and requested that security be deployed to the site immediately. If you’re interested and available, gather all the supplies and support you may need and head to the location pronto.  \n\nPayment will be issued upon successful completion of contract.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n== Stats ==\nReputation XP: +500\nFailure Penalty: -2,000 XP
EckhartSecurity_Defend_M_Title_001=Protect Location [500 XP]
EckhartSecurity_DestroyServers_FacilityDelving_Desc_001=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Destroy Server\nAPPROVAL CODE = VS-14\n\nFOR IMMEDIATE PROCESSING\n\nOur client has requested the immediate destruction of a group of servers located at a long-shuttered ASD research site. The servers in question contain information that our client considers extremely damaging and is eager to see the data completely eliminated.\n\nInitial surveillance indicates the servers are within the facility’s <EM4>Energy Lab, located in the Research wing</EM4>. We’ve also picked up on a number of hostile forces, so be on alert.\n\nPayment will be issued upon successful completion of contract.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n== Stats ==\nReputation XP: +50
EckhartSecurity_DestroyServers_FacilityDelving_Desc_002=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Destroy Server\nAPPROVAL CODE = VS-14\n\nFOR IMMEDIATE PROCESSING\n\nA client has asked us to infiltrate an old ASD research site and wipe the contents of a few specific servers there.\n\nWe believe the servers are located somewhere within the <EM4>Xenotech Lab, in the Research wing</EM4>. The client has also informed us that despite the facilities being publicly declared as closed, you're still likely to find hostile forces there.\n\nPayment will be issued upon successful completion of contract.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n== Stats ==\nReputation XP: +50
EckhartSecurity_DestroyServers_FacilityDelving_Desc_003=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Destroy Server\nAPPROVAL CODE = VS-14\n\nFOR IMMEDIATE PROCESSING\n\nThis a simple seek and destroy contract. The client has requested that several servers located at an ASD research site be destroyed as soon as possible. Under no circumstances should these servers be accessed, or copies of the data made.\n\nThe client believes that the servers are somewhere in the <EM4>Engineering wing</EM4>, most likely in the <EM4>Management</EM4> area. In addition to this, there is a strong chance you won’t be the only presence on-site so be wary of potential hostiles.\n\nPayment will be issued upon successful completion of contract.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n== Stats ==\nReputation XP: +50
EckhartSecurity_DestroyServers_FacilityDelving_Desc_004=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Destroy Server\nAPPROVAL CODE = VS-14\n\nFOR IMMEDIATE PROCESSING\n\nClient has requested a discreet contractor to infiltrate an ASD research site, locate a group of servers, and destroy the information stored on them permanently.\n\nThe client was able to share the location of the servers within the facility: the <EM4>Control Center in the Engineering wing</EM4>. The site has officially been shuttered, but there still may be hostile forces there. Be on your guard.\n\nPayment will be issued upon successful completion of contract.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n== Stats ==\nReputation XP: +50
