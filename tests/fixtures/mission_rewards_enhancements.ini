headhunters_EliminateSpecific_CFP_E_desc_001=My boss is looking for an available hitter. Headhunters are looking to retake ~mission(Location|Address). The CFP Mercs there have been digging in for a long fight. Look, we don't want to kill anyone we don't have to, so we're looking into other options.\n\nSecurity there's being run by ~mission(TargetName) and my Judge thinks that if they're taken out, the rest'll scatter. Shedding a little blood's better than a lot, right?\n\n-Stows\n\n<EM4>Potential Blueprints</EM4>\n- Coda "Big Boss" Pistol\n- Coda "Nighthawk" Pistol\n- Coda Pistol\n- Coda Pistol Magazine (6 cap)\n- Morozov-SH Arms\n- Morozov-SH Core\n- Morozov-SH Helmet\n- Morozov-SH Legs\n- Scalpel Sniper Rifle\n- Scalpel Sniper Rifle Magazine (12 cap)\n\n== Stats ==\nReputation XP: +50
