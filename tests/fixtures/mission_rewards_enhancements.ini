mtps_UGF_destroy_H_desc_001=ABOUT THE JOB\nmicroTech Protection Services is looking for a detail-oriented mercenary or security professional to report to ~mission(Location|Address) and destroy the narcotics being stored there. \n\nRESPONSIBILITIES\n• Provide own transportation to ~mission(Location|Address).\n• Clear the site of narcotics; using force as necessary.\n\nMINIMUM QUALIFICATIONS\n• 2 years of combined mercenary and/or security experience.\n• Access to combat equipment and mode of transport.\n• Available for immediate deployment.\n\nPREFERRED QUALIFICATIONS\n• No ongoing addiction issues.\n\n\n== Stats ==\naUEC Reward: 75,000\nReputation XP: +500
