RAIN_collectresources_multiple_GEN_desc_01=To all available contractors,\n\nRayari scientists are hard at work trying to solve the issues with failing regen tech. Currently, their efforts are hindered by a lack of materials which they believe could be essential for their experiments.  \n\nIn particular, our scientists at <EM4>~mission(Destination|Address)</EM4> have had to put their work on hold after running out of those resources. With a restock from our normal provider not possible for months owing to short supply, we’ll pay a premium to anyone who can assist with restocking the materials.\n\nFor more information on the animals in question, refer to "Explorer's Guide to Harvestables" in your Journal.\n\nTogether we can make the universe better for all.\n\nNarina Lerrem\nSenior Manager\nClinical Research Outsourcing\n\n<EM4>Potential Blueprints</EM4>\n- P8-AR Rifle\n- P8-AR Rifle Magazine (15 Cap)\n- Palatino Arms\n- Palatino Arms Moonfall\n- Palatino Core\n- Palatino Core Moonfall\n- Palatino Helmet\n- Palatino Helmet Moonfall\n- Palatino Legs\n- Palatino Legs Moonfall\n\n== Stats ==\nTier 1: +100 XP\nTier 2: +200 XP
RAIN_collectresources_multiple_GEN_name_01=Additional Resources For Research <EM4>[BP]</EM4> [100–200 XP]
RAIN_collectresources_multiple_OLP_desc_01=To all available contractors,\n\nRayari scientists are hard at work trying to solve the issues with failing regen tech. Currently, their efforts are hindered by a lack of three resources essential for their experiments: <EM4>saldynium, jaclium, and carinite</EM4>.  \n\nIn particular, our scientists at <EM4>~mission(Destination|Address)</EM4> have had to put their work on hold after running out of those resources. With a restock from our normal provider not possible for months owing to short supply, we’ll pay a premium to anyone who can assist with restocking the materials.\n\nThough we haven’t been able to do thorough scans, there’s a strong belief among our teams that Hathor’s defunct Orbital Laser Platforms were built above areas with a high concentration of these resources. Reactivating these OLP could be your best hope of acquiring what we need.\n\nTogether we can make the universe better for all.\n\nNarina Lerrem\nSenior Manager\nClinical Research Outsourcing\n\n\n<EM4>Potential Blueprints</EM4>\n- Pulse "Blacklist" Pistol\n- Pulse "Rouge" Pistol\n- Pulse Laser Pistol\n- Pulse Laser Pistol Battery (60 Cap)\n- Quartz "Black Op" Energy SMG\n- Quartz "Deadfall" Energy SMG\n- Quartz "Lumen" Energy SMG\n- Quartz Energy SMG\n- Quartz Energy SMG Battery (45 cap)\n\n== Stats ==\nReputation XP: +100
RAIN_collectresources_multiple_OLP_name_01=Vital Resources Needed For Research <EM4>[BP]</EM4> [100 XP]
RAIN_collectresources_single_OLP_desc_01=To all available contractors,\n\nOur research team at at <EM4>~mission(Destination|Address)</EM4> is working tirelessly on solving the current ‘Regen Crisis’ and addressing the issue of unstable imprints. Their work has produced promising results, but a lack of a key resource is impeding their ability to run further experiments. \n\nWe’ve received word from our supplier that increased demand combined with lower mining yields means that we won’t receive our scheduled shipment for another few months. Our research team can’t wait that long, and we’re hoping you can help.      \n\nThe resource is hard to come by, but we have it on good authority that the old Hathor mining facilities were built in areas with a high concentration of the ore. Since Hathor went defunct not long after establishing their operations in- system, there’s a good chance that activating one of these mining lasers could provide you with what we need.\n\nTogether we can make the universe better for all.\n\nNarina Lerrem\nSenior Manager\nClinical Research Outsourcing\n\n\n<EM4>Potential Blueprints</EM4>\n- Pulse "Blacklist" Pistol\n- Pulse "Rouge" Pistol\n- Pulse Laser Pistol\n- Pulse Laser Pistol Battery (60 Cap)\n- Quartz "Black Op" Energy SMG\n- Quartz "Deadfall" Energy SMG\n- Quartz "Lumen" Energy SMG\n- Quartz Energy SMG\n- Quartz Energy SMG Battery (45 cap)\n\n== Stats ==\nTier 1: +100 XP\nTier 2: +150 XP
RAIN_collectresources_single_OLP_name_01=Need Resource for Research\n <EM4>[BP]</EM4> [100–150 XP]
RAIN_intro_desc_01=To all available contractors,\n\nRayari Incorporated is looking for independent contractors to provide additional support in our efforts to push the boundaries of science, agriculture, and medicine in the Empire and beyond. \n\nA research initiative at <EM4>~mission(Destination|Address)</EM4> is in desperate need of resources, so we are looking for a reliable contractor to obtain and deliver these crucial components.\n\nFor more information on the animals in question, refer to "The Guide to Stanton Wildlife" in your Journal.\n\nRayari offers competitive wages along with the knowledge that you're building a better universe.\n\nLet’s grow together,\n\nNarina Lerrem\nSenior Manager\nClinical Research Outsourcing\n\n== Stats ==\nReputation XP: +100
RAIN_intro_name_01=Interested in Building a Better Future? [100 XP]
RedWind_Delivery_Illegal_Desc_01=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nGot another special job that I could use you on. Should be a quick run.\n\nPACKAGE FOR PICK UP\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> from the <EM4>~mission(Pickup1|Address)</EM4>)\n\nDROP OFF LOCATION\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> to the <EM4>~mission(Dropoff1|Address)</EM4>\n\nAnd please remember not to bother the clients or any of their guests. Professionalism is the key here. \n\n\n== Stats ==\naUEC Reward: 6,000\nReputation XP: +500
RedWind_Delivery_Illegal_Desc_02=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nGot another special job that I need a pilot I can trust to handle.\n\nPACKAGES FOR PICK UP (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> from the <EM4>~mission(Pickup1|Address)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> from the <EM4>~mission(Pickup2|Address)</EM4>\n\nDROP OFF LOCATIONS (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> to the <EM4>~mission(Dropoff1|Address)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> to the <EM4>~mission(Dropoff2|Address)</EM4>\n\nThis is a very important client for us so please treat them and their packages with extra respect.\n\n\n== Stats ==\naUEC Reward: 8,000\nReputation XP: +500
RedWind_Delivery_Illegal_Desc_03=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nHad another special job come in from one of our more private clients.\n\nPACKAGES FOR PICK UP (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> from the <EM4>~mission(Pickup1|Address)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> from the <EM4>~mission(Pickup2|Address)</EM4>\n     · Package <EM4>#~mission(Item3|SerialNumber)</EM4> from the <EM4>~mission(Pickup3|Address)</EM4>\n\nDROP OFF LOCATIONS (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> to the <EM4>~mission(Dropoff1|Address)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> to the <EM4>~mission(Dropoff2|Address)</EM4>\n     · Package <EM4>#~mission(Item3|SerialNumber)</EM4> to the <EM4>~mission(Dropoff3|Address)</EM4>\n\nRemember to try and keep a low profile. The last thing this client wants is to draw attention to their business, and the last thing I want is an unhappy client. Especially in this case.\n\n\n== Stats ==\naUEC Reward: 12,000\nReputation XP: +500
RedWind_Delivery_Illegal_Desc_04=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nGot another special run. Figured you'd be the right pilot to handle it for me.\n\nPACKAGES FOR PICK UP (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> from the <EM4>~mission(Pickup1|Address)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> from the <EM4>~mission(Pickup2|Address)</EM4>\n     · Package <EM4>#~mission(Item3|SerialNumber)</EM4> from the <EM4>~mission(Pickup3|Address)</EM4>\n     · Package <EM4>#~mission(Item4|SerialNumber)</EM4> from the <EM4>~mission(Pickup4|Address)</EM4>\n\nDROP OFF LOCATIONS (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> to the <EM4>~mission(Dropoff1|Address)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> to the <EM4>~mission(Dropoff2|Address)</EM4>\n     · Package <EM4>#~mission(Item3|SerialNumber)</EM4> to the <EM4>~mission(Dropoff3|Address)</EM4>\n     · Package <EM4>#~mission(Item4|SerialNumber)</EM4> to the <EM4>~mission(Dropoff4|Address)</EM4>\n\nOnce again, be smart and keep quiet about anything you might see or hear while you're out there. Remember, you're just there for the packages.\n\n\n== Stats ==\naUEC Reward: 16,000\nReputation XP: +500
RedWind_Delivery_Illegal_Desc_05=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nGot another special job that I could use you on. This one's a bit more complicated since there's a few more packages to keep track of. Here's the list:\n\nPACKAGES FOR PICK UP (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> from the <EM4>~mission(Pickup1|Address)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> from the <EM4>~mission(Pickup2|Address)</EM4>\n     · Package <EM4>#~mission(Item3|SerialNumber)</EM4> from the <EM4>~mission(Pickup3|Address)</EM4>\n     · Package <EM4>#~mission(Item4|SerialNumber)</EM4> from the <EM4>~mission(Pickup4|Address)</EM4>\n     · Package <EM4>#~mission(Item5|SerialNumber)</EM4> from the <EM4>~mission(Pickup5|Address)</EM4>\n\nDROP OFF LOCATIONS (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> to the <EM4>~mission(Dropoff1|Address)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> to the <EM4>~mission(Dropoff2|Address)</EM4>\n     · Package <EM4>#~mission(Item3|SerialNumber)</EM4> to the <EM4>~mission(Dropoff3|Address)</EM4>\n     · Package <EM4>#~mission(Item4|SerialNumber)</EM4> to the <EM4>~mission(Dropoff4|Address)</EM4>\n     · Package <EM4>#~mission(Item5|SerialNumber)</EM4> to the <EM4>~mission(Dropoff5|Address)</EM4> \n\nMake sure the right packages get to where they're going. You really don't want to have to explain a mix up to these particular clients.\n\n\n== Stats ==\naUEC Reward: 20,000\nReputation XP: +500
RedWind_Delivery_Illegal_Desc_Intro=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nI know you've done some solid work for us in the past, so I figured I'd see if you were interested in handling a bit of a special run for us that's a bit farther out in the system than what you've been doing so far.\n\nIn a nutshell, we need a pilot who's willing to keep their head down, focus on getting the packages delivered, and most importantly, not ask a lot of questions.\n\nSee, for a smaller company like us, staying ahead of competition means that we need to offer our clients something they can't get elsewhere - discretion. At Red Wind, as long as you got the credits we'll take whatever to wherever. Understand?\n\nIf that sounds good to you, let's see how you do on this run -\n\nPACKAGES FOR PICK UP (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> from the <EM4>~mission(Pickup1|Address)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> from the <EM4>~mission(Pickup2|Address)</EM4>\n     · Package <EM4>#~mission(Item3|SerialNumber)</EM4> from the <EM4>~mission(Pickup3|Address)</EM4>\n\nDROP OFF LOCATIONS (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> to the <EM4>~mission(Dropoff1|Address)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> to the <EM4>~mission(Dropoff2|Address)</EM4>\n     · Package <EM4>#~mission(Item3|SerialNumber)</EM4> to the <EM4>~mission(Dropoff3|Address)</EM4>\n\nOne last bit of advice, it would probably be good to avoid any unnecessary delays once you got the packages onboard, for example being searched by local law enforcement. \n\n\n== Stats ==\naUEC Reward: 12,000\nReputation XP: +500
RedWind_Delivery_Illegal_Title_01=Red Wind Discreet Courier Run [500 XP]
RedWind_Delivery_Illegal_Title_Intro=Red Wind In Need of Discreet Couriers [500 XP]
RedWind_HaulCargo_AToB_ASD_Desc=RED WIND LINEHAUL \n'YOUR GOODS IN GOOD HANDS' \n----------------------------    \n\nASD reached out to us as it seems one of their old labs, <EM4>~mission(Location|Address)</EM4>, still has some cargo being stored there they want to get their hands on.\n\nYou would fly there in a ship that can handle containers up to <EM4>~mission(MissionMaxSCUSize)</EM4> in size, land in the hangar, load up from the freight elevator, and then transport it all back to <EM4>~mission(Destination|Address)</EM4>. \n\nJust be sure to keep your head on swivel while you’re at the facility and try not to let your curiosity get the better of you Abandoned sites like this can be home to all sort of nastiness.  And don't forget to pack a <EM4>handheld tractor beam</EM4> to bring along. \n\nBE YOUR BEST – Take pride in the work you do and you’ll do work to be proud of.\n\n\n== Stats ==\nReputation XP: +50
RedWind_HaulCargo_AToB_ASD_title=Cargo Transfer from Shuttered Facility [50 XP]
RedWind_HaulCargo_AToB_desc_01=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------  \n\nNeed a pilot for a straightforward haul going from the freight elevator at <EM4>~mission(Location|Address)</EM4> to <EM4>~mission(Destination|Address)</EM4>. Should be easy enough as long as you got a ship that can handle containers up to <EM4>~mission(MissionMaxSCUSize)</EM4> in size. \n\nCredits don't come much easier than this. Just be careful as the route's not exactly in the safest of sectors. And don't forget to pack a <EM4>handheld tractor beam</EM4> to bring along.\n\n== Stats ==\nTier 1: +50 XP\nTier 2: +100 XP\nTier 3: +200 XP\nTier 4: +250 XP\nTier 5: +1,000 XP
RedWind_HaulCargo_AToB_title_01=~mission(ReputationRank) Hauler Needed for Direct ~mission(CargoGradeToken) Shipment [50–1,000 XP]
RedWind_HaulCargo_MultiToSingle_desc_01=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nJust got off a comm with a client. They got cargo (<EM4>~mission(MissionMaxSCUSize)</EM4> or smaller) at a few different locations ready to be taken over to a freight elevator at <EM4>~mission(Destination|Address)</EM4>.\n\nPICK UP LOCATIONS (ANY ORDER)  \n~mission(MultiToSingleToken)  \n\nI'd recommend taking a few minutes to plan your route before taking off. Might save you a bit of fuel. And don't forget to pack a <EM4>handheld tractor beam</EM4> to bring along.\n\n== Stats ==\nTier 1: +200 XP\nTier 2: +250 XP\nTier 3: +500 XP\nTier 4: +1,000 XP\nTier 5: +2,000 XP\nTier 6: +4,000 XP
RedWind_HaulCargo_MultiToSingle_title_01=~mission(ReputationRank) Hauler Needed for ~mission(CargoGradeToken) Shipment [200–4,000 XP]
RedWind_HaulCargo_SingleToMulti_desc_01=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------   \n\nOne of the folks over at <EM4>~mission(Location|Address)</EM4> just hit me up about a pile of cargo, <EM4>~mission(MissionMaxSCUSize)</EM4> or smaller, that needs to be hauled out to a few different spots.   \n\nDROP OFF LOCATIONS (ANY ORDER)  \n~mission(SingleToMultiToken)  \n\nI'm trusting you to set your own route here, so don't mess it up. And try to stay away from anywhere too dangerous. And don't forget to pack a <EM4>handheld tractor beam</EM4> to bring along.\n\n== Stats ==\nTier 1: +100 XP\nTier 2: +200 XP\nTier 3: +250 XP\nTier 4: +500 XP\nTier 5: +1,000 XP\nTier 6: +2,000 XP\nTier 7: +4,000 XP
RedWind_HaulCargo_SingleToMulti_title_01=~mission(ReputationRank) Hauler Needed for ~mission(CargoGradeToken) Shipment [100–4,000 XP]
RedWind_LocalDelivery_desc_01=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nNeed an available independent pilot for a quick local delivery.\n\nPACKAGE FOR PICK UP\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> from the <EM4>~mission(Pickup1|Address)</EM4>\n\nDROP OFF LOCATION\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> to the <EM4>~mission(Dropoff1|Address)</EM4>\n\nTry to keep your nose clean when you're out there. If you got Red Wind packages onboard, a certain level of professionalism is appreciated. And don't forget to pack a <EM4>handheld tractor beam</EM4> to bring along. \n\n~mission(Contractor|SignOff)\n\n== Stats ==\naUEC Reward: 3,000\nReputation XP: +250
RedWind_LocalDelivery_desc_02=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nLooking for a pilot to run a couple packages -\n\nPACKAGES FOR PICK UP (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> from the <EM4>~mission(Pickup1|Address)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> from the <EM4>~mission(Pickup2|Address)</EM4>\n\nDROP OFF LOCATIONS (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> to the <EM4>~mission(Dropoff1|Address)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> to the <EM4>~mission(Dropoff2|Address)</EM4>\n\nNeed it done quick and without screwups. And don't forget to pack a <EM4>handheld tractor beam</EM4> to bring along. \n\n~mission(Contractor|SignOff)\n\n== Stats ==\naUEC Reward: 6,000\nReputation XP: +500
RedWind_LocalDelivery_desc_03=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nHey all, got a contract up for grabs for any pilots with a ship at the ready -\n\nPACKAGES FOR PICK UP (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> from the <EM4>~mission(Pickup1|Address)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> from the <EM4>~mission(Pickup2|Address)</EM4>\n     · Package <EM4>#~mission(Item3|SerialNumber)</EM4> from the <EM4>~mission(Pickup3|Address)</EM4>\n\nDROP OFF LOCATIONS (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> to the <EM4>~mission(Dropoff1|Address)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> to the <EM4>~mission(Dropoff2|Address)</EM4>\n     · Package <EM4>#~mission(Item3|SerialNumber)</EM4> to the <EM4>~mission(Dropoff3|Address)</EM4>\n\nAnd don't forget to pack a <EM4>handheld tractor beam</EM4> to bring along. \n\n~mission(Contractor|SignOff)\n\n== Stats ==\naUEC Reward: 9,000\nReputation XP: +500
RedWind_LocalDelivery_desc_04=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nA run came through that needs an available pilot.\n\nPACKAGES FOR PICK UP (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> from the <EM4>~mission(Pickup1|Address)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> from the <EM4>~mission(Pickup2|Address)</EM4>\n     · Package <EM4>#~mission(Item3|SerialNumber)</EM4> from the <EM4>~mission(Pickup3|Address)</EM4>\n     · Package <EM4>#~mission(Item4|SerialNumber)</EM4> from the <EM4>~mission(Pickup4|Address)</EM4>\n\nDROP OFF LOCATIONS (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> to the <EM4>~mission(Dropoff1|Address)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> to the <EM4>~mission(Dropoff2|Address)</EM4>\n     · Package <EM4>#~mission(Item3|SerialNumber)</EM4> to the <EM4>~mission(Dropoff3|Address)</EM4>\n     · Package <EM4>#~mission(Item4|SerialNumber)</EM4> to the <EM4>~mission(Dropoff4|Address)</EM4>\n\nAnd just to be clear, you have to provide your own cargo ship. Make sure you got the space. And don't forget to pack a <EM4>handheld tractor beam</EM4> to bring along. \n\n~mission(Contractor|SignOff)\n\n== Stats ==\naUEC Reward: 12,000\nReputation XP: +500
RedWind_LocalDelivery_desc_05=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nPut together a multi-stop run that needs a pilot.\n\nPACKAGES FOR PICK UP (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> from the <EM4>~mission(Pickup1|Address)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> from the <EM4>~mission(Pickup2|Address)</EM4>\n     · Package <EM4>#~mission(Item3|SerialNumber)</EM4> from the <EM4>~mission(Pickup3|Address)</EM4>\n     · Package <EM4>#~mission(Item4|SerialNumber)</EM4> from the <EM4>~mission(Pickup4|Address)</EM4>\n     · Package <EM4>#~mission(Item5|SerialNumber)</EM4> from the <EM4>~mission(Pickup5|Address)</EM4>\n\nDROP OFF LOCATIONS (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> to the <EM4>~mission(Dropoff1|Address)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> to the <EM4>~mission(Dropoff2|Address)</EM4>\n     · Package <EM4>#~mission(Item3|SerialNumber)</EM4> to the <EM4>~mission(Dropoff3|Address)</EM4>\n     · Package <EM4>#~mission(Item4|SerialNumber)</EM4> to the <EM4>~mission(Dropoff4|Address)</EM4>\n     · Package <EM4>#~mission(Item5|SerialNumber)</EM4> to the <EM4>~mission(Dropoff5|Address)</EM4> \n\nMake sure your ship's got the space for all these pickups. And don't forget to pack a <EM4>handheld tractor beam</EM4> to bring along. \n\n~mission(Contractor|SignOff)\n\n== Stats ==\naUEC Reward: 15,000\nReputation XP: +500
RedWind_LocalDelivery_desc_intro=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nWe're looking to hire an independent pilot that's interested in running a local route for us.\n\nPACKAGES FOR PICK UP (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> from the <EM4>~mission(Pickup1|Address)</EM4>\n\nDROP OFF LOCATIONS (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> to the <EM4>~mission(Dropoff1|Address)</EM4>\n\nIf you pull this off, we can see about other contracts in the future. And don't forget to pack a <EM4>handheld tractor beam</EM4> to bring along. \n\n~mission(Contractor|SignOff)\n\n== Stats ==\naUEC Reward: 5,750\nReputation XP: +100
RedWind_LocalDelivery_desc_rehire=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nEven though we haven't hired you in a while, we could use the extra help right now.\n\nPACKAGES FOR PICK UP (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> from the <EM4>~mission(Pickup1|Address)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> from the <EM4>~mission(Pickup2|Address)</EM4>\n     · Package <EM4>#~mission(Item3|SerialNumber)</EM4> from the <EM4>~mission(Pickup3|Address)</EM4>\n\nDROP OFF LOCATIONS (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> to the <EM4>~mission(Dropoff1|Address)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> to the <EM4>~mission(Dropoff2|Address)</EM4>\n     · Package <EM4>#~mission(Item3|SerialNumber)</EM4> to the <EM4>~mission(Dropoff3|Address)</EM4>\n\nIf you pull this delivery off, we can see about making it a more regular thing again. And don't forget to pack a <EM4>handheld tractor beam</EM4> to bring along. \n\n~mission(Contractor|SignOff)\n\n== Stats ==\naUEC Reward: 9,000\nReputation XP: +500
RedWind_LocalDelivery_title_01=Red Wind Local Delivery Route [500 XP]
RedWind_LocalDelivery_title_intro=Red Wind Seeking New Pilots [100 XP]
RedWind_LocalDelivery_title_rehire=Another Attempt at Red Wind Delivery [500 XP]
RedWind_RecoverCargo_Easy_Description=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nOne of our haulers ran into some engine trouble whilst transporting some cargo for us and was forced to abandon their ship. Looking for a contractor who can recover the cargo and complete the delivery. You’ll need to bring your own <EM4>heavy-duty tractor beam</EM4> to transport the cargo to your ship. Details below.\n\nRECOVERY LOCATION\n     · <EM4>~mission(Location|Address)</EM4>\n\nDROP OFF LOCATION\n     · Freight elevator at <EM4>~mission(Destination|Address)</EM4>\n\nBe advised, the recovery location hasn’t been verified as safe. You might find an opportunistic outlaw trying to take the cargo for themselves, so be on alert.\n\nTAKE PRIDE IN YOUR WORK – Even as a contractor you are representing Red Wind Linehaul. Do not intentionally do anything to harm the company’s reputation.\n\n== Stats ==\nReputation XP: +100
RedWind_RecoverCargo_Easy_Title=Red Wind Easy Cargo Recovery [100 XP]
RedWind_RecoverCargo_Hard_Description=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nWe’re having trouble completing a hauling mission and need a reliable contractor who has experience working in dangerous environments to complete the job. Just as a heads up, the cargo is in an abandoned ship surrounded by multiple, highly dangerous outlaws. We strongly advise you bring some backup with you and <EM4>heavy-duty tractor beam</EM4> to retrieve the client’s goods. Details follow:\n\nRECOVERY LOCATION\n     · <EM4>~mission(Location|Address)</EM4>\n\nDROP OFF LOCATION\n     · Freight elevator at <EM4>~mission(Destination|Address)</EM4>\n\nSince this is a bit risky, we’re offering proportionate pay. I’ll leave it up to you to decide how to distribute it to your crew.\n\nTAKE PRIDE IN YOUR WORK – Even as a contractor you are representing Red Wind Linehaul. Do not intentionally do anything to harm the company’s reputation.\n\n== Stats ==\nReputation XP: +200
RedWind_RecoverCargo_Hard_Title=Red Wind Challenging Cargo Recovery [200 XP]
RedWind_RecoverCargo_Medium_Description=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nA Red Wind hauler has been ambushed by some outlaws and now our clients’ cargo is sitting still whilst they prepare to steal it. We need a pilot with a <EM4>heavy-duty tractor beam</EM4> and a combat ready ship to head to the location below and recover the cargo before it’s gone for good.\n\nRECOVERY LOCATION\n     · <EM4>~mission(Location|Address)</EM4>\n\nDROP OFF LOCATION\n     · Freight elevator at <EM4>~mission(Destination|Address)</EM4>\n\nThe pilot reported multiple hostiles so make sure you take this seriously. \n\nEVERY OPPORTUNITY COUNTS – Make the most of what’s given to you, show us that you can handle more work.\n\n\n== Stats ==\nReputation XP: +150
RedWind_RecoverCargo_Medium_Title=Red Wind Straightforward Cargo Recovery [150 XP]
RedWind_RecoverCargo_Super_Description=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nWe have a special assignment for only the most competent contractors. One of our haulers who is sadly no longer with us failed to complete their last job. The cargo they were supposed to deliver is sitting stationary in their former ship in the location listed below.\n\nRECOVERY LOCATION\n     · <EM4>~mission(Location|Address)</EM4>\n\nDROP OFF LOCATION\n     · Freight elevator at <EM4>~mission(Destination|Address)</EM4>\n\nI’m not going dance around the issue, this is an extremely challenging job. You’ll need to bring a strong team of skilled pilots with you to deal with the outlaws that killed the previous contractor and a <EM4>heavy-duty tractor beam</EM4> to retrieve the client’s cargo. That said, if you take on this contract, we will make it worth your time.\n\nHOW DID WE DO – Complete our short feedback survey on our Spectrum page for a chance to enter our monthly prize draw.\n\n== Stats ==\nReputation XP: +300
RedWind_RecoverCargo_Super_Title=Red Wind Special Cargo Recovery [300 XP]
RedWind_RecoverCargo_VeryHard_Description=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nPutting out a call for a highly skilled pilot who can recover our client’s cargo. Please only accept this contract if you have experience dealing with extremely hostile situations involving multiple combatants. Additional crew members and a <EM4>heavy-duty tractor beam</EM4> are highly recommended.\n\nRECOVERY LOCATION\n     · <EM4>~mission(Location|Address)</EM4>\n\nDROP OFF LOCATION\n     · Freight elevator at <EM4>~mission(Destination|Address)</EM4>\n\nThe cargo should be in the bay of the abandoned ship. The client has already expressed frustration regarding the cargo’s delay so please work quickly and efficiently.\n\nBE RESILIENT – Life is hard and sometimes you have to roll with the punches. Keep going and don’t let it bring you down.\n\n== Stats ==\nReputation XP: +200
RedWind_RecoverCargo_VeryHard_Title=Red Wind Dangerous Cargo Recovery [200 XP]
Redwind_internaldelivery_dc_desc_001=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nThe folks over at <EM4>~mission(Location|Address)</EM4> are doing some clean up and want some packages moved around the facility.\n\nPACKAGES FOR PICK UP (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> from the <EM4>~mission(Pickup1)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> from the <EM4>~mission(Pickup2)</EM4>\n\nDROP OFF LOCATIONS (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> to the <EM4>~mission(Dropoff1)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> to the <EM4>~mission(Dropoff2)</EM4>\n\nThey need it done efficiently and without a lot of bother.\n\n\nDO NOT TAKE THIS CONTRACT - unless you are reliable. Red Wind has a reputation that our clients trust and for good reason. \n\n\n\n== Stats ==\naUEC Reward: 3,000\nReputation XP: +500
Redwind_internaldelivery_dc_desc_003=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nGot some boxes that need reorganizing over at <EM4>~mission(Location|Address)</EM4>.\n\nPACKAGES FOR PICK UP (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> from the <EM4>~mission(Pickup1)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> from the <EM4>~mission(Pickup2)</EM4>\n     · Package <EM4>#~mission(Item3|SerialNumber)</EM4> from the <EM4>~mission(Pickup3)</EM4>\n     · Package <EM4>#~mission(Item4|SerialNumber)</EM4> from the <EM4>~mission(Pickup4)</EM4>\n\nDROP OFF LOCATIONS (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> to the <EM4>~mission(Dropoff1)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> to the <EM4>~mission(Dropoff2)</EM4>\n     · Package <EM4>#~mission(Item3|SerialNumber)</EM4> to the <EM4>~mission(Dropoff3)</EM4>\n     · Package <EM4>#~mission(Item4|SerialNumber)</EM4> to the <EM4>~mission(Dropoff4)</EM4>\n\n\nTO ALL VETS - Red Wind appreciates your service to our Empire! Your struggles mean our freedom! \n\n\n== Stats ==\naUEC Reward: 4,750\nReputation XP: +1,000
Redwind_internaldelivery_dc_desc_005=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nSeems like there was a bit of a logistical snafu at <EM4>~mission(Location|Address)</EM4> and they need someone to make sure the misplaced packages end up where they’re supposed to go inside the facility.\n\nPACKAGES FOR PICK UP (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> from the <EM4>~mission(Pickup1)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> from the <EM4>~mission(Pickup2)</EM4>\n     · Package <EM4>#~mission(Item3|SerialNumber)</EM4> from the <EM4>~mission(Pickup3)</EM4>\n     · Package <EM4>#~mission(Item4|SerialNumber)</EM4> from the <EM4>~mission(Pickup4)</EM4>\n     · Package <EM4>#~mission(Item5|SerialNumber)</EM4> from the <EM4>~mission(Pickup5)</EM4>\n     · Package <EM4>#~mission(Item6|SerialNumber)</EM4> from the <EM4>~mission(Pickup6)</EM4>\n\n\nDROP OFF LOCATIONS (ANY ORDER)\n     · Package <EM4>#~mission(Item1|SerialNumber)</EM4> to the <EM4>~mission(Dropoff1)</EM4>\n     · Package <EM4>#~mission(Item2|SerialNumber)</EM4> to the <EM4>~mission(Dropoff2)</EM4>\n     · Package <EM4>#~mission(Item3|SerialNumber)</EM4> to the <EM4>~mission(Dropoff3)</EM4>\n     · Package <EM4>#~mission(Item4|SerialNumber)</EM4> to the <EM4>~mission(Dropoff4)</EM4>\n     · Package <EM4>#~mission(Item5|SerialNumber)</EM4> to the <EM4>~mission(Dropoff5)</EM4>\n     · Package <EM4>#~mission(Item6|SerialNumber)</EM4> to the <EM4>~mission(Dropoff6)</EM4>\n\n\n\nTRUST GOES TWO WAYS - By taking this contract you are pledging not to screw us over, and Red Wind Linehaul pledges to treat you the same. \n\n\n== Stats ==\naUEC Reward: 6,000\nReputation XP: +2,000
Redwind_internaldelivery_dc_title_001=Red Wind Package Handler [500 XP]
RepairOxygenKiosk_DescriptionLong=Hello Guests,\n\nWe have recently been alerted that one of our Oxygen Dispensers has suffered a technical error. As you know these kiosks are vital to ensure that you have plenty of oxygen handy while participating in our Work Release Program.\n\nWe are looking for any available guest to reset the kiosk. That should reconnect the kiosk to the network and resolve the issue. The first guest who's able to complete this task will not only be compensated with merits, but also with the satisfaction that they're making the workplace safer for other guests.\n\nThank you.\n\n== Stats ==\nReputation XP: +100
RepairOxygenKiosk_Title=Inmate Maintenance Opportunity [100 XP]
RetakeLocation_MissionDescription=~mission(Contractor|RetakeLocationDescription)\n\n== Stats ==\naUEC Reward: 10,000
RetrieveDatapad_desc=Ran into a bit of crap luck that I'm hoping you can help me right.\n\nA few days ago, I hired the crew of the 'Pride of Arliss' to obtain some important data for me. They pulled off the job no problem, but the bastard of a captain comm'd me demanding more credits. Turns out it wasn't the first time he's tried to pull this trick either because in middle of "negotiating" with me, his ship was attacked by some very pissed off individuals looking to teach him a lesson.\n\nOur comm got cut off when the shooting started and that was the last I heard from him. I'm guessing he's as good as ghosted, but I want you to head to the Pride of Arliss and try to get my data off the captain's personal datapad.\n\nOnce you have it, I set up a secure transmission channel at the ARC-L1 rest stop. Travel there and when you're in range, submit the data to me through this contract to get paid.\n  \nDon’t try to screw me over either. Karma can be a real asshole.\n\n\n== Stats ==\naUEC Reward: 24,600
Roughready_bounty_desc_002=Rough & Ready have been in business with ~mission(TargetName) for years but that relationship has taken a turn for the worse. For a while, we were supplying them with fuel on credit but when it came time to collect the coward went into hiding. If ~mission(TargetName|Last) can’t pay with creds, guess they’re gonna pay with their life.\n\nAn associate just clocked ~mission(TargetName|Last) at ~mission(Location|Address). I’d love for you to head there now to make the stingy bastard pay.\n\nBy the way, it looks like ~mission(TargetName|Last) isn’t traveling alone, so I’d make sure you’re fully stocked before going after ‘em. \n\n- Smokey\n\n== Stats ==\naUEC Reward: 7,500
Roughready_destroyitems_fuel_desc_01=If you’re in the market for some easy credits, I’ve got an offer for you.\n\nSee, word on the vine is that ~mission(location|address) is operating as a fuel depot. They must not have gotten the memo that the fuel trade in Pyro belongs to Rough & Ready.\n\nThat’s why you’re going to make your way there and destroy their fuel reserves. They should be easy for you to spot. They’re the large yellow storage tanks dotted around the outpost. Watch out though, there are turret emplacements defending the area, so make sure you’re ready to dodge their shots or blow the guns sky high. \n\nI’ll leave it up to you how you handle the demo. Bombs would be my first choice, but I don’t care much as long as the gig gets done.\n\n- Smokey\n\n== Stats ==\naUEC Reward: 8,000\nReputation XP: +50
Roughready_destroyitems_fuel_title_01=Fuel to the Fire [50 XP]
Ruto_Assassin_Sync_E_Desc=Here's the deal. ~mission(TargetName) and ~mission(TargetName2) need to die at the same time. Unfortunately, they aren't gonna be in the same place.\n\nA double hit can sound complicated, but if you hire some additional guns it shouldn't be all that hard to do two hits simultaneously.\n\nMake sure you find folks who have skills as I have it on good authority that each'll be flying with some escorts for "protection."\n\n== Stats ==\naUEC Reward: 32,000\nReputation XP: +500
Ruto_Assassin_Sync_E_Title=together forever [500 XP]
Ruto_Assassin_Sync_H_Desc=Have another pair that needs simultaneous deathing. Seems to be getting more and more popular as a murder option. \n\nThis time it's ~mission(TargetName) and ~mission(TargetName2). Both are supposed to be pretty skilled operators and they won't be flying alone. \n\nI'd make sure whoever you get to help you on this one can handle a fight.\n\n== Stats ==\naUEC Reward: 40,000\nReputation XP: +500
Ruto_Assassin_Sync_H_Title=twice the headache [500 XP]
Ruto_Assassin_Sync_Intro_Desc=Guess what ~mission(TargetName) and ~mission(TargetName2) have in common? \n\nYou're gonna kill 'em both!\n\nDifficult part is that I need you to kill them at the same time so that one doesn't have a chance to escape, or worse, kill the person trying to kill them. \n\nSo put together a team to track one target while you handle the other. Divide and conquer!\n\nAnd despite the fact they made a mess big enough to get themselves killed, my understanding is that they are relative lightweights. Don't expect you to meet too much resistance.\n\n== Stats ==\naUEC Reward: 32,000\nReputation XP: +500
Ruto_Assassin_Sync_Intro_Title=simultaneous release [500 XP]
Ruto_Assassin_Sync_M_Desc=I really hope that you're not buddies with ~mission(TargetName) or ~mission(TargetName2) because I need you to ghost the pair of them... at the same time...\n\nOf course they wouldn't make this easy on us and travel in the same ship or something obvious like that. No. You're going to have to put together a crew so that you can down both targets simultaneously. \n\nAs soon as one of them is dead, be ready to drop the other one too. Can't risk either of them getting away.\n\nAnd I figure I should mention that not only are both pretty good pilots, but that they'll be traveling with backup too. Nothing you can't handle I'm sure.\n\n== Stats ==\naUEC Reward: 37,500\nReputation XP: +500
Ruto_Assassin_Sync_M_Title=friends to the end [500 XP]
Ruto_Assassin_Sync_S_Desc=If you had asked me, I would've said ~mission(TargetName) and ~mission(TargetName2) would have wound up eventually killing each other. But instead you're going to get the honor of killing them both at the same time.\n\nYou're going to have to work for it, though.\n\nEach one is trouble. Serious records, highly trained, and too smart to fly without backup.\n\nGather the best crew you can on this one. You'll need it. And don't be stingy. You can't spend credits if you're dead.\n\n== Stats ==\naUEC Reward: 40,000\nReputation XP: +500
Ruto_Assassin_Sync_S_Title=double trouble [500 XP]
Ruto_Assassin_Sync_VE_Desc=It's pretty touching when you run across a pair that's willing to die for one another. Stupid but touching.\n\n~mission(TargetName) and ~mission(TargetName2) chose to stand by each other and now its gone and got them dead.\n\nFind a friend of your own and hunt each of these two down. Make sure you kill them at the same time. Call it poetic justice.\n\nThey should die pretty easy. Maybe they'll have a ship or two with them but I don't think it'll be anything to worry about.\n\n== Stats ==\naUEC Reward: 32,000\nReputation XP: +500
Ruto_Assassin_Sync_VE_Title=death do us part [500 XP]
Ruto_Assassin_Sync_VH_Desc=~mission(TargetName) and ~mission(TargetName2). I think they may be related? Or dating? Doesn't really matter, someone wants them killed. \n\nI've arranged it so that you can hit them when they're not flying together. Safer for you this way. They are both serious business and fly with equally serious backup.\n\nMake sure you and your crew time your attacks. I don't want one of them left alive or it's going to be a real headache.\n\n== Stats ==\naUEC Reward: 40,000\nReputation XP: +500
Ruto_Assassin_Sync_VH_Title=two for the price of two [500 XP]
ServiceBeacon_CombatAssist_Mission_Desc=~mission(InitiatorName) is requesting combat assistance in ~mission(InitiatorLocation). If accepted, you will be paid ~mission(PaymentAmount) aUEC upon elimination of the threat.\n\n\n== Stats ==\naUEC Reward: 21,604
