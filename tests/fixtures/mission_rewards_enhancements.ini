Intersec_KillShip_Vanduul_Desc_VeryHard_001=MISSION SPECS\n\nArea of Operation: Nyx System\nHostile Forces: Vanduul\nEquipment Specs: Combat-rated Ships\nBriefing: InterSec is in need of a highly skilled combat pilot who can locate and neutralize a dangerous Vanduul target.\n\nAn operator of ours has identified a Vanduul ship flying within the vicinity of <EM4>~mission(Location|Address)</EM4>. We've been given strict instructions to eliminate any Vanduul spotted on the fringes of UEE space, for fear of encroachment into the Empire's territory.\n\nBring a <EM4>small fleet of competent pilots</EM4> with you to engage and neutralize the target.\n\nRespectfully, \n\nDeacon Tobin \nOperations Manager \nInterSec Defense Solutions  \n\nThis communication consists of a non-binding offer that upon acceptance may be immediately terminated by either party without any given notice. All operations are conducted at the contractor’s own personal risk and must adhere to system law where applicable.\n\n<EM4>Potential Blueprints</EM4>\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)\n\n== Stats ==\nReputation XP: +250
Intersec_KillShip_Vanduul_Title_VeryHard_001=Neutralize Vanduul Target <EM4>[BP]</EM4> [250 XP]
Intersec_ShipWaveAttack_DrawOutBoss_S_Desc_001=MISSION SPECS\n\nArea of Operation: ~mission(Location|Address)\nHostile Forces: Outlaws\nEquipment Specs: Capital Ship\nBriefing: An outlaw fleet lead by <EM4>~mission(TargetName)</EM4> has been planning a potentially devastating strike against sensitive UEE targets. InterSec has been tasked with dealing with this threat before their attack can be launched.\n\nAfter putting together a fighting force of your own, head to the site and engage with the hostiles there. Their leader will not risk entering into the fray themselve unless they feel their operation is suitably at risk. Stay at the site and take out hostile targets, until you can engage with the groups leader directly and put a stop to this heinous attack once and for all.\n\nRespectfully, \n\nDeacon Tobin \nOperations Manager \nInterSec Defense Solutions  \n\nThis communication consists of a non-binding offer that upon acceptance may be immediately terminated by either party without any given notice. All operations are conducted at the contractor’s own personal risk and must adhere to system law where applicable.\n\n== Stats ==\nReputation XP: +300
Intersec_ShipWaveAttack_DrawOutBoss_S_Title_001=Eradicate UEE Threat: ~mission(TargetName) [300 XP]
Intersec_ShipWaveAttack_DrawOutBoss_VH_Desc_001=MISSION SPECS\n\nArea of Operation: ~mission(Location|Address)\nHostile Forces: Outlaws\nEquipment Specs: Heavy Gun-Ship\nBriefing: An outlaw fleet lead by <EM4>~mission(TargetName)</EM4> has been planning a major strike against vital UEE infrastructure. InterSec has been tasked with dealing with this threat before their attack can be launched.\n\nGather a suitable amount of support craft and head to the engagement site. There you will have to engage with various squadrons before their leader will deem the situation dire enough to directly lead their forces. It is critical that they be neutralized in order to ensure the attack is stopped.\n\nRespectfully, \n\nDeacon Tobin \nOperations Manager \nInterSec Defense Solutions  \n\nThis communication consists of a non-binding offer that upon acceptance may be immediately terminated by either party without any given notice. All operations are conducted at the contractor’s own personal risk and must adhere to system law where applicable.\n\n== Stats ==\nReputation XP: +250
Intersec_ShipWaveAttack_DrawOutBoss_VH_Title_001=Terminate UEE Threat: ~mission(TargetName) [250 XP]
Kaboos_Intro_Description=MISSION SPECS\n\nArea of Operation: Nyx System\nHostile Forces: Unknown\nEquipment Specs: Combat-rated Ship, Personal Arms\nBriefing: InterSec has been enlisted by the UEE to gather intel on a group of <EM4>black marketeers dealing in Vanduul parts</EM4>, that have been linked to the illegal Vanduul experiments happening at ASD’s Onyx Facility. The UEE is eager to understand and put an end to their operations.\n\nBased on evidence extracted from the ASD facilities, we’ve potentially managed to track down the location of one of their storage sites.\n\nOnce accepted, head over to the old <EM4>QV Planet Services Logistics station</EM4> and we’ll be in touch.\n\n\nRespectfully, \n\nDeacon Tobin\nOperations Manager\nInterSec Defense Solutions\n\nThis communication consists of confidential information solely intended for the recipient. Please disregard if received in error and notify sender. All operations are conducted at the contractor’s own personal risk and must adhere to UEE and system law where applicable.\n\n== Stats ==\nReputation XP: +100
Kaboos_Intro_Title=Vanduul-Tech Smugglers [100 XP]
Kaboos_Mission_Description=MISSION SPECS\n\nArea of Operation: Nyx System\nHostile Forces: Outlaws present and armed\nEquipment Specs: Combat-rated Ship, Personal Arms\nBriefing: InterSec needs your services once again.\n\nThe intel you previously gathered has been invaluable in identifying several prominent buyers of the illegally-obtained Vanduul parts. However, since then the Shattered Blade have continued their operations and the UEE is requesting that we <EM4>update our intel.</EM4>\n\nWe believe more information can be retrieved from the storage facilities located at the old <EM4>QV Logistics station.</EM4>\n\nThe operation parameters haven’t changed since your last mission: find the <EM4>encrypted data</EM4> and use the <EM4>decryption key</EM4> to decipher and upload the list to us. The Shattered Blade will have reinforced the area since the last time, so expect resistance.\n\nGood luck. We’ll be in touch.\n\n\nRespectfully,\n\nDeacon Tobin\nOperations Manager\nInterSec Defense Solutions\n\nThis communication consists of confidential information solely intended for the recipient. Please disregard if received in error and notify sender. All operations are conducted at the contractor’s own personal risk and must adhere to UEE and system law where applicable.\n\n<EM4>Potential Blueprints</EM4>\n- Pulse "Blacklist" Pistol\n- Pulse Laser Pistol Battery (60 Cap)\n- Quartz "Black Op" Energy SMG\n- Quartz Energy SMG\n- Quartz Energy SMG Battery (45 cap)\n- Testudo Arms\n- Testudo Arms Clanguard\n- Testudo Core\n- Testudo Core Clanguard\n- Testudo Helmet\n- Testudo Helmet Clanguard\n- Testudo Legs\n- Testudo Legs Clanguard\n\n== Stats ==\nReputation XP: +100
Kaboos_Mission_Title=Retrieve Additional Smuggler Intel <EM4>[BP]</EM4> [100 XP]
LOC_PLACEHOLDER=<= PLACEHOLDER => [500 XP]
LOC_UNINITIALIZED=<= UNINITIALIZED =>\n\n<EM4>Potential Blueprints</EM4>\n- ADP Arms Woodland\n- ADP Core\n- ADP Legs Woodland\n- ADP-mk4 Arms Woodland\n- ADP-mk4 Core Woodland\n- ADP-mk4 Helmet Woodland\n- ADP-mk4 Legs Woodland\n- BR-2 Shotgun\n- BR-2 Shotgun Magazine (12 cap)\n- Balor HCH Helmet\n- FS-9 LMG\n- FS-9 Magazine (75 cap)\n- Gallant Rifle\n- Gallant Rifle Battery (45 cap)\n\n== Stats ==\nTier 1: +10 XP\nTier 2: +3,200 XP
LingFamily_HaulCargo_AToB_Intro_desc=Hi,  \n \nThis is Petra Ling, and I’m proud to offer you a new and exciting opportunity to partner with Ling Family Hauling. When my parents started this company, their goal was to provide fast and reliable courier deliveries around the greater Crusader area. It quickly became a success, and as our reputation grew, so did our operations.  \n \nNow, under my stewardship, Ling Family Hauling is taking the next big step – cargo hauling. Demand for this new service is growing faster than I expected, and that’s great news for both of us.   \n \nIf you’ve ever wanted to be a hauler, then I can make your dreams come true. Best way to learn something is by doing it, and I’ve got a haul of <EM4>~mission(Item)</EM4> that needs to go from <EM4>~mission(Location|Address)</EM4> to <EM4>~mission(Destination|Address)</EM4>.  \n\nNo prior experience is necessary, but here’s a few things to keep in mind. All pick-ups and deliveries must be done at a freight elevator or autoloaded. You will need a ship that can hold <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>, and a <EM4>handheld tractor beam</EM4> to move them around. \n \nUpon successful completion of this delivery, you will be promoted to a ‘trusted contractor’ status and more hauls will become available to you.     \n\n \nSincerely,  \nPetra Ling  \nManaging Director of Cargo Operations \nLing Family Hauling \n\n \n\n \n\n \n\nLing Family Hauling knows it’s a dangerous and unpredictable universe and has established several protocols to protect both you and our client’s cargo. To ensure you aren’t punished for circumstances outside of your control, total payment will be prorated to the percentage of cargo successfully delivered. A delivery timer will be set for each haul. Any cargo that remains undelivered upon its expiration will be flagged as stolen and treated as such. All pick-ups and deliveries must be autoloaded or done at a freight elevator.\n\n== Stats ==\nReputation XP: +100
LingFamily_HaulCargo_AToB_Intro_title=Cargo Hauling Opportunity with Ling Hauling [100 XP]
LingFamily_HaulCargo_AToB_title=Ling Family ~mission(ReputationRank) Cargo Haul - ~mission(CargoGradeToken) Scale [100 XP]
LingFamily_HaulCargo_MultiToSingle_desc_CFPAmenities=Hey, \n \nAny chance you’d be willing to do a haul into Pyro? I know it can get dangerous there but this is for a good cause. A group of new CFP members have moved to <EM4>~mission(Destination|Address)</EM4> and had a tough time adjusting to life in the system. They all left stuff behind in Stanton, because their transporter didn’t have room, so we’ve been hired to pick it all up and bring it to them.      \n\nHere are the pick ups:   \n\nPICK UP LOCATIONS (ANY ORDER)   \n\n~mission(MultiToSingleToken) \n\nCFP leaders hope that bringing them this stuff will make the system feel more like home. Let’s make sure this one goes down smoothly. Remember to equip your <EM4>handheld tractor beam</EM4>, and a ship that can fit <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>. \n \n\nHappy Hauling,  \nReyes Ling \nCargo Logistics Coordinator \nLing Family Hauling\n\n\n\n\n\n\n\nLing Family Hauling knows it’s a dangerous and unpredictable universe and has established several protocols to protect both you and our client’s cargo. To ensure you aren’t punished for circumstances outside of your control, total payment will be prorated to the percentage of cargo successfully delivered. A delivery timer will be set for each haul. Any cargo that remains undelivered upon its expiration will be flagged as stolen and treated as such. All pick-ups and deliveries must be autoloaded or done at a freight elevator.\n\n== Stats ==\nReputation XP: +100
LingFamily_HaulCargo_MultiToSingle_desc_Party=Hi, \n\nGuess the folks at <EM4>~mission(Destination|Address)</EM4> are planning a party and need help acquiring everything in a timely manner. You’ll need to make multiple pick-ups for this one, including one in Nyx to grab some Jynx gin. Not sure if you’ve ever had the stuff, but it’s a Nyx specialty. Some folks can’t get past that it glows pink, but I love it. Got a truly unique kick to it.\n\nHere are the pick ups:  \n\nPICK UP LOCATIONS (ANY ORDER) \n\n~mission(MultiToSingleToken)     \n\nPlease remember to bring a <EM4>handheld tractor beam</EM4>, as you’ll be handling cargo containers up to <EM4>~mission(MissionMaxSCUSize)</EM4>.  \n\n  \nHappy Hauling,  \nReyes Ling \nCargo Logistics Coordinator \nLing Family Hauling\n\n\n\n\n\n\n\nLing Family Hauling knows it’s a dangerous and unpredictable universe and has established several protocols to protect both you and our client’s cargo. To ensure you aren’t punished for circumstances outside of your control, total payment will be prorated to the percentage of cargo successfully delivered. A delivery timer will be set for each haul. Any cargo that remains undelivered upon its expiration will be flagged as stolen and treated as such. All pick-ups and deliveries must be autoloaded or done at a freight elevator.\n\n== Stats ==\nReputation XP: +100
