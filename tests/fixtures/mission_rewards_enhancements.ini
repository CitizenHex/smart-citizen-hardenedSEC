EckhartSecurity_EliminateAll_DC_Desc_001=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Clear Location\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nA client is sending frantic comms that one of their locations is under attack. We need a contractor who can hustle to <EM4>~mission(Location|Address)</EM4> and clear the location of hostile actors. \n\nAccording to onsite personnel, the outlaws are currently holed up near the <EM4>~mission(Location)</EM4>. Approach with caution and be prepared to use lethal force if the outlaws resist being removed.\n\nPayment will be issued upon successful completion of contract.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n== Stats ==\nTier 1: +500 XP (Failure: -50)\nTier 2: +500 XP
EckhartSecurity_EliminateAll_DC_Title_001=Expel Outlaws [500 XP]
EckhartSecurity_EliminateAll_storm_data_H_desc_001=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Clear Location\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nUrgent request came in from Associated Science & Development to provide combat support at ~mission(Location). Apparently they have been attacked by outlaws and their security forces have been unable to handle it on their own. \n\nYou've been cleared to go on site and aide local security elements in taking out the outlaws, but ASD reserves the right to restrict you from certain areas.\n\nThis is a confirmed combat op, so prepare accordingly.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n== Stats ==\nReputation XP: +2,000
EckhartSecurity_EliminateAll_storm_data_H_title_001=Combat Support: ~mission(Location) [2,000 XP]
EckhartSecurity_EliminateAll_storm_shut_H_desc_001=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Clear Location\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nGot an emergency request from Associated Science & Development for any available operators to report to ~mission(Location) and deal with some hostiles who have overtaken one of their facilities. \n\nOnce on site, you will need to engage and eliminate any hostile elements. ASD has indicated that this facility provides shuttle services to one of their embedded research centers but were very clear that you are not authorized to travel there. Trespassers will be shot and you will be no exception, so stick to the prescribed AO.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n== Stats ==\nReputation XP: +2,000
EckhartSecurity_EliminateAll_storm_shut_H_title_001=Requesting Help [2,000 XP]
EckhartSecurity_EliminateBoss_DC_Desc_001=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Bounty\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nWe’ve received actionable intelligence on a dangerous bounty, who’s turned out to be extremely elusive. <EM4>~mission(TargetName)</EM4> was spotted with a dedicated contingent of known associates at <EM4>~mission(Location|Address)</EM4>. We’re looking for a contractor ready and willing to execute this bounty before they disappear again.\n\nBased on previous attempts to apprehend this criminal, there’s a good chance that <EM4>~mission(TargetName|Last)</EM4> will try to avoid a direct confrontation, and instead send their allies to confront you. We believe that neutralizing these protective forces, and shredding the safety net they provide, is the best way to draw out <EM4>~mission(TargetName|Last)</EM4> to face you directly. \n\nExpect to confront a significant and skilled force. We advise that you plan accordingly. Payment will be issued upon successful completion of contract.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n== Stats ==\nReputation XP: +500
EckhartSecurity_EliminateBoss_DC_Title_001=High-Risk Bounty: ~mission(TargetName) [500 XP]
EckhartSecurity_EliminateSpecific_DC_Desc_001=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Bounty\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nWe’ve received a tip on the location of a high-profile bounty. Intel reports have tracked <EM4>~mission(TargetName)</EM4> to <EM4>~mission(Location|Address)</EM4>. We need a contractor heading in that direction on the double before the target vanishes. According to the latest reports, they were last seen near the <EM4>~mission(Location)</EM4>.  \n\nCome prepared to use lethal force if <EM4>~mission(TargetName|Last)</EM4> resists apprehension.    \n\nPayment will be issued upon successful completion of contract.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n== Stats ==\nReputation XP: +500
EckhartSecurity_EliminateSpecific_DC_Title_001=Hunt Bounty: ~mission(TargetName) [500 XP]
EckhartSecurity_Mercenary_Rehire_Desc_001=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Trial - Defend Location\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nEckhart Security is continuing to evaluate potential new contractors. According to our records, you’ve previously attempted a trial contract. We understand how demanding and unpredictable this line of work can be, and would like to give you another chance at completing a qualifying contract. \n\nIf interested, report to <EM4>~mission(Location|Address)</EM4> ready to defend it from an incoming assault by outlaws. Successfully complete this contract to receive payment and more work opportunities from Eckhart Security.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n== Stats ==\nReputation XP: +500\nFailure Penalty: -1,000 XP
EckhartSecurity_Mercenary_Rehire_Title_001=Security Contractor Reevaluation [500 XP]
EckhartSecurity_MultiEliminateAllAndBoss_DC_Desc_001=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Bounty\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nGot a big league bounty contract that’s primed to be executed. <EM4>~mission(TargetName)</EM4> and their crew were identified executing a raid on <EM4>~mission(Location|Address)</EM4>. If their MO holds true, <EM4>~mission(TargetName|Last)</EM4> has surfaced to land a big score and then will disappear into the ether. Let's not allow that to happen again. \n\nWord is the hostile forces have spread themselves across the location. That’ll make hunting down the precise location of <EM4>~mission(TargetName|Last)</EM4> difficult. In addition, expect the target to act defensively when under attack. In previous engagements, they remained hidden and directed their forces from afar. It is our recommendation that you focus on thinning out their allies first and force <EM4>~mission(TargetName|Last)</EM4> to come to their own defense. Would also advise you to bring plenty of ammo and even some support to help keep you from being overwhelmed.    \n\nPayment will be issued upon successful completion of contract.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n== Stats ==\nReputation XP: +500\nFailure Penalty: -50 XP
EckhartSecurity_MultiEliminateAllAndBoss_DC_Title_001=Deal with ~mission(TargetName) and Support Forces [500 XP]
EckhartSecurity_RecoverCargo_Easy_Description=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Recover Cargo\nApproval code: = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nClient's cargo was mid-transport when they ran into some ship trouble, and now a group of opportunistic outlaws are looking to cash in on this.\n\nIf you accept, head to <EM4>~mission(Location|Address)</EM4> and deal with the outlaws guarding the cargo. Extract it using a <EM4>heavy-duty tractor beam</EM4>, recover the cargo, load it in to a ship that can transport <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>, and deposit it on the freight elevator at <EM4>~mission(Destination|Address)</EM4>.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n== Stats ==\nReputation XP: +100
EckhartSecurity_RecoverCargo_Easy_Title=Client's Cargo Needs Recovering [100 XP]
EckhartSecurity_RecoverCargo_Hard_Description=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Recover Cargo\nApproval code: = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nGot a transport in need of backup over at <EM4>~mission(Location|Address)</EM4>. Signal was patchy, but their comms made it sound like a group of outlaws had gotten wind of what they were hauling and attempted to take it from them.\n\nConsidering the state of things before we lost contact, I'm considering this a recovery mission. Multiple hostiles are expected at the site, so a skilled crew is crucial for the success of this operation. There will be a high volume of cargo to deal with, so a ship that can carry <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> and a <EM4>heavy-duty tractor beam</EM4> will be needed. \n\nUpon successful extraction of cargo, deliver to the freight elevator at <EM4>~mission(Destination|Address)</EM4>.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n== Stats ==\nReputation XP: +200
EckhartSecurity_RecoverCargo_Hard_Title=High Risk Shipment Recovery [200 XP]
EckhartSecurity_RecoverCargo_Medium_Description=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Recover Cargo\nApproval code: = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nLooking for a competent contractor who can salvage a messy situation. A client's trusted pilot apparently wasn't so trustworthy and made off with a shipment. But thankfully our trackers are reporting the shipment's static for the moment, waiting to be picked up. If we play our cards right, there's still time to resolve this.\n\nThe abandoned ship is located at <EM4>~mission(Location|Address)</EM4> and will need a <EM4>heavy-duty tractor beam</EM4> to transport the goods. A ship that can handle <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> is a necessity, and expect contact from whatever outlaws this double-crossing pilot was hoping to sell to. \n\nOnce recovered, deliver the cargo to the freight elevator at <EM4>~mission(Destination|Address)</EM4>.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n== Stats ==\nReputation XP: +150
EckhartSecurity_RecoverCargo_Medium_Title=Standard Cargo Recovery Op. [150 XP]
EckhartSecurity_RecoverCargo_Super_Description=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Recover Cargo\nApproval code: = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nPutting out an immediate call for a highly skilled contractor to reclaim a client's cargo located at <EM4>~mission(Location|Address)</EM4>.\n\nClient hired an expert hauler to transport something discreetly, but it seems some information regarding the shipment was either hacked or leaked. The pilot was attacked and now the shipment is stranded. We need you and any support ships you bring to make it to the site before the cargo is lost for good. \n\nYou will need a <EM4>heavy-duty tractor beam</EM4> and a ship capable of storing <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>.\n\nAfter assessing the situation and the importance the client has placed on the recovery of the cargo, we have decided to reward a high payout for the successful delivery of the shipment to the freight elevator located at <EM4>~mission(Destination|Address)</EM4>.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n== Stats ==\nReputation XP: +300
EckhartSecurity_RecoverCargo_Super_Title=Extreme Risk Cargo Retrieval [300 XP]
EckhartSecurity_RecoverCargo_VeryEasy_Description=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Recover Cargo\nApproval code: = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nOne of my clients was in the process of transporting some cargo when they came under fire from a group of outlaws. We haven't been able to contact the crew onboard, but trackers indicate the cargo remains intact.\n\nWe need a contractor to head to <EM4>~mission(Location|Address)</EM4>, recover the cargo, and deliver it to the freight elevator located at <EM4>~mission(Destination|Address)</EM4>. A ship that can store <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> and a <EM4>heavy-duty tractor beam</EM4> are essential for this. Presently, we're not detecting any hostiles, but that could change by the time you've arrived.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n== Stats ==\nReputation XP: +50
EckhartSecurity_RecoverCargo_VeryEasy_Title=Low Risk Cargo Retrieval [50 XP]
EckhartSecurity_RecoverCargo_VeryHard_Description=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Recover Cargo\nApproval code: = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nCalling for a skilled contractor to recover a displaced shipment located at <EM4>~mission(Location|Address)</EM4>. Client's hauler was transporting some high value cargo when they decided to respond to a distress beacon and got ambushed by a group of outlaws. The client believes their pilot is gone but their cargo could still be recovered.\n\nThe information we have so far is that you'll need a ship that can carry <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>, a <EM4>heavy-duty tractor beam</EM4> for shifting the goods, as well as your support ships to help deal with the outlaws at the location. \n\nClient will be expecting the completed delivery to be made to the freight elevator at <EM4>~mission(Destination|Address)</EM4>.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n== Stats ==\nReputation XP: +200
EckhartSecurity_RecoverCargo_VeryHard_Title=Critical Cargo Extraction [200 XP]
Eckhart_Assassin_Sync_E_Desc_001=A price has been set on the heads of ~mission(TargetName) and ~mission(TargetName2). \n\nWhile having to hit two targets isn't that weird, the client wants to send a very specific message, so they need to targets hit at the exact same moment. The extra credits should make up for the hassle.\n\nAnd unfortunately since the pair aren't traveling together, it goes without saying that to pull it off you're gonna need some help. Make sure you bring people you trust can handle more than one ships since the targets are known to travel with backup. \n\n\n\n== Stats ==\naUEC Reward: 32,000\nReputation XP: +500
Eckhart_Assassin_Sync_E_Title_001=Double Tap [500 XP]
Eckhart_Assassin_Sync_H_Desc_001=Contract's for two targets that need to be taken out at the same time. \n\nGuess the client is worried that if they aren't eliminated together, one of them will go dark and try to get some revenge.\n\nThey go by ~mission(TargetName) and ~mission(TargetName2).\n\nFind yourself a team, divide and conquer.\n\nAnd make sure whoever it is has got skills, because these two have a reputation for holding their own in a fight and they for sure won't be alone. Be ready for them to give you some trouble.\n\n== Stats ==\naUEC Reward: 40,000\nReputation XP: +500
Eckhart_Assassin_Sync_H_Title_001=Two In The Head [500 XP]
Eckhart_Assassin_Sync_Intro_Desc_001=Interesting assignment came my way. I need two separate targets taken out: ~mission(TargetName) and ~mission(TargetName2) \n\nProblem is, either one gets word about the other being hit, they’ll go to ground. Can’t risk losing either of them. \n\nIt’ll take considerable coordination, but I want you to hit them both at the same exact time.  \n\nAnd since you can’t be in two places at once, you’ll need to find someone you can trust to help on this.\n\nThankfully, my intel says that both the targets should be traveling alone. That should help make things a bit easier on you.\n\n== Stats ==\naUEC Reward: 32,000\nReputation XP: +500
Eckhart_Assassin_Sync_Intro_Title_001=Coordinated Takedown [500 XP]
Eckhart_Assassin_Sync_M_Desc_001=Got a contract to take out two up and comers who've been stirring up trouble. It has to be clean, both done at the same time, or else they might cause even more trouble.  Long story short, you'll need some help on this one.\n\nBoth ~mission(TargetName) and ~mission(TargetName2) know how to handle themselves, and the people they fly with aren't no joke either. You can expect each of them to be guarded by a few ships.\n\n== Stats ==\naUEC Reward: 37,500\nReputation XP: +500
Eckhart_Assassin_Sync_M_Title_001=Double Elimination [500 XP]
Eckhart_Assassin_Sync_S_Desc_001=Normally, the pair of ~mission(TargetName) and ~mission(TargetName2) would be too much to take on together. They both are about as good as it gets when it comes to dogfighting and the crew they fly with are almost as good.\n\nBut recently they split - not sure why - and are flying separate for the moment.  Someone thinks this may be the best chance to take them out. \n\nGather some personnel you can trust and plan a simultaneous raid against both targets. It's too dangerous to risk one of them living after such a direct move against them.\n\n== Stats ==\naUEC Reward: 40,000\nReputation XP: +500
Eckhart_Assassin_Sync_S_Title_001=Divide and Conquer [500 XP]
Eckhart_Assassin_Sync_VE_Desc_001=Have another pair that need to be eliminated:\n~mission(TargetName) and ~mission(TargetName2)\n\nThey've been in the wind for a few days now, but just popped up. If we don't get them now, I'm not sure we will get another chance.  You need to enlist a partner to make sure both targets are hit at the same time.\n\nAs far as them putting up resistance, ~mission(TargetName) is known to bring along a friend to watch their back, and I suspect ~mission(TargetName2) will do likewise.\n\n== Stats ==\naUEC Reward: 32,000\nReputation XP: +500
Eckhart_Assassin_Sync_VE_Title_001=One-Two Combo [500 XP]
Eckhart_Assassin_Sync_VH_Desc_001=~mission(TargetName) and ~mission(TargetName2).\n\nTwo serious operators who've recently decided to make a move against their boss. Each of the pair are traveling with a small, highly trained armada and cutting deep into territory that doesn't belong to them.\n\nYou, and whoever you recruit to help, are going to take them out and it has to be both at the same time so they can't regroup.\n\n== Stats ==\naUEC Reward: 40,000\nReputation XP: +500
Eckhart_Assassin_Sync_VH_Title_001=Deadly Combination [500 XP]
Eckhart_EscortShips_E_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Escort Ship\nApproval code: = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nA group of ships located at <EM4>~mission(Location|Address)</EM4> are requesting an escort. If you accept, head to the location immediately and await instructions. The client claims that this escort is purely a precautionary measure, but that doesn’t mean you should drop your guard. Expect some hostile forces and deal with them appropriately.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n\n== Stats ==\nReputation XP: +100
Eckhart_EscortShips_E_title=Executive Protection Detail [100 XP]
Eckhart_EscortShips_H_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Escort Ship\nApproval code: = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nIn need of a contractor who can report in now. A client has found themselves in hot water over at <EM4>~mission(Location|Address)</EM4> and a protection detail to get away from an asteroid base. They’ve reported multiple, well-armed hostile ships meaning you’ll need a crew of your own to deal with them. Based on the client’s account, these attackers seem highly motivated so they will likely not back down easily.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n\n== Stats ==\nReputation XP: +200
Eckhart_EscortShips_H_title=VIP Client Needs Protection [200 XP]
Eckhart_EscortShips_M_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Escort Ship\nApproval code: = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nOne of my clients needs an immediate escort through dangerous space. Rendezvous at <EM4>~mission(Location|Address)</EM4> and they’ll meet you after they launch. Reports indicate increased outlaw activity in the area, so don’t let your guard down.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n\n== Stats ==\nReputation XP: +150
Eckhart_EscortShips_M_title=Experienced Protection Detail Needed [150 XP]
Eckhart_EscortShips_S_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Escort Ship\nApproval code: = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nThis contract should only be considered by the most capable of pilots. A highly valued client is currently under attack at <EM4>~mission(Location|Address)</EM4> and requires immediate extraction. They’re sitting in the hangar ready to leave, but are unable to move until the hostile ships in the area have been neutralized. \n\nI don’t see the outlaws stopping any time soon and our client’s reporting they’re packing high-grade weaponry on their ships. This will be a test of your skill as much as your endurance. Assemble whoever you need and head there immediately to assist them.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n\n== Stats ==\nReputation XP: +300
Eckhart_EscortShips_S_title=Top Tier Operator Needed [300 XP]
Eckhart_EscortShips_VE_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Escort Ship\nApproval code: = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nA client has requested a contractor with immediate availability to provide extra support to a number of ships leaving an asteroid base located at <EM4>~mission(Location|Address)</EM4>). Once you’ve accepted, rendezvous there and await further instructions. In this instance, your job is to provide support for their safe passage. Hostiles may be present, but they shouldn’t be too challenging to deal with.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n\n== Stats ==\nReputation XP: +100
Eckhart_EscortShips_VE_title=Low Risk Protection Detail [100 XP]
Eckhart_EscortShips_VH_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Escort Ship\nApproval code: = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nI’m in need of a highly competent pilot who can gather a crew of equally capable pilots for an escort mission. The mining base at <EM4>~mission(Location|Address)</EM4> is currently under attack from a group of outlaws and the crew there is unable to leave without assistance. Our scouts have reported that the attackers are armed with exceptional weaponry and ships.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n\n== Stats ==\nReputation XP: +250
Eckhart_EscortShips_VH_title=Protection Detail Needed. High Risk. [250 XP]
Eckhart_ShipAmbush_E_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Ship Ambush\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nA client of ours has been receiving anonymous threats in an attempt to blackmail them, and after a bit of leg work on our part, we’ve managed to trace it back to an individual who pilots a particular <EM4>~mission(AmbushTarget)</EM4>. The client wants us to take care of this blackmailer before they have a chance to make good. \n\nBased on our assessment, the target shouldn’t be too difficult to handle. They fly by <EM4>~mission(Location|Address)</EM4> on the regular, which has an <EM4>emission cloud</EM4> that’s an ideal spot to power down your ship and lie in wait. Sometimes the target is alone but they often travel with other single-seat ships as protection. Best be strategic when you launch your ambush or the <EM4>~mission(AmbushTarget)</EM4> could have a chance to get away. We don’t want to lose this one. We’ll alert other contractors in the area of the ambush so they can come help once it pops off.     \n\nPayment will be issued upon successful completion of contract. The client has also added a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> for the main contractor.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n\n== Stats ==\nReputation XP: +100
Eckhart_ShipAmbush_E_title=Time to Teach a Lesson [100 XP]
Eckhart_ShipAmbush_H_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Ship Ambush\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nLooking for a competent contractor who can recruit a wingman to help execute an ambush. The target is a <EM4>~mission(AmbushTarget)</EM4> which has been involved in several operations against one of our most important clients. By neutralizing it once and for all, it’ll make our client’s life a hell of a lot easier. While the ~mission(AmbushTarget) is our focus, they usually don’t fly anywhere without a sizable escort, including large craft. \n\nWe’ve gotten word that this group will be passing by <EM4>~mission(Location|Address)</EM4> soon. Any chance you could hurry and beat them there? That spot has an <EM4>emission cloud</EM4> that you can power down your ship and hide in. Then when they pass, you should have the upper hand.  \n\nPayment will be issued upon successful completion of contract. The client knows this one will be tough, so they threw in a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> that’ll go to the main contractor.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n\n== Stats ==\nReputation XP: +200
Eckhart_ShipAmbush_H_title=Tricky Ambush [200 XP]
Eckhart_ShipAmbush_Intro_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Ship Ambush\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nWe’re looking for contractors with combat experience who are willing to get their hands dirty so to speak. A client of ours was double-crossed by a <EM4>~mission(AmbushTarget)</EM4> and we’ve been waiting for an opportunity to deal with the issue. After tracking them for several weeks, we’ve identified <EM4>~mission(Location|Address)</EM4> as the ideal spot to intercept them. It features an <EM4>emission cloud</EM4> where you can hide and power down your ship while waiting for the <EM4>~mission(AmbushTarget)</EM4>.\n\nIntel suggests that they may travel with an escort. If they do, you’ll have to deal with them too. Since this is your first contract, we will have other contractors in the area who can lend a hand once you strike.\n\nPayment will be issued upon successful completion of contract. There’s a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> in this for the main contractor too.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n\n== Stats ==\nReputation XP: +100
Eckhart_ShipAmbush_Intro_title=New Opportunity - Ambush Strike [100 XP]
Eckhart_ShipAmbush_M_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Ship Ambush\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nNeed someone to take out a <EM4>~mission(AmbushTarget)</EM4> and deal with the escort ships protecting it. They’ve already interfered with several of our ongoing operations and have become a real problem across several of Eckhart Security cases. Not sure what their endgame is, but it won’t matter once you deal with them.\n\nWe’ve let slip that we will be working a job over at <EM4>~mission(Location|Address)</EM4> which should serve as bait to draw them out. The spot is ideal for an ambush because of the <EM4>emission cloud</EM4> that’s a perfect place to power down and hide until you’re ready to strike. If you’re available, the <EM4>~mission(AmbushTarget)</EM4> and its escorts should be passing through soon.   \n\nPayment will be issued upon successful completion of contract. The main contractor will also receive a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n\n== Stats ==\nReputation XP: +150
Eckhart_ShipAmbush_M_title=Launch Surprise Attack [150 XP]
Eckhart_ShipAmbush_S_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Ship Ambush\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nRecently, we sent a contractor after a <EM4>~mission(AmbushTarget)</EM4>, who was leading a crew targeting the operations of an extremely important client. Unfortunately, it was a trap and we lost some good people. We can’t let the target get away again, so we’ve decided the best course of action is to give them a dose of their own medicine.  \n\nAmbushing this target seems like the safest course of action, and we’ve identified a good spot for such an attack. There’s an <EM4>emission cloud</EM4> near <EM4>~mission(Location|Address)</EM4> that the target and their crew frequently fly by. You can power down your ship and hide there until you’re ready to strike. This crew is ruthless and extremely skilled. Don’t make the same mistake as the previous contractor and go this alone. It would be best for you to bring a few trusted friends to help handle this crew.    \n\nPayment will be issued upon successful completion of contract. Plus, we’ll throw in a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> for the main contractor for taking care of this.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n\n== Stats ==\nReputation XP: +300
Eckhart_ShipAmbush_S_title=Highly Dangerous Ambush [300 XP]
Eckhart_ShipAmbush_VE_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Ship Ambush\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nOne of our clients has been the victim of consistent harassment so the time has come to send a clear cease-and-desist message by taking out their prized <EM4>~mission(AmbushTarget)</EM4>.  The lowlife in question follows a fairly predictable routine making them susceptible to an ambush. We’ve identified <EM4>~mission(Location|Address)</EM4> as the ideal spot. It features an <EM4>emission cloud</EM4> where you can hide and power down your ship while waiting. \n\nBy the way, the <EM4>~mission(AmbushTarget)</EM4> often flies alone but is sometimes joined by a friend in a single-seat ship. Neither should give you too much trouble, but we have other contractors in the area who can lend a hand once you strike.\n\nPayment will be issued upon successful completion of contract. There’s a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> in this for the main contractor too.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n\n== Stats ==\nReputation XP: +100
Eckhart_ShipAmbush_VE_title=Settle a Score [100 XP]
Eckhart_ShipAmbush_VH_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Ship Ambush\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nA high profile client recently lost an important shipment when a pilot double-crossed them and ran off with their product. After weeks of hunting we’ve discovered that they were connected with an outlaw pack, so the client is looking to us to deter similar future issues from arising. The ultimate target is the pilot of a <EM4>~mission(AmbushTarget)</EM4>, who leads the crew responsible. This won’t be easy. They don’t go anywhere without escort fighters and sub-capital ships. That’s why we highly recommend that you find a trusted friend or two who can handle this with you.  \n  \nIntel gathered by our analysts indicates that they frequently fly by an <EM4>emission cloud</EM4> near <EM4>~mission(Location|Address)</EM4> which would provide an excellent area to stage a surprise strike.\n\nPayment will be issued upon successful completion of contract. We’re also adding a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> that’ll go to the main contractor.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n\n== Stats ==\nReputation XP: +250
Eckhart_ShipAmbush_VH_title=Dangerous Ambush [250 XP]
FTL_Courier_Nyx_Easy_Desc_001=AVAILABLE FTL CONTRACT\nFOR IMMEDIATE ASSIGNMENT\n\n**CONTRACT DETAILS**\nFTL requires an entry-level courier to complete deliveries in Nyx.\nCourier must provide own transportation.\nPrior training in manual lifting is preferred, with the <EM4>ability to move boxes of up to .25 SCU</EM4> in weight.\nBy accepting this contract you agree to take full responsibility for the safety of the assigned packages.\n\n~mission(Contractor|SignOff)\n\n== Stats ==\nReputation XP: +100
FTL_Courier_Nyx_Easy_Title_001=ENTRY LVL. COURIER NEEDED IN NYX [100 XP]
FTL_Courier_Stanton_Easy_Desc_001=AVAILABLE FTL CONTRACT\nFOR IMMEDIATE ASSIGNMENT\n\n**CONTRACT DETAILS** \nA reliable and hardworking entry-level courier is needed to ferry a delivery in Stanton.\nYou will be responsible for providing your own transportation.\nInterested contractors need the <EM4>ability to lift up to .25 SCU boxes</EM4>.\nContractors are employed on an independent basis and therefore not covered by FTL's company insurance.\n\n~mission(Contractor|SignOff)\n\n== Stats ==\nTier 1: +100 XP\nTier 2: +500 XP
FTL_Courier_Stanton_Easy_Title_001=ENTRY LVL. COURIER NEEDED IN STANTON [100–500 XP]
FTL_Courier_Stanton_Medium_Desc_001=AVAILABLE FTL CONTRACT\nFOR IMMEDIATE ASSIGNMENT\n\n**CONTRACT DETAILS**\nJunior-level courier needed for deliveries across the Stanton System.\nTransportation must be provided by courier.\nYou will be <EM4>required to lift up to .25 SCU</EM4> in weight.\nCouriers are responsible for the correct handling and safety of all packages charged to their care.\n\n~mission(Contractor|SignOff)\n\n== Stats ==\nReputation XP: +100
FTL_Courier_Stanton_Medium_Title_001=JR. LVL. COURIER NEEDED IN STANTON [100 XP]
Firesale_CFP_Description_01=Following the brutal attack on Pyro and our efforts to combat the vigilante group the Frontier Fighters, our strategic reserves across the system are at an all-time low. Citizens for Prosperity are eager to replenish our stocks before we reach a point of desperation. \n\nTo that end, we were hoping that you would be able to resupply<EM4> ~mission(Destination|Address) with detatrine. </EM4>\n\nThis rare chemical compound is a key ingredient in several vital medical supplies, so it is important that replace what we used up treating local civilians and CFP members injured in the wake of the Frontier Fighter assault.\n\nNormally we would direct you to reputable sources to acquire detatrine, but our contacts have informed us that several <EM4>depots</EM4> around the system have suddenly decided to sell the chemical at a significantly reduced price. In fact, it’s inexpensive enough that I suspect it will draw some unwanted attention. If you decide to seek out this potentially deadly deal, please do so with caution.\n\nYour support of our efforts is much appreciated,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n\n== Stats ==\nTier 1: +400 XP (Failure: -190,500)\nTier 2: +2,400 XP (Failure: -190,500)
