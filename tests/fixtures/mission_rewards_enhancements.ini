headhunters_ChainElimAll_1C_AttackCFP_E_desc_001=Been getting word that CFP security have been getting a little more aggressive and started pushing people out of the homes they've built out of the scrap in the system and they want payback, so they came to us.\n\nHead out to ~mission(Location|Address) and clear out the CFP there. Should be pretty cut and dry with a nice payday.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nReputation XP: +300
headhunters_ChainElimAll_1C_AttackCFP_E_title_001=A little retaliation <EM4>[BP]</EM4> [300 XP]
headhunters_ChainElimAll_1C_AttackXT_M_desc_001=Just got clearance from my Judge to start banging back against XenoThreat. Been eyeballing some spots under their control near ~mission(Location|Address).\n\nI'll give you the targets to hit, you kill everyone you find. Hell, I'd love to go myself, sounds like fun.\n\n-Stows\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nReputation XP: +150
headhunters_ChainElimAll_1C_AttackXT_M_title_001=Taking out some XenoThreat trash <EM4>[BP]</EM4> [150 XP]
headhunters_ChainElimAll_1C_ElimSpec_AttackCFP_M_desc_001=We've been trying to play nice with these Citizens for Prosperity people, but they've made it abundantly clear that we don't have a place in their 'safe system.' Their use of mercs for security have been causing all kinds of unreasonable violence like when this asshole ~mission(TargetName) opened fire on a group of settlers to drive them away from an outpost they'd been eyeing. So now the gloves are coming off.\n\nI need some hard workers to go hit ~mission(Location|Address) and take out ~mission(TargetName|Last). Odds are, they'll stay hidden until you prove you're enough of a threat, so make sure you do some damage.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nReputation XP: +150
headhunters_ChainElimAll_1C_ElimSpec_AttackCFP_M_title_001=Driving CFP out <EM4>[BP]</EM4> [150 XP]
headhunters_ChainElimAll_2C_ElimSpec_AttackCFP_H_desc_001=Got word from my Judge that we're to take back some of the outposts that CFP have taken over. They're a little pissed that CFP's getting as much of a foothold in the system as they are and think it's making the Headhunters look weak.\n\nFound a couple candidates near ~mission(Location|Address) that could use a sweep. Icing on the cake is that the head of security there is ~mission(TargetName). Not sure if you've heard of 'em, but they shot up a handful of Clips last month, so it's a win-win. Get some territory back and punch out someone who could really stand to get got.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nReputation XP: +300
headhunters_ChainElimAll_2C_ElimSpec_AttackCFP_H_title_001=Sweep and clear some CFP haunts <EM4>[BP]</EM4> [300 XP]
headhunters_ChainElimAll_2C_ElimSpec_AttackXT_H_desc_001=Need some good soldiers with a taste for violence to hit some XenoThreat hideouts located around ~mission(Location|Address). I'll get you the specifics if you're down, but you'll have to wipe out two separate clusters of hideouts. \n\nWe've also gotten word that ~mission(TargetName) is lurking around down there. If you take out enough XenoThreat dirtbags, they'll pop they're head up. \n\nWhen they do, put a round in it.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nReputation XP: +300
headhunters_ChainElimAll_2C_ElimSpec_AttackXT_H_title_001=Taking XenoThreat Turf <EM4>[BP]</EM4> [300 XP]
headhunters_ChainElimAll_3C_ElimSpec_AttackCFP_VH_desc_001=Got a big one here. We need a team to head out to ~mission(Location|Address). Word is CFP are dug in at three different clusters in the area. Our judge wants them all cleared out. Seems one of their mercs, a real mean skag named ~mission(TargetName), is holed up at one of them. We want you to go there, clear them all out and take out ~mission(TargetName|Last).\n\nGet yourself a nice little payday in the process.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nReputation XP: +300
headhunters_ChainElimAll_3C_ElimSpec_AttackCFP_VH_title_001=Hit a CFP Complex <EM4>[BP]</EM4> [300 XP]
headhunters_ChainElimAll_3C_ElimSpec_AttackXT_VH_desc_001=Got a juicy assignment for any big-time enforcers who want to clear a big payday. Over at ~mission(Location|Address) we got some XenoThreat turf run by a real bastard named ~mission(TargetName). Now if you've been in the system long enough, you've probably either heard of ~mission(TargetName|Last) or at least seen their work. Skag has a tendency to leaves bodies wherever they go.\n\nAnyway, Judge wants this area swept clean, that means you gotta hit all three clusters and kill every XenoThreat dirt you find. Kill enough and ~mission(TargetName|Last) won't be able to hide.\n\nTake them all out and have one on us.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nReputation XP: +400
headhunters_ChainElimAll_3C_ElimSpec_AttackXT_VH_title_001=Taking down a XenoThreat Hideout <EM4>[BP]</EM4> [400 XP]
headhunters_ChainElimAll_AttackCFP_E_desc_001=Looking for anyone with an itchy trigger finger. We're looking to move against some CFP at  ~mission(Location|Address) and take it for ourselves. You gotta play this smart though. There are a bunch of satellite outposts around the main one and all of 'em got security, so you should take out each of these before you take the main base.\n\nBut hey, if you wanna jump right in the deep end and fight off all the reinforcements, that's on you. As long as you get it done.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- DustUp Arms Tactical\n- DustUp Core Tactical\n- DustUp Helmet Tactical\n- DustUp Legs Tactical\n- Yubarev "Igniter" Pistol\n- Yubarev "Mirage" Pistol\n- Yubarev Pistol\n- Yubarev Pistol Battery (10 cap)\n\n== Stats ==\nReputation XP: +400
headhunters_ChainElimAll_AttackCFP_E_title_001=Time to roll on CFP <EM4>[BP]</EM4> [400 XP]
headhunters_ChainElimAll_AttackGen_E_desc_001=Looking for some hitters to go drop some violence on some local dipshits who've been pulling jobs in the system against Headhunters. We tried reaching out to explain the error of their ways, but they shot our messenger, so now we go with option B.\n\nYou'll find them holed up near ~mission(Location|Address). Go there and repaint the walls with their blood.\n\nHave fun.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- DustUp Arms Tactical\n- DustUp Core Tactical\n- DustUp Helmet Tactical\n- DustUp Legs Tactical\n- Yubarev "Igniter" Pistol\n- Yubarev "Mirage" Pistol\n- Yubarev Pistol\n- Yubarev Pistol Battery (10 cap)\n\n== Stats ==\nReputation XP: +400
headhunters_ChainElimAll_AttackGen_E_title_001=Go on the warpath <EM4>[BP]</EM4> [400 XP]
headhunters_ChainElimAll_Boss_XenoThreat_VH_desc_001=These XenoThreat assholes are like aloprats. Every time you thing you wipe them out, they just pop back up again. They seem to be back to their usual shit and trying to put together something big. No idea what, but we've been cleared to stop it before it starts.\n\nA group of XenoThreat biggies are supposedly meeting at ~mission(Location|Address) to plan or just rage or whatever it is they do, but we're gonna bust it up. Or you are.\n\nHead over there and wipe out everyone you find. Sure enough I'm sure the biggies will jump into the fight. That's what they always do.\n\nThis'll be a tough one. As much as I hate XenoThreat, they're damn good in a fight, so watch yourself and bring help if you can.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nReputation XP: +400
headhunters_ChainElimAll_Boss_XenoThreat_VH_title_001=Hit on XenoThreat command <EM4>[BP]</EM4> [400 XP]
headhunters_EliminateAll_Missing_Generic_M_desc_001=We tasked one of our up-and-coming triggers named ~mission(TargetName) to go clean out a hideout over at ~mission(Location|Address) from some assholes who'd been attacking some of the locals in the area. Well, I guess they got the drop on ~mission(TargetName|Last) because we haven't heard shit since.\n\nI want you to go and finish the job. While you're out there, if you can find out what happened to ~mission(TargetName|Last), that'd be great. I'm sure their dad would like to know.\n\nStows out.\n\n== Stats ==\nReputation XP: +200
headhunters_EliminateAll_Missing_Generic_M_title_001=Bring the hammer down [200 XP]
headhunters_EliminateAll_Missing_Xenothreat_H_desc_001=We had this kid named ~mission(TargetName) volunteer to go take out some XenoThreat near ~mission(Location|Address). Everything we knew about the place said it was gonna be too much for ~mission(TargetName|Last) to handle, but they were real keen on boosting their standing with the Headhunters and thought this would do it, so they went alone.\n\nHaven't heard anything but XenoThreat comms coming out of that place since. If you want to go and knock it over, we'll pay you instead. If you can find out what happened to ~mission(TargetName|Last) that would be a bonus.\n\nStows out.\n\n== Stats ==\nReputation XP: +600
headhunters_EliminateAll_Missing_Xenothreat_H_title_001=Should'a left it to a professional [600 XP]
headhunters_EliminateAll_Missing_Xenothreat_VH_desc_001=Here's the deal, one of our usual heavy hitters, a cat named ~mission(TargetName), was sent to ~mission(Location|Address) to knock out some XenoThreat who'd been hiding there. We knew it was going to be a tall order, but that's why we called in ~mission(TargetName|Last). Problem is, we ain't heard from them.\n\nAs far as we know XenoThreat are still operating out of that outpost so we gotta assume that ~mission(TargetName|Last) got popped. We need you to go in and finish what they started. Once that's done, if you can find out what happened to ~mission(TargetName|Last), that would be a bonus.\n\nStows out.\n\n== Stats ==\nReputation XP: +800
headhunters_EliminateAll_Missing_Xenothreat_VH_title_001=Unfinished Contract [800 XP]
headhunters_EliminateAll_XenoThreat_H_desc_001=One of our people stumbled across a group of XenoThreat hiding out over near ~mission(Location|Address). Not sure if they're dug in or just passing through, but we want to hit them before they move.\n\nMaybe bring some people if you got 'em because XenoThreat don't tend to go down easy. Get there and remind them who the power is in this system.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n== Stats ==\nReputation XP: +300
headhunters_EliminateAll_XenoThreat_H_title_001=Hit XenoThreat at ~mission(Location) <EM4>[BP]</EM4> [300 XP]
headhunters_EliminateSpecific_Asteroid_Generic_M_desc_001=Need someone taken care of. They're holed up near ~mission(Location|Address). Not sure if you care who they are, but their name's ~mission(TargetName). Not much to tell, local thug who killed someone who was connected.\n\nThey've been on the run, so they're gonna be skittish. I'd approach with caution.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Deadrig Shotgun Magazine (8 cap)\n- Dust Devil Armor Arms\n- Dust Devil Armor Core\n- Dust Devil Armor Legs\n- Manticore Helmet\n- Ravager-212 Twin Shotgun\n- Ravager-212 Twin Shotgun Magazine (16 cap)\n- Ripper "Sunblock" SMG\n\n== Stats ==\nReputation XP: +300
headhunters_EliminateSpecific_Asteroid_Generic_M_title_001=Need a death at ~mission(Location) <EM4>[BP]</EM4> [300 XP]
headhunters_EliminateSpecific_Asteroid_Generic_VE_desc_001=Got word of crew that's been pulling jobs and building a rep for themselves. Since they've said they don't want anything to do with Headhunters, we're looking to break 'em apart before they become a problem. Their leader is some punk named ~mission(TargetName) and we figure if they met the wrong end of a bullet, the rest of them would break apart.\n\nWe're told you can find ~mission(TargetName|Last) around ~mission(Location|Address). Head over and take care of it.\n\nThey shouldn't pose much of a problem to a pro like you.\n\nStows out.\n\n<EM4>Potential Blueprints</EM4>\n- Coda "Big Boss" Pistol\n- Coda "Nighthawk" Pistol\n- Coda Pistol\n- Coda Pistol Magazine (6 cap)\n- Morozov-SH Arms\n- Morozov-SH Core\n- Morozov-SH Helmet\n- Morozov-SH Legs\n- Scalpel Sniper Rifle\n- Scalpel Sniper Rifle Magazine (12 cap)\n\n== Stats ==\nReputation XP: +50
