ForceDepletionUnlawful_Desc=Thin out the security in this system. 750 UEC per head, with a 1500 UEC bonus upon completion.\n\nAny members of the following Organizations will count towards this mission:\n\nBlackJac Security\nCrusader Security\nHurston Security\nAdvocacy\n\n== Stats ==\naUEC Reward: 1,500\nReputation XP: +4,000
ForceDepletionUnlawful_Title=Eliminate Security Forces [4,000 XP]
ForceDepletion_Desc=Eliminate members of the Nine Tails Organization. \n\nFor each member neutralized,  you'll be paid 500 UEC, with a 1000 UEC bonus upon completion.\n\n== Stats ==\naUEC Reward: 1,000\nReputation XP: +4,000
ForceDepletion_Title=Eliminate members of the Nine Tails Organization [4,000 XP]
Foxwell_DefendLocation_E_Desc_001=Ships coming and going from <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4> are being targeted by hostile forces. The folks there have hired us to deal with this problem immediately.\n\nNeed someone to get there pronto and start fighting off these ships. The situation appears to be constantly evolving, so I’ll keep you updated on where you’re needed most. \n\nFor the hustle and effort, we’ll also be paying a bonus of <EM4>~mission(ScripAmount) MG Scrip</EM4> to the main contractor for dealing with this.\n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Storm\n- Antium Core Storm\n- Antium Helmet Storm\n- Antium Legs Storm\n- Parallax "Shock Trooper" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)\n\n== Stats ==\nReputation XP: +100
Foxwell_DefendLocation_E_Title_001=Yellow Level Contract: Defend ~mission(DefendLocationWrapperLocation) <EM4>[BP]</EM4> [100 XP]
Foxwell_DefendLocation_H_Desc_001=The folks at <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4> are under attack and need our support. Their ships in the wider area are being targeted and there’s a growing concern that this is only a precursor to something bigger.  \n\nThe situation is evolving, but I’m being fed constant updates on what’s going on and will keep you informed as the contract progresses. \n\nAre you available to come to their aid? Would be smart to recruit some friends to help. These are important clients and we can’t afford to fail them. The main contractor will earn a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> if you get the job done.\n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Storm\n- Antium Core Storm\n- Antium Helmet Storm\n- Antium Legs Storm\n- Parallax "Shock Trooper" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)\n\n== Stats ==\nReputation XP: +200
Foxwell_DefendLocation_H_Title_001=Orange Level Contract: Protect Our Client’s Interests <EM4>[BP]</EM4> [200 XP]
Foxwell_DefendLocation_M_Desc_001=We’ve got clients reporting outlaw attacks on ships around <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4>. They got locked down tight and anybody heading in or out is a target. Any attempts to solve the issue have just been met with more outlaw reinforcements appearing. \n\nThe client is desperate for a solution, so we’re hiring a contractor to go and restore peace in the area. If any other issues flare up once you're there, I’ll comm you directions on how to help.  \n\nReally need someone on this fast. So to sweeten the pot, the main contractor will also get a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Storm\n- Antium Core Storm\n- Antium Helmet Storm\n- Antium Legs Storm\n- Parallax "Shock Trooper" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)\n\n== Stats ==\nReputation XP: +150
Foxwell_DefendLocation_M_Title_001=Orange Level Contract: Ship Protection Needed <EM4>[BP]</EM4> [150 XP]
Foxwell_DefendLocation_S_Desc_001=Looking for a consummate professional to handle a high-stakes job. We’ve got VIP clients at <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4> who are facing extremely aggressive and motivated outlaws targeting ships around their location. Exact details on the attack are still rolling in, but it appears to be a wide ranging, multi-pronged operation. \n\nIf you’re available, I highly recommend that you bring additional combat support ships, plenty of supplies, and your A-game. Get this right, and we’ll reward the main contractor with a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Storm\n- Antium Core Storm\n- Antium Helmet Storm\n- Antium Legs Storm\n- Parallax "Shock Trooper" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)\n\n== Stats ==\nTier 1: +300 XP\nTier 2: +16,000 XP
Foxwell_DefendLocation_S_Title_001=Red Level Contract: Support VIP Clients <EM4>[BP]</EM4> [300–16,000 XP]
Foxwell_DefendLocation_VE_Desc_001=Outlaw ships are harassing anyone attempting to land or leave our client’s operations at <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4>. Need someone to fly there to defend the site and protect our client’s ships before the situation gets out of control. Get there, get after those aggressors, and I'll keep you updated on the situation. \n\nHelp take care of this and we'll pass along a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> to the main contractor.\n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Storm\n- Antium Core Storm\n- Antium Helmet Storm\n- Antium Legs Storm\n- Parallax "Shock Trooper" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)\n\n== Stats ==\nReputation XP: +100
Foxwell_DefendLocation_VE_Title_001=Yellow Level Contract: Stand Up to Aggressors <EM4>[BP]</EM4> [100 XP]
Foxwell_DefendLocation_VH_Desc_001=Ship support is needed at <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4> immediately. Our client’s interests in the area are under fierce attack by outlaw forces. Looking for someone who can grab their gear, a few support ships they can trust, and deploy before it’s too late. Once you arrive, I’ll send any sitrep updates your way.  \n\nDon’t mess this up. These clients are paying for and expecting top tier protection. If anything goes wrong, we could lose this contract. That’s why we’ll give the main contractor a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> if all goes down without a hitch.\n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Storm\n- Antium Core Storm\n- Antium Helmet Storm\n- Antium Legs Storm\n- Parallax "Shock Trooper" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)\n\n== Stats ==\nReputation XP: +250
Foxwell_DefendLocation_VH_Title_001=Red Level Contract: Save Ships at ~mission(DefendLocationWrapperLocation) <EM4>[BP]</EM4> [250 XP]
Foxwell_DestroyNarcotics_E_desc_001=Some folks will do anything for a few creds. There’s a group of upstart outlaws over at <EM4>~mission(Location|Address)</EM4> that have decided to start manufacturing drugs. Turns out they’re not too good at it, or maybe a little too good. The junk they’re pumping out is stronger than the normal stuff and a real danger to anyone who uses it. \n\nWe’ve been hired to knock out their operation and destroy whatever drugs stashes are on site. Armed guards are protecting the place, but they don’t seem too skilled. Our surveillance teams observed one of them almost shoot himself in the foot. Can’t say for certain, but odds are they won’t give a pro like you too many problems.  \n\n\nMarcus Clenn\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo\n\n== Stats ==\nReputation XP: +500\nFailure Penalty: -250 XP
Foxwell_DestroyNarcotics_E_title_001=Knock Out New Drug Op <EM4>[BP]</EM4> [500 XP]
Foxwell_DestroyNarcotics_H_desc_001=Reports of a spike in drug overdoses around Stanton has security services worried. Seems like some two-bit crew is juicing their profits by cutting their stuff with toxic chemicals. Shutting down this crew and stopping the distribution of their drugs has become a top priority.\n\nA Foxwell informant has revealed that part of this crew has currently set up shop at <EM4>~mission(Location|Address)</EM4>. Hiring a contractor to hustle over there and destroy whatever drugs they’ve got stashed before they’re spread across the system. Better be careful though, word is this crew is armed to the teeth and determined to profit off that poison no matter what.\n\n\nMarcus Clenn\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo\n\n== Stats ==\nReputation XP: +500\nFailure Penalty: -250 XP
Foxwell_DestroyNarcotics_H_title_001=Destroy Dangerous Drugs <EM4>[BP]</EM4> [500 XP]
Foxwell_DestroyNarcotics_M_desc_001=We’ve been contracted to take care of a problem at <EM4>~mission(Location|Address)</EM4>. There’s been a recent surge of activity in the area tied to the drug trade. It appears to be a well-run operation and there’s a growing concern that it’ll expand wider if not stopped. Any chance you’re available to make sure that doesn’t happen?   \n\nJob is pretty straightforward. Head to the site and destroy their stash of drugs. That way they won’t have the creds to expand their operations any further. I wouldn’t expect them to make this easy on you though. Armed guards are regularly seen around the facility, so be sure you’ve got enough gear to deal with them too. \n\n\nMarcus Clenn\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo\n\n== Stats ==\nReputation XP: +500\nFailure Penalty: -250 XP
Foxwell_DestroyNarcotics_M_title_001=Destroy Illegal Drugs <EM4>[BP]</EM4> [500 XP]
Foxwell_EliminateAll_Allies_desc_001=Got word that outlaws are attempting to overrun <EM4>~mission(Location|Address)</EM4>. There’s local security forces there, but they’re struggling to stop that attack.\n\nNeed a contractor to hustle there and help take care of the aggressors. Bring plenty of gear, and be careful when engaging targets. Don’t want to hear about any security team members getting caught in your crossfire.    \n\n\nMarcus Clenn\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo\n\n== Stats ==\nReputation XP: +500\nFailure Penalty: -250 XP
Foxwell_EliminateAll_Allies_title_001=Help Protect Site <EM4>[BP]</EM4> [500 XP]
Foxwell_EliminateAll_NonHostiles_desc_001=We’ve been contracted to take care of a delicate situation. A gang has settled into <EM4>~mission(Location|Address)</EM4> that we need to get cleared out. Only issue is that there’s still some civilians there too. \n\nLooking for someone with the skills and good trigger sense to get rid of those outlaws without harming any innocent people. If that’s you, grab your gear and get over there. \n\n\nMarcus Clenn\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo\n\n== Stats ==\nReputation XP: +500\nFailure Penalty: -1,000 XP
Foxwell_EliminateAll_NonHostiles_title_001=Carefully Clear Site <EM4>[BP]</EM4> [500 XP]
Foxwell_EliminateAll_OLP_M_desc_001=We’ve been following a group of outlaws on behalf of a client, and it looks like they’ve taken a permanent pit stop on an old orbital platform. \n\nWe’re looking for a contractor who can head over to <EM4>~mission(Location|Address)</EM4> and neutralize the targets. The platform is crawling with a bunch of armed and dangerous thugs, so we’ve designated this a yellow level contract.\n\n\nMarcus Clenn\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo\n\n== Stats ==\nReputation XP: +500\nFailure Penalty: -500 XP
Foxwell_EliminateAll_OLP_M_title_001=Yellow Level Contract: Merc Work <EM4>[BP]</EM4> [500 XP]
Foxwell_EliminateAll_PAF_M_desc_001=We’ve been tracking a group of outlaws who’ve been causing trouble for one of our clients. Seems they’ve taken up residence at an old Hathor facility. Don’t know what their plans with that old facility are but our client is eager to have them taken care of.\n\nLooking for someone to go to <EM4>~mission(Location|Address)</EM4> and neutralize these targets.\n\n\nMarcus Clenn\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo\n\n== Stats ==\nReputation XP: +500\nFailure Penalty: -500 XP
Foxwell_EliminateAll_PAF_M_title_001=Yellow Level Contract: Clear Out PAF <EM4>[BP]</EM4> [500 XP]
Foxwell_EliminateAll_desc_001=Looking for someone willing to take out the trash at <EM4>~mission(Location|Address)</EM4>. Guess a gang has settled in without the permission of the owners. So they’ve hired us to get them out whatever way we see fit. \n\nI’d bring plenty of ammo, if I were you. Doubt they’ll want to leave willingly. \n\n\nMarcus Clenn\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo\n\n== Stats ==\nReputation XP: +500\nFailure Penalty: -500 XP
Foxwell_EliminateAll_title_001=Sweep and Clear Location <EM4>[BP]</EM4> [500 XP]
Foxwell_EliminateSpecific_NonHostiles_desc_001=Got a line on a bounty named <EM4>~mission(TargetName)</EM4>. Someone spotted them along with known criminal accomplices at <EM4>~mission(Location|Address)</EM4>. Need you to get there before they get going. \n\n<EM4>~mission(TargetName|Last)</EM4> has a reputation for only showing their face in places with civs. Really need you to take down this bounty without there being any civilian collateral damage. Foxwell can’t afford to be caught in the shitstorm that would erupt over the loss of innocent life. \n\n\nMarcus Clenn\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo\n\n== Stats ==\nReputation XP: +1,000\nFailure Penalty: -500 XP
Foxwell_EliminateSpecific_NonHostiles_title_001=Precision Strike on ~mission(TargetName) <EM4>[BP]</EM4> [1,000 XP]
Foxwell_EliminateSpecific_desc_001=Looking to execute a bounty on <EM4>~mission(TargetName)</EM4>. We’ve learned that they’re currently hiding out with some confederates at <EM4>~mission(Location|Address)</EM4>. \n\nI’d be prepared to deal with the lowlifes hanging around <EM4>~mission(TargetName|Last)</EM4>, but our only real concern is that you land the target. \n    \n\nMarcus Clenn\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo\n\n== Stats ==\nReputation XP: +500\nFailure Penalty: -250 XP
Foxwell_EliminateSpecific_title_001=Track Down ~mission(TargetName) <EM4>[BP]</EM4> [500 XP]
Foxwell_HaulCargo_AToB_OLP_desc_01=Looking for a contractor with the right skills and ship for an important mission. Outlaws ambushed a Hull C carrying a <EM4>~mission(CargoGradeToken)</EM4> load of cargo and took it to <EM4>~mission(Location|Address)</EM4>. We’ve been hired to get it all back.  \n\nThe cargo is being stored somewhere at a defunct Hathor facility. The place is big and crawling with outlaws. Need someone to retrieve the goods from the freight elevator there and deliver it all back to the <EM4>freight elevator at ~mission(Destination|Address)</EM4>. Don’t think this will be a walk in the park. Bring lots of ammo and a ship that can handle <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>. \n\nIt also wouldn't hurt to bring a <EM4>handheld tractor beam</EM4> with you.   \n\n\nMarcus Clenn\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo
Foxwell_HaulCargo_AToB_OLP_title_01=Red Level Contract: Retrieve Cargo Haul <EM4>[BP]</EM4>
Foxwell_HaulCargo_AToB_PAF_desc_01=A crew recently raided a distribution center and made off with <EM4>~mission(CargoGradeToken) load of cargo</EM4>. Foxwell has been hired to get all those goods back. We’re getting reports of these outlaws using old Hathor facilities as stash houses and we believe the stolen items are currently at <EM4>~mission(Location|Address)</EM4>.\n\nIf interested, you’ll need a ship that can handle <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>. Doubt you’ll be able to slip in and out of that PAF without being noticed either, so best be prepared to clear the location. Once safe, grab the goods from the freight elevator and deliver them to the <EM4>freight elevator at ~mission(Destination|Address)</EM4>. \n\nIt also wouldn't hurt to bring a <EM4>handheld tractor beam</EM4> with you.   \n\n\nMarcus Clenn\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo
Foxwell_HaulCargo_AToB_PAF_title_01=Red Level Contract: Recoup Stolen Cargo Haul <EM4>[BP]</EM4>
Foxwell_HaulCargo_MultiToSingle_desc_01=Something weird is going on at the old Hathor mining facilities. Both the platform alignment facilities and orbital laser platforms have been abandoned and gathering dust for decades, but outlaws have started using them as a base of operations.\n\nWe’ve been hired by a concerned party who’s recently lost a lot of important cargo to one such gang. Currently, their stuff is stashed at <EM4>~mission(Location1|Address)</EM4> and <EM4>~mission(Location2|Address)</EM4>, but there’s a growing fear that the gang may be offloading their goods soon. That’s why we’ve been hired to hit both of those Hathor facilities, retrieve the cargo from the freight elevators, and bring it to the freight elevator at <EM4>~mission(Destination|Address)</EM4>. \n\nHere’s the specifics on what to grab from each location. Doesn’t matter in what order you do this, as long as it all gets collected and delivered. Just be sure to bring a ship that can handle <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>.  It also wouldn't hurt to bring a <EM4>handheld tractor beam</EM4> with you.   \n\n~mission(MultiToSingleToken)\n\nFoxwell hasn’t been able to scout these locations, but if I were you, I’d expect to face some serious armed resistance. Best bring a bunch of gear and some friends.\n\n\nMarcus Clenn\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo
Foxwell_HaulCargo_MultiToSingle_title_01=Red Level Contract: Clear PAFs, Recover Cargo, and Deliver to OLP <EM4>[BP]</EM4>
Foxwell_Mercenary_Rehire_desc_001=Due to a corporate restructuring, Foxwell has some new vacancies that need to be filled immediately. Foxwell knows you’ve previously expressed interest in this line of work, and we’re wondering if you would want to take another crack at a contract.\n\nOne of our clients needs support at <EM4>~mission(Location|Address)</EM4> where their security forces are struggling to handle an outlaw incursion. Head there and help the local forces get rid of the problem before it’s too late. \n\nSuccessfully complete this contract, and Foxwell would be happy to send more work your way.\n\n\nMarcus Clenn\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo\n\n== Stats ==\nReputation XP: +500\nFailure Penalty: -50 XP
Foxwell_Mercenary_Rehire_title_001=Still Looking for Work? <EM4>[BP]</EM4> [500 XP]
Foxwell_SecurityPatrol_E_Desc_001=Need someone to knock out a security patrol. You’ll need to go to the <EM4>location marker</EM4> on your HUD and then scan several designated waypoints ensuring that they’re safe and secure. \n\nSatellites in that region have been acting up recently. Not exactly sure what’s going on out there, but best be prepared in case there’s any trouble.\n\nComplete this contract and the main contractor will get a bonus payment of <EM4>~mission(ScripAmount) MG Scrip.</EM4>\n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Sand\n- Antium Core Sand\n- Antium Helmet Sand\n- Antium Legs Sand\n- Parallax "Sanguine" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)\n\n== Stats ==\nReputation XP: +100
Foxwell_SecurityPatrol_E_Title_001=Yellow Level Contract: Security Sweep <EM4>[BP]</EM4> [100 XP]
Foxwell_SecurityPatrol_H_Desc_001=Several unknown ships have been spotted in areas frequented by haulers delivering goods for our client. They’re worried these ships are monitoring their haulers in preparation for an ambush, so they’ve hired us to patrol the area. \n\nStart by going to the <EM4>location marker</EM4> on your HUD and scan it to ensure it’s clear. After that, we’ll send you to some other areas to scan for potential threats. We recommend that you bring a <EM4>wingman</EM4> and plenty of supplies to be ready to handle whatever might come your way.     \n\nAlso know that successfully completing this contract will earn the main contractor a bonus payment of <EM4>~mission(ScripAmount) MG Scrip.</EM4>\n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Sand\n- Antium Core Sand\n- Antium Helmet Sand\n- Antium Legs Sand\n- Parallax "Sanguine" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)\n\n== Stats ==\nReputation XP: +200
Foxwell_SecurityPatrol_H_Title_001=Orange Level Contract: Potential Security Threat <EM4>[BP]</EM4> [200 XP]
Foxwell_SecurityPatrol_M_Desc_001=A client is concerned about activity near some of their interests. We’ve been contracted to patrol the area and run scans at several locations. Interested? If so, head to the <EM4>location marker</EM4> on your HUD to start the patrol.\n\nThe client wasn’t specific about the threats, but they don’t think everything’s on the level out there. Hopefully we’ll be able to bring them some peace of mind.\n\nAdditionally, the client arranged for us to offer a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> to the main contractor.\n\n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Sand\n- Antium Core Sand\n- Antium Helmet Sand\n- Antium Legs Sand\n- Parallax "Sanguine" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)\n\n== Stats ==\nReputation XP: +150
Foxwell_SecurityPatrol_M_Title_001=Orange Level Contract: Security Patrol <EM4>[BP]</EM4> [150 XP]
Foxwell_SecurityPatrol_S_Desc_001=Need a battle-hardened pilot for an important patrol. A prominent client is fed up with outlaws targeting their ships and satellites. We’ve been hired to scan the areas in question and deal with any hostile forces. The patrol begins at the <EM4>location marker</EM4> on your HUD before moving to a number of other locations we’ll expect you to clear.\n\nNot sure what you’ll run into out there, but based on intel shared by the client, they’re frequently seeing fighter groups of five to seven ships roaming the region. Some even have larger ships leading the charge. That means you better be ready for a serious fight. If you can, try to recruit at least <EM4>three friends</EM4> to the cause. Even a seasoned pilot will need all the help they can get against this crew.   \n\nSince this is going to be a tough one, the main contractor will get a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> at the end of the patrol.\n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Sand\n- Antium Core Sand\n- Antium Helmet Sand\n- Antium Legs Sand\n- Parallax "Sanguine" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)\n\n== Stats ==\nReputation XP: +300
Foxwell_SecurityPatrol_S_Title_001=Red Level Contract: Secure Threatened Space <EM4>[BP]</EM4> [300 XP]
Foxwell_SecurityPatrol_VE_Desc_001=Time to knock out a routine patrol for one of our long-term clients. The route is a series of waypoints that need to be visited and scanned to confirm everything’s as expected. Should be simple enough.  \n\nIf interested, please accept and head to the <EM4>location marker</EM4> on your HUD to start. Pull this off and the main contractor will get a bonus payment of <EM4>~mission(ScripAmount) MG Scrip.</EM4>\n\n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Sand\n- Antium Core Sand\n- Antium Helmet Sand\n- Antium Legs Sand\n- Parallax "Sanguine" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)\n\n== Stats ==\nReputation XP: +100
Foxwell_SecurityPatrol_VE_Title_001=Yellow Level Contract: Routine Patrol <EM4>[BP]</EM4> [100 XP]
Foxwell_SecurityPatrol_VH_Desc_001=A client needs our help. Outlaws are roaming certain sectors where they do business and attacking anyone they come across. Our client has already lost several ships and can’t afford to lose anymore. \n\nWe need someone to patrol those areas and draw out any hostile forces. The job begins with you heading to the <EM4>location marker</EM4> on your HUD and scanning. Then we’ll share a handful of other patrol points for you to scan. \n\nFrom the sound of it, these packs of ships feature skilled and aggressive pilots. Best be ready to rumble if you run into any of them. Would be good to have at least <EM4>two trusted pilots</EM4> by your side for this one.\n\nAt the end of a successful patrol, the main contractor will get a bonus payment of <EM4>~mission(ScripAmount) MG Scrip.</EM4>\n\nStay chilly,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Sand\n- Antium Core Sand\n- Antium Helmet Sand\n- Antium Legs Sand\n- Parallax "Sanguine" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)\n\n== Stats ==\nReputation XP: +250
Foxwell_SecurityPatrol_VH_Title_001=Red Level Contract: High-Risk Security Patrol <EM4>[BP]</EM4> [250 XP]
Foxwell_ShipAmbush_E_desc_001=An outlaw who’s been on the run finally returned to the system. Seems like they hoped that disappearing for a bit would make us forget about them. They’re not even trying to hide their identity or vary their routine which means we know exactly where they’re going to be.\n\nLatest intel indicates that they’re flying a <EM4>~mission(AmbushTarget)</EM4> and will be passing by <EM4>~mission(Location|Address)</EM4> soon. I’ve already scoped out an emission cloud that’s a perfect place for you to find cover, power down your ship, and wait. Only real variable is if they’ll be alone or not. We’ve heard they sometimes roll with friends that all fly single-seaters. Landing that first surprise strike will be important as this crew is battle-tested, but we’ll have reinforcements at the ready to provide support if you need them.\n\nGet this done and we'll give the main contractor a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Jet\n- Antium Core Jet\n- Antium Helmet Jet\n- Antium Legs Jet\n- Parallax "Sunstone" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)\n\n== Stats ==\nReputation XP: +100
Foxwell_ShipAmbush_E_title_001=Yellow Level Contract: Surprise Strike <EM4>[BP]</EM4> [100 XP]
Foxwell_ShipAmbush_H_desc_001=Recently, a <EM4>~mission(AmbushTarget)</EM4> baited Foxwell forces with a bogus rescue beacon. By the time our forces realized what was happening, a squad of ships unleashed a devastating attack and only one Foxwell contractor survived. Their scan logs identified the bait ship, and we’ve had scouts monitoring them ever since.\n\nOur surveillance has revealed the squad has a regular flight pattern that we think we can exploit. There’s a sizable emission cloud at <EM4>~mission(Location|Address)</EM4> that makes it an ideal spot to post up. Think you have what it takes to handle this for us? \n\nIt’ll be you against the <EM4>~mission(AmbushTarget)</EM4>, other large craft, and a sizable escort. Wish I could be more specific than that but this crew regularly rotates ships in and out of the squad. Would be smart to bring some support, so you don’t get overwhelmed by their numbers.   \n\nComplete the job and we'll give the main contractor a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Jet\n- Antium Core Jet\n- Antium Helmet Jet\n- Antium Legs Jet\n- Parallax "Sunstone" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)\n\n== Stats ==\nReputation XP: +200
Foxwell_ShipAmbush_H_title_001=Orange Level Contract: Return the Favor <EM4>[BP]</EM4> [200 XP]
Foxwell_ShipAmbush_M_desc_001=Foxwell has been tracking a <EM4>~mission(AmbushTarget)</EM4> used by outlaws and discovered a pattern to its movements. The ship should be passing by <EM4>~mission(Location|Address)</EM4> soon.\n\nLooking for a contractor willing to hustle there, hide in the emission cloud, and then spring the trap when the time is right. There’s usually escort ships with the <EM4>~mission(AmbushTarget)</EM4>. Careful not to jump the gun and blow your cover. The element of surprise is crucial from what I’ve read.\n\nPull this off and we'll give the main contractor a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Jet\n- Antium Core Jet\n- Antium Helmet Jet\n- Antium Legs Jet\n- Parallax "Sunstone" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)\n\n== Stats ==\nTier 1: +150 XP\nTier 2: +2,000 XP
Foxwell_ShipAmbush_M_title_001=Orange Level Contract: Spring a Trap <EM4>[BP]</EM4> [150–2,000 XP]
Foxwell_ShipAmbush_S_desc_001=We’ve received a handful of comms about recent attacks undertaken by an <EM4>~mission(AmbushTarget)</EM4> and its escort ships. After opening a file, we started tracking the ship’s movements and noticed that it frequently passes an emission cloud near <EM4>~mission(Location|Address)</EM4>. We want to use that to our advantage to launch a surprise attack. \n\nOnce on site, you should hide in the emission cloud to cloak your signature enough to allow you to make the first strike. Unfortunately, Foxwell can’t provide additional reinforcements for this operation, so you’ll be responsible for bringing any support forces. You might need the help too. The crew of the ~mission(AmbushTarget) is aggressive and battle hardened.        \n\nYou get this taken care of for us and there's a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> in it for the main contractor.\n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Jet\n- Antium Core Jet\n- Antium Helmet Jet\n- Antium Legs Jet\n- Parallax "Sunstone" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)\n\n== Stats ==\nReputation XP: +300
Foxwell_ShipAmbush_S_title_001=Red Level Contract: Surprise Attack <EM4>[BP]</EM4> [300 XP]
Foxwell_ShipAmbush_VE_desc_001=Care to help us ghost a bad guy? \n\nWe’ve been hired to hunt down an outlaw flying a <EM4>~mission(AmbushTarget)</EM4>. Shouldn’t be too hard since they take the same flightpath each day. That makes them a prime target for an ambush if I ever saw one. I’ve analyzed the route and determined that <EM4>~mission(Location|Address)</EM4> is the ideal spot to strike. There’s an emission cloud there that’ll be perfect to hide your ship’s signature while you wait.   \n\nJob is simple if you’re interested. Head to the location, hide out, power down, and then wait for them to fly by. Sometimes they roll alone but they often have other single-seat ships with them. Shouldn’t be too hard to handle for a pro. Plus, we’ll still have reinforcements nearby and ready to deploy once it pops off.\n\nPull this off and we'll give the main contractor a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nGood luck,\n\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Jet\n- Antium Core Jet\n- Antium Helmet Jet\n- Antium Legs Jet\n- Parallax "Sunstone" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)\n\n== Stats ==\nTier 1: +100 XP\nTier 2: +500 XP
Foxwell_ShipAmbush_VE_title_001=Yellow Level Contract: Ambush An Amateur <EM4>[BP]</EM4> [100–500 XP]
Foxwell_ShipAmbush_VH_desc_001=Foxwell got word from an important client that outlaws have put together a squad that’s been stalking the system with sub-capital ships and escort fighters. Our client is concerned that if left unchecked, outlaws will create more of these attack squads and destabilize system security. We’ve been hired to wipe out this group before that happens. \n\nWe need a confident and skilled contractor for this task. Good news is that we have a plan in place. One of the ships used by this squad, a <EM4>~mission(AmbushTarget)</EM4>, was stolen from our client, who’s still able to track its movements. They’ve shared the location data with us and we’ve discovered that this squad often goes by <EM4>~mission(Location|Address)</EM4>. We’ve scouted the location and discovered a large emission cloud makes an ideal spot for an ambush.  \n\nNot going to lie, this isn’t going to be easy. We don’t have any additional forces available to deploy, so it would be good to bring your own support. \n\nYou manage to pull this off, I've arranged for a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> for the main contractor.\n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms Jet\n- Antium Core Jet\n- Antium Helmet Jet\n- Antium Legs Jet\n- Parallax "Sunstone" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)\n\n== Stats ==\nReputation XP: +250
Foxwell_ShipAmbush_VH_title_001=Red Level Contract: Ambush Attack Squad <EM4>[BP]</EM4> [250 XP]
Foxwell_ShipWaveAttack_ClearHostiles_Desc_E_001=Okay, this might be a bit of stretch to do on your own, so if you got any favors to call in, it could be good to cash those chits now. There's a group of desperados striking delivery ships up and down this sector and we've been tasked with cleaning them up. \n\nOnce your crew is ready, head over to ~mission(Location|Address) and take the hostiles there down. Now, these bastards are a bit clever so they tend to split up into smaller packs. Make sure you wait around to clear every last one of them out.\n \nGood luck,\n\nMarcus Clenn\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives."\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms\n- Antium Core\n- Antium Helmet\n- Antium Legs\n- Parallax Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)\n\n== Stats ==\nReputation XP: +100
Foxwell_ShipWaveAttack_ClearHostiles_Desc_H_001=It seems that a couple of different small-time gangs have decided to pool their resources and start doing coordinated attacks. Alone, they weren't much, but all together they're proving to be a serious threat that has to be dealt with.\n\nRecruit some backup you can rely on and the fly over to ~mission(Location|Address). Once you attack the initial gang members you find there, the other groups will arrive to support them. Make sure you wait around to take out all of them.\n \nGood luck,\n\nMarcus Clenn\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms\n- Antium Core\n- Antium Helmet\n- Antium Legs\n- Parallax Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)\n\n== Stats ==\nReputation XP: +200
Foxwell_ShipWaveAttack_ClearHostiles_Desc_M_001=A splinter group of outlaws have broken off from one of the main gangs in the system and have been trying to strike out on their own. With the amount of trouble they've been causing its clear they're looking to establish a name for themselves as quickly as they can. It's going to be up to you and your support crew to put a stop to them.\n\nOnce your crew is ready, head over to ~mission(Location|Address) and engage with the gang. Not all of them will just be waiting there on site. Expect reinforcements to arrive once you begin your assault. Just be sure to stay until every last one of them has been take care of.\n \nGood luck,\n\nMarcus Clenn\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives."\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms\n- Antium Core\n- Antium Helmet\n- Antium Legs\n- Parallax Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)\n\n== Stats ==\nReputation XP: +150
Foxwell_ShipWaveAttack_ClearHostiles_Desc_VE_001=There's a small group of criminals that have been marking their territory, striking out any freighters that get close enough. They got a little too greedy though, because now someone's paying us to go deal with them.\n\nOnce you and whoever you're bringing are ready, go to ~mission(Location|Address) and engage with these criminals. Since they like to fly in separate packs, be sure you wait around to clear every last one of them out.\n \nGood luck,\n\nMarcus Clenn\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\n<EM4>Potential Blueprints</EM4>\n- Antium Arms\n- Antium Core\n- Antium Helmet\n- Antium Legs\n- Parallax Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)\n\n== Stats ==\nReputation XP: +100
