Hurston_bounty_boss_dc_desc_001=HURSTON DYNAMICS OUTSOURCING\nCONTRACT: Bounty Collection\nOUTSOURCE MANAGER: I. Takao\nRISK ASSESSMENT: High Risk Target (Armed Support)\n\nHurston Dynamics is seeking a contractor to complete a bounty for ~mission(TargetName). This bounty has proven extremely elusive so far, but intel reports have tracked the target and a cohort of their known associates to ~mission(Location|Address). \n\nHowever, there is a strong chance that ~mission(TargetName|Last) will not risk a confrontation unless absolutely forced to. It is our recommendation that you neutralize a significant portion of the criminal’s allies first in order to draw them out. The report indicates that a large party of these hostiles are currently near the ~mission(Location).\n\nPayment will be released only after the bounty has been deemed complete.\n\n\n\n\n** The information transmitted may contain confidential and/or privileged material. Any review, retransmission, dissemination or other use of or taking action in reliance upon this information by persons or entities other than the intended recipient is prohibited. **\n\n== Stats ==\naUEC Reward: 16,750\nReputation XP: +500
Hurston_bounty_boss_dc_title_001=Elusive Bounty: ~mission(TargetName) (HRT) [500 XP]
Hurston_bounty_multiboss_dc_desc_001=HURSTON DYNAMICS OUTSOURCING\nCONTRACT: Bounty Collection\nOUTSOURCE MANAGER: I. Takao\nRISK ASSESSMENT: Very High Risk Target (Armed Support)\n\nHurston Dynamics is seeking a contractor to complete a bounty for ~mission(TargetName). This target and the large hostile force they are traveling with have just been reported raiding ~mission(Location|Address). \n\nHowever, if their MO holds true, ~mission(TargetName|Last) has typically remained hidden during attacks, preferring to direct their forces from afar. It is our recommendation that you focus on thinning out their allies first, and once their numbers have been significantly weakened, ~mission(TargetName|Last) will have no choice but to confront you directly. \n\nPayment will be released only after the bounty has been deemed complete.\n\n\n\n\n** The information transmitted may contain confidential and/or privileged material. Any review, retransmission, dissemination or other use of or taking action in reliance upon this information by persons or entities other than the intended recipient is prohibited. **\n\n\n== Stats ==\naUEC Reward: 134,500\nReputation XP: +1,000
Hurston_bounty_multiboss_dc_title_001=Evasive Bounty: ~mission(TargetName) (VHRT) [1,000 XP]
Hurston_eliminateall_dc_desc_001=HURSTON DYNAMICS OUTSOURCING\nCONTRACT: Neutralize Hostile Force\nOUTSOURCE MANAGER: T. Dalik\nRISK ASSESSMENT: High\n\nOur security forces have been notified of an ongoing outlaw incursion at ~mission(Location|Address), and we are in need of an independent operator capable of clearing out the hostile actors. \n\nAccording to onsite personnel, the outlaws are currently holed up near the ~mission(Location). Approach with caution and be prepared to use lethal force if the outlaws resist being removed.\n\nPayment will only be authorized once the location has been effectively cleared.\n\n\n\n\n** The information transmitted may contain confidential and/or privileged material. Any review, retransmission, dissemination, or other use of or taking action in reliance upon this information by persons or entities other than the intended recipient is prohibited. **\n\n\n== Stats ==\naUEC Reward: 21,000\nReputation XP: +500
Hurston_eliminateall_dc_title_001=Neutralize Outlaw Incursion [500 XP]
Hurston_eliminatespecifc_dc_desc_001=HURSTON DYNAMICS OUTSOURCING\nCONTRACT: Bounty Collection\nOUTSOURCE MANAGER: T. Davik\nRISK ASSESSMENT: Moderate Risk Target\n\nHurston Dynamics is seeking a contractor to complete a bounty for ~mission(TargetName). Intel reports have tracked the target to ~mission(Location|Address) where they were last seen near the ~mission(Location). \n\nBe prepared for them to resist apprehension and for the use of lethal force if required.\n\nPayment will be released only after the bounty has been deemed complete.\n \n\n\n\n** The information transmitted may contain confidential and/or privileged material. Any review, retransmission, dissemination or other use of or taking action in reliance upon this information by persons or entities other than the intended recipient is prohibited. **\n\n\n== Stats ==\naUEC Reward: 34,000\nReputation XP: +500
Hurston_eliminatespecifc_dc_title_001=Bounty Located: ~mission(TargetName) (MRT) [500 XP]
Hurston_searchbody_dc_desc_001=HURSTON DYNAMICS OUTSOURCING\nCONTRACT: Locate Missing Individual\nOUTSOURCE MANAGER: I. Takao\nRISK ASSESSMENT: Low\n\nThe staff at ~mission(Location|Address) has recently filed a missing persons report for one ~mission(TargetName). They have been missing for several days and were last seen heading to the ~mission(Location).\n\nYou are being contracted to conduct an onsite search for ~mission(TargetName|Last) and see if you can determine their whereabouts. \n\nPayment is dependent on returning a record of their current location, alive or dead.\n\n\n\n\n** The information transmitted may contain confidential and/or privileged material. Any review, retransmission, dissemination or other use of or taking action in reliance upon this information by persons or entities other than the intended recipient is prohibited. **\n\n\n== Stats ==\naUEC Reward: 6,000
InterSec_KillShip_Vanduul_Desc_Super_001=MISSION SPECS\n\nArea of Operation: Nyx System\nHostile Forces: Vanduul\nEquipment Specs: Combat-rated Ship\nBriefing: InterSec requires the services of a skilled pilot who’s prepared to assist in taking down a dangerous Vanduul target that has been involved in numerous attacks.\n\nVanduul incursions have been on the rise recently, posing not only a threat to the system of Nyx, but the UEE as a whole. It is imperative that these sightings are responded to in a swift and efficient manner. \n\nWe require you to fly to the last known sighting of the Vanduul ship at <EM4>~mission(Location|Address)</EM4> and eliminate them immediately.  \n\nVanduul pilots are highly skilled and extremely dangerous. Engage the enemy immediately and do not hesitate – they will not show the same mercy.\n\nCompensation proportionate to the risk of the contract will be awarded.\n\n\nRespectfully,\nDeacon Tobin\nOperations Manager\nInterSec Defense Solutions\n\nThis communication consists of a non-binding offer that upon acceptance may be immediately terminated by either party without any given notice. All operations are conducted at the contractor’s own personal risk and must adhere to system law where applicable.\n\n<EM4>Potential Blueprints</EM4>\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)\n\n== Stats ==\nReputation XP: +300
InterSec_KillShip_Vanduul_Title_Super_001=Eliminate Vanduul Ship <EM4>[BP]</EM4> [300 XP]
InterSec_ResourceGathering_Cryopods_Desc=MISSION SPECS\n\nArea of Operation: Nyx System\nHostile Forces: Outlaws present and armed\nEquipment Specs: <EM4>Cargo Capable Ship</EM4>, Personal Arms, <EM4>Heavy-Duty Tractor Beam</EM4>\nBriefing: \nOur latest intel shows that the Shattered Blade have replenished their stock of Vanduul corpses and will shortly be transferring them from the old <EM4>QV Logistics station</EM4>they're operating from to an interested buyer. The UEE can't have another incident like what happened with ASD so they're eager for us to <EM4>recover the cryopods</EM4> and deliver them to <EM4>the freight elevator at ~mission(Destination|Address)</EM4>.\n\nWhile the Shattered Blade members present at the site might offer resistance, they are not the focus of you mission. Deal with them as needed and get the cryopods. \n\nRespectfully,\n\nDeacon Tobin\nOperations Manager\nInterSec Defense Solutions\n\nThis communication consists of confidential information solely intended for the recipient. Please disregard if received in error and notify sender. All operations are conducted at the contractor’s own personal risk and must adhere to UEE and system law where applicable.\n\n<EM4>Potential Blueprints</EM4>\n- Pulse Laser Pistol\n- Pulse Laser Pistol Battery (60 Cap)\n- Testudo Arms Earthshake\n- Testudo Core Earthshake\n- Testudo Helmet Earthshake\n- Testudo Legs Earthshake
InterSec_ResourceGathering_Cryopods_Title=Recover Vanduul Corpses <EM4>[BP]</EM4>
InterSec_ResourceGathering_Tech_Desc=MISSION SPECS\n\nArea of Operation: Nyx System\nHostile Forces: Outlaws present and armed\nEquipment Specs: Combat-rated Ship, Personal Arms\nBriefing: \nTo prevent the Shattered Blade from flooding the black market with xeno-contraband, the UEE has charged InterSec with <EM4>recovering a stash of Vanduul Plating and Metal.</EM4> from the old <EM4>QV Logistics station</EM4> the gang has been occupying. Once you have the materials in your posession, deliver them to the freight elevator at <EM4>~mission(Destination|Address)</EM4>.\n\nFollowing from your previous experience, it would not be surprising if the Shattered Blade offer resistance, but ensure that your focus is on recovering the materials.\n\nRespectfully,\n\nDeacon Tobin\nOperations Manager\nInterSec Defense Solutions\n\nThis communication consists of confidential information solely intended for the recipient. Please disregard if received in error and notify sender. All operations are conducted at the contractor’s own personal risk and must adhere to UEE and system law where applicable.\n\n<EM4>Potential Blueprints</EM4>\n- Pulse Laser Pistol\n- Pulse Laser Pistol Battery (60 Cap)\n- Testudo Arms Earthshake\n- Testudo Core Earthshake\n- Testudo Helmet Earthshake\n- Testudo Legs Earthshake
InterSec_ResourceGathering_Tech_Title=Recover Vanduul Tech <EM4>[BP]</EM4>
InterSec_SecurityPatrol_H_Desc_001=MISSION SPECS\n\nArea of Operation: Nyx System\nHostile Forces: Outlaws\nEquipment Specs: Combat-rated Ships\nBriefing: InterSec has received intelligence that outlaws are planning to launch an attack on a target within the UEE. In an effort to prevent this from happening, we need a contractor to patrol a sector we believe these outlaws are using to prepare for their attack.\n\nOutlaw activity in this sector is higher than normal, so InterSec recommends that you <EM4>bring backup</EM4>. When ready, dispatch to the <EM4>location marker</EM4> on your HUD and scan the waypoints along the route. Once you've confirmed that the entire sector is clear, the main contractor will receive a bonus of <EM4>~mission(ScripAmount) MG Scrip.</EM4> \n\nRespectfully,\n\nDeacon Tobin\nOperations Manager\nInterSec Defense Solutions\n\nThis communication consists of a non-binding offer that upon acceptance may be immediately terminated by either party without any given notice. All operations are conducted at the contractor’s own personal risk and must adhere to system law where applicable.\n\n<EM4>Potential Blueprints</EM4>\n- Quartz "Deadfall" Energy SMG\n- Quartz "Lumen" Energy SMG\n- Quartz Energy SMG Battery (45 cap)\n- Testudo Arms Nightveil\n- Testudo Arms Turfwar\n- Testudo Core Nightveil\n- Testudo Core Turfwar\n- Testudo Helmet Nightveil\n- Testudo Helmet Turfwar\n- Testudo Legs Nightveil\n- Testudo Legs Turfwar\n\n== Stats ==\nReputation XP: +200
InterSec_SecurityPatrol_H_Title_001=Patrol Dangerous Sector <EM4>[BP]</EM4> [200 XP]
InterSec_SecurityPatrol_S_Desc_001=MISSION SPECS\n\nArea of Operation: Nyx System\nHostile Forces: Vanduul\nEquipment Specs: Combat-rated Ships\nBriefing: There's a growing concern that Vanduul hunting parties are pushing further into Nyx. The first line of defense against this encroachment is increased patrols. InterSec has identified a sector that has seen an uptick in Vanduul activity and are looking for someone to patrol the region and provide an update on it.\n\nYou'll begin your patrol at a <EM4>location marker</EM4> sent to your HUD and then scan a series of waypoints along a designated route. The Vanduul ships in this sector are highly skilled and aggressive, so InterSec highly recommends that you <EM4>bring several combat-ready ships along as backup</EM4>.\n\nInterSec understands the immense danger you'll be under on this patrol, so we'll send a special bonus of <EM4>~mission(ScripAmount) MG Scrip</EM4> to the main contractor once the sector is clear.      \n\nRespectfully,\n\nDeacon Tobin\nOperations Manager\nInterSec Defense Solutions\n\nThis communication consists of a non-binding offer that upon acceptance may be immediately terminated by either party without any given notice. All operations are conducted at the contractor’s own personal risk and must adhere to system law where applicable.\n\n<EM4>Potential Blueprints</EM4>\n- Quartz "Deadfall" Energy SMG\n- Quartz "Lumen" Energy SMG\n- Quartz Energy SMG Battery (45 cap)\n- Testudo Arms Nightveil\n- Testudo Arms Turfwar\n- Testudo Core Nightveil\n- Testudo Core Turfwar\n- Testudo Helmet Nightveil\n- Testudo Helmet Turfwar\n- Testudo Legs Nightveil\n- Testudo Legs Turfwar\n\n== Stats ==\nReputation XP: +300
InterSec_SecurityPatrol_S_Title_001=Patrol Vanduul Hunting Ground <EM4>[BP]</EM4> [300 XP]
InterSec_SecurityPatrol_VH_Title_001=Patrol to Prevent Possible Attack <EM4>[BP]</EM4> [250 XP]
InterSec_SecurityPatrol_VH_desc_001=MISSION SPECS\n\nArea of Operation: Nyx System\nHostile Forces: Outlaws\nEquipment Specs: Combat-rated Ships\nBriefing: InterSec has been tracking increased outlaw activity in certain sectors of the system. This activity in conjunction with other intelligence leads us to believe that outlaws are planning an attack on elements traveling from the UEE. We're aiming to patrol these sectors and disrupt any plans before they can be put into action.\n\nCurrently, we need someone who can help patrol a highly dangerous sector. Once you've accepted the mission, you can proceed to the <EM4>location marker</EM4> on your HUD. From there, we'll send you along a specific route with additional waypoints to scan. Complete the patrol and we'll send the main contractor a bonus of <EM4>~mission(ScripAmount) MG Scrip.</EM4>\n\nDue to the high probability of attack and general threat level of local outlaws, we recommend <EM4>recruiting trusted wingmen</EM4> to provide combat support.\n\nRespectfully,\n\nDeacon Tobin\nOperations Manager\nInterSec Defense Solutions\n\nThis communication consists of a non-binding offer that upon acceptance may be immediately terminated by either party without any given notice. All operations are conducted at the contractor’s own personal risk and must adhere to system law where applicable.\n\n<EM4>Potential Blueprints</EM4>\n- Quartz "Deadfall" Energy SMG\n- Quartz "Lumen" Energy SMG\n- Quartz Energy SMG Battery (45 cap)\n- Testudo Arms Nightveil\n- Testudo Arms Turfwar\n- Testudo Core Nightveil\n- Testudo Core Turfwar\n- Testudo Helmet Nightveil\n- Testudo Helmet Turfwar\n- Testudo Legs Nightveil\n- Testudo Legs Turfwar\n\n== Stats ==\nReputation XP: +250
Intersec_DefendShip_Desc_Easy_001=MISSION SPECS\n\nArea of Operation: Nyx System \nHostile Forces: Outlaws\nEquipment Specs: Combat-rated Ship \nBriefing: Require urgent assistance for an InterSec operative who is currently under fire at <EM4>~mission(Location|Address)</EM4>.\n\nA group of outlaws had previously taken our operative captive with the intention of extracting sensitive information from them, but miraculously they were able to escape. Unfortunately, the pursuing outlaws now have them pinned down.\n\nDue to the number of the ships assaulting them, we're offering additional compensation to accommodate the added danger. <EM4>Recruiting additional ships</EM4> to support you in this mission is highly advised.\n\nRespectfully,   \n\nDeacon Tobin \nOperations Manager \nInterSec Defense Solutions  \n\nThis communication consists of confidential information solely intended for the recipient. Please disregard if received in error and notify the sender. All operations are conducted at the contractor’s own personal risk and must adhere to UEE and system law where applicable.\n\n<EM4>Potential Blueprints</EM4>\n- Pulse "Rouge" Pistol\n- Pulse Laser Pistol Battery (60 Cap)\n- Testudo Arms Combustion\n- Testudo Core Combustion\n- Testudo Helmet Combustion\n- Testudo Legs Combustion\n\n== Stats ==\nReputation XP: +100
Intersec_DefendShip_Desc_Hard_001=MISSION SPECS\n\nArea of Operation: Nyx System \nHostile Forces: Outlaws\nEquipment Specs: Combat-rated Ships\nBriefing: One of our pilots is under attack at <EM4>~mission(Location|Address)</EM4> and is in need of assistance.\n\nThis operative is carrying key information regarding a coordinated attack on key UEE infrastructure and it is vital that they are able to deliver it to us. You and any <EM4>dependable pilots you can recruit</EM4> are charged with protecting them from the outlaws in pursuit long enough for them to QT away.\n\nRespectfully,   \n\nDeacon Tobin \nOperations Manager \nInterSec Defense Solutions  \n\nThis communication consists of confidential information solely intended for the recipient. Please disregard if received in error and notify the sender. All operations are conducted at the contractor’s own personal risk and must adhere to UEE and system law where applicable.\n\n<EM4>Potential Blueprints</EM4>\n- Pulse "Rouge" Pistol\n- Pulse Laser Pistol Battery (60 Cap)\n- Testudo Arms Combustion\n- Testudo Core Combustion\n- Testudo Helmet Combustion\n- Testudo Legs Combustion\n\n== Stats ==\nReputation XP: +200
Intersec_DefendShip_Desc_Medium_001=MISSION SPECS\n\nArea of Operation: Nyx System \nHostile Forces: Outlaws\nEquipment Specs: Combat-rated Ships\nBriefing: An undercover agent of ours was compromised and is now being pursued by the outlaw pack they had infiltrated. As such, they are in need of immediate extraction at <EM4>~mission(Location|Address)</EM4>. \n\nOnce on site, engage with all hostiles in order to provide cover so our operative can QT away.\n\n<EM4>Bring additional backup</EM4> and don't underestimate these outlaws. They are violent and motivated so they are unlikely to give up anytime soon.\n\nRespectfully,\n\nDeacon Tobin \nOperations Manager \nInterSec Defense Solutions  \n\nThis communication consists of confidential information solely intended for the recipient. Please disregard if received in error and notify the sender. All operations are conducted at the contractor’s own personal risk and must adhere to UEE and system law where applicable.\n\n<EM4>Potential Blueprints</EM4>\n- Pulse "Rouge" Pistol\n- Pulse Laser Pistol Battery (60 Cap)\n- Testudo Arms Combustion\n- Testudo Core Combustion\n- Testudo Helmet Combustion\n- Testudo Legs Combustion\n\n== Stats ==\nReputation XP: +150
