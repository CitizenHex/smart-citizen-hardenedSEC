name: Installer Preview

# Build a tester-installable installer outside the standard release flow.
# Output is a workflow artifact (a downloadable SmartCitizen-{VERSION}-Setup.exe)
# accessible to anyone with read access on the repo — testers need a
# GitHub account but no special permission.
#
# Two triggers, both opt-in to keep CI minutes lean:
#
#   1. workflow_dispatch — manually triggered from the Actions tab.
#      Pick the branch you want a tester build for; the workflow uses
#      whatever ref you selected. Use for ad-hoc rebuilds against any
#      branch (PR or otherwise).
#   2. pull_request labeled with `build-installer` — add the label to a
#      PR and a build kicks off automatically. Subsequent pushes to a
#      labeled PR rebuild on every commit (synchronize event), so the
#      artifact tracks the PR head. Remove the label to stop the rebuilds.
#
# Output:
#   Artifact: smartcitizen-installer-{SHA} (retention 30 days)
#   Contains: SmartCitizen-{VERSION}-Setup.exe
#
# Why 30 days vs CI's 7: testers need lead time to actually run the
# installer, file feedback, iterate. Release artifacts live forever on
# the Releases page; these are the in-between.

on:
  workflow_dispatch:
  pull_request:
    # Fires on label add AND on every push to a labeled PR. The label
    # check in the job-level `if` gates both — a push to an unlabeled
    # PR is a no-op, a push to a labeled PR rebuilds the installer.
    types: [labeled, synchronize, reopened]

# Cancel in-flight installer builds when a newer commit lands on the same
# PR (or the same branch on dispatch). The compile is ~5min and only the
# latest tip is interesting for testers; older runs would just be wasted
# minutes producing stale artifacts.
concurrency:
  group: installer-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    # Label gate. workflow_dispatch bypasses the label check entirely.
    # For pull_request, require the literal `build-installer` label
    # present on the PR — adding a different label to a build-installer
    # PR still fires the workflow because contains() sees the existing
    # label, but the build is still relevant so that's fine.
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'build-installer')
    name: Build installer
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        # Same `python -m pytest` invocation and pak_extraction.TestDataForgeCache
        # deselect as ci.yml / release.yml — see those files for rationale.
        # A failed test still red-X's the workflow; testers should not get
        # an installer compiled from a broken commit. If a tester needs an
        # installer DESPITE failing tests, re-run with workflow_dispatch
        # against the same SHA and amend the deselects locally.
        run: |
          python -m pytest tests/ `
            --deselect tests/test_pak_extraction.py::TestDataForgeCache `
            -q

      - name: Build PyInstaller onedir
        run: python scripts/build/build_exe.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Error "ISCC.exe not found at $iscc — Inno Setup install failed?"
            exit 1
          }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup compile failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Locate installer + capture version
        id: artifact
        shell: pwsh
        run: |
          $version = (Get-Content VERSION.TXT).Trim()
          $installer = "dist/SmartCitizen-${version}-Setup.exe"
          if (-not (Test-Path $installer)) {
            Write-Error "Installer not found at $installer"
            Get-ChildItem dist -Recurse -Depth 2 | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          $size_mb = [math]::Round((Get-Item $installer).Length / 1MB, 1)
          Write-Host "Installer: $installer ($size_mb MB)"
          "installer_path=$installer" | Out-File -Append $env:GITHUB_OUTPUT
          "version=$version" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          # SHA in the artifact name lets multiple in-flight builds for
          # different commits coexist in the Actions UI without clobbering
          # each other. The filename INSIDE the zip is the canonical
          # SmartCitizen-{VERSION}-Setup.exe so testers don't have to
          # rename anything.
          name: smartcitizen-installer-${{ github.sha }}
          path: ${{ steps.artifact.outputs.installer_path }}
          retention-days: 30
          if-no-files-found: error

      - name: Comment on PR with download instructions
        # Only relevant for pull_request triggers (workflow_dispatch
        # doesn't have a PR to comment on). Uses gh CLI which is
        # pre-installed on windows-latest runners. The comment includes
        # the run URL so testers can click straight through to the
        # Artifacts section — GitHub doesn't expose stable direct-download
        # URLs for artifacts (you have to go through the run page).
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $version = "${{ steps.artifact.outputs.version }}"
          $run_url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $body = @"
          📦 **Tester installer built for this PR**

          - Version: ``$version``
          - Commit: ``${{ github.sha }}``
          - [Download from workflow run]($run_url) → scroll to **Artifacts** → ``smartcitizen-installer-${{ github.sha }}``

          Testers need a GitHub account but no special repo permissions. The download is a zip; inside is ``SmartCitizen-$version-Setup.exe``. Artifact expires in 30 days. Pushing more commits to this PR will rebuild and post a new link.
          "@
          gh pr comment ${{ github.event.pull_request.number }} --body $body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
