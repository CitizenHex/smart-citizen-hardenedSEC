name: CI

# Runs on every PR + every push to main / 1.3.0. Validates that the test
# suite passes and that the PyInstaller onedir build succeeds. Inno Setup
# installer compilation is deliberately scoped out of CI — that step lives
# in release.yml because it adds ~3 minutes of toolchain install per run
# and produces an artifact only useful at release time.
#
# Windows-only: Smart Citizen uses Windows Registry via PyQt6 QSettings, so
# Linux/macOS runners can't import src/utils/settings.py. windows-latest is
# free for public repos so the runner-cost concern is moot here.

on:
  # main / master are intentionally excluded from push triggers —
  # release.yml owns those (it builds standard installer + portable zip,
  # auto-tags from VERSION.TXT, and publishes the GitHub Release).
  # Running CI in parallel on main-push would duplicate test work and
  # produce a confusing dual status. PRs *to* main still run CI here,
  # just the post-merge push doesn't.
  push:
    branches: ["1.3.0"]
  pull_request:
    branches: [main, master, "1.3.0"]
  # Manual trigger for one-off debugging without pushing.
  workflow_dispatch:

# Skip in-flight runs when a newer commit lands on the same branch — saves
# minutes on rapid pushes. Keeps tag/release runs (group includes ref).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + build verification
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Caches pip downloads keyed on requirements files — typical
          # speedup is ~30s per run after the first.
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        # `python -m pytest` (not bare `pytest`) so the CWD always lands
        # on sys.path — required for the `from src.X` test imports even
        # if pytest.ini's pythonpath resolution drifts. Belt-and-braces.
        #
        # TestDataForgeCache was previously deselected for a str/Path bug in
        # dataforge_cache_is_fresh; that's fixed (issue #209, now size-keyed)
        # and the suite runs it again. The only remaining non-passing block is
        # the skipped TestStringEntry in test_core.py (constructor calls
        # predate the StringEntry signature expansion), which self-skips via a
        # marker. Everything else MUST pass.
        run: |
          python -m pytest tests/ -q

      - name: Build PyInstaller onedir
        # Verifies the build script runs to completion on a clean
        # runner. Doesn't compile the installer (Inno Setup install +
        # ISCC compile is ~3min and only useful at release time —
        # release.yml will own that step in a follow-up PR).
        run: python scripts/build/build_exe.py

      - name: Verify build output
        # Sanity check the onedir layout: catches regressions where
        # build_exe.py "succeeds" but doesn't write the expected
        # dist/SmartCitizen/SmartCitizen.exe. The exe name is stable (not
        # versioned) so installed shortcuts survive version updates (#104).
        shell: pwsh
        run: |
          $exe = "dist/SmartCitizen/SmartCitizen.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Expected build artifact not found: $exe"
            Get-ChildItem dist -Recurse -Depth 2 | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "Build artifact verified: $exe ($((Get-Item $exe).Length) bytes)"

      - name: Upload build artifact
        # Lets PR reviewers / maintainers grab the unsigned onedir for
        # spot-testing without rebuilding locally. Retention is 7 days
        # (tight to keep storage trivial — release builds get their
        # own permanent home on the GitHub Releases page).
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smartcitizen-onedir-${{ github.sha }}
          path: dist/SmartCitizen/
          retention-days: 7
          if-no-files-found: error
